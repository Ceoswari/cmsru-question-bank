d identical epitopes, as the carrier control shows.", "Correct: with only one epitope per molecule, the hormone cannot bridge two antibody-coated beads, so no lattice forms.", "Antigen excess would not explain a negative result at low concentrations too.", "The antibody binds the hormone efficiently in the separate assay and clumps the carrier-linked hormone, so affinity is adequate.", "Agglutination is read by eye and needs no enzyme; enzyme-linked reagents belong to ELISA."], "objective": "Agglutination requires cross-linking, so antigen detection with antibody-coated particles works only when the antigen has multiple epitopes; a single-epitope antigen binds but cannot bridge particles."}, {"qid": "3A-5", "topic": "Polyclonal antiserum versus monoclonal antibody on a Western blot", "stem": "<p>Proteins from a bacterial lysate are separated by size on a gel, transferred to a membrane and cut into strips. Each strip is probed with a different reagent, then with an enzyme-linked secondary antibody.<\/p><table class=\"labs\"><tr><th>Strip<\/th><th>Reagent<\/th><th>Bands seen<\/th><\/tr><tr><td>1<\/td><td>Serum from rabbit A immunized repeatedly with the bacterium<\/td><td>About 12 bands, 15 to 120 kDa<\/td><\/tr><tr><td>2<\/td><td>Serum from rabbit B, immunized the same way<\/td><td>About 10 bands, partly different from strip 1<\/td><\/tr><tr><td>3<\/td><td>Antibody from one cultured hybridoma clone<\/td><td>One band at 45 kDa<\/td><\/tr><tr><td>4<\/td><td>Serum from a non-immunized rabbit<\/td><td>None<\/td><\/tr><\/table>", "lead": "Which best explains the results on strips 1 to 3?", "choices": ["The hybridoma antibody comes from one clone with one specificity", "The rabbit sera contain complement that cut the proteins apart", "The hybridoma antibody binds only proteins that are denatured", "The rabbit sera bind each protein with a higher affinity", "The hybridoma antibody recognizes only carbohydrate on the proteins"], "answer": 0, "explanation": "<p>A Western blot separates proteins by size, so each band is a different protein that the reagent recognizes. Antiserum from a repeatedly immunized animal is polyclonal: it holds the output of many B cell clones responding to many antigens of the bacterium, so it lights up many bands. Because each animal makes its own mixture, two rabbits immunized the same way give partly different patterns, which is the batch-to-batch variation of antisera.<\/p><p>A hybridoma is a single B cell fused with an immortal myeloma line that makes no antibody of its own. All of its antibody is identical, with one heavy and one light chain recognizing one epitope, so it detects a single protein. That uniformity and unlimited supply are why monoclonal antibodies are preferred as diagnostic reagents and drugs.<\/p>", "why_wrong": ["Correct: a hybridoma comes from one B cell clone, so its antibodies are identical and bind one epitope on one protein, while antisera are polyclonal mixtures.", "Complement does not cut proteins already separated on a membrane, and the bands differ in number, not in size alone.", "All strips were run on the same denatured blot, so denaturation cannot explain why only one band appears on strip 3.", "Affinity differences would change band strength, not the number of proteins detected.", "Nothing indicates carbohydrate specificity; a single band reflects one epitope, not a type of molecule."], "objective": "Antisera are polyclonal and vary between animals, so they recognize many antigens; a monoclonal antibody from a hybridoma is uniform and recognizes one epitope, giving a single band on a Western blot."}, {"qid": "3A-6", "topic": "Reading a lateral flow test and its control line", "stem": "<p>A man uses a home rapid antigen strip on a nasal swab. In this strip, the reagent pad holds mouse antibody to the viral antigen linked to colored particles. The test line (T) holds a second mouse antibody to the viral antigen, and the control line (C) holds anti-mouse immunoglobulin antibody. Fifteen minutes after adding the sample, the strip shows a faint colored band at T and no band at C. Liquid reached the far end of the strip.<\/p>", "lead": "Which is the correct interpretation of this result?", "choices": ["Positive, because colored antibody was captured at the test line", "Negative, because the viral antigen did not reach the control line", "Invalid, because no colored antibody was captured at C", "Positive, because excess antigen blocked binding at the control line", "Negative, because the test line band is fainter than a control band"], "answer": 2, "explanation": "<p>As the sample flows along the strip it picks up the colored mouse antibody. If viral antigen is present, the antigen bridges the colored antibody to the capture antibody at T, making a band. The control line holds anti-mouse immunoglobulin, which grabs the colored mouse antibody whether or not antigen is present, so a band at C should appear on every properly working strip. It proves that sample flowed and the labeled reagent was intact and mobile.<\/p><p>When C is missing, the strip has not shown that it worked, so no conclusion can be drawn from T, and the test must be repeated with a new strip. Reading a T band as positive here could be wrong, because the device itself has failed its internal check.<\/p>", "why_wrong": ["A test line band counts only when the control line shows that the strip worked.", "The control line captures the colored antibody, not the antigen, and it should appear in positive and negative tests alike.", "Correct: the control line binds colored mouse antibody in every working test, so its absence makes the strip invalid.", "Antigen does not bind the anti-mouse control line, so excess antigen cannot block it.", "Band intensity is not compared with C for a negative result, and here the control band is absent."], "objective": "In a lateral flow immunoassay, the control line captures the labeled antibody regardless of analyte; if it fails to appear the test is invalid, whatever the test line shows."}, {"qid": "3A-7", "topic": "Therapeutic monoclonal antibody names and B cell depletion", "stem": "<p>A 54-year-old man was treated for a B cell lymphoma with chemotherapy plus rituximab, followed by rituximab every 2 months as maintenance. Over the past 8 months he has had three bacterial sinus infections and a pneumococcal pneumonia. He had no unusual infections before treatment. He is evaluated with blood counts, flow cytometry and serum immunoglobulins.<\/p>", "lead": "Which set of results is most likely?", "choices": ["Normal CD19+ B cells, low CD4+ T cells, normal IgG", "Low CD3+ T cells, normal CD19+ B cells, low IgG", "Normal CD19+ B cells, normal CD3+ T cells, high IgM", "Low CD19+ B cells, normal CD3+ T cells, low IgG", "Low NK cells, normal CD19+ B cells, normal IgG"], "answer": 3, "explanation": "<p>Therapeutic monoclonal antibody names carry information: the stem -mab marks a monoclonal antibody, -xi- marks a chimeric antibody (mouse variable regions on human constant regions), and -tu- marks a tumor target. Rituximab is a chimeric antibody against CD20, a surface protein on B cells, used for B cell lymphoma, and it works by depleting the B cells that carry CD20.<\/p><p>Repeated doses remove normal B cells along with the lymphoma, so flow cytometry shows very few CD19+ B cells while T cells are unaffected. With fewer B cells, new antibody production falls and IgG drops over time, leaving him open to encapsulated bacteria such as pneumococcus. This is a pharmacological, secondary immunodeficiency that resembles a primary antibody deficiency.<\/p>", "why_wrong": ["CD20 is a B cell protein, so B cells, not CD4 T cells, are the cells lost.", "T cells do not carry CD20 and are spared by rituximab.", "Normal B cells and high IgM describe a class switching defect, not B cell depletion.", "Correct: anti-CD20 depletion removes B cells while sparing T cells, and IgG falls, causing recurrent bacterial infections.", "NK cells do not carry CD20; the infections reflect low antibody, not an NK defect."], "table": "<table><tr><th>Name part<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><tr><td>-xi-<\/td><td>Chimeric<\/td><td>Rituximab (anti-CD20, B cell lymphoma)<\/td><\/tr><tr><td>-zu-<\/td><td>Humanized<\/td><td>Palivizumab (anti-RSV), certolizumab (anti-TNF)<\/td><\/tr><tr><td>-tu-, -vi-, -li-<\/td><td>Tumor, viral, immune modulator target<\/td><td><\/td><\/tr><tr><td>-mab<\/td><td>Monoclonal antibody<\/td><td><\/td><\/tr><\/table>", "objective": "Rituximab (chimeric anti-CD20, decoded from its name) depletes B cells, causing low B cell counts, falling IgG and recurrent bacterial infections, a pharmacological secondary immunodeficiency."}, {"qid": "3A-8", "topic": "Reading an antinuclear antibody (ANA) immunofluorescence test", "stem": "<p>Serum from a 27-year-old woman with joint pain and a facial rash is tested for antinuclear antibodies. Cultured cells on slides are fixed and permeabilized, then incubated with serial dilutions of her serum, washed, and incubated with fluorescent anti-human immunoglobulin. A healthy control serum is run in parallel. Slides are read under a fluorescence microscope.<\/p><table class=\"labs\"><tr><th>Serum dilution<\/th><th>Patient<\/th><th>Healthy control<\/th><\/tr><tr><td>1:40<\/td><td>Bright, evenly stained nuclei<\/td><td>No staining<\/td><\/tr><tr><td>1:80<\/td><td>Bright, evenly stained nuclei<\/td><td>No staining<\/td><\/tr><tr><td>1:160<\/td><td>Evenly stained nuclei<\/td><td>No staining<\/td><\/tr><tr><td>1:320<\/td><td>Faint, evenly stained nuclei<\/td><td>No staining<\/td><\/tr><tr><td>1:640<\/td><td>No staining<\/td><td>No staining<\/td><\/tr><\/table>", "lead": "Which conclusion is best supported by these results?", "choices": ["Her cells carry bound antibody on their nuclei at a titer of 1:320", "Her serum contains a nuclear antigen detected to a titer of 1:640", "Her serum contains antibody to the fluorescent reagent itself", "Her serum has antibody to nuclear antigens at a titer of 1:320", "Her serum contains antibody to cell surface antigens only"], "answer": 3, "explanation": "<p>In this indirect immunofluorescence test, the antigens are inside the nuclei of someone else's cultured cells, made reachable by fixing and permeabilizing them. Her serum supplies the antibodies; the fluorescent anti-human immunoglobulin then shows where her antibodies bound. Nuclear staining that the control serum does not give means her serum contains autoantibodies against nuclear antigens, which supports testing for diseases such as lupus.<\/p><p>The titer is the highest dilution that still gives a positive signal, here 1:320; at 1:640 the signal is gone. A higher titer means more antibody. The staining pattern (diffuse, speckled, nucleolar and so on) gives some hint about which nuclear antigen is targeted, but it is not a diagnosis on its own.<\/p>", "why_wrong": ["The cells on the slide are cultured cells, not hers; the test detects antibodies in her serum.", "The assay detects antibody in serum, not antigen, and 1:640 was negative.", "The healthy control was negative with the same fluorescent reagent, so the signal is not against the reagent.", "Correct: nuclear staining traced by anti-human immunoglobulin shows antinuclear antibodies, and 1:320 is the last positive dilution, so it is the titer.", "Surface antibodies would outline the cells; the staining is inside the nuclei of permeabilized cells."], "objective": "In the ANA test, patient serum on fixed, permeabilized cells is revealed with fluorescent anti-human immunoglobulin; nuclear staining shows antinuclear antibodies, and the highest positive dilution is the titer."}]}, {"id": "3B", "title": "Flow Cytometry", "week": 3, "subject": "Immunology", "questions": [{"qid": "3B-1", "topic": "Reading an IgM versus IgD dot plot", "stem": "<p>Cells from the bone marrow and spleen of a healthy mouse are stained with a fluorochrome-labeled anti-IgM antibody read in the FL1 channel and an anti-IgD antibody read in the FL2 channel. The analysis is gated on CD19-positive cells. Quadrant percentages:<\/p><table class=\"labs\"><tr><th>Quadrant<\/th><th>Bone marrow<\/th><th>Spleen<\/th><\/tr><tr><td>IgM negative, IgD negative<\/td><td>58%<\/td><td>4%<\/td><\/tr><tr><td>IgM positive, IgD negative<\/td><td>32%<\/td><td>6%<\/td><\/tr><tr><td>IgM positive, IgD positive<\/td><td>8%<\/td><td>88%<\/td><\/tr><tr><td>IgM negative, IgD positive<\/td><td>2%<\/td><td>2%<\/td><\/tr><\/table>", "lead": "The IgM-positive, IgD-negative population that is enriched in the bone marrow most likely consists of which cells?", "choices": ["Mature naive B cells about to leave for the spleen", "Plasma cells secreting IgM into the marrow", "Pre-B cells pairing mu with surrogate light chains", "Immature B cells with a newly completed receptor", "Memory B cells that have switched to IgG"], "answer": 3, "explanation": "<p>A dot plot gated on CD19 shows only B lineage cells, and each quadrant is a combination of the two markers. The bone marrow is where B cells develop, so its quadrants hold successive stages. Cells with no surface IgM or IgD (lower left) are the earliest, pro-B and pre-B cells, which have no complete surface receptor yet. Cells with IgM but no IgD are immature B cells: they have just paired a heavy chain with a light chain and put complete IgM on the surface, the second developmental checkpoint, but have not yet added IgD.<\/p><p>Mature naive B cells express both IgM and IgD, and they dominate the spleen (88% in the upper right quadrant), where they circulate after leaving the marrow. Reading the plot this way, the population that is IgM positive and IgD negative and concentrated in the marrow is the immature B cell, the stage that undergoes central tolerance checks before release.<\/p>", "why_wrong": ["Mature naive B cells co-express IgM and IgD; that is the quadrant that dominates the spleen.", "Plasma cells lose surface immunoglobulin because they switch to the secreted form, so they would not stain for surface IgM.", "Pre-B cells have not yet made a light chain, so they lack complete surface IgM and sit in the double negative quadrant.", "Correct: immature B cells display complete surface IgM but no IgD yet, and they are found in the bone marrow.", "Switched memory B cells would be IgM negative and IgD negative; they are also not concentrated in the marrow."], "objective": "On an IgM versus IgD plot of B cells, immature B cells in the bone marrow are IgM positive and IgD negative, while mature naive B cells in the periphery are IgM positive and IgD positive.", "table": "<table class=\"\"><tr><th>Stage<\/th><th>Surface IgM<\/th><th>Surface IgD<\/th><th>Where<\/th><\/tr><tr><td>Pro-B, pre-B<\/td><td>No<\/td><td>No<\/td><td>Bone marrow<\/td><\/tr><tr><td>Immature B<\/td><td>Yes<\/td><td>No<\/td><td>Bone marrow<\/td><\/tr><tr><td>Mature naive B<\/td><td>Yes<\/td><td>Yes<\/td><td>Blood, spleen, lymph nodes<\/td><\/tr><tr><td>Plasma cell<\/td><td>No (secretes Ig)<\/td><td>No<\/td><td>Lymphoid organs, bone marrow<\/td><\/tr><\/table>"}, {"qid": "3B-2", "topic": "Reading histograms: costimulation and the high-affinity IL-2 receptor", "stem": "<p>Purified naive CD4 T cells are cultured for 48 hours under three conditions, then stained with a fluorochrome-labeled antibody to CD25 (the interleukin 2 receptor alpha chain) read in the FL1 channel. Histograms of cell number against FL1 fluorescence intensity show:<\/p><table class=\"labs\"><tr><th>Culture condition<\/th><th>Histogram<\/th><\/tr><tr><td>No stimulus<\/td><td>One peak at low fluorescence (about 10 units)<\/td><\/tr><tr><td>Antibody to the T cell receptor (TCR) only<\/td><td>One peak at low fluorescence (about 12 units)<\/td><\/tr><tr><td>Antibody to the TCR plus antibody to CD28<\/td><td>Most cells in a peak at high fluorescence (about 1,000 units)<\/td><\/tr><\/table><p>Cells in the third culture are also dividing; cells in the other two are not.<\/p>", "lead": "Which conclusion is best supported by these histograms?", "choices": ["Signals 1 and 2 together are needed to raise the IL-2 receptor alpha chain", "Signal 1 alone is enough to raise the IL-2 receptor alpha chain", "The cells in culture 3 have all become FOXP3-positive regulatory T cells", "Signal 2 alone would have produced the high fluorescence peak", "Spillover between channels created the high peak in culture 3"], "answer": 0, "explanation": "<p>A single-color histogram plots how many cells (y axis) show each level of fluorescence (x axis), so a peak shifting to the right means most cells now carry more of the stained marker. Unstimulated cells and cells given only TCR engagement (signal 1) sit at the same low peak: they have essentially no CD25. Only cells that received TCR engagement plus CD28 costimulation (signal 2) shift about a hundredfold to the right.<\/p><p>CD25 is the alpha chain that converts the interleukin 2 (IL-2) receptor into its high-affinity form. Priming with both signals makes T cells produce IL-2 and raise CD25, and IL-2 acting on that receptor drives the clonal proliferation seen only in culture 3. Signal 1 without signal 2 does not activate the cell and, in the body, leads toward anergy. This is also why drugs that block costimulation, IL-2 production or CD25 suppress T cell responses.<\/p>", "why_wrong": ["Correct: only the culture with both TCR and CD28 signals shifted to high CD25, matching the requirement for signals 1 and 2 to prime T cells and drive IL-2-dependent proliferation.", "The TCR-only histogram is almost identical to the unstimulated one, so signal 1 alone did not raise CD25.", "Regulatory T cells also carry CD25, but FOXP3 was not measured, and regulatory T cell differentiation needs TGF-beta; activated conventional T cells raise CD25 too.", "No culture tested CD28 stimulation alone, so this conclusion cannot be drawn from the data.", "Spillover affects multi-color staining; this is a single-color stain, and the shift appears only under one condition."], "objective": "On a flow histogram a rightward shift means more marker per cell; naive T cells raise CD25 (the high-affinity IL-2 receptor alpha chain) and proliferate only when they receive both TCR signal 1 and CD28 signal 2."}, {"qid": "3B-3", "topic": "Intracellular cytokine staining and T helper subsets", "stem": "<p>A mouse is immunized with a protein antigen mixed with an experimental adjuvant. Ten days later, CD4 T cells from its draining lymph node are restimulated briefly, then fixed and permeabilized and stained with a fluorochrome-labeled antibody to interferon gamma (IFN-gamma), read in FL1, and one to interleukin 4 (IL-4), read in FL2. Results, gated on CD4 T cells:<\/p><table class=\"labs\"><tr><th>Quadrant<\/th><th>Percent of CD4 T cells<\/th><\/tr><tr><td>IFN-gamma negative, IL-4 negative<\/td><td>70%<\/td><\/tr><tr><td>IFN-gamma positive, IL-4 negative<\/td><td>27%<\/td><\/tr><tr><td>IFN-gamma negative, IL-4 positive<\/td><td>2%<\/td><\/tr><tr><td>IFN-gamma positive, IL-4 positive<\/td><td>1%<\/td><\/tr><\/table>", "lead": "During priming, the dendritic cells in this mouse most likely provided which polarizing signal?", "choices": ["Interleukin 4", "Interleukin 12", "Interleukin 6 with TGF-beta", "TGF-beta with interleukin 2", "Interleukin 10"], "answer": 1, "explanation": "<p>Cytokines are made inside the cell, so the cells had to be permeabilized for the antibodies to reach them. Reading the quadrants, most CD4 T cells are not making either cytokine, but among the responders, IFN-gamma producers that make no IL-4 (27%) far outnumber IL-4 producers (2%). A response dominated by IFN-gamma-producing CD4 T cells is a T helper 1 (Th1) response.<\/p><p>Which subset a naive CD4 T cell becomes is set during priming by polarizing cytokines from the dendritic cell, sometimes called signal 3. The Th1 program (transcription factor T-bet) is driven by interleukin 12, reinforced by IFN-gamma. So this adjuvant most likely made the dendritic cells produce IL-12. Had IL-4 dominated the plot, the polarizing signal would have been IL-4 and the response Th2.<\/p>", "why_wrong": ["Interleukin 4 polarizes toward T helper 2 cells, which would make the IL-4-positive quadrant dominate.", "Correct: the plot shows mainly IFN-gamma-producing CD4 T cells, a Th1 response, which dendritic cells drive with interleukin 12.", "Interleukin 6 with TGF-beta (plus interleukin 23) drives T helper 17 cells, which make interleukin 17 and interleukin 22.", "TGF-beta with interleukin 2 induces FOXP3-positive regulatory T cells, which make interleukin 10 and TGF-beta rather than IFN-gamma.", "Interleukin 10 is a suppressive cytokine made by regulatory T cells; it is not the signal that creates Th1 cells."], "objective": "Intracellular cytokine staining of permeabilized CD4 T cells reveals the T helper subset; an IFN-gamma-dominant pattern marks a Th1 response, which dendritic cells induce with interleukin 12 during priming."}, {"qid": "3B-4", "topic": "Reading a dihydrorhodamine (DHR) flow test", "stem": "<p>Neutrophils from a 4-year-old boy with repeated deep tissue abscesses are loaded with dihydrorhodamine, a dye that becomes fluorescent only when it is oxidized by reactive oxygen species. Cells are then left resting or stimulated with a chemical activator of neutrophils, and fluorescence is measured on a flow cytometer as a histogram (cell number against fluorescence intensity, arbitrary units).<\/p><table class=\"labs\"><tr><th>Sample<\/th><th>Peak fluorescence, resting<\/th><th>Peak fluorescence, stimulated<\/th><\/tr><tr><td>Healthy control<\/td><td>10<\/td><td>1,200 (whole peak shifts right)<\/td><\/tr><tr><td>Patient<\/td><td>10<\/td><td>12 (no shift)<\/td><\/tr><\/table>", "lead": "This patient is most susceptible to infection by organisms with which feature?", "choices": ["A thick polysaccharide capsule", "Survival inside resting macrophages", "Transmission by the fecal-oral route", "An outer membrane with endotoxin", "Production of the enzyme catalase"], "answer": 4, "explanation": "<p>Each histogram shows how brightly each cell fluoresces. In the control, stimulation moves the whole neutrophil peak far to the right, meaning every cell made reactive oxygen species and oxidized the dye. The patient's peak does not move, so his neutrophils cannot produce an oxidative burst. That is chronic granulomatous disease (CGD), a defect in the NADPH oxidase (most often gp91phox, X-linked), and this flow test, like the older nitroblue tetrazolium test, is how it is diagnosed.<\/p><p>Without NADPH oxidase, phagocytes cannot make superoxide and the oxidants derived from it. Organisms that make catalase destroy the small amount of hydrogen peroxide they generate themselves, so the phagocyte has nothing left to use against them. Catalase-positive organisms such as Staphylococcus aureus, Pseudomonas and Aspergillus therefore cause the deep abscesses and granulomas typical of CGD.<\/p>", "why_wrong": ["Encapsulated bacteria are the problem in antibody, complement and spleen defects, where opsonization fails.", "Organisms that survive in resting macrophages, such as mycobacteria, point to the IL-12 and interferon-gamma axis.", "Route of transmission does not determine susceptibility in a phagocyte killing defect.", "Endotoxin is a feature of gram-negative bacteria in general and does not mark the organisms that exploit CGD.", "Correct: absent oxidative burst (CGD) leaves patients open to catalase-positive organisms, which remove their own hydrogen peroxide."], "objective": "On a DHR flow test, failure of the neutrophil fluorescence peak to shift after stimulation shows an absent oxidative burst (chronic granulomatous disease), which predisposes to catalase-positive organisms."}, {"qid": "3B-5", "topic": "Spectral overlap and mass cytometry", "stem": "<p>A research team wants to measure 45 different markers on every cell in blood samples. Their fluorescent flow cytometer reads 18 colors. When they try a 22-color panel, many single-stained control cells appear positive in channels for markers they do not carry, and some of these false signals persist after the instrument's automated correction. The team needs reliable data on every marker, cell by cell, in large numbers of cells.<\/p>", "lead": "Which approach best meets their goal?", "choices": ["Fluorescence microscopy of the stained cells", "Sorting the cells first with a fluorescence-activated cell sorter", "Mass cytometry with antibodies tagged by metal isotopes", "Gating the cells by forward and side scatter alone", "Splitting the panel across many separate ELISA plates"], "answer": 2, "explanation": "<p>Fluorochromes emit light across a range of wavelengths, so when many are used at once their emission spectra overlap and light from one dye leaks into the detector for another. That creates false positive signals. Compensation, now automated, subtracts the expected leak, but the more colors are packed into the visible spectrum, the harder it becomes to separate them cleanly, which limits how many markers a fluorescent cytometer can read.<\/p><p>Mass cytometry (CyTOF) avoids the problem by labeling antibodies with metal isotopes instead of fluorochromes and detecting them by mass. Isotope signals barely overlap, so one cell can be measured for up to 100 or more markers at once while still analyzing large numbers of cells.<\/p>", "why_wrong": ["Microscopy gives shape information but is slow, poorly quantitative and handles only a few colors.", "Sorting purifies populations but uses the same fluorescent detection, so it does not add channels or remove spillover.", "Correct: isotope-tagged antibodies detected by mass have little overlap, allowing 100 or more markers per cell.", "Scatter reflects only cell size and granularity and cannot report 45 markers.", "ELISA measures molecules in bulk, so it cannot tell which markers sit on the same individual cell."], "objective": "Overlapping fluorochrome emission spectra cause spillover that compensation corrects only partly and that limits fluorescent panels; mass cytometry uses isotope-tagged antibodies to measure 100 or more markers per cell."}, {"qid": "3B-6", "topic": "Reading a lymphocyte subset panel in SCID", "stem": "<p>A 3-month-old girl has persistent thrush, diarrhea and Pneumocystis pneumonia. Her blood is stained with fluorescent antibodies to CD3, CD19 and CD56 and run on a flow cytometer. Lymphocytes are first gated by forward and side scatter. In a CD3 (x axis) versus CD19 (y axis) dot plot of that gate, fewer than 1% of events fall in the CD3-positive region and fewer than 1% in the CD19-positive region. Of the gated lymphocytes, 88% are CD3-negative, CD56-positive. A healthy infant's sample run the same day shows about 60% CD3-positive and 25% CD19-positive cells.<\/p>", "lead": "A defect in which process best explains this result?", "choices": ["Signaling through the common gamma chain", "Recombination of antigen receptor gene segments", "Breakdown of toxic adenosine metabolites", "Expression of MHC class II on thymic epithelium", "Signaling through the B cell receptor kinase"], "answer": 1, "explanation": "<p>The dot plot shows almost no T cells (CD3-positive) and almost no B cells (CD19-positive), while NK cells (CD3-negative, CD56-positive) are present and make up most of the lymphocyte gate. This is a T-B-NK+ severe combined immunodeficiency. The healthy control run the same day shows the staining worked.<\/p><p>T and B cells share one step that NK cells do not need: V(D)J recombination, which assembles the T cell receptor and immunoglobulin genes. Defects in the RAG1 and RAG2 enzymes or in the DNA repair factors that finish the joins block both lineages and leave NK cells untouched. Other SCID types give different patterns, so the subset panel points to the gene to test.<\/p>", "why_wrong": ["Common gamma chain loss removes T and NK cells but leaves B cells (T-B+NK-).", "Correct: V(D)J recombination (RAG1/2, DNA repair) is needed for T and B cell receptors but not NK cells, giving T-B-NK+.", "ADA deficiency kills all lymphocyte lineages, so NK cells would also be absent (T-B-NK-).", "Absent MHC class II lowers CD4 T cells but spares B cells and CD8 T cells.", "Loss of the B cell receptor kinase (BTK) removes B cells but leaves T cells normal."], "objective": "A flow panel with absent T and B cells but present NK cells (T-B-NK+) points to a V(D)J recombination defect (RAG1/2 or DNA repair), distinguishing it from other SCID patterns."}]}, {"id": "19", "title": "Immunology of Hypersensitivity Reactions", "week": 4, "subject": "Immunology", "questions": [{"topic": "Definitions: hypersensitivity, allergy, atopy", "stem": "<p>A 46-year-old woman reports that every time she takes ibuprofen for a headache her nose runs and her face swells within an hour. The reaction has happened on four separate occasions at ordinary doses that her family members take without trouble. Skin prick testing with the drug and a search for drug-specific IgE are both negative, and no drug-specific T cell response is found. She has no personal or family history of hay fever, eczema or asthma.<\/p>", "lead": "Which term best describes her reaction?", "choices": ["Atopy", "Type I allergy", "Non-immunological hypersensitivity", "Alloreactivity", "Delayed-type allergy"], "answer": 2, "explanation": "<p>Hypersensitivity is any objectively reproducible reaction to a defined stimulus at a dose that normal people tolerate. Her reaction meets that definition: it recurs reliably at ordinary doses that others take safely. The next question is whether it is immunological, meaning driven by an antigen-specific response (IgE, IgG or T cells).<\/p><p>No drug-specific IgE or T cell response is found, so there is no evidence of an antigen-specific mechanism. The lecture uses exactly this group, reactions to drugs such as NSAIDs and ACE inhibitors, as the example of non-immunological hypersensitivity. Allergy, by contrast, requires antigen-specific immune mechanisms and a sensitization step, and atopy is an inherited tendency to make IgE.<\/p>", "why_wrong": ["Atopy is a personal or familial tendency to become sensitized and make IgE; she has no IgE response and no atopic history.", "Type I allergy needs drug-specific IgE from a prior sensitization, which testing did not find.", "Correct: a reproducible reaction at a tolerated dose with no antigen-specific mechanism is non-immunological hypersensitivity, as with NSAIDs.", "Alloreactivity is an immune response to another person's antigens, such as a transfusion or graft.", "A delayed-type (Type IV) allergy would need drug-specific T cells and would appear over days, not within an hour."], "table": "<table><tr><th>Term<\/th><th>Requires<\/th><\/tr><tr><td>Hypersensitivity<\/td><td>Reproducible reaction at a dose normal people tolerate<\/td><\/tr><tr><td>Allergy<\/td><td>Antigen-specific immune mechanism plus sensitization<\/td><\/tr><tr><td>Atopy<\/td><td>Inherited tendency to make IgE (Type I)<\/td><\/tr><tr><td>Non-immunological<\/td><td>No antigen-specific response (NSAIDs, ACE inhibitors)<\/td><\/tr><\/table>", "objective": "Hypersensitivity is the umbrella term; a reproducible reaction with no antigen-specific immune mechanism, such as to NSAIDs, is non-immunological rather than allergic.", "qid": "19-1"}, {"topic": "Type I sensitization", "stem": "<p>An 11-year-old boy is stung by a wasp at camp in June and has only a small, painful red bump. In August he is stung again and within 10 minutes develops hives over his chest and arms and swelling of his lips. His blood pressure stays normal and the hives fade after treatment. Testing a month later shows wasp venom-specific IgE in his serum.<\/p>", "lead": "Which event during the weeks after the first sting best explains why the second sting caused hives?", "choices": ["Memory Th1 cells primed to activate skin macrophages", "IL-4 from follicular helper T cells switching B cells to IgE", "Complexes of venom and IgG deposited in skin vessels", "IgG made against venom bound to his mast cells", "Langerhans cells inducing venom-specific regulatory T cells"], "answer": 1, "explanation": "<p>Type I hypersensitivity takes two encounters. The first exposure sensitizes without symptoms: antigen-presenting cells take up the allergen and activate follicular helper T cells, which secrete IL-4. IL-4 binds the B cell's IL-4 receptor and drives isotype switching to IgE, and that IgE binds its very high affinity receptor, FcεRI, on mast cells, basophils and eosinophils.<\/p><p>On the second sting the venom cross-links IgE already sitting on his mast cells, which degranulate within minutes, releasing histamine and lipid mediators that cause hives and lip swelling. His mild first reaction, rapid second reaction and venom-specific IgE all fit this sequence.<\/p>", "why_wrong": ["Th1 and macrophage activation is Type IVa, which takes 1 to 3 days, not 10 minutes.", "Correct: during sensitization, IL-4 from TFH cells switches B cells to IgE, which then arms mast cells for the next exposure.", "Immune complex deposition is Type III, which causes vasculitis, arthritis and nephritis days later.", "Mast cells are armed by IgE on FcεRI in Type I, not by IgG.", "Treg induction is how tolerance develops, which would reduce the reaction rather than cause hives."], "objective": "Type I sensitization: allergen is presented to TFH cells, IL-4 switches B cells to IgE, and IgE arms FcεRI on mast cells so that re-exposure triggers degranulation.", "qid": "19-2"}, {"topic": "Type I mediators", "stem": "<p>A 25-year-old woman with cat allergy pets a friend's cat. Within about one minute her eyes itch and a wheal and flare appears on her forearm where the cat licked her. Fluid sampled from the wheal at 60 seconds already contains a high level of a mast cell product, at a time too early for her mast cells to have synthesized any new protein or lipid.<\/p>", "lead": "Which mediator is most likely responsible for this earliest itch and vascular leak?", "choices": ["Leukotriene C4", "Platelet-activating factor", "Tumor necrosis factor", "Histamine", "Prostaglandin D2"], "answer": 3, "explanation": "<p>Mast cell mediators come in two groups. Some are pre-synthesized and stored in granules before activation, so they are released within seconds of degranulation: histamine and other biogenic amines, and enzymes such as tryptase. Others are synthesized only after activation: lipid mediators such as prostaglandin D2, leukotriene C4 and platelet-activating factor, and cytokines such as TNF.<\/p><p>A mediator that peaks before anything new could be made must be one of the stored, preformed ones. Histamine causes vascular leak and itch, which matches her wheal, flare and itchy eyes within a minute.<\/p>", "why_wrong": ["Leukotriene C4 is a lipid mediator synthesized on activation, so it appears after the preformed mediators.", "Platelet-activating factor is synthesized on activation, not stored in granules.", "TNF is a cytokine made after activation and mainly drives inflammation and the late phase.", "Correct: histamine is preformed in granules, released within seconds, and causes vascular leak and itch.", "Prostaglandin D2 is a newly synthesized lipid mediator, released after the stored ones."], "table": "<table><tr><th>Preformed (granules)<\/th><th>Synthesized on activation<\/th><\/tr><tr><td>Histamine, biogenic amines; tryptase<\/td><td>PGD2, leukotriene C4, PAF; cytokines (TNF)<\/td><\/tr><\/table>", "objective": "Histamine and tryptase are preformed in mast cell granules and released first; prostaglandins, leukotrienes, PAF and cytokines are synthesized after activation.", "qid": "19-3"}, {"topic": "Type II cytotoxic, alloreactive", "stem": "<p>A 58-year-old man receives a unit of packed red cells during surgery. Within 15 minutes he develops fever, back pain and dark red urine, and his blood pressure falls. The transfusion is stopped. A check finds that he received a unit intended for another patient, and that his serum contains preformed antibodies against an antigen on the donor red cells. Repeat hemoglobin is lower than before the transfusion.<\/p>", "lead": "His reaction shares its basic mechanism with which other condition?", "choices": ["Serum sickness after antivenom", "Allergic contact dermatitis to poison ivy", "Autoimmune idiopathic thrombocytopenic purpura", "Seasonal allergic rhinitis to ragweed", "Positive tuberculin skin test"], "answer": 2, "explanation": "<p>Destruction of the transfused red cells by the recipient's preformed antibodies against a donor cell surface antigen is a transfusion reaction. The antibody targets an antigen fixed on a cell, and the coated cell is destroyed, so this is Type II cytotoxic hypersensitivity, in its alloreactive form (antibody against another person's antigen).<\/p><p>The lecture groups Type II cytotoxic reactions as autoimmune (hemolytic anemia, idiopathic thrombocytopenic purpura), alloreactive (transfusion reactions, hemolytic disease of the fetus and newborn, hyperacute graft rejection) and drug induced. ITP shares the mechanism: IgG against a surface antigen leads to destruction of the coated cell, here platelets instead of red cells.<\/p>", "why_wrong": ["Serum sickness is Type III: soluble foreign protein forms circulating complexes that deposit in vessels, joints and kidneys.", "Poison ivy contact dermatitis is Type IVc, carried out by cytotoxic T cells with no antibody.", "Correct: ITP is Type II cytotoxic, IgG against a surface antigen destroying the coated cell, like a mismatched transfusion.", "Allergic rhinitis is Type I, IgE on mast cells.", "The tuberculin skin test is Type IVa, Th1 cells activating macrophages."], "objective": "Transfusion reactions, hemolytic disease of the newborn and ITP are all Type II cytotoxic: IgG against a cell surface antigen destroys the coated cell.", "qid": "19-4"}, {"topic": "Type III course of serum sickness", "stem": "<p>A 50-year-old woman receives a single course of a monoclonal antibody made partly from mouse protein. Nine days later she develops fever, joint pain and a rash, and urinalysis shows protein and red cells. No further doses are given and she receives only supportive care. Over the following two weeks her symptoms fade completely, and serial blood tests show antibody against the drug continuing to rise while the drug level falls to zero.<\/p>", "lead": "Which best explains why her illness ended without specific treatment?", "choices": ["Mast cells were depleted of preformed histamine", "Complexes were cleared once the foreign antigen was gone", "Regulatory T cells deleted the drug-specific B cells", "Her IgG switched to IgE, which cannot fix complement", "Memory Th1 cells stopped producing interferon-gamma"], "answer": 1, "explanation": "<p>A large dose of foreign protein followed days later by fever, arthritis, rash and nephritis is serum sickness, a Type III reaction. Antibody against the protein appears while the protein is still in the blood, and soluble antigen-antibody complexes form. They deposit in vessels, joints and kidneys, fix complement and recruit leukocytes.<\/p><p>Complexes exist only while both antigen and antibody are present. As antibody keeps rising and the single dose of antigen is used up and cleared, no new complexes form and the deposited ones are removed, so serum sickness usually follows a self-resolving course. Her rising antibody with the drug level falling to zero shows exactly that.<\/p>", "why_wrong": ["Mast cell histamine release is Type I and is not the cause of serum sickness.", "Correct: complexes need both antigen and antibody; once the single dose of antigen is cleared, complexes stop forming and are removed.", "Her antibody kept rising, so the responding B cells were not removed.", "Nothing suggests a switch to IgE, and her antibody against the drug kept rising.", "Th1 and interferon-gamma drive Type IVa reactions, not immune complex disease."], "table": "<table><tr><th>Time after dose<\/th><th>Antigen<\/th><th>Antibody<\/th><th>Complexes, symptoms<\/th><\/tr><tr><td>Days 1 to 6<\/td><td>High<\/td><td>None yet<\/td><td>None<\/td><\/tr><tr><td>About days 7 to 14<\/td><td>Falling<\/td><td>Rising<\/td><td>Peak: fever, vasculitis, arthritis, nephritis<\/td><\/tr><tr><td>Later<\/td><td>Gone<\/td><td>High<\/td><td>Cleared, illness resolves<\/td><\/tr><\/table>", "objective": "Serum sickness is self-limited because immune complexes form only while foreign antigen remains; once it is cleared by rising antibody, complexes are removed.", "qid": "19-5"}, {"topic": "Type IVa: tuberculin test", "stem": "<p>A 24-year-old nurse has a tuberculin (PPD) skin test as part of employee screening. At 15 minutes the injection site looks normal. At 48 to 72 hours she has a firm, raised area of induration 14 mm across. A biopsy of the site at 72 hours shows a dense infiltrate of CD4 T cells and activated macrophages around small vessels, with no eosinophils.<\/p>", "lead": "Which cytokine is most responsible for activating the macrophages at the test site?", "choices": ["IL-4", "IL-5", "Interferon-gamma", "IL-17", "IL-10"], "answer": 2, "explanation": "<p>A reaction that is absent at 15 minutes and peaks at 48 to 72 hours is delayed-type hypersensitivity (Type IV), which needs no antibody. The tuberculin (PPD) test is the classical Type IVa reaction: local antigen-presenting cells show mycobacterial antigens to memory Th1 cells specific for them.<\/p><p>Th1 cells release interferon-gamma and TNF, part of the IL-12, IFN-gamma, TNF axis, and interferon-gamma activates the monocytes and macrophages that produce the firm induration. If such a response persists for weeks it becomes granulomatous.<\/p>", "why_wrong": ["IL-4 is a Th2 cytokine that drives IgE class switching and Type I or IVb responses.", "IL-5 recruits eosinophils, which are absent here; it belongs to the Type I late phase and IVb.", "Correct: interferon-gamma from memory Th1 cells activates macrophages in the Type IVa tuberculin reaction.", "IL-17 drives IL-8 and neutrophil recruitment in Type IVd.", "IL-10 is an anti-inflammatory cytokine of regulatory T cells, not a macrophage activator."], "objective": "The PPD test is Type IVa: memory Th1 cells release interferon-gamma and TNF that activate macrophages, producing induration at 48 to 72 hours.", "qid": "19-6"}, {"topic": "Type IVc: severe drug reaction", "stem": "<p>A 62-year-old man started allopurinol for gout 10 days ago. He now has fever, painful red skin that is blistering and peeling over his trunk, and sores on his lips and inside his mouth. Gentle pressure makes the top layer of skin slide off. Temperature is 38.9 °C and pulse 112/min. A skin biopsy shows death of keratinocytes through the full thickness of the epidermis with T cells at the junction.<\/p>", "lead": "Which effector mechanism is mainly responsible for the skin damage?", "choices": ["IgE cross-linking on dermal mast cells", "Immune complexes fixing complement in dermal vessels", "Th2 cells recruiting eosinophils with IL-5", "Th17 cells recruiting neutrophils through IL-8", "Cytotoxic T cells killing keratinocytes"], "answer": 4, "explanation": "<p>Days after starting a drug, a feverish illness with widespread blistering, peeling skin and mucosal sores, and full-thickness keratinocyte death, is Stevens-Johnson syndrome or toxic epidermal necrolysis (SJS/TEN). The lecture names allopurinol as an example of the drugs that cause it.<\/p><p>SJS/TEN is a severe Type IVc reaction: cytotoxic T cells (with or without Th1 help) recognize drug-related antigen on keratinocytes and kill them. It shares the IVc category with poison ivy contact dermatitis. AGEP, the IVd drug reaction, instead gives sterile pustules from IL-17-driven neutrophil recruitment, without full-thickness skin death.<\/p>", "why_wrong": ["IgE on mast cells causes hives and anaphylaxis within minutes, not epidermal death days later.", "Immune complex deposition (Type III) causes vasculitis, arthritis and nephritis.", "Th2 and eosinophil inflammation is Type IVb, as in chronic allergic asthma.", "Th17 and IL-8 neutrophil recruitment is Type IVd (AGEP), which forms pustules rather than full-thickness necrosis.", "Correct: SJS/TEN is a Type IVc reaction in which cytotoxic T cells kill keratinocytes."], "objective": "Stevens-Johnson syndrome and toxic epidermal necrolysis (for example after allopurinol) are severe Type IVc reactions in which cytotoxic T cells kill keratinocytes.", "qid": "19-7"}, {"topic": "Balance of T helper subsets", "stem": "<p>A 7-year-old girl has had eczema since infancy, then allergic rhinitis and asthma. Her total IgE is 1,100 IU/mL (normal less than 20) and blood eosinophils are 900/uL (normal less than 500). Stimulated blood T cells from her produce large amounts of IL-4, IL-5 and IL-13 and very little of the signature cytokine of a competing helper subset, whose differentiation is driven by IL-12 through STAT1, STAT4 and T-bet.<\/p>", "lead": "Low levels of which cytokine best explain why her Th2 response is unopposed?", "choices": ["Interferon-gamma", "IL-17A", "TGF-beta", "IL-10", "IL-22"], "answer": 0, "explanation": "<p>Her pattern of eczema, rhinitis and asthma with high IgE, eosinophilia and T cells making IL-4, IL-5 and IL-13 is a strongly Th2-polarized, atopic response. The competing subset described, driven by IL-12 through STAT1, STAT4 and T-bet, is Th1, and its signature cytokine is interferon-gamma.<\/p><p>The lecture presents helper T cell subsets as counter-balancing equilibria: each subset's cytokines restrain the others. Interferon-gamma from Th1 cells opposes Th2 differentiation, just as IL-4 opposes Th1. When Th1 output is weak, nothing checks the IL-4, STAT6, GATA3 program, and allergic disease is the result of the balance tipping toward Th2.<\/p>", "why_wrong": ["Correct: interferon-gamma is the Th1 cytokine (IL-12, STAT1, STAT4, T-bet) that counter-balances Th2.", "IL-17A is made by Th17 cells, whose differentiation uses IL-6, IL-23, TGF-beta and STAT3, not IL-12 and T-bet.", "TGF-beta drives induced Tregs (and with IL-6, Th17); it is not the Th1 signature cytokine.", "IL-10 is made by regulatory T cells (FOXP3), not by the IL-12, T-bet subset.", "IL-22 is a Th17-associated cytokine in the lecture's figure."], "table": "<table><tr><th>Subset<\/th><th>Driven by<\/th><th>Signature<\/th><\/tr><tr><td>Th1<\/td><td>IL-12, IFN-gamma; STAT1, STAT4, T-bet<\/td><td>IFN-gamma<\/td><\/tr><tr><td>Th2<\/td><td>IL-4; STAT6, GATA3<\/td><td>IL-4, IL-5, IL-13<\/td><\/tr><tr><td>Th17<\/td><td>IL-6, IL-23, TGF-beta; STAT3, RORgt<\/td><td>IL-17A, IL-17F, IL-22<\/td><\/tr><tr><td>iTreg<\/td><td>TGF-beta; FOXP3<\/td><td>IL-10<\/td><\/tr><\/table>", "objective": "Helper T subsets counter-balance one another; weak Th1 interferon-gamma leaves the Th2 (IL-4, IL-5, IL-13) program unopposed, tipping toward allergy.", "qid": "19-8"}, {"topic": "Interpreting total IgE", "stem": "<p>A 30-year-old man with lifelong hay fever and eczema asks whether a single blood test can tell him which things he is allergic to. His physician orders a total serum IgE by ELISA against a reference standard. The result is 1,250 IU/mL (normal less than 20). He has no fever, no travel and no gastrointestinal symptoms.<\/p>", "lead": "Which conclusion is best supported by this result alone?", "choices": ["He is sensitized to dust mite and grass pollen", "His mast cells degranulated within the last 2 hours", "His basophils will activate when exposed to cat dander", "He has a high level of IgE, but the allergens are unknown", "He has a delayed T cell allergy to a contact agent"], "answer": 3, "explanation": "<p>Total IgE is measured in international units against a reference standard, often by ELISA. Normal is below about 20 IU/mL, and atopic patients can reach the thousands, so his value fits his atopic history.<\/p><p>But total IgE is not antigen specific. It adds up IgE against everything and cannot say which allergen any of it recognizes. Naming the allergens needs allergen-specific tests: skin prick tests, allergen-specific IgE (ImmunoCAP), or a basophil activation test with a chosen allergen. Mast cell activation in an acute event is shown by tryptase, and delayed T cell allergy by a patch test.<\/p>", "why_wrong": ["Naming specific allergens requires allergen-specific IgE or skin testing; total IgE cannot identify them.", "Recent mast cell degranulation is documented by serum tryptase, which peaks 1 to 2 hours after anaphylaxis.", "Basophil reactivity to a named allergen needs a basophil activation test with that allergen.", "Correct: total IgE confirms a high overall IgE level consistent with atopy but is not antigen specific.", "Delayed T cell (Type IV) allergy is tested with a patch test, not IgE."], "objective": "Total IgE (normal under 20 IU/mL) shows overall IgE level and fits atopy but is not antigen specific; allergen-specific tests are needed to name the allergens.", "qid": "19-9"}]}, {"id": "21", "title": "Transplant Immunology and Immunosuppressives", "week": 4, "subject": "Immunology", "questions": [{"qid": "21-1", "topic": "Direct allorecognition", "stem": "<p>A 45-year-old man receives a kidney from a genetically unrelated donor. Within the first week, dendritic cells that came with the graft are found in his iliac lymph node, where they display their own surface molecules to his T cells. Large numbers of his CD4 and CD8 T cells begin to divide in that node, and effector T cells then appear in the graft.<\/p>", "lead": "The dividing recipient T cells in the lymph node are responding to which of the following?", "choices": ["Intact donor MHC molecules on the surface of donor dendritic cells", "Donor peptides displayed on the recipient's own MHC molecules", "Donor antibodies bound to the surface of recipient lymphocytes", "Complement fragments deposited on donor endothelial cells", "Blood group sugars shed from the donor's red blood cells"], "answer": 0, "explanation": "<p>Graft antigen reaches recipient T cells by two routes. In the <b>direct<\/b> route, dendritic cells carried inside the graft travel to the recipient's draining lymph node and present their own <b>intact allogeneic MHC<\/b> to recipient T cells. In the <b>indirect<\/b> route, the recipient's own dendritic cells pick up donor proteins in the graft, return to the node, and present <b>donor peptides on self MHC<\/b>.<\/p><p>Here the presenting cells came with the graft and are displaying their own surface molecules, which is direct presentation. This route explains the unusual size of the early response, because a large fraction of recipient T cell clones, all selected on self MHC, cross-react with a foreign MHC molecule. Either route ends the same way: activated recipient CD4 and CD8 effector T cells leave the node and migrate to the graft.<\/p>", "why_wrong": ["Correct: donor dendritic cells carried in the graft present intact allogeneic MHC in the recipient's lymph node, which is direct allorecognition.", "That describes indirect presentation by recipient dendritic cells, not the donor cells described here.", "Antibodies made by the donor are not the stimulus for recipient T cell proliferation in the node.", "Complement deposition damages endothelium in antibody-mediated rejection and does not activate T cell clones.", "Blood group sugars are recognized by antibodies, not by T cell receptors."], "objective": "Donor dendritic cells carried in a graft present intact allogeneic MHC in the recipient's lymph node (direct allorecognition), while recipient dendritic cells present donor peptides on self MHC (indirect)."}, {"qid": "21-2", "topic": "Pre-transplant antibody screening", "stem": "<p>A 55-year-old woman on dialysis is being prepared for a deceased-donor kidney transplant. She has had four pregnancies and many transfusions. Before the operation her serum is tested against cells from the prospective donor. The surgical team states that this one test is what protects her from losing the graft on the operating table.<\/p>", "lead": "The test protects against a complication with which of the following features?", "choices": ["Onset over months, with fibrosis and narrowed graft arteries", "Onset over weeks, with a dense T cell infiltrate that responds to treatment", "Onset within hours, with vessel thrombosis and tissue necrosis", "Onset over weeks, with rash, diarrhea and cholestatic jaundice", "Onset over years, with recurrent infection by encapsulated bacteria"], "answer": 2, "explanation": "<p>Pregnancies, transfusions and previous grafts sensitize a patient to foreign HLA, leaving <b>antibodies that are already circulating at the time of surgery<\/b>. Screening the recipient's serum against donor cells detects them, and finding them is a reason not to use that donor.<\/p><p>What those antibodies would cause is <b>hyperacute rejection<\/b>: within 24 hours, often within minutes of reperfusion, the antibody binds graft vascular endothelium, activates complement, recruits neutrophils, and produces thrombosis, ischemia and necrosis. It is a type 2 hypersensitivity reaction and there is no treatment once it starts, which is why screening matters. Rejection that appears over weeks (T cell mediated, treatable) and over months (helper T cells plus antibody, fibrosis) are the acute and chronic forms and are not prevented by this test.<\/p>", "why_wrong": ["Fibrosis over months is chronic rejection, driven by helper T cells and antibodies formed after transplant.", "A treatable T cell infiltrate over weeks is acute rejection, which antibody screening does not prevent.", "Correct: pre-existing antibody causes hyperacute rejection within 24 hours, with complement activation, thrombosis and necrosis.", "Rash, diarrhea and jaundice describe graft vs host disease, which follows stem cell transplantation.", "Recurrent encapsulated bacterial infection is a pattern of antibody deficiency, not a rejection syndrome."], "objective": "Screening recipient serum for pre-existing anti-donor antibodies prevents hyperacute rejection, an untreatable type 2 reaction that destroys the graft within 24 hours.", "table": "<table><tr><th>Type<\/th><th>Onset<\/th><th>Effectors<\/th><th>Treatable<\/th><\/tr><tr><td>Hyperacute<\/td><td>Under 24 hours<\/td><td>Pre-existing antibody, complement, neutrophils<\/td><td>No<\/td><\/tr><tr><td>Acute<\/td><td>Weeks<\/td><td>CD8 CTL, CD4 Th, new antibody<\/td><td>Yes<\/td><\/tr><tr><td>Chronic<\/td><td>Months<\/td><td>CD4 Th plus antibody, fibrosis<\/td><td>No<\/td><\/tr><\/table>"}, {"qid": "21-3", "topic": "Anti-interleukin-2 receptor induction", "stem": "<p>A 50-year-old man is given a monoclonal antibody at the time of his kidney transplant. In the laboratory, his T cells exposed to the antibody are stimulated through the T cell receptor with costimulation. Calcineurin is activated, interleukin-2 messenger RNA rises normally, and interleukin-2 protein is released into the medium, but the released cytokine does not attach to the surface of the treated cells and they do not proliferate.<\/p>", "lead": "Which of the following drugs best fits this result?", "choices": ["Cyclosporine", "Prednisone", "Rapamycin", "Azathioprine", "Basiliximab"], "answer": 4, "explanation": "<p>Reading the assay step by step: signal 1 works (calcineurin is active and interleukin-2 is transcribed), signal 2 works, and the cytokine is made and released. The failure is that the released interleukin-2 <b>cannot attach to the cell<\/b>, which points at the receptor itself.<\/p><p><b>Anti-interleukin-2 receptor antibodies<\/b> such as basiliximab and daclizumab occupy the receptor and block interleukin-2 signaling, so the T cell cannot respond to a cytokine it has made perfectly well. Calcineurin inhibitors would have stopped interleukin-2 from being transcribed. Rapamycin acts inside the cell at mTORC1, so binding would look normal and only the downstream signal would fail. Azathioprine blocks DNA synthesis, and glucocorticoids suppress activation broadly rather than at one defined receptor.<\/p>", "why_wrong": ["Calcineurin inhibition would have prevented interleukin-2 transcription, which was normal here.", "Glucocorticoids broadly suppress activation and inflammatory signaling rather than blocking one receptor.", "Rapamycin acts at mTORC1 inside the cell, so the cytokine would still bind normally.", "Azathioprine inhibits DNA synthesis and would not change cytokine binding.", "Correct: an anti-interleukin-2 receptor antibody prevents the cytokine from binding its receptor, so the cell cannot respond to it."], "objective": "Anti-interleukin-2 receptor antibodies block the cytokine from binding its receptor, distinguishing them from calcineurin inhibitors (no interleukin-2 made) and mTOR inhibitors (signal blocked inside the cell)."}, {"qid": "21-4", "topic": "Minor histocompatibility antigens", "stem": "<p>Two sibling pairs are studied at a transplant center. In the first pair, a brother donates a kidney to his HLA-identical sister, who later develops a T cell rich rejection episode. In the second pair, a sister donates to her HLA-identical sister, whose graft functions without a rejection episode. Both pairs are ABO compatible and neither recipient had antibodies against the donor before surgery.<\/p>", "lead": "The difference between the two pairs is best explained by which of the following?", "choices": ["Differences in the sugar groups carried on donor endothelial surface proteins", "A polymorphic protein encoded on the Y chromosome, presented as peptide on shared MHC", "Expression of a class I MHC allele the recipient's thymus never encountered", "Antibodies against donor HLA produced during the donor's own lifetime", "Greater numbers of regulatory T cells in female recipients of female grafts"], "answer": 1, "explanation": "<p>Alloreactivity has three sources: <b>MHC polymorphism<\/b>, <b>polymorphisms in other proteins<\/b> that yield allo-peptides presented on class I or class II MHC (the minor histocompatibility antigens), and <b>glycosylation differences<\/b> such as ABO. HLA matching removes the first and ABO compatibility removes the third, so anything left must come from the second.<\/p><p>The classic example is <b>H-Y<\/b>, encoded on the Y chromosome. A woman's T cells have never seen H-Y derived peptides during thymic selection, so when those peptides appear on the shared MHC of a male graft they are foreign, and an HLA-matched female recipient can reject a male graft. A sister to sister graft has no H-Y, which is why the second pair had no rejection episode.<\/p>", "why_wrong": ["ABO compatibility was confirmed, and sugar differences drive antibody-mediated reactions rather than a T cell rich infiltrate.", "Correct: H-Y peptides from a male donor presented on shared MHC are minor histocompatibility antigens and can drive rejection despite full HLA matching.", "The pairs are HLA identical, so no unfamiliar class I allele is present.", "Neither recipient had anti-donor antibodies before surgery, and the rejection was T cell rich.", "The lecture does not attribute graft outcome to a sex difference in regulatory T cell numbers."], "objective": "Minor histocompatibility antigens such as H-Y are allo-peptides presented on shared MHC, and they can cause rejection even between HLA-identical donor and recipient."}, {"qid": "21-5", "topic": "Graft vs host disease after solid organ transplant", "stem": "<p>A 58-year-old man is recovering from a liver transplant. Three weeks later he develops a widespread rash, watery diarrhea and pancytopenia. Skin biopsy shows T cells attacking the basal layer of the epidermis, and analysis shows those T cells carry the donor's HLA type rather than his own. Liver function tests from the graft itself are near normal.<\/p>", "lead": "Which of the following best explains his new illness?", "choices": ["Recipient T cells rejecting the transplanted liver", "Reactivation of the recipient's own autoreactive B cells", "Antibodies in the recipient binding donor endothelium", "Lymphocytes transferred within the donor liver attacking his tissues", "Chemotherapy toxicity to skin, gut and bone marrow"], "answer": 3, "explanation": "<p>Graft vs host disease is usually discussed after hematopoietic stem cell transplantation, where the infused product carries <b>residual mature alloreactive donor T cells<\/b> that attack the recipient. The same thing can happen after a <b>solid organ<\/b> transplant, because the organ carries passenger lymphocytes. After a liver transplant it occurs in roughly 1 to 2% of cases and carries a high mortality, around 70 to 80%.<\/p><p>The decisive finding here is that the T cells damaging his skin <b>carry the donor's HLA type<\/b>, so the attack is running from graft to host. The target organs are the familiar ones: skin, gastrointestinal tract, liver and the hematopoietic system, which is why he also has pancytopenia. Rejection would be the reverse, with recipient T cells injuring the graft and abnormal liver tests.<\/p>", "why_wrong": ["Rejection would damage the transplanted liver and raise its enzymes, and the attacking cells would be his own.", "His own autoreactive B cells would not explain donor-derived T cells in the skin.", "Antibody-mediated injury targets the graft's vessels rather than the recipient's own skin and marrow.", "Correct: donor lymphocytes carried in the liver attacking recipient skin, gut and marrow is graft vs host disease after a solid organ transplant.", "No chemotherapy was given, and the infiltrating cells are donor T cells."], "objective": "Graft vs host disease occurs when mature donor T cells attack recipient skin, gut, liver and marrow, and it can follow solid organ transplantation (liver, about 1 to 2%) with high mortality."}, {"qid": "21-6", "topic": "HLA matching and graft survival", "stem": "<p>Registry data for kidney transplants are compared between two eras. In the earlier era, graft survival falls steeply as the number of HLA mismatches rises from zero to six. In the later era, graft survival is higher at every mismatch number and the gap between zero and six mismatches is much smaller. Allocation policy and surgical technique changed little between the two eras.<\/p>", "lead": "Which of the following best accounts for the change between eras?", "choices": ["More effective immunosuppressive drugs entered routine use", "The population of donors became more closely related to recipients", "Hyperacute rejection became the main cause of graft loss", "Minor histocompatibility antigens stopped being recognized", "Recipients were matched for blood group rather than for HLA"], "answer": 0, "explanation": "<p>The number of HLA mismatches predicts how much alloreactive stimulus the recipient's T cells face, so in the era before effective maintenance therapy each added mismatch cost graft survival. What changed was the <b>pharmacology<\/b>: the introduction of <b>cyclosporine<\/b> in the early 1980s raised five-year cardiac allograft survival substantially, and later regimens built on it.<\/p><p>Better suppression of T cell activation means a mismatched graft can be kept, so <b>partially mismatched allogeneic transplants became workable<\/b>. Matching still helps, which is why the curves still separate, but it is no longer all or nothing. Nothing about the biology of allorecognition changed; only the ability to blunt it did.<\/p>", "why_wrong": ["Correct: improved immunosuppression, beginning with cyclosporine, allowed partially mismatched allografts to survive.", "Closer donor relatedness would reduce mismatch numbers, not improve survival within each mismatch category.", "Hyperacute rejection became rarer with pre-transplant antibody screening and is not the usual cause of late graft loss.", "Minor histocompatibility antigens are still recognized and still cause rejection.", "Blood group compatibility has always been required and does not replace HLA matching."], "objective": "Improved immunosuppression, starting with cyclosporine, raised graft survival at every level of HLA mismatch, making partially mismatched allografts workable without eliminating the benefit of matching."}, {"qid": "21-7", "topic": "Immune privilege", "stem": "<p>A surgeon places skin from an unrelated donor onto a recipient's forearm and the same donor's tissue into the anterior chamber of the recipient's eye. The forearm graft is infiltrated by lymphocytes and sloughs within 2 weeks. The tissue in the eye survives for months, and no donor-reactive T cells can be found in the regional lymph nodes.<\/p>", "lead": "Which property of the ocular site best explains this difference?", "choices": ["Higher levels of MHC expression on cells in the eye", "Absence of T cell receptors capable of recognizing donor MHC", "Limited vascular and lymphatic drainage from the site", "Rapid replacement of donor cells by recipient cells", "Secretion of complement proteins into the aqueous humor"], "answer": 2, "explanation": "<p>Certain anatomical sites, the <b>brain, eye, testis and uterus<\/b>, accept mismatched allografts. The mechanisms are only partly understood but include physical <b>exclusion<\/b> such as the blood brain barrier, <b>low MHC levels<\/b>, local <b>immunosuppressive cytokines<\/b> and inhibitory surface receptors such as Fas (CD95), local regulatory and suppressor cell subsets, and <b>limited vascularization and lymphatic drainage<\/b>.<\/p><p>The decisive clue here is the absence of donor-reactive T cells in the regional nodes: alloreactive T cells must first be primed in a draining lymph node, and antigen from a poorly drained site never gets there. The practical consequence of this biology is that allogeneic <b>corneal transplants can survive many years with only local immunosuppression<\/b>, whereas skin, which is richly vascularized and drained, is among the most readily rejected tissues.<\/p>", "why_wrong": ["Privileged sites express low, not high, levels of MHC.", "The recipient has a normal T cell repertoire that rejected the skin graft from the same donor.", "Correct: poor blood supply and lymphatic drainage prevent antigen and dendritic cells from reaching a lymph node, so alloreactive T cells are never primed.", "Cell replacement does not explain the absence of priming in the lymph nodes.", "Complement secretion would promote damage, not tolerance."], "objective": "Immune privilege at sites such as the eye reflects barriers, low MHC, local suppression and limited lymphatic drainage, which is why corneal allografts survive on local immunosuppression alone."}, {"qid": "21-8", "topic": "Conditioning and the inflammatory environment", "stem": "<p>Two groups of mice receive allogeneic hematopoietic stem cells from the same donor strain. One group is conditioned with high dose irradiation, which injures the intestinal lining and allows gut bacterial products to reach the tissue. The other receives a much gentler regimen with little mucosal damage. Donor cells engraft in both groups, but severe skin and gut disease caused by donor T cells is far more common in the first group.<\/p>", "lead": "Which of the following best explains the higher rate of disease in the first group?", "choices": ["Irradiation increases the number of mature T cells in the donor graft", "Microbial products directly lyse recipient epithelial cells", "Gentler conditioning deletes donor alloreactive clones in the thymus", "Irradiation raises MHC expression on donor stem cells", "Tissue damage and microbial products activate host antigen-presenting cells"], "answer": 4, "explanation": "<p>Conditioning regimens are <b>pro-inflammatory<\/b>. Radiation and chemotherapy damage tissue, especially the gut, and the damaged cells release <b>DAMPs<\/b> and cytokines while gut commensals release <b>PAMPs<\/b> such as lipopolysaccharide. These signals activate <b>host antigen-presenting cells<\/b>, which then present recipient MHC and minor antigens to the <b>donor T cells<\/b> that came with the graft, with costimulation and a cytokine storm following.<\/p><p>That is why heavier conditioning brings more graft vs host disease, and why one strategy against it is a <b>less damaging regimen<\/b>. The trade-off is that gentler conditioning leaves more of the recipient's immune system alive and risks <b>graft failure<\/b>; the other strategy, depleting mature donor T cells, costs the graft vs leukemia effect instead.<\/p>", "why_wrong": ["The graft composition is the same in both groups; conditioning acts on the recipient.", "Microbial products act as inflammatory signals through innate receptors rather than lysing epithelium directly.", "Conditioning does not cause thymic deletion of donor clones.", "The problem is activation of host antigen-presenting cells, not MHC on the donor stem cells.", "Correct: damage signals and microbial products activate host antigen-presenting cells, which drive donor T cell activation."], "objective": "Pro-inflammatory conditioning activates host antigen-presenting cells through DAMPs and PAMPs, which drives donor T cell activation, so gentler regimens lower graft vs host disease at the cost of graft failure.", "table": "<table><tr><th>Strategy against graft vs host disease<\/th><th>Downside<\/th><\/tr><tr><td>Deplete mature donor CD3 positive T cells<\/td><td>Loss of the graft vs leukemia effect, more relapse<\/td><\/tr><tr><td>Use less damaging conditioning<\/td><td>Graft failure from surviving recipient immunity<\/td><\/tr><\/table>"}, {"qid": "21-9", "topic": "Disparities along the transplant pathway", "stem": "<p>A transplant program reviews its own data for patients with kidney failure. Compared with white patients, Black patients at the program are referred for transplant evaluation later, are less often rated as suitable candidates, complete the pre-transplant workup less often, and receive living donor kidneys less often. HLA typing, surgical technique and immunosuppressive protocols are the same for all patients at the program.<\/p>", "lead": "These findings are best described as which of the following?", "choices": ["An inherited difference in the strength of alloreactive responses", "An effect of differing rates of hyperacute rejection", "A consequence of organ size matching requirements", "Inequities arising at successive steps of the transplant pathway", "A limitation imposed by the private status of the allocation network"], "answer": 3, "explanation": "<p>The transplant system is more than its immunology. Scarcity and the complexity of matching and logistics limit how many people are transplanted, and that scarcity interacts with <b>socioeconomic and cultural factors, systemic racism and ancestry<\/b> to create inequities.<\/p><p>The documented gaps appear at <b>successive steps along the same path<\/b>: donor registration and authorization, referral for evaluation, being rated a suitable candidate, completing the pre-transplant evaluation, access to the waiting list and to preemptive listing, access to living donor kidneys, and outcomes after transplant. Each gap is modest on its own, and together they compound. Since this program applies identical typing, technique and drugs to everyone, the differences described lie in access rather than in biology.<\/p>", "why_wrong": ["Alloreactivity works the same way in all patients; nothing in the data points to a biological difference.", "Hyperacute rejection is rare and is prevented by antibody screening, which the program applies to everyone.", "Organ size matching applies to all patients and does not produce this sequence of gaps.", "Correct: the differences are access gaps appearing at successive steps of the transplant pathway, the pattern of inequity described in the lecture.", "The allocation network sets policy for allocation; the gaps described occur before and around allocation."], "objective": "Inequities in transplantation accumulate across steps of the pathway (registration, referral, suitability, workup, listing, living donation and outcomes) rather than arising from immunological differences between patients."}]}, {"id": "4B", "title": "Immune Function in Children and the Elderly", "week": 4, "subject": "Immunology", "questions": [{"qid": "4B-1", "topic": "Breast milk antibody", "stem": "<p>Two healthy term infants are followed in a study of early mucosal immunity. Infant A is exclusively breastfed; infant B is fed formula. Both have normal serum IgG for age at 2 months, largely from placental transfer. Over the next three months, infant B has more episodes of infectious diarrhea than infant A. Stool from infant A contains abundant antibody that binds intestinal microbes, while stool from infant B contains very little, even though infant B's own B cell numbers are normal.<\/p>", "lead": "Which antibody best accounts for the extra protection of infant A?", "choices": ["Maternal IgG carried across the placenta by FcRn", "Maternal IgA delivered to the gut in breast milk", "The infant's own IgG2 against gut polysaccharides", "Maternal IgE bound to the infant's mast cells", "The infant's own IgG1 made after vaccination"], "answer": 1, "explanation": "<p>The two infants have the same serum IgG, so placental transfer is not what separates them. What differs is antibody inside the gut lumen. After birth, breast milk delivers maternal IgA, along with some IgM, directly to the infant's gut, where it binds microbes at the mucosal surface and supports maturation of the gastrointestinal tract.<\/p><p>Placental IgG crosses by FcRn and circulates in the blood, protecting systemically until it fades by about 4 to 8 months. It does not line the gut. The infant's own antibody responses are still developing, and polysaccharide (IgG2) responses in particular lag for years, so they cannot explain an early, feeding-dependent difference.<\/p>", "why_wrong": ["Both infants received placental IgG and have the same serum levels, so it cannot explain the difference between them.", "Correct: breast milk delivers maternal IgA (and some IgM) to the gut, giving mucosal protection that formula lacks.", "IgG2 responses to polysaccharides mature slowly and would not be strong in a few-month-old infant.", "IgE triggers mast cell reactions in allergy; it is not a protective mucosal antibody against gut microbes.", "The infant's own IgG1 circulates in blood and is not what is being supplied by breastfeeding."], "objective": "After birth, breast milk supplies maternal IgA (and some IgM) for mucosal immunity and GI maturation, separate from placental IgG transferred by FcRn.", "table": "<table><tr><th>Source<\/th><th>Antibody<\/th><th>Where it acts<\/th><th>When<\/th><\/tr><tr><td>Placenta (FcRn)<\/td><td>IgG<\/td><td>Blood, systemic<\/td><td>Mostly after week 30; gone by 4 to 8 months<\/td><\/tr><tr><td>Breast milk<\/td><td>IgA, some IgM<\/td><td>Gut mucosa<\/td><td>After birth, while breastfeeding<\/td><\/tr><tr><td>Infant's own B cells<\/td><td>IgM, then IgG, IgA<\/td><td>Rising over the first years<\/td><td>IgG2 (polysaccharide) slowest<\/td><\/tr><\/table>"}, {"qid": "4B-2", "topic": "Window of opportunity", "stem": "<p>Mice raised germ-free from birth are compared with conventionally housed mice. As adults, the germ-free mice show strong allergic sensitization and higher rates of autoimmune disease. In one group, germ-free pups are given normal gut flora during the first week of life; as adults they look like conventional mice. In another group, germ-free mice receive the same flora only as adults; their allergic and autoimmune tendencies persist.<\/p>", "lead": "Which conclusion is best supported by these results?", "choices": ["Early microbial exposure shapes lifelong immune balance", "Maternal IgG protects only during the first months", "Thymic involution drives autoimmunity in adulthood", "Microbes trigger allergy by priming Th2 responses", "Homeostatic T cell proliferation causes allergy"], "answer": 0, "explanation": "<p>Germ-free animals have a high risk of allergic and autoimmune disease, which is part of the experimental evidence for the hygiene hypothesis. The key result is the timing: restoring flora early reverses that risk, while restoring the same flora in adulthood does not. That points to a window early in life when microbial exposures set the long-term balance between regulation and inflammation.<\/p><p>The lecture frames this as a possible window of opportunity for early interventions (delivery mode, breastfeeding, antibiotic use and other exposures) that shape the immune system and microbiome together. Microbes in this model protect against allergy, so a conclusion that they cause it reverses the finding.<\/p>", "why_wrong": ["Correct: early but not late reconstitution reverses the risk, so early exposures set long-term immune balance.", "Maternal IgG timing is true but is not what this experiment tests; no antibody transfer was manipulated.", "Thymic involution begins at puberty in every animal and was not varied between the groups.", "Microbes here protect against allergy; their absence, not their presence, led to sensitization.", "Homeostatic proliferation is the response to thymic involution in aging, unrelated to this germ-free model."], "objective": "Germ-free animals develop allergy and autoimmunity that early (but not late) microbial reconstitution reverses, supporting a window of opportunity in early life."}, {"qid": "4B-3", "topic": "Physiologic IgG nadir", "stem": "<p>A 5-month-old boy born at term is evaluated for two bacterial pneumonias and an ear infection over the past two months. He was well until 3 months of age. Growth has slowed.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Note<\/th><\/tr><tr><td>Serum IgG<\/td><td>12% of adult level<\/td><td>healthy infants: rarely below about 40%<\/td><\/tr><tr><td>Serum IgM<\/td><td>Undetectable<\/td><td><\/td><\/tr><tr><td>CD19+ B cells<\/td><td>Absent<\/td><td>normal 10 to 30% of lymphocytes<\/td><\/tr><tr><td>CD3+ T cells<\/td><td>Normal for age<\/td><td><\/td><\/tr><\/table><p>His parents were told by a relative that all babies have low antibody levels at this age.<\/p>", "lead": "Which interpretation of his IgG level is most appropriate?", "choices": ["Normal nadir as maternal IgG fades and his own IgG rises", "Expected result of limited placental transfer before week 30", "Below the healthy nadir, consistent with failed antibody production", "Reflection of slow IgG2 maturation seen in all young children", "Consequence of Th2 skewing that suppresses IgG in infancy"], "answer": 2, "explanation": "<p>Total IgG does dip in every infant: maternal IgG crossed the placenta by FcRn and fades by about 4 to 8 months, while the infant's own IgG is still rising. But healthy infants start making their own IgG fairly quickly, so serum IgG typically never falls below about 40% of adult levels. A value of 12% is far below that floor.<\/p><p>The rest of the panel says why: no B cells and no IgM mean he is making no antibody of his own, so nothing replaces maternal IgG as it disappears. That is why humoral immunodeficiencies typically show up clinically in this window. He was born at term, so placental transfer was complete, and slow IgG2 maturation affects polysaccharide responses in children who otherwise make antibody normally.<\/p>", "why_wrong": ["A physiologic dip exists, but healthy infants rarely fall below about 40% of adult IgG; 12% with no B cells is not normal.", "He was born at term, after the bulk of placental IgG transfer.", "Correct: IgG far below the healthy floor, with absent B cells and IgM, means he cannot replace fading maternal IgG.", "Slow IgG2 maturation limits polysaccharide responses but does not drop total IgG this low or remove B cells.", "The early Th2 skew favors tolerance and allergy potential; it does not abolish IgG production."],
