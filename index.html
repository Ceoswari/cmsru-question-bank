<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>CMSRU Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a calm study desk. Light top app bar with pill tabs and a centered page for setup screens; the test runs
   full screen with a single toolbar, a horizontal question rail of round chips, the question as a card on the left
   and the explanation as a card on the right. Teal is the working accent; correct/incorrect use blue vs gold
   (colorblind-safe) and always carry a word or a glyph. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f5f8f6; --sunk:#e4eae6;
  --ink:#16211d; --muted:#5a6a63; --line:#d5ded9; --line-2:#c3cfc9;
  --accent:#0d7a69; --accent-ink:#ffffff; --accent-soft:#dcefe9; --accent-deep:#095c4f;
  --good:#1f5fbf; --good-soft:#e1eafa; --bad:#a96800; --bad-soft:#f8ecd6;
  --hl:#ffe86b; --hl-ink:#16211d; --strike:#97a59e; --shadow:0 1px 2px rgba(18,40,32,.06),0 4px 14px rgba(18,40,32,.06);
  --f-ui:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:17px; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --surface-2:#1c2723; --sunk:#121a17;
  --ink:#e4ece8; --muted:#97a8a0; --line:#2a3833; --line-2:#36463f;
  --accent:#3fbfa6; --accent-ink:#06231d; --accent-soft:#163a33; --accent-deep:#6fd6c1;
  --good:#6aa8ff; --good-soft:#172c49; --bad:#f2b14a; --bad-soft:#3a2b12;
  --hl:#6b5a12; --hl-ink:#f5f1dc; --strike:#5f6f68; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --surface-2:#1c2723; --sunk:#121a17;
  --ink:#e4ece8; --muted:#97a8a0; --line:#2a3833; --line-2:#36463f;
  --accent:#3fbfa6; --accent-ink:#06231d; --accent-soft:#163a33; --accent-deep:#6fd6c1;
  --good:#6aa8ff; --good-soft:#172c49; --bad:#f2b14a; --bad-soft:#3a2b12;
  --hl:#6b5a12; --hl-ink:#f5f1dc; --strike:#5f6f68; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h2,h3,h4{font-family:var(--f-ui)}

/* ---------- app bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-ui)}
.logo .glyph{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px}
.logo b{display:block;font-size:15.5px;line-height:1.1}
.logo small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{background:var(--surface-2);color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep)}
.spacer{flex:1}
.appbar select{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13.5px;max-width:180px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:var(--surface-2)}

.page{max-width:1180px;margin:0 auto;padding-block:26px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.page-h h2{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0;text-wrap:balance}
.page-h p{margin:0;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec p.help{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.count{display:inline-block;min-width:24px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-family:var(--f-data);font-size:11.5px;line-height:20px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* chips used as checkboxes */
.opt{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:14.5px;cursor:pointer;user-select:none;background:var(--surface)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.opt:has(input:checked) .count{background:var(--surface);color:var(--accent-deep)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;position:relative}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);flex:none;margin-top:2px;display:grid;place-items:center}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode:has(input:checked) .box{background:var(--accent);border-color:var(--accent)}
.mode:has(input:checked) .box::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.mode:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.mode b{display:block;font-family:var(--f-ui);font-size:14.5px}
.mode span.d{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:var(--f-ui);font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.create{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:18px;align-items:start}
.lec-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.lec-head h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);flex:1}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-weight:600;font-size:13.5px}
.week{padding:14px 20px 16px;border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.week-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.week-h b{font-family:var(--f-ui);font-size:15px}
.week-h .linkbtn{margin-left:auto}
.lec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.lec{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer;position:relative}
.lec:hover{background:var(--surface-2)}
.lec input{position:absolute;opacity:0;pointer-events:none}
.lec .id{font-family:var(--f-data);font-size:12px;font-weight:500;min-width:44px;padding:2px 0;text-align:center;border-radius:6px;background:var(--sunk);color:var(--muted)}
.lec .t{flex:1;min-width:0;font-size:14.5px;line-height:1.3}
.lec:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.lec:has(input:checked) .id{background:var(--accent);color:var(--accent-ink)}
.lec:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.lec.dis{opacity:.4;cursor:default}

.startbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(18,40,32,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.startbar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.startbar .sum{font-family:var(--f-ui);font-weight:700;flex:1;min-width:160px}
.startbar .sum small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.startbar label{font-size:14px;color:var(--muted)}
.startbar input[type=number]{width:70px;padding:7px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-left:6px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:10px 20px;font-family:var(--f-ui);font-size:14.5px;font-weight:700}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.warn{background:var(--bad);color:#fff}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th{text-align:left;font-family:var(--f-ui);font-weight:800;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-data);font-size:11.5px;font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--accent-deep)}
.acts button.del{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:var(--f-ui);white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.om{background:var(--sunk);color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{padding:16px 18px}
.stat .k{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-family:var(--f-ui)}
.stat .v{font-family:var(--f-ui);font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat .v small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}

/* ---------- test interface ---------- */
.ti{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);z-index:7;font-size:var(--fs)}
.ti>*{min-width:0}
.ti-top{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));font-size:15px}
.ti-meta{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ti-meta .qno{font-family:var(--f-ui);font-weight:800;font-size:15px;white-space:nowrap}
.ti-meta .qid{font-family:var(--f-data);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-nav{display:flex;gap:6px;margin-left:8px}
.navbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 12px;font-family:var(--f-ui);font-weight:700;font-size:13.5px}
.navbtn svg{width:15px;height:15px}
.navbtn:hover:not(:disabled){background:var(--surface-2)}
.navbtn:disabled{opacity:.4;cursor:default}
.ti-tools{display:flex;gap:4px;margin-left:auto}
.tbtn{border:1px solid transparent;background:none;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.tbtn svg{width:18px;height:18px}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--line-2)}
.clock{font-family:var(--f-data);font-size:13px;padding:6px 10px;border-radius:8px;background:var(--sunk);white-space:nowrap}
.clock.low{background:var(--bad-soft);color:var(--bad);font-weight:600}
.endbtn{border:0;border-radius:9px;padding:8px 14px;font-family:var(--f-ui);font-weight:700;font-size:13.5px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.endbtn.alt{background:none;border:1px solid var(--line-2);color:var(--ink)}

.ti-rail{display:flex;gap:7px;overflow-x:auto;padding:10px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;position:relative;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);font-family:var(--f-data);font-size:12.5px;font-weight:500;display:grid;place-items:center;padding:0}
.chip.ans{border-color:var(--accent);color:var(--accent-deep)}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip[aria-current="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
.chip .fl{position:absolute;top:-5px;right:-5px;width:14px;height:14px;color:var(--bad)}

.ti-body{display:flex;gap:18px;min-height:0;padding:18px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));overflow:hidden}
.pane{overflow-y:auto;min-width:0;padding-bottom:40px}
.pane.q{flex:1}
.pane.x{flex:1;display:none}
.ti.split .pane.x{display:block}
.qcard,.xcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;max-width:820px}
.ti:not(.split) .qcard{margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lecpill{font-family:var(--f-data);font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.markq{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;margin-left:auto;padding:4px 10px;border:1px solid var(--line);border-radius:999px;position:relative;font-family:var(--f-ui);font-weight:600}
.markq input{position:absolute;opacity:0;pointer-events:none}
.markq svg{width:14px;height:14px}
.markq:has(input:checked){color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.markq:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.stem p{margin:0 0 .9em}
.stem table,.xbody table{border-collapse:collapse;margin:.4em 0 1em;font-size:.9em}
.stem td,.stem th,.xbody td,.xbody th{border:1px solid var(--line);padding:5px 11px;text-align:left;vertical-align:top}
.stem th,.xbody th{background:var(--surface-2);font-family:var(--f-ui);font-weight:700;font-size:.92em}
.lead{margin:1.1em 0 1em;font-weight:600}
mark.hl{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.hl-on mark.hl{cursor:pointer}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.ch:hover{border-color:var(--line-2);background:var(--surface-2)}
.ch .let{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:13px}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)}
.ch.sel .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch.struck .txt{text-decoration:line-through;color:var(--strike)}
.ch.struck .let{opacity:.5}
.ch .ab{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 7px;text-decoration:line-through}
.ch .ab:hover{color:var(--ink)}
.ch.locked{cursor:default}
.ch.locked:hover{background:var(--surface);border-color:var(--line)}
.ch.right,.ch.right:hover{border-color:var(--good);background:var(--good-soft)}
.ch.right .let{background:var(--good);border-color:var(--good);color:#fff}
.ch.wrong,.ch.wrong:hover{border-color:var(--bad);background:var(--bad-soft)}
.ch.wrong .let{background:var(--bad);border-color:var(--bad);color:#fff}
.ch .res{font-family:var(--f-ui);font-size:12px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.ch.right .res{color:var(--good)} .ch.wrong .res{color:var(--bad)}
.submit{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.submit .muted{font-size:13.5px}
.verdict{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;padding:12px 16px;border-radius:10px;background:var(--bad-soft);font-size:.9em}
.verdict.ok{background:var(--good-soft)}
.verdict .big{font-family:var(--f-ui);font-weight:800;font-size:1.1em;color:var(--bad)}
.verdict.ok .big{color:var(--good)}
.verdict.om{background:var(--sunk)} .verdict.om .big{color:var(--muted)}
.xcard h4{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.xbody p{margin:0 0 .9em}
.xbody .choice-why{margin:0 0 .7em;padding-left:12px;border-left:3px solid var(--line)}
.xbody .obj{margin-top:1.2em;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.xbody .obj b{display:block;margin-bottom:2px;font-family:var(--f-ui);color:var(--accent-deep)}
.xfoot{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.9em}

.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:440px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
.modal h4{margin:0;padding:18px 20px 0;font-size:17px;font-weight:800}

.kbd{font-family:var(--f-data);font-size:12px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;background:var(--surface-2)}

<script>window.QBANKS = [{"id": "miid", "name": "MIID Block I (M1)", "short": "MIID BLOCK I", "sessions": [{"id": "01", "title": "Intro to Microbiology", "week": 1, "subject": "Microbiology", "questions": [{"qid": "01-1", "topic": "Peptidoglycan and lysozyme", "stem": "<p>A researcher suspends a Gram-positive coccus in an isotonic sucrose buffer and adds a purified enzyme obtained from human tears and saliva. Within minutes, the cells lose their rigid outline and become fragile spheres that keep their cytoplasmic membrane. When the spheres are moved into distilled water, they swell and burst. Cells pretreated with the same enzyme that had been heat-inactivated keep their normal shape in water.<\/p>", "lead": "The enzyme most likely acted on which of the following?", "choices": ["The bond linking N-acetylmuramic acid to N-acetylglucosamine", "The terminal D-alanine-D-alanine of the pentapeptide side chain", "The lipid A portion of lipopolysaccharide in the outer membrane", "The phosphate group of the bactoprenol membrane carrier", "The mycolic acids of the waxy outer envelope"], "answer": 0, "explanation": "<p>An enzyme found in tears and saliva that strips a Gram-positive cell of its wall, leaving an osmotically fragile sphere that bursts in water, is lysozyme. The stem never names it, so the first step is recognizing that a protective structure outside the membrane was removed (the cell keeps its membrane but loses its shape and its resistance to osmotic swelling), and that only the cell wall does that job.<\/p><p>Lysozyme is an N-acetylmuramide glycan hydrolase. It cleaves the link between the two sugars of peptidoglycan, N-acetylmuramic acid (NAM) and N-acetylglucosamine (NAG), which breaks the glycan backbone, destabilizes the wall and leads to lysis. Gram-positive bacteria are especially exposed because their thick peptidoglycan layer sits on the outside with no outer membrane over it.<\/p>", "why_wrong": ["Correct: lysozyme breaks the sugar backbone bond between NAM and NAG, destroying the wall and leaving a fragile sphere.", "The D-alanine-D-alanine terminus is where vancomycin binds; an enzyme from tears does not act there.", "Lipid A belongs to the Gram-negative outer membrane, which a Gram-positive coccus does not have.", "Bacitracin blocks dephosphorylation of bactoprenol; that stops new wall synthesis but does not strip an existing wall within minutes.", "Mycolic acids are found in mycobacteria, not in a Gram-positive coccus."], "objective": "Lysozyme, present in secretions, cleaves the bond between NAM and NAG in peptidoglycan, which destroys the cell wall and leaves the bacterium vulnerable to osmotic lysis."}, {"qid": "01-2", "topic": "Cell wall-deficient bacteria", "stem": "<p>A bacterium recovered in a research laboratory grows only when the culture medium is supplemented with a sterol. Lipid analysis shows cholesterol in its cytoplasmic membrane. The organism keeps growing in the presence of high concentrations of penicillin and of a cephalosporin, and adding lysozyme has no effect on it. On a Gram stain it retains neither crystal violet nor counterstain well and is seen only as faint, irregular forms.<\/p>", "lead": "Which of the following best explains this organism's antibiotic resistance?", "choices": ["It secretes beta-lactamase into a periplasmic space", "It has a waxy envelope rich in mycolic acids", "It has no peptidoglycan cell wall to be targeted", "It produces a dense polysaccharide capsule", "It has penicillin-binding proteins that fail to bind the drug"], "answer": 2, "explanation": "<p>Two clues point to the same identity. Bacterial membranes lack sterols, and the only exception the lecture names is the mycoplasmas, which take up sterols such as cholesterol when grown in sterol-containing media. Mycoplasmas are also the one group of bacteria that is not surrounded by a cell wall, which fits the poor Gram staining and the indifference to lysozyme.<\/p><p>Beta-lactams such as penicillins and cephalosporins work by binding penicillin-binding proteins and blocking the final cross-linking of peptidoglycan. An organism with no peptidoglycan wall offers no target, so every cell wall synthesis inhibitor (beta-lactams, glycopeptides, bacitracin, cycloserine) is ineffective against it. That is why the lecture lists \"cephalosporin would be highly effective against mycoplasmas\" as a false statement.<\/p>", "why_wrong": ["A periplasmic beta-lactamase would not explain resistance to lysozyme or the sterol-containing membrane.", "Mycolic acids explain acid-fast staining in mycobacteria; they do not explain a sterol requirement.", "Correct: mycoplasmas lack a cell wall, so drugs and enzymes that target peptidoglycan have nothing to act on.", "A capsule protects against phagocytosis; it does not block beta-lactams from their target.", "Altered penicillin-binding proteins would explain beta-lactam resistance but not lysozyme resistance or the sterol requirement."], "objective": "Mycoplasmas, the only bacteria with sterols in their membrane, lack a cell wall and are therefore intrinsically resistant to beta-lactams and all other cell wall synthesis inhibitors."}, {"qid": "01-3", "topic": "Glycopeptides and the Gram-negative outer membrane", "stem": "<p>A 52-year-old man has a bloodstream infection with Gram-positive cocci in clusters that are catalase positive and resistant to methicillin. He is treated with a very large, bactericidal antibiotic that binds the end of the pentapeptide chains on newly made cell wall subunits and prevents their incorporation into the growing wall. He recovers. A year later he develops a urinary tract infection with <i>Escherichia coli<\/i>. In vitro, the same antibiotic has no effect on his <i>E. coli<\/i> isolate even at high concentrations.<\/p>", "lead": "Which of the following best explains the lack of activity against the second organism?", "choices": ["Gram-negative bacteria have no peptidoglycan for the drug to bind", "Lipopolysaccharide binds the drug and neutralizes it on the cell surface", "Gram-negative peptidoglycan pentapeptides do not end in D-alanine", "Periplasmic beta-lactamases hydrolyze the drug before it reaches its target", "The drug is too large to cross the outer membrane"], "answer": 4, "explanation": "<p>The first step is naming the drug. A very large bactericidal agent that binds the terminal D-alanine-D-alanine of the pentapeptide chains and blocks transglycosylation is a glycopeptide, vancomycin (or teicoplanin). It is used for methicillin-resistant <i>Staphylococcus aureus<\/i>, the organism the first part of the stem describes.<\/p><p>The second step is asking what is different about a Gram-negative rod. <i>E. coli<\/i> still has peptidoglycan with the same D-alanine-D-alanine target, but its thin peptidoglycan layer is covered by an outer membrane that acts as a permeability barrier to large molecules. Small hydrophilic molecules enter through porins; a molecule as large as a glycopeptide cannot. That is why glycopeptides are active only against Gram-positive organisms.<\/p>", "why_wrong": ["Gram-negative bacteria do have peptidoglycan; it is thin (5 to 10 nm), not absent.", "Lipopolysaccharide is a barrier and an endotoxin; it is not described as binding and neutralizing glycopeptides.", "The target is the same in Gram-negative bacteria; the problem is reaching it.", "Beta-lactamases inactivate beta-lactams; a glycopeptide has no beta-lactam ring.", "Correct: glycopeptides are very large molecules and cannot penetrate the Gram-negative outer membrane."], "objective": "Glycopeptides such as vancomycin bind D-alanine-D-alanine on cell wall precursors, but their large size keeps them out of Gram-negative bacteria, whose outer membrane excludes large molecules.", "table": "<table><tr><th><\/th><th>Gram-positive<\/th><th>Gram-negative<\/th><\/tr><tr><td>Peptidoglycan<\/td><td>Thick (20 to 80 nm), outermost<\/td><td>Thin (5 to 10 nm)<\/td><\/tr><tr><td>Outer membrane with lipopolysaccharide<\/td><td>Absent<\/td><td>Present; barrier to large molecules<\/td><\/tr><tr><td>Periplasmic space with beta-lactamases<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><td>Glycopeptide activity<\/td><td>Yes<\/td><td>No<\/td><\/tr><\/table>"}, {"qid": "01-4", "topic": "Prokaryotic cell organization and the cytoplasmic membrane", "stem": "<p>A microorganism is isolated from a soil sample. Electron microscopy shows a single, tightly coiled circular DNA molecule lying free in the cytoplasm with no surrounding membrane, small extra circles of DNA, and 70S ribosomes. No mitochondria, endoplasmic reticulum or Golgi apparatus are seen. The organism grows best in air, and biochemical studies show that it generates most of its adenosine triphosphate (ATP) by electron transport coupled to oxidative phosphorylation.<\/p>", "lead": "In this organism, the electron transport chain is most likely located in which of the following?", "choices": ["The outer membrane", "The periplasmic space", "The nucleoid region", "The cytoplasmic membrane", "The inner mitochondrial membrane"], "answer": 3, "explanation": "<p>The first step is classifying the organism. DNA in a single circular chromosome coiled into a nucleoid with no nuclear membrane, plasmids, 70S ribosomes and no membrane-bound organelles are the defining features of a prokaryote, a bacterium. Because it has no mitochondria, the aerobic energy machinery a eukaryote keeps in its mitochondria has to sit somewhere else.<\/p><p>In prokaryotes, many of the metabolic functions that eukaryotic cells carry out in membrane-bound organelles are performed by the cytoplasmic membrane. Its major jobs include selective permeability and transport, electron transport and oxidative phosphorylation in aerobic species, excretion of hydrolytic exoenzymes, the enzymes that build DNA, cell wall polymers and membrane lipids, and the receptors of chemotaxis and other sensory systems.<\/p>", "why_wrong": ["The outer membrane of Gram-negative bacteria is a permeability barrier carrying lipopolysaccharide and porins, not the respiratory chain.", "The periplasmic space holds enzymes for metabolism and antibiotic resistance, such as beta-lactamases, but not the membrane-bound electron transport chain.", "The nucleoid is simply the region of coiled chromosomal DNA; it is not membrane bound and carries out no electron transport.", "Correct: in bacteria the cytoplasmic membrane carries out electron transport and oxidative phosphorylation, jobs done by mitochondria in eukaryotes.", "Prokaryotes have no mitochondria or other membrane-bound organelles."], "objective": "Bacteria lack membrane-bound organelles, so their cytoplasmic membrane performs functions that eukaryotes assign to organelles, including electron transport and oxidative phosphorylation in aerobic species."}, {"qid": "01-5", "topic": "Capsule and virulence", "stem": "<p>Two strains of <i>Streptococcus pneumoniae<\/i> are compared. Strain 1 forms smooth, glistening colonies on agar. Strain 2 is a mutant that lacks a single enzyme in a polysaccharide biosynthetic pathway and forms rough colonies. Both strains grow at the same rate in broth, have identical Gram stains, and carry the same cell wall composition. When injected into mice, a small number of strain 1 organisms causes fatal pneumonia, while large numbers of strain 2 organisms cause no illness.<\/p>", "lead": "Which of the following best explains why the mice survive infection with strain 2?", "choices": ["It cannot attach to host cells because it lacks common pili", "It is readily ingested by phagocytes because it lacks a capsule", "It cannot move toward nutrients because it lacks flagella", "It cannot exchange plasmids because it lacks conjugation pili", "It is destroyed by drying because it lacks a waxy lipid envelope"], "answer": 1, "explanation": "<p>Smooth versus rough colony form in <i>S. pneumoniae<\/i> reflects the polysaccharide coat. The virulent S form makes a dense glycocalyx, the capsule, which gives the colonies their smooth appearance. The R form is a mutant lacking an enzyme needed to manufacture that polysaccharide, so its colonies look rough. Since growth rate, Gram stain and cell wall are identical, the only difference between the strains is the capsule.<\/p><p>The capsule, made of high molecular weight polysaccharides, protects the bacterium against phagocytosis by host cells and is an important determinant of virulence. With <i>S. pneumoniae<\/i>, only a few encapsulated organisms can cause a fatal infection, while unencapsulated mutants do not cause disease, which is exactly what the mouse experiment shows.<\/p>", "why_wrong": ["Common pili (fimbriae) mediate adherence and are found almost exclusively on Gram-negative bacteria; the mutation here is in polysaccharide synthesis.", "Correct: loss of the polysaccharide capsule produces rough colonies and leaves the organism open to phagocytosis, so it no longer causes disease.", "Flagella are protein structures for motility and are rarely found on cocci; a polysaccharide pathway mutation would not remove them.", "Conjugation pili transfer DNA between cells and do not determine whether a single strain causes disease in a host.", "A waxy envelope of mycolic acids belongs to mycobacteria, not to <i>S. pneumoniae<\/i>."], "objective": "The polysaccharide capsule protects bacteria such as Streptococcus pneumoniae from phagocytosis; encapsulated smooth strains are virulent, while unencapsulated rough mutants are not."}, {"qid": "01-6", "topic": "Flagella and H antigens", "stem": "<p>A Gram-negative rod is studied in a capillary assay. Wild-type cells swim toward a capillary containing an amino acid and away from one containing a toxic chemical. A mutant with a deletion in a single structural gene grows and divides normally and still adheres to intestinal epithelial cells, but shows no net movement toward or away from either capillary. Convalescent serum from infected animals contains protective antibodies that coat the surface projections of wild-type cells; these antibodies find no target on the mutant.<\/p>", "lead": "The antigen missing from the mutant is best classified as which of the following?", "choices": ["The O antigen of lipopolysaccharide", "The lipid A of lipopolysaccharide", "The capsular polysaccharide", "The H antigen", "The adhesin of common pili"], "answer": 3, "explanation": "<p>The mutant has lost movement in response to chemical stimuli, which is chemotaxis, while growth and adherence are untouched. Motility in bacteria comes from flagella, long helical filaments extending from the cell surface. Normal adherence tells you the common pili are intact, so the missing surface projection is the flagellum.<\/p><p>Flagella are built of protein subunits called flagellins, which are strongly antigenic. These flagellar antigens are the H antigens, and they are important targets of protective antibody responses. A strain that cannot make flagellin therefore has no flagella, no chemotaxis and no H antigen for those antibodies to bind.<\/p>", "why_wrong": ["The O antigen is the outer polysaccharide of lipopolysaccharide; losing it would not stop motility or chemotaxis.", "Lipid A is the toxic, membrane-anchored part of lipopolysaccharide and is not a surface projection used for movement.", "A capsule protects against phagocytosis; it is a polysaccharide coat, not a motility structure.", "Correct: flagella are made of flagellin, the strongly antigenic H antigen, and their loss abolishes motility and chemotaxis.", "Adhesins of common pili mediate attachment, and the mutant still adheres normally."], "objective": "Bacterial flagella, made of strongly antigenic flagellin (the H antigen), provide motility and chemotaxis and are targets of protective antibodies."}, {"qid": "01-7", "topic": "Common pili and adherence", "stem": "<p>A strain of <i>Escherichia coli<\/i> isolated from the intestine binds tightly to cultured intestinal epithelial cells. Electron microscopy shows many short, hair-like protein projections over its surface in addition to a few long helical filaments. A mutant lacking the long helical filaments still binds normally. Binding of the wild-type strain is almost completely blocked when soluble mannose is added to the culture medium, while adding glucose has no effect. Transfer of a resistance plasmid from this strain to a recipient strain is unchanged in the presence of mannose.<\/p>", "lead": "Which of the following structures most likely mediates this binding?", "choices": ["Conjugation pili", "Peritrichous flagella", "Common pili (fimbriae)", "A polysaccharide capsule", "The lipopolysaccharide O antigen"], "answer": 2, "explanation": "<p>The binding depends on short protein projections, does not need the long helical filaments (flagella), and is blocked by a specific sugar, mannose. That pattern describes adherence through a specific receptor interaction, and the surface projections that carry out adherence are the common pili, also called fimbriae.<\/p><p>Adherence to host cells involves specific interactions between molecules of the pili called adhesins and molecules in host cell membranes. The adhesins of <i>E. coli<\/i> interact with fucose and mannose molecules on the surface of intestinal epithelial cells, so free mannose competes for the adhesin and blocks attachment. Conjugation pili are a different class of pili used for DNA exchange, which is why plasmid transfer is unaffected by mannose.<\/p>", "why_wrong": ["Conjugation pili transfer DNA between bacterial cells, and plasmid transfer here is unaffected by mannose.", "The long helical filaments are flagella, and the mutant lacking them still binds normally.", "Correct: common pili carry adhesins that bind mannose and fucose on intestinal epithelial cells, so soluble mannose blocks attachment.", "A capsule is a polysaccharide coat that protects against phagocytosis, not a protein projection that binds a host sugar.", "The O antigen is part of lipopolysaccharide in the outer membrane; it is not the short protein projection described."], "objective": "Common pili (fimbriae) mediate adherence through adhesins that bind specific host molecules, such as the mannose and fucose residues on intestinal epithelial cells bound by Escherichia coli."}, {"qid": "01-8", "topic": "Endospores and heat resistance", "stem": "<p>After a church supper, several people develop blurred vision and weakness. The source is traced to home-canned peppers that had been boiled for 10 minutes during canning. A Gram-positive rod that grows only without oxygen is recovered from the jar. In the laboratory, a broth culture of the organism in active growth is completely killed by 10 minutes of boiling. A culture of the same strain left until its nutrients were exhausted is boiled in the same way, and viable organisms grow from it when it is placed back in fresh medium without oxygen.<\/p>", "lead": "The structure that allowed the second culture to survive boiling is rich in which of the following?", "choices": ["Mycolic acids", "Dipicolinic acid and calcium", "Sterols such as cholesterol", "Lipid A and core polysaccharide", "High molecular weight polysaccharide"], "answer": 1, "explanation": "<p>The first inference is that growing cells and nutrient-starved cells of the same strain behave differently. Only the starved culture survives boiling, which points to endospores: highly resistant spores that certain bacteria form when they are unable to grow, for example when nutrients are exhausted, and never by actively growing cells. The organism (a Gram-positive anaerobic rod from improperly canned food) fits <i>Clostridium<\/i>, one of the two spore formers the lecture highlights.<\/p><p>The second inference is what makes the spore so resistant. The endospore has a complex multilayered coat around a new bacterial cell, and it contains dipicolinic acid and a high calcium content, which are thought to give its extreme resistance to heat and chemicals. Spores that survive inadequate heating in a sealed jar can later return to growth, which is how food handling errors lead to disease.<\/p>", "why_wrong": ["Mycolic acids form the waxy envelope of mycobacteria, which resists drying but is not the basis of spore heat resistance.", "Correct: endospores, formed only by non-growing cells, contain dipicolinic acid and high calcium, which give them their resistance to heat.", "Sterols are found in the membranes of mycoplasmas, not in endospores.", "Lipid A and core polysaccharide belong to Gram-negative lipopolysaccharide; this organism is Gram-positive.", "High molecular weight polysaccharide forms a capsule, which protects against phagocytosis rather than boiling."], "objective": "Endospores form only in non-growing cells (for example when nutrients run out) and owe their extreme heat and chemical resistance to dipicolinic acid and a high calcium content.", "table": "<table><tr><th>Structure<\/th><th>Key component<\/th><th>Main protective role<\/th><\/tr><tr><td>Capsule<\/td><td>High molecular weight polysaccharide<\/td><td>Resists phagocytosis<\/td><\/tr><tr><td>Endospore<\/td><td>Dipicolinic acid, high calcium<\/td><td>Resists heat and chemicals<\/td><\/tr><tr><td>Mycobacterial envelope<\/td><td>Mycolic acids (waxy)<\/td><td>Resists drying; acid-fast staining<\/td><\/tr><tr><td>Gram-negative outer membrane<\/td><td>Lipopolysaccharide, porins<\/td><td>Barrier to large and hydrophobic molecules<\/td><\/tr><\/table>"}, {"qid": "01-9", "topic": "Gram-positive peptidoglycan and bile resistance", "stem": "<p>A bacterium isolated from the intestine keeps the primary stain after the alcohol decolorization step of a Gram stain. Electron microscopy shows a wall layer about 50 nm thick lying directly outside the cytoplasmic membrane, with no outer membrane over it. Chemical analysis shows the layer is made of hexose sugars cross-linked by chains of charged amino acids. The organism grows well in a medium containing a high concentration of bile.<\/p>", "lead": "Which property of this wall layer most directly allows the organism to grow in bile?", "choices": ["Its waxy, lipid-rich surface", "Its hydrophobic lipid A anchor", "Its sterol-containing structure", "Its porin channels that exclude bile salts", "Its thick, highly polar surface"], "answer": 4, "explanation": "<p>A thick wall layer (20 to 80 nm) of hexose sugars and amino acids, sitting outside the membrane with no outer membrane, and retaining the primary stain, is the peptidoglycan of a Gram-positive bacterium.<\/p><p>The polysaccharides and charged amino acids of the peptidoglycan layer make it highly polar, so Gram-positive organisms have a thick hydrophilic surface. That property is what allows them to resist the activity of bile in the intestine. Gram-negative bacteria instead rely on an outer membrane whose lipid components add hydrophobic properties.<\/p>", "why_wrong": ["A waxy, lipid-rich envelope of mycolic acids belongs to mycobacteria, and this wall is made of sugars and amino acids.", "Lipid A is part of Gram-negative lipopolysaccharide, and this organism has no outer membrane.", "Sterols are absent from bacterial membranes except in mycoplasmas, which have no cell wall at all.", "Porins are channels in the Gram-negative outer membrane that let hydrophilic nutrients in; this organism has no outer membrane.", "Correct: the thick Gram-positive peptidoglycan is highly polar and hydrophilic, which lets these organisms resist bile."], "objective": "The polysaccharides and charged amino acids of Gram-positive peptidoglycan give it a thick, highly polar, hydrophilic surface that resists the action of bile in the intestine."}, {"qid": "01-10", "topic": "Acid-fast organisms and cycloserine", "stem": "<p>A 45-year-old man has three months of cough and weight loss. A Gram stain of his sputum shows almost nothing. A second smear is flooded with fuchsin and heated, then washed with acid and alcohol; slender rods keep the stain while the background bacteria lose it. The organism grows slowly in culture. After first-line treatment fails, he is started on a second-line oral drug for this organism that inhibits bacterial cell wall synthesis at a cytoplasmic step.<\/p>", "lead": "This drug most likely acts by which of the following mechanisms?", "choices": ["Mimicking D-alanine and blocking its addition to wall precursors", "Binding D-alanine-D-alanine ends of growing pentapeptide chains", "Blocking dephosphorylation of the bactoprenol membrane carrier", "Binding penicillin-binding proteins through a beta-lactam ring", "Hydrolyzing the bond between the two sugars of peptidoglycan"], "answer": 0, "explanation": "<p>The first step is the stain. Retaining fuchsin that was driven in with heat, despite washing with acid and alcohol, is the Ziehl-Neelsen acid-fast stain. Organisms that do this are mycobacteria, whose waxy outer envelope of mycolic acids does not readily take up the Gram stain. A slowly growing acid-fast rod causing chronic cough and weight loss is <i>Mycobacterium tuberculosis<\/i>.<\/p><p>The second step is the drug. Among the cell wall synthesis inhibitors taught, the one used as a second-line drug for <i>M. tuberculosis<\/i> is cycloserine. It is a cyclic analogue of D-alanine and inhibits the incorporation of alanine into the cell wall precursor, a step that happens in the cytoplasm before the subunits are carried across the membrane.<\/p>", "why_wrong": ["Correct: cycloserine, a second-line drug for tuberculosis, is a cyclic analogue of D-alanine that blocks its incorporation into the cell wall precursor.", "Binding D-alanine-D-alanine is the action of glycopeptides such as vancomycin, which are large and active only against Gram-positive organisms.", "Blocking bactoprenol dephosphorylation is the action of bacitracin, which is used only topically.", "Binding penicillin-binding proteins describes the beta-lactams, which act at the final cross-linking stage outside the cytoplasm.", "Cleaving the NAM to NAG bond is the action of lysozyme, an enzyme in secretions, not an oral antibiotic."], "objective": "Mycobacteria are identified by acid-fast staining because of their waxy mycolic acid envelope, and cycloserine, a D-alanine analogue that blocks alanine incorporation into wall precursors, is a second-line drug for Mycobacterium tuberculosis."}, {"qid": "01-11", "topic": "Bacitracin and bactoprenol", "stem": "<p>An antibiotic is added to a culture of <i>Streptococcus pyogenes<\/i>. Within minutes, radiolabeled cell wall monomers made in the cytosol stop appearing in the growing wall. Analysis of the cytoplasmic membrane shows that the lipid carrier molecule that shuttles the monomers across the membrane is trapped in its phosphorylated, used form and cannot be recycled for another round. Synthesis of the monomers themselves and the activity of penicillin-binding proteins are both normal. Because of toxicity, the drug is applied only to the skin.<\/p>", "lead": "Which of the following antibiotics was most likely added?", "choices": ["Vancomycin", "Cycloserine", "Ampicillin", "Bacitracin", "Tetracycline"], "answer": 3, "explanation": "<p>Peptidoglycan monomers are made in the cytosol and attach to a membrane carrier called bactoprenol, which transports them across the cytoplasmic membrane and helps insert them into the growing peptidoglycan chains. For the carrier to be used again, it must be dephosphorylated. A drug that leaves bactoprenol stuck in its phosphorylated form stalls the transport step, so monomers never reach the wall even though they are made normally.<\/p><p>The antibiotic that blocks dephosphorylation of bactoprenol is bacitracin. It is used only for topical applications, and <i>S. pyogenes<\/i> is sensitive to it. Normal penicillin-binding protein activity and normal monomer synthesis rule out drugs that act at the final cross-linking step or at the cytoplasmic step.<\/p>", "why_wrong": ["Vancomycin binds D-alanine-D-alanine on the pentapeptide and blocks transglycosylation; it does not trap bactoprenol and is given systemically.", "Cycloserine blocks alanine incorporation in the cytoplasm, which would stop monomer synthesis itself.", "Ampicillin is a beta-lactam that binds penicillin-binding proteins, whose activity here is normal.", "Correct: bacitracin blocks dephosphorylation of bactoprenol, so monomers are not carried across the membrane; it is used only topically.", "Tetracycline inhibits protein synthesis at the 30S ribosome, not cell wall synthesis."], "objective": "Bacitracin blocks dephosphorylation of the bactoprenol carrier that moves peptidoglycan monomers across the membrane; it is used only topically, and Streptococcus pyogenes is sensitive to it."}, {"qid": "01-12", "topic": "Beta-lactamases in the periplasmic space", "stem": "<p>A Gram-negative rod isolated from a patient grows in high concentrations of ampicillin. Its penicillin-binding proteins, purified and tested on their own, bind ampicillin normally. The cells are gently broken apart and separated into fractions. One fraction rapidly opens the ring structure of ampicillin and destroys its activity; it comes from the compartment between the cytoplasmic membrane and the thin peptidoglycan layer, beneath the outer membrane. The culture supernatant, the cytoplasm and the outer membrane fraction have no such activity.<\/p>", "lead": "The fraction that destroys ampicillin corresponds to which of the following?", "choices": ["The nucleoid", "The capsule", "The cytosol", "The lipopolysaccharide layer", "The periplasmic space"], "answer": 4, "explanation": "<p>Normal binding by the purified penicillin-binding proteins means the target is unchanged, so the drug is being destroyed before it reaches the target. Opening the beta-lactam ring is the work of a beta-lactamase, and the compartment described, between the cytoplasmic membrane and the peptidoglycan, beneath the outer membrane, is the periplasmic space.<\/p><p>The periplasmic space of Gram-negative bacteria contains several enzymes involved in metabolism and in resistance to antibiotics. Beta-lactamases there can inactivate beta-lactams as they cross into the cell, before they reach their target penicillin-binding proteins, protecting the cell from the drug. Gram-positive bacteria, which have no outer membrane, secrete beta-lactamases extracellularly instead.<\/p>", "why_wrong": ["The nucleoid is the region of coiled chromosomal DNA in the cytoplasm, which had no activity.", "A capsule is an external polysaccharide coat that protects against phagocytosis; it lies outside the outer membrane.", "The cytoplasm (cytosol) fraction had no beta-lactamase activity.", "Lipopolysaccharide is part of the outer membrane, which had no activity.", "Correct: the periplasmic space, between the cytoplasmic membrane and the peptidoglycan, holds beta-lactamases that inactivate beta-lactams before they reach penicillin-binding proteins."], "objective": "In Gram-negative bacteria, beta-lactamases in the periplasmic space inactivate beta-lactams before they reach their penicillin-binding protein targets."}, {"qid": "01-13", "topic": "Penicillin-binding proteins and autolysis", "stem": "<p>A cephalosporin is added to a growing culture of a susceptible Gram-positive coccus. Within 30 minutes, cell wall subunits that have been carried across the membrane but not cross-linked build up outside the membrane, and by 2 hours most cells have burst. The experiment is repeated with a mutant strain that is identical except that it lacks the enzymes the cell normally uses to break down its own wall during growth. In the mutant, the subunits build up in the same way and growth stops, but the cells stay intact and viable counts fall only slightly.<\/p>", "lead": "Which of the following best explains the rapid lysis of the original strain?", "choices": ["Activation of the cell's own autolytic system", "Cleavage of peptidoglycan by host lysozyme", "Direct dissolution of the membrane by the drug", "Loss of the outer membrane barrier", "Inhibition of bactoprenol recycling by the drug"], "answer": 0, "explanation": "<p>A cephalosporin is a beta-lactam. Beta-lactams bind penicillin-binding proteins (PBPs), the membrane enzymes such as transpeptidases, transglycosylases and carboxypeptidases that carry out the final cross-linking of the wall. With those enzymes blocked, subunits that have already been moved across the membrane cannot be cross-linked, so precursor wall units accumulate.<\/p><p>That accumulation activates the cell's own autolytic system, which breaks down the wall and causes lysis. The mutant shows the point directly: without its autolytic enzymes the same drug still blocks cross-linking and stops growth, but the cells do not burst. This is why beta-lactams are bactericidal against susceptible bacteria.<\/p>", "why_wrong": ["Correct: blocking penicillin-binding proteins leads to accumulation of precursor wall units, which activates the cell's autolytic system and causes lysis.", "This is a culture with no host secretions, so lysozyme is not present.", "Beta-lactams act on penicillin-binding proteins; the mutant shows the membrane is not dissolved by the drug itself.", "A Gram-positive coccus has no outer membrane.", "Bactoprenol recycling is blocked by bacitracin, and here subunits were already carried across the membrane."], "objective": "Beta-lactams inhibit penicillin-binding proteins that cross-link the wall; the resulting accumulation of precursor units activates the bacterium's autolytic system and causes lysis."}, {"qid": "01-14", "topic": "Outer membrane, lipopolysaccharide and porins", "stem": "<p>A bacterium's cell envelope is analyzed. It contains a molecule made of three parts: a lipid that is toxic when injected into animals, a central core, and a long polysaccharide chain that differs between strains and is recognized by antibodies. A small, water-soluble antibiotic that must enter the cell to work is highly active against the wild-type strain. A spontaneous mutant becomes resistant to this antibiotic and also grows more slowly when sugars and amino acids in the medium are scarce. The antibiotic target in the mutant is unchanged, and no drug-destroying enzyme is found.<\/p>", "lead": "The mutant most likely has a defect in which of the following?", "choices": ["The polysaccharide capsule", "Penicillin-binding proteins", "Outer membrane porins", "The peptidoglycan cross-links", "Periplasmic beta-lactamases"], "answer": 2, "explanation": "<p>The first inference is the type of envelope. A molecule of lipid A (toxic), a core and a strain-variable O antigen (antigenic) is lipopolysaccharide, present only in Gram-negative bacteria. So this organism has an outer membrane over a thin peptidoglycan layer, and that outer membrane acts as a permeability barrier.<\/p><p>The second inference is how a small hydrophilic molecule gets through that barrier. Hydrophilic molecules such as sugars and amino acids, which the cell needs for nutrition, enter through channels formed by proteins called porins. A mutant that has lost porins lets less of a small water-soluble drug in and also takes up nutrients more poorly, which explains both the resistance (with an unchanged target and no inactivating enzyme) and the slow growth on scarce nutrients.<\/p>", "why_wrong": ["A capsule protects against phagocytosis; losing it would not reduce drug or nutrient entry.", "The target is unchanged, which excludes altered penicillin-binding proteins.", "Correct: porins in the Gram-negative outer membrane admit small hydrophilic molecules, both nutrients and drugs, so their loss explains resistance and slow growth.", "Changes in peptidoglycan cross-links would not explain poorer uptake of sugars and amino acids.", "No drug-destroying enzyme was found, which excludes beta-lactamase activity."], "objective": "Lipopolysaccharide (lipid A, core and O antigen) marks the Gram-negative outer membrane, a permeability barrier that small hydrophilic nutrients and drugs cross through porins.", "table": "<table><tr><th>Outer membrane feature<\/th><th>Role<\/th><\/tr><tr><td>Lipid A<\/td><td>Toxic properties; hydrophobic barrier<\/td><\/tr><tr><td>O antigen<\/td><td>Antigenic properties<\/td><\/tr><tr><td>Porins<\/td><td>Entry of small hydrophilic molecules (sugars, amino acids)<\/td><\/tr><tr><td>Overall membrane<\/td><td>Barrier to large molecules such as glycopeptides<\/td><\/tr><\/table>"}]}, {"id": "02", "title": "Bacterial Metabolism and Genetics", "week": 1, "subject": "Microbiology", "questions": [{"qid": "02-1", "topic": "Selective toxicity of metronidazole", "stem": "<p>In a pharmacology laboratory, an antimicrobial prodrug containing a nitro group is incubated with cell extracts. Extracts of an anaerobic bacterium and of an anaerobic intestinal protozoan convert the drug into reactive compounds that fragment DNA. Extracts of <i>Pseudomonas aeruginosa<\/i> grown in air and extracts of human liver cells leave the drug unchanged. When the anaerobic bacterial extract is depleted of its ferredoxin-like electron carriers, the conversion no longer occurs.<\/p>", "lead": "Which of the following best explains why the drug is selectively toxic?", "choices": ["Susceptible cells lack superoxide dismutase and catalase", "Susceptible cells reduce its nitro group via low redox potential carriers", "Susceptible cells synthesize folate that host cells must obtain from the diet", "Susceptible cells have 70S ribosomes that bind the activated drug", "Susceptible cells carry DNA gyrase that the drug inhibits"], "answer": 1, "explanation": "<p>The stem describes metronidazole without naming it: a nitroimidazole prodrug that damages DNA only after it is activated. The key finding is that activation happens in anaerobic bacteria and protozoa but not in aerobic bacteria or human cells, and that it depends on ferredoxin-like carriers.<\/p><p>Metronidazole works because bacterial nitroreductase pathways of low redox potential, linked to ferredoxin or flavodoxin-like electron transport components, reduce its nitro group into cytotoxic compounds that disrupt DNA. Those pathways are characteristic of anaerobic bacteria and protozoa (for example <i>Giardia lamblia<\/i> and <i>Trichomonas vaginalis<\/i>) and absent in aerobic host cells, which is the basis of its selectivity. It is also why metronidazole is not useful against an obligate aerobe such as <i>Pseudomonas<\/i>.<\/p>", "why_wrong": ["Lack of superoxide dismutase explains why obligate anaerobes die in oxygen, not how they activate this drug.", "Correct: low redox potential, ferredoxin-linked pathways reduce the nitro group to DNA-damaging products, and host cells lack them.", "Folate synthesis is the target of sulfonamides and trimethoprim, not of a nitro-group prodrug.", "70S ribosomes are the target of aminoglycosides, tetracyclines, macrolides and chloramphenicol.", "DNA gyrase is the target of quinolones; this drug damages DNA directly after activation."], "objective": "Metronidazole is activated by reduction of its nitro group through low redox potential, ferredoxin-linked pathways present only in anaerobic bacteria and protozoa, which makes it selectively toxic to them."}, {"qid": "02-2", "topic": "Mechanisms of gene transfer", "stem": "<p>Two strains of a bacterium are placed in a U-shaped tube separated by a filter whose pores block whole bacterial cells but let through particles of virus size. The donor strain carries an antibiotic resistance gene; the recipient does not. After incubation, resistant recipient colonies appear. Adding purified deoxyribonuclease to the recipient side does not prevent their appearance. When the experiment is repeated with a donor strain that carries no bacteriophage, no resistant recipients appear.<\/p>", "lead": "Which of the following processes most likely transferred the gene?", "choices": ["Conjugation", "Transformation", "Transfection", "Transduction", "Transposition"], "answer": 3, "explanation": "<p>Each control in the experiment rules out one route. A filter that blocks whole cells prevents direct contact, so conjugation through a sex pilus cannot occur. Deoxyribonuclease destroys free, naked DNA, so its failure to block transfer rules out transformation. The remaining requirement, that the donor carry a bacteriophage, points to transfer by a virus.<\/p><p>In transduction, a bacteriophage accidentally packages a fragment of host DNA (generalized) or picks up genes next to its integration site (specialized) and delivers it to the next cell it infects, where the DNA is incorporated into the genome. Phage particles pass the filter, and DNA inside a phage capsid is protected from deoxyribonuclease.<\/p>", "why_wrong": ["Conjugation requires direct contact through a pilus, which the filter prevents.", "Transformation is uptake of free DNA, which deoxyribonuclease would have destroyed.", "Transfection is not one of the bacterial gene transfer mechanisms taught; the term is a common confusion for transduction.", "Correct: phage-mediated transfer passes through the filter and is protected from deoxyribonuclease inside the capsid.", "A transposon moves between DNA molecules within a cell; it does not move a gene between cells on its own."], "objective": "Transduction moves bacterial DNA between cells inside bacteriophage particles, so it does not need cell contact and is resistant to deoxyribonuclease, unlike conjugation and transformation.", "table": "<table><tr><th>Process<\/th><th>Vehicle<\/th><th>Needs cell contact<\/th><th>Blocked by DNase<\/th><\/tr><tr><td>Transformation<\/td><td>Free DNA<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><td>Conjugation<\/td><td>Sex pilus<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>Transduction<\/td><td>Bacteriophage<\/td><td>No<\/td><td>No<\/td><\/tr><\/table>"}, {"qid": "02-3", "topic": "Inhibitors of bacterial transcription", "stem": "<p>An antibiotic is added to a growing culture of <i>Escherichia coli<\/i>. Within 2 minutes, incorporation of radiolabeled uridine into new RNA stops. Protein synthesis declines over the next several minutes as existing messenger RNA is degraded, while incorporation of radiolabeled thymidine into DNA continues briefly. Resistant mutants that arise have a single amino acid change in an enzyme that binds the DNA template. The drug has no effect on the corresponding process in cultured human cells.<\/p>", "lead": "Which of the following best describes the spectrum of activity expected for this drug?", "choices": ["Gram-positive, Gram-negative and acid-fast bacteria", "Gram-positive bacteria only, because of its large size", "Anaerobic bacteria and anaerobic protozoa only", "Gram-negative bacteria except Pseudomonas", "Bacteria that lack a cell wall only"], "answer": 0, "explanation": "<p>First, identify the process. RNA synthesis stops at once, protein synthesis falls only as preexisting messenger RNA decays (bacterial messenger RNA is unstable, with no 5 prime cap or poly-A tail), and DNA synthesis continues, so transcription is the step blocked. Resistance by a change in the enzyme that reads the DNA template identifies the target as DNA-dependent RNA polymerase. The drug is rifampin.<\/p><p>Second, recall what the lecture says about rifampin: it binds DNA-dependent RNA polymerase, blocks transcription, and is effective against Gram-positive, Gram-negative and acid-fast bacteria. That broad reach is why it is a central drug for <i>Mycobacterium tuberculosis<\/i>.<\/p>", "why_wrong": ["Correct: rifampin, the RNA polymerase inhibitor, is active against Gram-positive, Gram-negative and acid-fast bacteria.", "Gram-positive only coverage because of size describes the glycopeptides, which act on the cell wall.", "Activity limited to anaerobes and anaerobic protozoa describes metronidazole, which damages DNA after activation.", "Gram-negative coverage excluding Pseudomonas describes nalidixic acid, a first-generation quinolone that inhibits DNA gyrase.", "No drug in the lecture is limited to cell wall-deficient bacteria; those organisms are instead resistant to cell wall inhibitors."], "objective": "Rifampin blocks bacterial transcription by binding DNA-dependent RNA polymerase and is active against Gram-positive, Gram-negative and acid-fast bacteria."}, {"qid": "02-4", "topic": "Catalase and aerobic metabolism", "stem": "<p>Two Gram-positive cocci are isolated from separate wound cultures. Both grow on plates incubated in air. A colony of each is placed on a glass slide, and a drop of hydrogen peroxide is added. Isolate 1 immediately produces vigorous bubbling, and the gas released is oxygen. Isolate 2 produces no bubbles, even when the slide is watched for several minutes.<\/p>", "lead": "Isolate 1 most likely belongs to which of the following genera?", "choices": ["Streptococcus", "Clostridium", "Staphylococcus", "Corynebacterium", "Campylobacter"], "answer": 2, "explanation": "<p>Oxygen bubbling from hydrogen peroxide means the colony contains catalase, the enzyme that converts peroxide into water and oxygen. Aerobic metabolism produces toxic oxygen products: superoxide dismutase converts the free radical superoxide into peroxide, and catalase or peroxidase then breaks the peroxide down. Aerobic bacteria carry either catalase or peroxidase.<\/p><p>The presence or absence of catalase distinguishes <i>Staphylococcus<\/i>, which is catalase positive, from <i>Streptococcus<\/i>, which is catalase negative. Since both isolates are Gram-positive cocci growing in air, the bubbling isolate is a staphylococcus and the non-bubbling isolate is a streptococcus.<\/p>", "why_wrong": ["Streptococci are catalase negative, which fits isolate 2, not isolate 1.", "Clostridium is a Gram-positive rod and an obligate anaerobe that does not grow on plates in air.", "Correct: catalase converts hydrogen peroxide to water and oxygen, and catalase positivity distinguishes Staphylococcus from Streptococcus.", "Corynebacterium species are Gram-positive rods, not cocci.", "Campylobacter is a microaerophile that needs reduced oxygen and is not a Gram-positive coccus."], "objective": "Catalase breaks hydrogen peroxide down into water and oxygen; a positive catalase test distinguishes Staphylococcus (catalase positive) from Streptococcus (catalase negative)."}, {"qid": "02-5", "topic": "Obligate anaerobes and oxygen toxicity", "stem": "<p>A specimen from a deep, necrotic thigh wound shows large Gram-positive rods on stain. A plate incubated in room air shows no growth after 48 hours. A second plate placed in a sealed jar from which oxygen has been chemically removed shows small colonies only after 72 hours. When colonies from the jar are moved into room air, they are no longer viable within a few hours. Cell extracts from the organism easily reduce a nitro-containing drug to reactive compounds.<\/p>", "lead": "The death of this organism in room air is best explained by the absence of which of the following enzymes?", "choices": ["Nitroreductase", "Beta-lactamase", "Dihydrofolate reductase", "Beta-galactosidase", "Superoxide dismutase"], "answer": 4, "explanation": "<p>An organism that grows only after oxygen is removed and dies when moved into air is an obligate anaerobe. Large Gram-positive rods from a necrotic wound fit <i>Clostridium perfringens<\/i>, the cause of gangrene shown in the lecture. Its ready reduction of a nitro-containing drug reflects the low redox potential metabolism of anaerobes, which is why such organisms activate metronidazole.<\/p><p>Exposure to oxygen generates the toxic free radical superoxide. Aerobes convert it to peroxide with superoxide dismutase and then remove the peroxide with catalase or peroxidase. Obligate anaerobes lack superoxide dismutase, so exposure to oxygen leads to death. Anaerobes also grow more slowly than aerobes, so adequate incubation time matters; reading the jar plate at 48 hours could have produced a false negative result.<\/p>", "why_wrong": ["This organism clearly has nitroreductase activity, since it reduces the nitro-containing drug.", "Beta-lactamase protects against beta-lactam antibiotics, not against oxygen.", "Dihydrofolate reductase is a folate pathway enzyme, the target of trimethoprim, and has nothing to do with oxygen tolerance.", "Beta-galactosidase is a lactose-using enzyme of the lac operon and does not protect against oxygen.", "Correct: obligate anaerobes lack superoxide dismutase, so the superoxide formed in air kills them."], "objective": "Obligate anaerobes such as Clostridium perfringens lack superoxide dismutase and die on exposure to oxygen; because they grow slowly, cultures need adequate incubation time to avoid misdiagnosis."}, {"qid": "02-6", "topic": "Anaerobic respiration with nitrate", "stem": "<p><i>Escherichia coli<\/i> is grown in three flasks containing glucose. Flask 1 is open to air. Flasks 2 and 3 are sealed and flushed so that no oxygen remains; flask 3 also contains potassium nitrate. Growth is greatest in flask 1. Growth in flask 3 is clearly better than in flask 2, and nitrite accumulates in flask 3 as the nitrate is consumed. No nitrite forms in flask 1, even though nitrate was added to it in a repeat experiment.<\/p>", "lead": "The metabolic ability shown in flask 3 is used clinically as the basis of which of the following?", "choices": ["The catalase test for staphylococci", "The nitrite reading on a urine dipstick", "The acid-fast stain of a sputum smear", "The anaerobic jar culture of a deep wound", "The Gram stain of a urine sediment"], "answer": 1, "explanation": "<p><i>E. coli<\/i> is a facultative anaerobe. It uses oxygen as the final electron acceptor whenever oxygen is available, which gives the greatest growth and explains why no nitrite forms in air. Without oxygen, it can carry out anaerobic respiration using nitrate as the last acceptor of electrons, reducing nitrate to nitrite. That is why flask 3 outgrows flask 2 and accumulates nitrite.<\/p><p>Enterobacteria such as <i>E. coli<\/i> are common causes of urinary tract infection, and urine in the bladder is a low-oxygen setting where they can reduce nitrate to nitrite. Detecting nitrite on a urine dipstick is therefore used as evidence of a bacterial infection of the urinary tract.<\/p>", "why_wrong": ["The catalase test detects breakdown of hydrogen peroxide, not reduction of nitrate.", "Correct: facultative anaerobes such as E. coli reduce nitrate to nitrite without oxygen, which the urine dipstick nitrite test detects.", "The acid-fast stain detects the waxy mycolic acid envelope of mycobacteria.", "An anaerobic jar is used to grow obligate anaerobes; it does not detect nitrate reduction.", "The Gram stain separates bacteria by cell wall structure and does not detect a metabolic product."], "objective": "Facultative anaerobes such as Escherichia coli use oxygen when available but use nitrate as the final electron acceptor without it, producing the nitrite detected on a urine dipstick in urinary tract infection."}, {"qid": "02-7", "topic": "Folate pathway inhibitors", "stem": "<p>A synthetic antibacterial drug is tested in cell-free extracts. In bacterial extracts, production of tetrahydrofolic acid stops and its immediate precursor, dihydrofolic acid, accumulates; synthesis of new nucleotides and amino acids falls soon after. The drug inhibits both Gram-positive and Gram-negative bacteria. Extracts of human cells and cultured human fibroblasts continue to make nucleotides normally at the same drug concentration. The drug is usually given together with a second agent in a fixed combination.<\/p>", "lead": "The second agent in this combination most likely acts by which of the following?", "choices": ["Inhibiting DNA-dependent RNA polymerase", "Binding the 30S subunit and blocking tRNA binding", "Inhibiting dihydropteroate synthetase", "Inhibiting DNA gyrase and topoisomerase IV", "Forming DNA-damaging products from a nitro group"], "answer": 2, "explanation": "<p>A drug that blocks conversion of dihydrofolic acid to tetrahydrofolic acid is inhibiting dihydrofolate reductase, which identifies it as trimethoprim. Tetrahydrofolic acid is needed to build amino acids and nucleic acids, and this synthetic pathway is absent in humans, which is why human cells are unaffected and why the pathway is an excellent antibacterial target, active against both Gram-positive and Gram-negative bacteria.<\/p><p>Trimethoprim is given with sulfamethoxazole as the combination Bactrim. Sulfonamides block an earlier step of the same pathway: they inhibit dihydropteroate synthetase, the enzyme that joins para-aminobenzoic acid (PABA) to dihydropteroate diphosphate. Hitting two steps of one pathway is the logic of the combination.<\/p>", "why_wrong": ["Inhibition of RNA polymerase is the action of rifampin, which is not part of this combination.", "Binding the 30S subunit and blocking aminoacyl-tRNA binding is the action of tetracyclines.", "Correct: the drug described is trimethoprim (dihydrofolate reductase), and its partner sulfamethoxazole inhibits dihydropteroate synthetase earlier in the same pathway.", "Inhibition of DNA gyrase and topoisomerase IV is the action of quinolones.", "Reduction of a nitro group to DNA-damaging products is how metronidazole works."], "objective": "Trimethoprim inhibits dihydrofolate reductase and sulfonamides inhibit dihydropteroate synthetase; combined as Bactrim, they block two steps of a folate pathway that humans lack.", "table": "<table><tr><th>Step<\/th><th>Enzyme<\/th><th>Inhibitor<\/th><\/tr><tr><td>PABA + dihydropteroate diphosphate to dihydropteroic acid<\/td><td>Dihydropteroate synthetase<\/td><td>Sulfonamides (sulfamethoxazole)<\/td><\/tr><tr><td>Dihydrofolic acid to tetrahydrofolic acid<\/td><td>Dihydrofolate reductase<\/td><td>Trimethoprim<\/td><\/tr><\/table>"}, {"qid": "02-8", "topic": "30S inhibitors: bactericidal versus bacteriostatic", "stem": "<p>Two antibiotics that bind the small ribosomal subunit are tested against the same Gram-negative rod. Drug A blocks movement of transfer RNA from the acceptor site to the peptidyl site, causes misreading of messenger RNA and releases incomplete peptide chains. Drug B binds the 16S ribosomal RNA and prevents aminoacyl-transfer RNA from interacting with the messenger RNA, so peptide chains stop growing. Viable counts are measured after 6 hours of exposure, and then again after each drug is washed out and the cells are placed in fresh broth.<\/p>", "lead": "Which of the following best describes the expected results?", "choices": ["Both drugs reduce viable counts sharply", "Neither drug changes the viable count", "Drug A halts growth; drug B reduces viable counts", "Drug A reduces viable counts; drug B halts growth", "Both drugs halt growth that resumes after washout"], "answer": 3, "explanation": "<p>Drug A has the features of an aminoglycoside: it acts at the 30S subunit, blocks translocation of tRNA from the A site to the P site, produces premature release of peptide chains and interferes with proofreading of aminoacyl-tRNAs. Drug B has the features of a tetracycline: it binds the 16S RNA of the 30S subunit and blocks the interaction of aminoacyl-tRNA with the mRNA, preventing elongation.<\/p><p>The two classes differ in outcome. Aminoglycosides are usually bactericidal, so viable counts fall and do not recover after washout. Tetracyclines are bacteriostatic: growth stops while the drug is present, the viable count stays roughly flat, and the cells resume growing once the drug is removed.<\/p>", "why_wrong": ["Tetracyclines are bacteriostatic, so drug B would not reduce viable counts sharply.", "Both drugs inhibit protein synthesis: drug A kills the cells and drug B stops their growth.", "This reverses the two classes: the aminoglycoside (drug A) is bactericidal and the tetracycline (drug B) is bacteriostatic.", "Correct: drug A is an aminoglycoside, usually bactericidal, and drug B is a tetracycline, bacteriostatic, so growth resumes after washout.", "Only the tetracycline is bacteriostatic; the aminoglycoside kills the cells."], "objective": "Aminoglycosides (30S, block A-to-P translocation and cause misreading) are usually bactericidal, while tetracyclines (30S, block aminoacyl-tRNA binding) are bacteriostatic."}, {"qid": "02-9", "topic": "50S ribosome inhibitors", "stem": "<p>An antibiotic is studied in a cell-free bacterial translation system. Initiation complexes form normally and the first peptide bonds are made, but during elongation, partially completed peptidyl-transfer RNA molecules come off the ribosome. Radiolabeled drug binds the large ribosomal subunit and not the small subunit. The drug is used against streptococci and against <i>Haemophilus<\/i>. It has no effect on ribosomes isolated from human cells.<\/p>", "lead": "Which of the following drugs acts on the same ribosomal subunit as this antibiotic?", "choices": ["Tetracycline", "Clindamycin", "Rifampin", "Ciprofloxacin", "Metronidazole"], "answer": 1, "explanation": "<p>Stimulating dissociation of peptidyl-tRNA from the ribosome during elongation is the mechanism of the macrolides, erythromycin and azithromycin. They act at the 50S subunit and are used against Gram-positive bacteria such as streptococci and Gram-negative bacteria such as <i>Haemophilus<\/i>. Bacterial ribosomes are 70S while human ribosomes are 80S, which is why bacterial ribosomes make excellent targets.<\/p><p>The other drugs taught to act at the 50S subunit are chloramphenicol, a broad-spectrum agent, and clindamycin, a lincosamide used against Gram-positive cocci. Tetracyclines and aminoglycosides act at the 30S subunit instead.<\/p>", "why_wrong": ["Tetracycline binds the 30S subunit and blocks aminoacyl-tRNA binding.", "Correct: clindamycin, a lincosamide, acts at the 50S subunit, like the macrolide described and chloramphenicol.", "Rifampin inhibits DNA-dependent RNA polymerase, not the ribosome.", "Cipr
