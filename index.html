ofloxacin inhibits DNA gyrase and topoisomerase IV.", "Metronidazole forms DNA-damaging products after its nitro group is reduced."], "objective": "Macrolides (erythromycin, azithromycin), chloramphenicol and clindamycin act on the 50S subunit; macrolides cause peptidyl-tRNA to dissociate during elongation.", "table": "<table><tr><th>Subunit<\/th><th>Drug<\/th><th>Key action<\/th><th>Effect<\/th><\/tr><tr><td>30S<\/td><td>Aminoglycosides<\/td><td>Block A-to-P translocation, misreading<\/td><td>Usually bactericidal<\/td><\/tr><tr><td>30S<\/td><td>Tetracyclines<\/td><td>Block aminoacyl-tRNA binding<\/td><td>Bacteriostatic<\/td><\/tr><tr><td>50S<\/td><td>Macrolides<\/td><td>Peptidyl-tRNA dissociation<\/td><td>Used for streptococci, Haemophilus<\/td><\/tr><tr><td>50S<\/td><td>Chloramphenicol<\/td><td>Binds 50S subunit<\/td><td>Broad spectrum<\/td><\/tr><tr><td>50S<\/td><td>Clindamycin<\/td><td>Binds 50S subunit (lincosamide)<\/td><td>Gram-positive cocci<\/td><\/tr><\/table>"}, {"qid": "02-10", "topic": "Two-component regulation of virulence in Bordetella pertussis", "stem": "<p>An infant has two weeks of coughing fits ending in a whooping breath. The organism recovered is studied in the laboratory. A wild-type strain shifted from 25 to 37 degrees Celsius makes several virulence proteins within an hour. A mutant strain carrying a point mutation in a membrane-anchored sensor protein makes those proteins at background levels at every temperature. In the mutant, the downstream regulatory protein is present in normal amounts but is recovered almost entirely without its phosphate group.<\/p>", "lead": "Which of the following best explains the mutant's failure to make virulence proteins?", "choices": ["The regulatory protein is degraded before it can act", "The regulatory protein is not activated to drive transcription", "The virulence genes have been deleted from the bacterial chromosome", "The ribosome cannot translate the virulence messenger RNA", "The virulence genes are carried on a lost plasmid"], "answer": 1, "explanation": "<p>The organism is <i>Bordetella pertussis<\/i>, the cause of whooping cough, and the system described is the bvg operon that controls its virulence genes. One gene encodes a membrane-anchored sensor protein, which senses changes such as temperature and becomes phosphorylated. The other encodes a transcription factor.<\/p><p>The phosphorylated sensor then phosphorylates and activates the regulatory protein, and in its phosphorylated form that protein acts as a transcription factor for several genes involved in virulence. In the mutant the regulatory protein is present at normal levels but unphosphorylated, so it is never activated and the virulence genes are never transcribed.<\/p>", "why_wrong": ["The stem states the regulatory protein is present in normal amounts, so it is not being degraded.", "Correct: a broken sensor cannot phosphorylate the regulatory protein, so it never becomes an active transcription factor for the virulence genes.", "The mutation is a point mutation in the sensor gene, and the virulence genes themselves are intact.", "The block is at transcription of the virulence genes, not at translation of their messenger RNA.", "Nothing indicates plasmid loss, and the defect maps to a point mutation in the sensor."], "objective": "In Bordetella pertussis, a membrane-anchored sensor responds to environmental change by phosphorylating a partner protein, which then acts as a transcription factor for virulence genes."}, {"qid": "02-11", "topic": "Transformation and competence", "stem": "<p>A culture of an encapsulated strain of <i>Streptococcus pneumoniae<\/i> is grown until the cells die and lyse, and the cell-free filtrate is collected. The filtrate is added to a growing culture of an unencapsulated strain near the end of its logarithmic growth. After incubation, a few encapsulated organisms are recovered. The experiment is repeated with deoxyribonuclease added to the filtrate before it is mixed in, and no encapsulated organisms appear. No bacteriophage is present in either culture, and the two cultures are never in contact as whole cells.<\/p>", "lead": "The appearance of encapsulated organisms is best explained by which of the following?", "choices": ["Conjugation", "Transduction", "Transformation", "Transposition", "Spontaneous reversion"], "answer": 2, "explanation": "<p>Three details narrow this down. Whole cells never touch, so there is no pilus-mediated transfer. No bacteriophage is present, so no phage can carry DNA. The transferred material is destroyed by deoxyribonuclease, so it is free, naked DNA released when the donor cells lysed.<\/p><p>Transformation is the active uptake and incorporation of exogenous DNA by a competent cell. <i>Streptococcus pneumoniae<\/i> is one of the naturally competent species, along with <i>Haemophilus influenzae<\/i>, <i>Bacillus<\/i> and <i>Neisseria<\/i> species, and competence develops toward the end of logarithmic growth, which is exactly when the recipient culture was exposed.<\/p>", "why_wrong": ["Conjugation is a one-way transfer through a sex pilus and requires cell to cell contact, which did not occur.", "Transduction requires a bacteriophage to package and deliver the DNA, and none is present.", "Correct: naturally competent Streptococcus pneumoniae took up free donor DNA, which is transformation, and deoxyribonuclease destroys that free DNA.", "Transposition is the movement of a transposon between DNA molecules inside one cell, not transfer between cells.", "Spontaneous reversion would not be prevented by adding deoxyribonuclease to the filtrate."], "objective": "Transformation is uptake of free exogenous DNA by competent bacteria such as Streptococcus pneumoniae, Haemophilus influenzae, Bacillus and Neisseria, and is blocked by deoxyribonuclease.", "table": "<table><tr><th>Mechanism<\/th><th>Vehicle<\/th><th>Blocked by deoxyribonuclease<\/th><\/tr><tr><td>Transformation<\/td><td>Free DNA from lysed cells<\/td><td>Yes<\/td><\/tr><tr><td>Conjugation<\/td><td>Sex pilus, cell contact<\/td><td>No<\/td><\/tr><tr><td>Transduction<\/td><td>Bacteriophage particle<\/td><td>No<\/td><\/tr><tr><td>Transposition<\/td><td>Transposon within one cell<\/td><td>No<\/td><\/tr><\/table>"}, {"qid": "02-12", "topic": "Quinolones and their generations", "stem": "<p>A synthetic agent is tested on a Gram-negative rod. Treated cultures accumulate excessive supercoiling ahead of the replication fork and interlinked daughter chromosomes that cannot separate, and the cells die. Human fibroblasts show unchanged replication at the same concentration. The first member of this drug family, which lacks a fluorine on the main ring, inhibits this isolate. A different isolate, <i>Pseudomonas aeruginosa<\/i>, is not inhibited by that first member but is inhibited by a later fluorinated member of the same family.<\/p>", "lead": "The enzymes inhibited by these agents normally perform which of the following functions?", "choices": ["Joining Okazaki fragments of the lagging strand after replication", "Adding nucleotides to the growing DNA strand", "Managing supercoils and separating daughter strands", "Unwinding messenger RNA during translation", "Transferring methyl groups onto ribosomal RNA"], "answer": 2, "explanation": "<p>The drug family is the quinolones, synthetic bactericidal agents that interfere with replication of the bacterial chromosome. The first-generation prototype, nalidixic acid, is effective against Gram-negative bacteria but not <i>Pseudomonas<\/i>. Adding fluorine at position 6 of the quinolone ring gives the fluoroquinolones, and ciprofloxacin, a second-generation agent, covers <i>Pseudomonas<\/i> and some Gram-positive organisms.<\/p><p>Their targets are DNA gyrase and topoisomerase IV. DNA gyrase produces and removes supercoils ahead of the replication fork to keep the tension needed for efficient duplication, and topoisomerase IV removes supercoils and separates newly formed daughter strands after replication. Quinolones inhibit these bacterial enzymes without affecting their human counterparts.<\/p>", "why_wrong": ["Joining fragments of the lagging strand is the job of DNA ligase, which is not the quinolone target.", "Adding nucleotides to the growing strand is the job of DNA polymerase.", "Correct: DNA gyrase and topoisomerase IV manage supercoiling and separate daughter chromosomes, and quinolones inhibit them.", "Quinolones act on DNA replication, not on messenger RNA during translation.", "Methylation of ribosomal RNA is a resistance mechanism against ribosome-binding drugs, not the quinolone target."], "objective": "Quinolones inhibit bacterial DNA gyrase and topoisomerase IV, which manage supercoiling and separate daughter chromosomes; nalidixic acid covers Gram-negative organisms except Pseudomonas, while fluorinated agents such as ciprofloxacin extend that coverage."}, {"qid": "02-13", "topic": "Oxygen requirements: microaerophiles and aerotolerant organisms", "stem": "<p>Four isolates are stabbed into tubes of soft agar in which oxygen is highest at the surface and absent at the bottom. Isolate W grows only in a narrow band a short distance below the surface, where oxygen is roughly 5 percent, and not at the top or bottom. Isolate X grows only at the surface. Isolate Y grows evenly from top to bottom with no change in density. Isolate Z grows only at the bottom of the tube.<\/p>", "lead": "Isolates W and Y are best classified as which of the following, respectively?", "choices": ["Obligate aerobe and facultative anaerobe", "Facultative anaerobe and obligate anaerobe", "Microaerophile and aerotolerant organism", "Aerotolerant organism and microaerophile", "Obligate anaerobe and obligate aerobe"], "answer": 2, "explanation": "<p>The position of growth in the tube reports the oxygen each organism needs. Isolate X at the surface is an obligate aerobe, dependent on oxygen. Isolate Z at the bottom is an obligate anaerobe, which dies in the presence of oxygen because it lacks superoxide dismutase.<\/p><p>Isolate W grows only where oxygen is low, around 2 to 10 percent, which defines a microaerophile such as <i>Campylobacter jejuni<\/i>. Isolate Y grows equally everywhere, meaning it neither uses nor is harmed by oxygen, which defines an aerotolerant organism such as <i>Streptococcus<\/i>. A facultative anaerobe would grow throughout but more heavily near the surface, since it grows better when oxygen is available.<\/p>", "why_wrong": ["An obligate aerobe grows only at the surface, which describes isolate X, not isolate W.", "A facultative anaerobe grows throughout but best near the oxygen, and isolate Y grows evenly.", "Correct: W needs low oxygen (microaerophile) and Y grows the same with or without oxygen (aerotolerant).", "This reverses the two: even growth means aerotolerant, and a narrow low-oxygen band means microaerophilic.", "An obligate anaerobe grows only at the bottom, which describes isolate Z."], "objective": "Oxygen requirement separates obligate aerobes, facultative anaerobes (better with oxygen), microaerophiles (2 to 10 percent oxygen), aerotolerant organisms (equal growth either way) and obligate anaerobes (killed by oxygen)."}, {"qid": "02-14", "topic": "Energy yield of respiration versus fermentation", "stem": "<p>A facultative anaerobe is grown in two flasks with the same amount of glucose. Flask 1 is aerated, and the culture reaches a high cell density; nearly all the carbon from glucose leaves as carbon dioxide, and oxygen is consumed. Flask 2 is sealed without oxygen and without nitrate, and the same amount of glucose supports far fewer cells; the medium accumulates organic acids and alcohols, and the pattern of these end products is characteristic enough for the laboratory to use it in identifying the organism.<\/p>", "lead": "The difference in cell yield between the flasks is best explained by which of the following?", "choices": ["Far more adenosine triphosphate is made per glucose in flask 1", "Glucose is transported into the cells faster in flask 1", "The organism makes more ribosomes per cell in flask 1", "The organism loses its capsule when oxygen is absent", "Toxic oxygen radicals are generated only in flask 2"], "answer": 0, "explanation": "<p>In aerobic respiration, oxygen is the last acceptor of electrons, and the theoretical yield is 38 molecules of adenosine triphosphate (ATP) per molecule of glucose, with glucose fully oxidized to carbon dioxide. That large energy yield is what supports a high cell density from a fixed amount of sugar.<\/p><p>Without oxygen and without an alternative acceptor such as nitrate, the organism must ferment pyruvate, which yields far less ATP per glucose and leaves partly oxidized end products behind. Different microorganisms ferment pyruvate to different end products, and the clinical laboratory uses those pathways and end products to distinguish bacteria.<\/p>", "why_wrong": ["Correct: aerobic respiration yields about 38 ATP per glucose, far more than fermentation, so the same sugar supports many more cells.", "Nothing indicates a difference in glucose transport, and the sugar is consumed in both flasks.", "Ribosome number follows growth rate rather than explaining the energy difference.", "The capsule protects against phagocytosis and does not determine energy yield from glucose.", "Toxic oxygen radicals form where oxygen is present, which is flask 1, and this organism tolerates them."], "objective": "Aerobic respiration yields about 38 ATP per glucose, while fermentation yields far less and leaves organism-specific end products that the clinical laboratory uses for identification."}, {"qid": "02-15", "topic": "Spread of resistance plasmids between species", "stem": "<p>A hospitalized man is infected at the same site with an <i>Enterococcus<\/i> strain resistant to a glycopeptide and with a <i>Staphylococcus aureus<\/i> strain resistant to a penicillinase-resistant penicillin. Weeks later, a <i>S. aureus<\/i> isolate from his wound is resistant to the glycopeptide as well, and it carries a new plasmid containing the glycopeptide resistance gene. Mixed in the laboratory with susceptible <i>S. aureus<\/i> strains, this isolate transfers the new plasmid readily when the cells are in direct contact, but not when a filter keeps the cells apart.<\/p>", "lead": "Which of the following structures is required for the laboratory transfer described?", "choices": ["A bacteriophage capsid", "A conjugation pilus", "A common pilus", "A polysaccharide capsule", "A flagellar filament"], "answer": 1, "explanation": "<p>The resistance gene has moved from one genus to another and the new plasmid now spreads among <i>S. aureus<\/i> strains. Transfer that requires direct cell to cell contact, and that fails when a filter separates the cells, is conjugation: a one-way transfer of DNA from donor to recipient through the conjugation or sex pilus. Free DNA (transformation) and phage-mediated transfer (transduction) would both work across a filter that blocks whole cells.<\/p><p>This is the mechanism the lecture uses to explain how glycopeptide resistance reached <i>Staphylococcus aureus<\/i>. A resistance plasmid moved from the enterococcus into the staphylococcus, most likely by conjugation, a transposon carrying the resistance gene jumped into the staphylococcal multiple-resistance plasmid, and that new plasmid then spreads readily to other <i>S. aureus<\/i> strains by conjugation.<\/p>", "why_wrong": ["Phage-mediated transfer would still occur across a filter that blocks whole cells.", "Correct: conjugation moves plasmid DNA one way through the sex pilus and requires direct contact between donor and recipient.", "Common pili (fimbriae) mediate adherence to host cells or surfaces, not DNA transfer.", "A capsule protects against phagocytosis and plays no part in plasmid transfer.", "Flagella provide motility and chemotaxis, not DNA transfer."], "objective": "Conjugation transfers plasmids one way through a sex pilus and requires cell to cell contact; it is the main route by which resistance plasmids spread, including glycopeptide resistance passing from enterococci into Staphylococcus aureus."}, {"qid": "02-16", "topic": "Bacterial versus eukaryotic gene expression", "stem": "<p>Researchers sequence a single messenger RNA isolated from a bacterial culture. The transcript has no 5' cap and no poly-A tail, and it contains three separate open reading frames in a row, each with its own start codon. The three proteins it encodes are enzymes of the same metabolic pathway. Metabolic labeling shows that newly made proteins from this transcript begin with a modified first amino acid.<\/p>", "lead": "Which of the following is most consistent with these findings?", "choices": ["The transcript was spliced to join three exons into one coding region", "The transcript is stable for hours because it lacks a cap and tail", "Each protein begins with methionine carrying no chemical modification", "The three genes are co-transcribed as one operon and start with formyl-methionine", "Translation must wait until the transcript is exported out of a nucleus"], "answer": 3, "explanation": "<p>Bacterial genes that share a function are often grouped into operons and transcribed together into one polycistronic messenger RNA, which carries more than one open reading frame. Three reading frames for three enzymes of the same pathway on one transcript is the textbook picture of an operon, which lets the cell turn the whole pathway on or off at once.<\/p><p>The modified first amino acid fits too: bacterial proteins start with formyl-methionine, while eukaryotic proteins start with plain methionine. Bacterial transcripts also lack a 5' cap and a poly-A tail, which makes them unstable, so the cell can change its protein output quickly. These differences, along with 70S versus 80S ribosomes, are why bacterial protein synthesis is a useful antibiotic target.<\/p>", "why_wrong": ["Bacteria lack introns, so their transcripts are not spliced.", "Lacking a cap and a poly-A tail makes bacterial messenger RNA unstable, not long lived.", "Plain methionine is the eukaryotic start; bacterial proteins begin with formyl-methionine.", "Correct: one polycistronic transcript for related enzymes is an operon, and bacterial proteins start with formyl-methionine.", "Bacteria have no nucleus, so there is no export step before translation."], "objective": "Bacterial messenger RNAs are often polycistronic operon transcripts without a cap or poly-A tail (so they are unstable), and bacterial proteins begin with formyl-methionine."}, {"qid": "02-17", "topic": "Lac operon regulation", "stem": "<p>E. coli strains are grown in different sugars, and expression of the lactose-use genes is measured.<\/p><table class=\"labs\"><tr><th>Strain<\/th><th>Glucose only<\/th><th>Lactose only<\/th><th>Glucose + lactose<\/th><\/tr><tr><td>Wild type<\/td><td>Very low<\/td><td>High<\/td><td>Low<\/td><\/tr><tr><td>Mutant 1<\/td><td>Very low<\/td><td>Very low<\/td><td>Very low<\/td><\/tr><\/table><p>Mutant 1 cannot make cyclic AMP. Its repressor protein and its lactose-use genes have normal sequences.<\/p>", "lead": "Adding which of the following to Mutant 1 grown in lactose only would most likely restore high expression?", "choices": ["Extra glucose, to activate the repressor", "Cyclic AMP, to allow CAP to activate transcription", "A second copy of the repressor gene", "An inhibitor of the lactose-use enzymes", "Additional lactose, to further inactivate the repressor"], "answer": 1, "explanation": "<p>The lac operon has two controls. The lac repressor is a negative regulator that responds to lactose: when lactose is present, the repressor lets go of the operon. CAP bound to cyclic AMP (CAP-cAMP) is a positive regulator that responds to glucose: cyclic AMP is high when glucose is low, and CAP-cAMP is then needed for strong transcription. The wild type shows both: high expression only with lactose and no glucose, and low expression when glucose is also present.<\/p><p>Mutant 1 has a normal repressor, so in lactose the repressor should already be off. Expression is still very low because there is no cyclic AMP, so CAP cannot activate the operon. Removing the brake is not enough without the accelerator. Supplying cyclic AMP restores CAP-cAMP and high expression in lactose.<\/p>", "why_wrong": ["Glucose lowers cyclic AMP and would reduce expression further; it does not act through the repressor.", "Correct: the missing piece is the positive regulator, CAP-cAMP, which needs cyclic AMP.", "More repressor would add negative control and lower expression.", "Blocking the enzymes does not change transcription of their genes and would not raise expression.", "The repressor is already off in lactose; the problem is the missing positive signal, not the repressor."], "objective": "The lac operon needs both the repressor removed (lactose present) and CAP-cAMP bound (glucose low, cyclic AMP high) for strong transcription."}]}, {"id": "03", "title": "Bacterial Pathogenesis I", "week": 1, "subject": "Microbiology", "questions": [{"qid": "03-1", "topic": "Dysbiosis and vaginitis", "stem": "<p>A 27-year-old woman has a thin, malodorous vaginal discharge that began after a 10-day course of a broad-spectrum oral antibiotic. Vaginal pH is 5.6 (normal 3.8 to 4.5). A Gram stain of the discharge shows very few of the large Gram-positive rods normally seen in healthy vaginal samples and many mixed anaerobic organisms. A similar episode two years ago resolved with treatment but recurred.<\/p>", "lead": "Which of the following best explains how this condition developed?", "choices": ["A new pathogen was acquired through sexual contact and invaded the vaginal wall", "A spore-forming anaerobe produced toxins after the antibiotic eliminated competitors", "Loss of acid-producing commensals let anaerobes take over the vacated niche", "Antibiotic exposure induced capsule production by the resident Gram-positive rods", "Anaerobes formed a biofilm on a retained foreign body and resisted clearance"], "answer": 2, "explanation": "<p>The large Gram-positive rods that dominate a healthy vaginal sample are <i>Lactobacillus<\/i> species. They keep the vaginal pH acidic, occupy the niche and discourage other organisms, which are among the protective roles the lecture assigns to normal microbiota. An antibiotic course disrupted them, and the stem shows the result: few lactobacilli, a rising pH and an overgrowth of anaerobes.<\/p><p>This is dysbiosis, a loss of the normal balance of the microbiota, here leading to vaginitis. The disease comes from a shift in who lives there rather than from a new invader, which is also why recurrence is common after antibiotics alone and why restoring a <i>Lactobacillus<\/i>-dominant community (for example vaginal microbiota transplant, under study) is the logical strategy.<\/p>", "why_wrong": ["Nothing in the stem suggests a newly acquired invasive pathogen; the change is in the resident flora.", "Toxin-producing spore formers after antibiotics describes Clostridioides difficile colitis in the gut, not this picture.", "Correct: losing Lactobacillus removes the acidic pH and competition that kept anaerobes in check, which is dysbiosis.", "Capsule production by lactobacilli is not part of this process; the lactobacilli are disappearing.", "No device or foreign body is present, and biofilm is not the mechanism described."], "objective": "Vaginitis from dysbiosis occurs when antibiotics or other disruptions deplete acid-producing Lactobacillus, raising the pH and allowing anaerobes to overgrow."}, {"qid": "03-2", "topic": "Quorum sensing and biofilms", "stem": "<p>Researchers study a <i>Pseudomonas aeruginosa<\/i> isolate taken from a urinary catheter. The wild-type strain grown at low density stays free-floating, but at high density it attaches to plastic, produces an extracellular matrix and becomes tolerant to antibiotic concentrations 100 times higher than those that kill free cells. A mutant lacking the enzyme that makes a small secreted signaling molecule never forms matrix, even at high density, and is killed by standard concentrations. Adding culture fluid from the wild-type strain restores matrix formation in the mutant.<\/p>", "lead": "The missing molecule normally allows the bacteria to do which of the following?", "choices": ["Bind mannose residues on host epithelial cells", "Transfer plasmids to neighboring cells through a pilus", "Survive dormant for years in a heat-resistant coat", "Inject effector proteins directly into the cytoplasm of host cells", "Sense population density and switch on group behavior"], "answer": 4, "explanation": "<p>The behavior changes with cell density, a secreted small molecule is required, and adding fluid from dense wild-type cultures rescues the mutant. Those three findings describe quorum sensing: bacteria release a signaling molecule that accumulates as their number rises, and once it passes a threshold it switches on multicellular behaviors.<\/p><p>Biofilm formation is the clinically important behavior quorum sensing controls. Biofilms form on medical devices such as catheters, are resistant or tolerant to antibiotics and biocides, can cause device failure, and act as a reservoir for recurrent bloodstream and urinary tract infections. Blocking the signal leaves the bacteria as free cells that ordinary antibiotic doses can kill.<\/p>", "why_wrong": ["Mannose binding by fimbrial adhesins is attachment, which does not depend on a secreted signal or on cell density.", "Conjugation transfers DNA by cell contact; it does not explain density-dependent matrix production.", "Dormancy in a resistant coat describes endospores, which Pseudomonas does not form.", "Secretion systems inject proteins into host cells; that does not regulate matrix formation by density.", "Correct: the secreted signal reports population density and triggers biofilm formation, which is quorum sensing."], "objective": "Quorum sensing uses secreted signals that accumulate with cell density to switch on group behaviors such as biofilm formation, which makes device infections tolerant to antibiotics and prone to recurrence."}, {"qid": "03-3", "topic": "Identifying Gram-positive cocci", "stem": "<p>A 2-year-old boy has 3 days of fever, rapid breathing and a productive cough, and a chest film shows a lobar consolidation. A sputum isolate grows as Gram-positive cocci in pairs that are catalase negative. On blood agar, the colonies are surrounded by a green zone of partial hemolysis. Growth is inhibited around an optochin disk, and the organism is encapsulated.<\/p>", "lead": "This organism is also a common cause of which of the following?", "choices": ["Lyme disease", "Otitis media", "Pseudomembranous colitis", "Tetanus", "Scrub typhus"], "answer": 1, "explanation": "<p>First, identify the organism with the Gram-positive identification scheme. Catalase-negative cocci are streptococci. Alpha (partial) hemolysis leaves a green zone, and among alpha-hemolytic streptococci, optochin sensitivity separates <i>Streptococcus pneumoniae<\/i> from the optochin-resistant viridans group. The capsule fits too: <i>S. pneumoniae<\/i> is a key encapsulated pathogen.<\/p><p>Second, the lecture makes the point that one bacterium can cause several different diseases. <i>S. pneumoniae<\/i> causes pneumonia, otitis media and meningitis. Pneumonia, in turn, is a disease that many different bacteria can cause, so the organism has to be identified in the laboratory rather than assumed from the syndrome.<\/p>", "why_wrong": ["Lyme disease is caused by Borrelia burgdorferi, transmitted by tick bite.", "Correct: Streptococcus pneumoniae causes pneumonia, otitis media and meningitis.", "Pseudomembranous colitis is caused by Clostridioides difficile after antibiotics deplete the gut flora.", "Tetanus is caused by Clostridium tetani, a spore former entering through contaminated wounds.", "Scrub typhus is caused by Orientia tsutsugamushi, transmitted by larval mites."], "objective": "Catalase-negative, alpha-hemolytic, optochin-sensitive cocci are Streptococcus pneumoniae, which causes pneumonia, otitis media and meningitis, illustrating that one bacterium can cause several diseases."}, {"qid": "03-4", "topic": "Limits of Koch's postulates", "stem": "<p>Investigators want to prove that a newly described Gram-positive coccus causes a skin infection. They recover it from the lesions of every affected patient and grow it in pure culture. When they swab the noses of 100 healthy hospital staff with no symptoms, 30 of them carry the identical strain. Inoculating the cultured organism onto the intact skin of laboratory mice produces no disease, and a human challenge study is not permitted.<\/p>", "lead": "Which conclusion is best supported by these findings?", "choices": ["The organism cannot be the cause, because it fails Koch's postulates", "The organism is a commensal and the lesions must have another cause", "Causation must be supported by epidemiological, molecular and immunological evidence", "The healthy carriers prove the organism lacks any virulence factors", "The organism must be an obligate intracellular pathogen that cannot infect mice"], "answer": 2, "explanation": "<p>Koch's postulates ask that the germ be present in every case, be grown in pure culture, cause the disease in an experimental model, and be recovered again from that model. This organism meets the first two but fails the last two, and it is also found in healthy people. The lecture lists exactly these weak points: some pathogens are carried by healthy individuals (Staphylococcus aureus, Escherichia coli and Clostridioides difficile are the examples), some cannot be cultured, and many human pathogens do not infect experimental animals, while people cannot be infected on purpose.<\/p><p>So failing the postulates does not rule an organism out. In practice, causality is built from other lines of evidence: epidemiology, pathophysiology, molecular findings and the immune response of patients.<\/p>", "why_wrong": ["Failing the animal step does not exclude causation; the lecture stresses that many human pathogens do not infect animals.", "Being carried by healthy people does not make an organism harmless; S. aureus and C. difficile are carried and still cause disease.", "Correct: when the postulates cannot be satisfied, causation rests on epidemiological, pathophysiological, molecular and immunological evidence.", "Carriage without disease reflects host factors and opportunity, not an absence of virulence factors.", "The organism grew in pure culture on its own, so it is not obligate intracellular."], "objective": "Koch's postulates fail for pathogens carried by healthy people, pathogens that cannot be cultured and pathogens that do not infect animals, so causality is often established with epidemiological, molecular and immunological evidence instead."}, {"qid": "03-5", "topic": "Identifying Gram-negative bacteria and transmission", "stem": "<p>Several residents of a village develop profuse watery diarrhea within days of each other. A stool sample grows curved, comma-shaped Gram-negative rods that are oxidase positive. The organism grows well on alkaline media and does not grow at 42 degrees Celsius. All of the affected households draw from the same shallow well, and households using bottled water are unaffected.<\/p>", "lead": "This outbreak illustrates which type of transmission?", "choices": ["Direct person-to-person spread by inhaled droplets", "Vector transmission by an arthropod bite", "Indirect contact through a contaminated fomite", "Vehicle transmission through contaminated water", "Direct person-to-person spread by physical contact"], "answer": 3, "explanation": "<p>First, identify the organism with the Gram-negative scheme. Comma-shaped, oxidase-positive rods branch into three: growth at 42 degrees points to Campylobacter jejuni, growth in alkaline media points to Vibrio cholerae, and urease positivity points to Helicobacter pylori. Growth in alkaline media with profuse watery diarrhea is Vibrio cholerae, the cause of cholera.<\/p><p>Second, recall how it spreads. Cholera is acquired by ingesting contaminated water, which is vehicle transmission: a nonliving vehicle such as food or water carries the organism to many people at once. The clustering around a single well, with protection in households using bottled water, is the classic epidemiological signature of a common vehicle.<\/p>", "why_wrong": ["Inhaled droplets spread organisms such as Bordetella pertussis and Mycobacterium tuberculosis, not a diarrheal illness tied to one well.", "Vector transmission needs an arthropod such as a tick, mite or flea, and none is involved.", "Fomites are inanimate objects such as tools or surfaces touched by patients; the shared source here is drinking water.", "Correct: Vibrio cholerae is ingested in contaminated water, which is vehicle transmission.", "Physical contact transmission describes organisms such as Chlamydia trachomatis; bottled water would not protect against it."], "objective": "Comma-shaped, oxidase-positive Gram-negative rods that grow in alkaline media are Vibrio cholerae, which spreads by vehicle transmission through contaminated water."}, {"qid": "03-6", "topic": "Enterococcus as a nosocomial pathogen", "stem": "<p>A 74-year-old man has been in the intensive care unit for 11 days with an indwelling urinary catheter. He develops fever and cloudy urine. Urine culture grows Gram-positive cocci in pairs and short chains that are catalase negative and show no hemolysis on blood agar. The isolate grows in broth containing 6.5% sodium chloride. The catheter is removed and shows a slimy coating of the same organism.<\/p>", "lead": "Which statement about this organism is most accurate?", "choices": ["It is an obligate intracellular pathogen that replicates only within host cells", "It is an environmental spore former that survives boiling for years", "It is a member of the ESKAPE group of hospital-acquired pathogens", "It is a vector-borne organism acquired from an arthropod bite", "It is an encapsulated organism identified by optochin sensitivity"], "answer": 2, "explanation": "<p>First, identify the organism. Catalase-negative cocci are streptococci or their relatives. Gamma hemolysis (none) with growth in 6.5% sodium chloride identifies the enterococci, such as Enterococcus faecalis and Enterococcus faecium. The slimy coating on the catheter is a biofilm, and Enterococcus faecalis is one of the lecture's examples of a biofilm former on catheters.<\/p><p>Second, place the infection. It began after more than a week in the intensive care unit with a device in place, which is a nosocomial (healthcare-associated) urinary tract infection. Enterococcus faecium is the E in ESKAPE, the group of pathogens (Enterococcus faecium, Staphylococcus aureus, Klebsiella pneumoniae, Acinetobacter baumannii, Pseudomonas aeruginosa, Enterobacter) that dominate hospital-acquired infections.<\/p>", "why_wrong": ["The organism grew on blood agar and in broth, so it does not need a host cell to replicate.", "The spore formers among Gram-positive bacteria are rods (Bacillus, Clostridium), not cocci.", "Correct: enterococci are salt-tolerant, gamma-hemolytic cocci, and Enterococcus faecium heads the ESKAPE list of hospital pathogens.", "Nothing suggests an arthropod; this infection came from a urinary catheter in the hospital.", "Optochin sensitivity identifies Streptococcus pneumoniae, which is alpha hemolytic, not salt tolerant."], "objective": "Catalase-negative, gamma-hemolytic cocci that grow in 6.5% sodium chloride are enterococci, which form biofilms on catheters and belong to the ESKAPE group of nosocomial pathogens."}, {"qid": "03-7", "topic": "Classification by intracellular lifestyle", "stem": "<p>A research laboratory receives an unidentified bacterium from a genital swab. It fails to grow on blood agar, chocolate agar, MacConkey agar or in any enriched broth, even after 2 weeks of incubation. When the swab is added to a layer of cultured human epithelial cells, inclusions full of bacteria appear inside the cells within 48 hours, and no bacteria are found in the culture fluid until the cells burst.<\/p>", "lead": "Which organism fits this pattern best?", "choices": ["Chlamydia trachomatis", "Salmonella Typhi", "Listeria monocytogenes", "Staphylococcus aureus", "Pseudomonas aeruginosa"], "answer": 0, "explanation": "<p>The organism grows only inside living host cells and not on any artificial medium. That is the definition of an obligate intracellular pathogen. The lecture divides pathogenic bacteria into three lifestyles: extracellular pathogens, which grow without the aid of the host; facultative intracellular pathogens, which can replicate both inside and outside cells; and obligate intracellular pathogens, which replicate only within a host cell.<\/p><p>The lecture's obligate intracellular examples are Chlamydia and the Rickettsiae, and a genital swab fits Chlamydia trachomatis, which causes urethritis and other genital infections spread by physical contact. Facultative intracellular organisms such as Salmonella Typhi and Listeria would have grown on laboratory media.<\/p>", "why_wrong": ["Correct: Chlamydia is an obligate intracellular pathogen that replicates only inside host cells.", "Salmonella Typhi is facultative intracellular, so it also grows on laboratory media.", "Listeria monocytogenes is facultative intracellular and grows readily on blood agar.", "Staphylococcus aureus is an extracellular pathogen that grows easily on blood agar.", "Pseudomonas aeruginosa is an extracellular pathogen that grows on blood and MacConkey agar."], "objective": "Obligate intracellular pathogens such as Chlamydia and Rickettsiae replicate only inside host cells, unlike facultative intracellular (Salmonella, Listeria, Legionella, Yersinia pestis) and extracellular (S. aureus, P. aeruginosa) pathogens.", "table": "<table><tr><th>Lifestyle<\/th><th>Grows on media?<\/th><th>Examples<\/th><\/tr><tr><td>Extracellular<\/td><td>Yes<\/td><td>S. aureus, P. aeruginosa<\/td><\/tr><tr><td>Facultative intracellular<\/td><td>Yes, and inside cells<\/td><td>Salmonella Typhi, Listeria, Legionella, Yersinia pestis<\/td><\/tr><tr><td>Obligate intracellular<\/td><td>No, only inside cells<\/td><td>Chlamydia, Rickettsiae<\/td><\/tr><\/table>"}, {"qid": "03-8", "topic": "Nosocomial vs community-acquired infection", "stem": "<p>A 52-year-old woman has an elective abdominal operation and goes home on postoperative day 4 feeling well. Twenty-one days after the operation, she returns with fever and redness, warmth and pus at the incision. Culture of the wound grows Staphylococcus aureus. She has had no other healthcare contact since discharge and no wounds elsewhere.<\/p>", "lead": "Which of the following best classifies this infection?", "choices": ["Community acquired, because it began more than 3 days after discharge", "Community acquired, because Staphylococcus aureus is normal skin flora", "Healthcare associated, because it began within 30 days of an operation", "Healthcare associated only if the strain matches one found in the operating room", "Neither, because an infection of the patient's own flora is not an infection"], "answer": 2, "explanation": "<p>The lecture gives timing windows for calling an infection hospital acquired (healthcare associated): it must appear more than 48 hours after admission, within 3 days after discharge, or within 30 days after an operation. The 3-day discharge window has passed, but the operation window has not, so a surgical site infection on day 21 counts as healthcare associated. Surgical site infections are one of the common healthcare-associated infections the lecture lists, along with urinary tract infections, gastroenteritis, meningitis and pneumonia.<\/p><p>The source of the organism does not change the classification. Staphylococcus aureus is often part of the normal microbiota, and the surgery is what gave it the opportunity to invade. Community-acquired infections are those acquired outside the hospital or healthcare environment.<\/p>", "why_wrong": ["The 3-day window applies to discharge without surgery; after an operation the window extends to 30 days.", "Belonging to the normal flora does not make an infection community acquired; the surgical wound gave it the opportunity.", "Correct: an infection within 30 days of an operation is classified as healthcare associated.", "Classification depends on timing relative to admission, discharge or surgery, not on proving an environmental strain match.", "Normal flora that invades sterile tissue does cause infection; that is what an opportunistic pathogen is."], "objective": "An infection counts as healthcare associated if it appears more than 48 hours after admission, within 3 days of discharge, or within 30 days of an operation; otherwise it is community acquired."}, {"qid": "03-9", "topic": "Medical implications of endospores", "stem": "<p>A clinic reprocesses reusable surgical instruments by soaking them in a standard alcohol disinfectant and then boiling them for 20 minutes. After several postoperative wound infections, investigators culture the processed instruments. They recover viable anaerobic Gram-positive rods. A special stain of the isolate shows oval green structures inside some cells and free in the background, while the rest of the cells stain pink. A course of antibiotics given to colonized instruments in the laboratory has no effect on these structures.<\/p>", "lead": "Which change in reprocessing would most reliably prevent these infections?", "choices": ["Doubling the boiling time to 40 minutes", "Autoclaving the instruments at 121 degrees Celsius", "Adding a broad-spectrum antibiotic rinse after boiling", "Soaking the instruments longer in the same alcohol solution", "Storing the instruments dry so bacteria cannot divide"], "answer": 1, "explanation": "<p>The organism is an anaerobic, spore-forming Gram-positive rod (Clostridium, or Clostridioides). On the Schaeffer-Fulton stain, endospores take the green stain and vegetative cells stain pink. Endospores are highly resistant to heat, including boiling, and to chemical disinfectants; they can survive for many years; and because they are dormant and metabolically inactive, antibiotics have no effect on them.<\/p><p>Those properties give the lecture's medical implications: medical supplies must be autoclaved at 121 degrees Celsius, and only sporicidal solutions kill spores. Ordinary boiling, ordinary disinfectants and antibiotics all fail, which is how these infections got through.<\/p>", "why_wrong": ["Spores survive boiling, so a longer boil is still not reliable sterilization.", "Correct: autoclaving at 121 degrees Celsius is required to destroy endospores.", "Antibiotics act on metabolically active cells and are ineffective against dormant spores.", "Ordinary disinfectants do not kill spores; only sporicidal solutions do.", "Spores are already dormant and survive dry storage for years, so drying does not remove them."], "objective": "Endospores of Bacillus, Clostridium and Clostridioides resist boiling, disinfectants and antibiotics, so medical supplies must be autoclaved at 121 degrees Celsius or treated with sporicidal agents."}, {"qid": "03-10", "topic": "Opportunistic pathogens", "stem": "<p>A 41-year-old man is admitted with extensive second- and third-degree burns over his back. On hospital day 3 he develops fever, and the burn wounds develop a blue-green discoloration. Wound culture grows a Gram-negative rod that is oxidase positive and does not ferment lactose. The same organism is later recovered from a sink drain on the burn unit. He has no history of immune disease and no recent antibiotics.<\/p>", "lead": "Which factor most directly allowed this organism to cause disease?", "choices": ["Loss of the acidic pH maintained by his normal microbiota", "Breach of the mechanical barrier formed by intact skin", "Antigenic variation of surface proteins to escape his antibodies", "Acquisition of the organism from an arthropod vector", "Depletion of his gut flora by prolonged antibiotic therapy"], "answer": 1, "explanation": "<p>First, identify the organism. An oxidase-positive Gram-negative rod that does not ferment lactose is Pseudomonas aeruginosa, an environmental organism that lives in places such as sink drains and normally causes no harm to healthy people. It is one of the lecture's examples of an opportunistic pathogen and one of the ESKAPE hospital pathogens.<\/p><p>Second, find the opportunity. Opportunistic pathogens cause disease only when the defenses that keep them out of sterile tissue are breached, by accident, by surgery or by an underlying disorder. Here the breach is the burn: the layer of dead skin cells is a mechanical barrier, and losing it exposes tissue to environmental bacteria. Because the infection began after more than 48 hours in the hospital, it is also nosocomial.<\/p>", "why_wrong": ["Acidic pH from Lactobacillus protects the vagina; it is not the defense lost in a burn.", "Correct: the burn destroyed the skin's mechanical barrier, which gave an environmental opportunist access to tissue.", "Antigenic variation is a strategy some pathogens use against established immunity; it is not the opportunity here.", "Pseudomonas came from the hospital environment (a sink drain), not from an arthropod.", "He received no antibiotics, and gut flora depletion is the opportunity in Clostridioides difficile colitis, not wound infection."], "objective": "Opportunistic pathogens such as Pseudomonas aeruginosa cause disease only when a defense is breached, as when burns remove the mechanical barrier of the skin."}, {"qid": "03-11", "topic": "Functions of the normal microbiota", "stem": "<p>Investigators compare mice raised in sterile isolators (germ free) with genetically identical mice carrying a normal gut microbiota. The germ-free mice have a thinner intestinal mucus layer, much less IgA in their intestinal secretions and lower levels of antimicrobial peptides in the gut lining. When both groups are given a small oral dose of Salmonella, the germ-free mice become colonized by a dose that fails to colonize the normal mice. Colonizing the germ-free mice with normal flora 4 weeks earlier reverses all of these differences.<\/p>", "lead": "These results best demonstrate that the normal microbiota does which of the following?", "choices": ["Makes vitamin K and B vitamins that the host absorbs", "Directly injects effector proteins into intestinal cells", "Forms biofilms that trap pathogens in the mucus layer", "Primes innate defenses by stimulating mucin, IgA and antimicrobial peptides", "Lowers intestinal pH by fermenting lactose to acid"], "answer": 3, "explanation": "<p>Every difference between the groups involves a host defense: mucus (mucin), secretory IgA and antimicrobial peptides. Those defenses are weak without microbes and return when normal flora is added, so the microbiota is driving them. The lecture lists this as one of the benefits of the gut microbiota: it primes innate immunity by stimulating production of mucin, IgA and antimicrobial peptides, contributing to immune system maturation.<\/p><p>The other listed benefits are releasing antibacterial factors and waste products that discourage foreign growth, outcompeting other species for the niche, aiding absorption of nutrients, and making B vitamins (biotin and folate) and vitamin K. Together they explain why the germ-free mice were easier to colonize with a pathogen.<\/p>", "why_wrong": ["Vitamin synthesis is a real benefit of the microbiota, but it does not explain the changes in mucus, IgA and antimicrobial peptides.", "Effector injection by secretion systems is a pathogen virulence strategy, not a commensal benefit.", "The stem shows changes in host defenses, not bacteria physically trapping pathogens.", "Correct: commensals stimulate the host to make mucin, IgA and antimicrobial peptides, which primes innate immunity.", "Acid production from lactose is not what the experiment measured, and acidic pH is the vaginal Lactobacillus example."], "objective": "The gut microbiota defends against pathogens by competing for the niche, releasing antibacterial factors and priming innate immunity through mucin, IgA and antimicrobial peptide production; it also aids nutrient absorption and makes B vitamins and vitamin K."}]}, {"id": "04", "title": "Bacterial Pathogenesis II", "week": 1, "subject": "Microbiology", "questions": [{"qid": "04-1", "topic": "Endotoxin and septic shock", "stem": "<p>A 68-year-old woman develops fever, confusion and hypotension, and blood cultures grow a Gram-negative rod. Blood pressure is 78/42 mm Hg. In a laboratory study, boiling an extract of her isolate for 30 minutes does not reduce its ability to cause fever and shock in rabbits. The activity is lost when the lipid portion of a molecule purified from the bacterial outer membrane is removed.<\/p><table class=\"labs\"><tr><td>White blood cell count<\/td><td>21,500/mm<sup>3<\/sup> (normal 4,500 to 11,000)<\/td><\/tr><tr><td>Serum lactate<\/td><td>5.1 mmol/L (normal less than 2.0)<\/td><\/tr><\/table>", "lead": "Which of the following is the main driver of this patient's hypotension?", "choices": ["Antigen-independent activation of many T cells with release of interleukin 2", "Toxin-induced rise in intestinal cyclic AMP with chloride efflux", "Antibodies against a bacterial surface protein that cross-react with host tissue", "Macrophage release of tumor necrosis factor and interleukins 1 and 6", "Toxin-mediated inhibition of protein synthesis in vascular endothelium"], "answer": 3, "explanation": "<p>A heat-stable toxic activity that resides in the lipid portion of an outer membrane molecule of a Gram-negative bacterium is endotoxin: the lipid A of lipopolysaccharide. Exotoxins, by contrast, are secreted proteins that are usually heat labile.<\/p><p>Endotoxin released by bacteria replicating in the blood activates macrophages, which release tumor necrosis factor, interleukin 1 and interleukin 6. That cytokine surge causes the fever, vasodilation and hypotension of septic shock. Toxic shock looks similar at the bedside but comes from a superantigen made at a localized infection, which activates large numbers of T cells and adds interleukin 2 and interferon gamma.<\/p>", "why_wrong": ["Activation of large numbers of T cells regardless of antigen is how superantigens cause toxic shock, not how lipopolysaccharide works.", "A rise in cyclic AMP with chloride efflux describes cholera toxin and secretory diarrhea.", "Cross-reacting antibodies are molecular mimicry, as in rheumatic fever.", "Correct: lipid A activates macrophages, whose tumor necrosis factor, interleukin 1 and interleukin 6 drive septic shock.", "Inhibition of endothelial protein synthesis describes Shiga toxin."], "objective": "Endotoxin (lipid A of lipopolysaccharide) is heat stable and causes septic shock by activating macrophages to release tumor necrosis factor, interleukin 1 and interleukin 6, unlike superantigen-driven toxic shock, which activates T cells.", "table": "<table><tr><th><\/th><th>Septic shock<\/th><th>Toxic shock<\/th><\/tr><tr><td>Cause<\/td><td>Bacteremia with lipopolysaccharide<\/td><td>Localized infection with superantigen<\/td><\/tr><tr><td>Cells activated<\/td><td>Macrophages<\/td><td>T cells<\/td><\/tr><tr><td>Cytokines<\/td><td>TNF, IL-1, IL-6<\/td><td>IL-1, IL-2, TNF, IFN-gamma<\/td><\/tr><\/table>"}, {"qid": "04-2", "topic": "Post-streptococcal glomerulonephritis", "stem": "<p>An 8-year-old boy has puffy eyelids and dark, cola-colored urine. Three weeks ago he had a crusted, pus-producing skin infection on his leg that grew catalase-negative, beta-hemolytic, bacitracin-sensitive Gram-positive cocci. Blood pressure is 138/90 mm Hg. He has no joint pain and no heart murmur.<\/p><table class=\"labs\"><tr><td>Urinalysis<\/td><td>Blood 3+, protein 2+<\/td><\/tr><tr><td>Serum C3 complement<\/td><td>Low<\/td><\/tr><tr><td>Anti-deoxyribonuclease B titer<\/td><td>Elevated<\/td><\/tr><\/table>", "lead": "Which of the following is the most likely mechanism of his kidney injury?", "choices": ["Immune complex deposition in glomeruli with complement activation", "Antibodies against M protein that cross-react with myosin", "Direct invasion and replication of the bacteria within the kidney", "Polyclonal T-cell activation by a secreted streptococcal pyrogenic exotoxin", "Shiga toxin damage to glomerular endothelial cells"], "answer": 0, "explanation": "<p>The skin isolate is <i>Streptococcus pyogenes<\/i> (group A streptococcus): catalase negative, beta hemolytic and bacitracin sensitive. About two weeks after a throat infection, or three weeks after a skin infection, a child develops hematuria, proteinuria, edema and hypertension with low complement and high anti-streptolysin O or anti-deoxyribonuclease titers. That is post-streptococcal glomerulonephritis.<\/p><p>The kidney is not infected. Streptococcal antigens and the IgG and IgM antibodies made against them form immune complexes that lodge in the glomerular basement membrane, a type III hypersensitivity. Complement (C3), cytokines, oxidants and proteases then damage the podocytes, letting blood and protein into the urine. The consumption of complement explains the low C3, and it is an example of immunopathogenesis: the immune response, not the bacterium, produces the disease.<\/p>", "why_wrong": ["Correct: immune complexes deposit in the glomerular basement membrane and activate complement, a type III hypersensitivity.", "Antibodies to M protein that cross-react with heart myosin cause rheumatic fever, and he has no carditis or joint findings.", "The disease appears weeks after the infection and is immune mediated, not a kidney infection.", "Superantigen-driven T-cell activation causes toxic shock, not delayed glomerulonephritis.", "Shiga toxin comes from Shigella dysenteriae and some E. coli, not from Streptococcus pyogenes."], "objective": "Post-streptococcal glomerulonephritis follows group A streptococcal throat or skin infection by weeks and results from immune complex deposition with complement activation (type III hypersensitivity), causing hematuria, proteinuria, edema, hypertension and low C3."}, {"qid": "04-3", "topic": "A-B exotoxins", "stem": "<p>A 6-year-old unvaccinated girl has sore throat, low-grade fever and a swollen neck. A tough gray membrane covers her tonsils and posterior pharynx and bleeds when scraped. A throat culture grows aerobic, non-spore-forming Gram-positive rods arranged in angled clusters that resemble letters. A week later she develops an abnormal heart rhythm.<\/p>", "lead": "The organism's major toxin causes damage by which of the following mechanisms?", "choices": ["Blocking acetylcholine release from neuronal vesicles", "Raising cyclic AMP and opening chloride channels in gut epithelium", "Inhibiting protein synthesis, which kills heart and liver cells", "Blocking release of inhibitory GABA and glycine from neurons", "Activating large numbers of T cells regardless of antigen specificity"], "answer": 2, "explanation": "<p>First, identify the organism. Aerobic, non-spore-forming Gram-positive rods in angled \"Chinese letter\" arrangements are <i>Corynebacterium<\/i>, and a gray pharyngeal pseudomembrane in an unvaccinated child is diphtheria, caused by <i>Corynebacterium diphtheriae<\/i>.<\/p><p>Second, recall its toxin. Diphtheria toxin is an A-B exotoxin: the B subunit binds a growth factor receptor precursor on target cells, especially in the heart and liver, and the A subunit inhibits protein synthesis, which kills the cell. Cell death in the airway produces the pseudomembrane, and toxin reaching the heart explains the rhythm problem a week later.<\/p>", "why_wrong": ["Blocking acetylcholine release is botulinum toxin, which causes flaccid paralysis.", "Raising cyclic AMP with chloride efflux is cholera toxin, which causes secretory diarrhea.", "Correct: diphtheria toxin inhibits protein synthesis and causes cell death, notably in the heart and liver.", "Blocking GABA and glycine release is tetanus toxin, which causes spastic paralysis.", "Antigen-independent T-cell activation is the action of superantigens such as toxic shock syndrome toxin."], "objective": "Diphtheria toxin, an A-B exotoxin of Corynebacterium diphtheriae, binds heart and liver cells and inhibits protein synthesis, causing cell death, a pharyngeal pseudomembrane and cardiac complications.", "table": "<table><tr><th>Toxin<\/th><th>Action<\/th><th>Result<\/th><\/tr><tr><td>Botulinum<\/td><td>Blocks acetylcholine release<\/td><td>Flaccid paralysis<\/td><\/tr><tr><td>Tetanus<\/td><td>Blocks GABA and glycine release<\/td><td>Spastic paralysis<\/td><\/tr><tr><td>Cholera<\/td><td>Raises cAMP, chloride efflux<\/td><td>Secretory diarrhea<\/td><\/tr><tr><td>Diphtheria<\/td><td>Inhibits protein synthesis<\/td><td>Cell death (heart, liver)<\/td><\/tr><tr><td>Shiga<\/td><td>Inhibits protein synthesis<\/td><td>Hemorrhage and diarrhea<\/td><\/tr><\/table>"}, {"qid": "04-4", "topic": "Capsule and phagocytosis", "stem": "<p>A laboratory studies two isolates of Streptococcus pneumoniae that are genetically identical except that one carries a mutation abolishing synthesis of its outer polysaccharide layer. Mixed with human neutrophils and serum, the parent strain is taken up poorly and survives, while the mutant is rapidly ingested and killed. Deposition of complement protein C3b on the surface is high for the mutant and low for the parent. Mice given the parent strain die, while mice given a thousand times more of the mutant remain well.<\/p>", "lead": "Which property of the missing structure best explains these results?", "choices": ["It is a strong immunogen that distracts antibodies away from surface proteins", "It degrades complement components enzymatically after they bind the surface", "It allows the organism to replicate inside the phagolysosome after ingestion", "It varies by mutation so that progeny escape recognition by existing antibodies", "It prevents opsonization and complement binding, so phagocytes cannot ingest it"], "answer": 4, "explanation": "<p>The structure is the capsule, a mostly polysaccharide layer found on both Gram-positive and Gram-negative bacteria. The experiment shows what it does: complement C3b deposition rises when it is gone, and uptake and killing by neutrophils rise with it. The capsule evades phagocytosis by protecting against opsonization, complement binding and cell lysis, and it also protects bacteria from destruction inside the phagolysosome and contributes to adhesion and biofilm formation.<\/p><p>The loss of virulence is dramatic, which is why the lecture notes that without a capsule, Streptococcus pneumoniae and Escherichia coli are avirulent. Capsules are also poor immunogens, so they do not provoke a strong antibody response on their own.<\/p>", "why_wrong": ["Capsules are poor immunogens, not strong ones, and they work by blocking rather than distracting.", "Enzymatic degradation of complement is a separate evasion strategy; the capsule works as a physical shield.", "Growth inside the phagolysosome describes Mycobacterium tuberculosis and Salmonella, and the mutant was killed after ingestion.", "Antigenic variation by mutation is a different strategy, used for example by Neisseria gonorrhoeae.", "Correct: the capsule prevents opsonization and complement binding, so phagocytes cannot efficiently ingest the organism."], "objective": "The bacterial capsule is a polysaccharide layer that evades phagocytosis by blocking opsonization and complement binding, and its loss renders organisms such as Streptococcus pneumoniae avirulent."}, {"qid": "04-5", "topic": "Intracellular evasion of killing", "stem": "<p>Three bacterial species are added to cultured human macrophages and followed with markers for the phagosome and the lysosome. Species 1 sits in a vesicle that never acquires lysosomal markers. Species 2 appears free in the cytoplasm within an hour, and this requires a bacterial enzyme that degrades membrane lipids. Species 3 remains in a vesicle whose pH falls to 5.0 and which acquires lysosomal markers, yet the bacteria continue to divide there, protected in part by bacterial catalase and superoxide dismutase.<\/p>", "lead": "Species 3 most likely corresponds to which organism?", "choices": ["Legionella pneumophila", "Rickettsia species", "Mycobacterium tuberculosis", "Corynebacterium diphtheriae", "Streptococcus pyogenes"], "answer": 2, "explanation": "<p>The lecture gives three mechanisms intracellular pathogens use. First, inhibition of lysosomal fusion, so the phagosome never matures, which is Legionella pneumophila (species 1). Second, production of phospholipases to escape the phagosome into the cytoplasm, which is the Rickettsiae (species 2). Third, growth within the acidic phagolysosome with resistance to killing, which is Mycobacterium tuberculosis and Salmonella species (species 3).<\/p><p>Surviving an acidified phagolysosome also requires handling oxidative stress, which bacterial catalase and superoxide dismutase provide. Corynebacterium diphtheriae and Streptococcus pyogenes are extracellular pathogens and would not be followed through this pathway.<\/p>", "why_wrong": ["Legionella pneumophila inhibits lysosomal fusion, which is species 1 in the experiment.", "Rickettsiae use phospholipases to escape into the cytoplasm, which is species 2.", "Correct: Mycobacterium tuberculosis (like Salmonella) grows in the low pH of the phagolysosome and resists killing.", "Corynebacterium diphtheriae causes disease by a secreted toxin, not by surviving inside macrophages.", "Streptococcus pyogenes is an extracellular pathogen and does not replicate in the phagolysosome."], "objective": "Intracellular bacteria evade killing by inhibiting lysosomal fusion (Legionella), escaping the phagosome with phospholipases (Rickettsia), or growing in the acidified phagolysosome and resisting killing (Mycobacterium tuberculosis, Salmonella).", "table": "<table><tr><th>Mechanism<\/th><th>Example<\/th><\/tr><tr><td>Inhibit lysosomal fusion<\/td><td>Legionella pneumophila<\/td><\/tr><tr><td>Phospholipase escape to cytoplasm<\/td><td>Rickettsia species<\/td><\/tr><tr><td>Grow in low pH phagolysosome<\/td><td>Mycobacterium tuberculosis, Salmonella<\/td><\/tr><\/table>"}, {"qid": "04-6", "topic": "Granuloma and latent tuberculosis", "stem": "<p>A 46-year-old man had a positive tuberculosis screening test 9 years ago, no symptoms and no treatment. He is now started on a medication that strongly suppresses cell-mediated immunity for a joint condition. Two months later he has fever, night sweats, weight loss and a cough, and a chest film shows a cavity in the upper lobe. Sputum is positive for acid-fast bacilli. Lung tissue from a similar patient shows organized collections of macrophages and lymphocytes with central necrosis.<\/p>", "lead": "Which of the following best explains his reactivation?", "choices": ["He was reinfected by a new strain because his prior infection gave no immunity", "Suppressed immunity allowed organisms walled off but not eliminated to escape", "The organism acquired a mutation that made it able to survive inside macrophages", "Antibodies made against the organism cross-reacted with his lung tissue", "A secreted toxin inhibited protein synthesis in alveolar epithelial cells"], "answer": 1, "explanation": "<p>A granuloma is a structure formed during inflammation when the immune system tries to wall off something it recognizes as foreign but cannot eliminate. In tuberculosis, macrophages and lymphocytes organize around the bacteria, which survive inside, so the infection is contained rather than cured. That containment is latent tuberculosis: a positive screening test, no symptoms, and live organisms sitting in the lung.<\/p><p>Containment depends on cell-mediated immunity. When that is suppressed, the walled-off bacteria escape the granuloma and multiply, giving active disease with fever, night sweats, weight loss, cough and cavitation. The lecture's point is that the organism uses our own immune response against us: the granuloma that limits the infection also preserves a reservoir for future active disease.<\/p>", "why_wrong": ["The reactivation of a contained prior infection explains this better than new acquisition, and the timing follows his immune suppression.", "Correct: the granuloma walled off live organisms, and loss of cell-mediated immunity let them escape and cause active disease.", "Surviving within macrophages is an established property of Mycobacterium tuberculosis, not a newly acquired mutation.", "Cross-reacting antibodies describe molecular mimicry, as in rheumatic fever, not tuberculosis reactivation.", "Inhibition of protein synthesis describes diphtheria and Shiga toxins; tuberculosis disease is driven by the immune response to the organism."], "objective": "Granulomas in tuberculosis wall off organisms that the immune system cannot eliminate, producing latent infection that reactivates when cell-mediated immunity is suppressed."}, {"qid": "04-7", "topic": "Superantigens and toxic shock", "stem": "<p>A 23-year-old woman has 2 days of high fever, vomiting, dizziness and a diffuse red rash. A small skin abscess on her thigh was drained 4 days ago. Blood pressure is 80/44 mm Hg. Two sets of blood cultures show no growth at 48 hours, while the abscess fluid grew catalase-positive, coagulase-positive Gram-positive cocci in clusters. Her serum contains high levels of interleukin 2 and interferon gamma, and a large fraction of her circulating T cells carry the same T-cell receptor segment.<\/p>", "lead": "The responsible bacterial product acts by which of the following mechanisms?", "choices": ["Binding ganglioside receptors and raising intracellular cyclic AMP", "Crosslinking T-cell receptors and class II molecules without antigen", "Activating macrophages through the lipid portion of the outer membrane", "Degrading extracellular matrix to allow spread through soft tissue", "Forming pores in erythrocyte and leukocyte membranes"], "answer": 1, "explanation": "<p>The organism is Staphylococcus aureus (catalase positive, coagulase positive clusters). Three findings point away from bacteria in the blood and toward a toxin made at a localized site: the blood cultures are sterile, the infection is a drained abscess, and the expanded T cells share one receptor segment. A superantigen crosslinks the T-cell receptor to the class II molecule on an antigen-presenting cell without regard to the antigen in the groove, so it activates a huge fraction of T cells at once.<\/p><p>Those T cells release interleukins 1, 2 and 6, tumor necrosis factor and interferon gamma, and that cytokine flood produces toxic shock. Staphylococcal toxic shock syndrome toxin and the streptococcal pyrogenic exotoxins are the examples. Septic shock looks similar but comes from bacteria replicating in the blood, with lipopolysaccharide activating macrophages, so blood cultures are typically positive.<\/p>", "why_wrong": ["Ganglioside binding with a rise in cyclic AMP is cholera toxin, which causes secretory diarrhea.", "Correct: a superantigen crosslinks the T-cell receptor and a class II molecule without antigen specificity, activating many T cells at once.", "Macrophage activation by lipid A is septic shock, which requires bacteria in the blood; her blood cultures are sterile.", "Matrix-degrading enzymes such as hyaluronidase and collagenase help spread through tissue, not cause shock.", "Pore-forming hemolysins and leukocidins destroy blood cells; they do not cause the polyclonal T-cell activation seen here."], "objective": "Superantigens crosslink T-cell receptors to class II molecules independently of antigen, activating many T cells to release interleukins 1, 2 and 6, tumor necrosis factor and interferon gamma, producing toxic shock from a localized infection with negative blood cultures."}, {"qid": "04-8", "topic": "Cholera toxin", "stem": "<p>A 4-year-old boy has 1 day of profuse watery stools with flecks of mucus and no blood or fever, after the family drank from an untreated well. He is lethargic with dry mucous membranes. A biopsy specimen of his small intestine shows an intact epithelium with no invading organisms and no inflammatory infiltrate. In an experimental loop of intestine, the purified toxin raises epithelial cyclic AMP and the loop fills with isotonic fluid.<\/p>", "lead": "The fluid loss in this illness is most directly caused by which of the following?", "choices": ["Death of enterocytes, which strips the absorptive surface", "Chloride efflux through an activated epithelial channel", "Blockade of neurotransmitter release at enteric neurons", "Inflammatory exudate from neutrophil invasion of the mucosa", "Inhibition of ribosomal protein synthesis in enterocytes"], "answer": 1, "explanation": "<p>The picture is watery, noninflammatory diarrhea with an intact epithelium, so the organism is not destroying tissue. Cholera toxin is an A-B toxin whose B subunit binds the GM1 ganglioside on intestinal epithelial cells. The A subunit then raises intracellular cyclic AMP, which activates the cystic fibrosis transmembrane conductance regulator channel and drives chloride out of the cell, with sodium and water following.<\/p><p>The result is massive secretory diarrhea and dehydration without fever, blood or inflammation, exactly what a biopsy with an intact epithelium predicts. The lecture pairs this with other A-B toxins whose actions differ: diphtheria and Shiga toxins inhibit protein synthesis, and botulinum and tetanus toxins block neurotransmitter release.<\/p>", "why_wrong": ["The biopsy shows intact epithelium, so cell death is not the mechanism.", "Correct: cholera toxin raises cyclic AMP and opens the chloride channel, producing secretory diarrhea.", "Blocking neurotransmitter release describes botulinum and tetanus toxins, which cause paralysis.", "There is no inflammatory infiltrate, and the stool is watery without blood.", "Protein synthesis inhibition describes diphtheria and Shiga toxins, not this watery diarrhea."], "objective": "Cholera toxin binds the GM1 ganglioside on intestinal epithelium and raises cyclic AMP, opening the chloride channel and causing secretory diarrhea without inflammation or epithelial destruction."}, {"qid": "04-9", "topic": "Botulinum versus tetanus toxin", "stem": "<p>Two patients arrive the same evening. The first, a 59-year-old man, has drooping eyelids, double vision, a weak voice and progressive limb weakness with normal sensation and no fever; he ate home-canned vegetables 2 days ago. The second, a 48-year-old gardener, has clenched jaw muscles, a rigid abdominal wall and painful whole-body muscle spasms triggered by noise; he had a deep puncture wound from a soil-covered tool 10 days ago.<\/p>", "lead": "The difference in their findings is best explained by which of the following?", "choices": ["One toxin is heat stable and the other is destroyed by cooking", "One organism forms spores and the other does not", "One toxin inhibits protein synthesis and the other raises cyclic AMP", "One toxin acts on muscle fibers and the other on the neuromuscular junction", "One toxin blocks excitatory and the other inhibitory transmission"], "answer": 4, "explanation": "<p>Both patients have disease caused by an A-B toxin from a spore-forming anaerobe, and both toxins bind polysialogangliosides on neurons. The difference is which transmitter release they block. Botulinum toxin, from Clostridium botulinum in improperly preserved food, blocks acetylcholine release from vesicles at the neuromuscular junction, so the muscle cannot be stimulated and the result is flaccid paralysis that begins with cranial nerves: drooping lids, double vision and a weak voice.<\/p><p>Tetanus toxin, from Clostridium tetani entering through a soil-contaminated wound, blocks release of the inhibitory transmitters GABA and glycine. Without inhibition, motor neurons fire unopposed, giving spastic paralysis: jaw clenching, rigidity and spasms provoked by stimuli. Same toxin architecture, opposite clinical pictures, because one removes excitation and the other removes inhibition.<\/p>", "why_wrong": ["Both are exotoxins and heat labile; heat stability describes endotoxin, and it does not explain the clinical difference.", "Both Clostridium botulinum and Clostridium tetani form spores, so sporulation cannot distinguish them.", "Neither toxin inhibits protein synthesis or raises cyclic AMP; those are diphtheria or Shiga and cholera toxins.", "Both act on neurons rather than on muscle fibers themselves.", "Correct: botulinum toxin blocks acetylcholine release (flaccid paralysis) and tetanus toxin blocks GABA and glycine release (spastic paralysis)."], "objective": "Botulinum toxin blocks acetylcholine release and causes flaccid paralysis, while tetanus toxin blocks GABA and glycine release and causes spastic paralysis, two A-B toxins with opposite effects.", "table": "<table><tr><th><\/th><th>Botulinum<\/th><th>Tetanus<\/th><\/tr><tr><td>Organism<\/td><td>Clostridium botulinum<\/td><td>Clostridium tetani<\/td><\/tr><tr><td>Usual source<\/td><td>Improperly preserved food<\/td><td>Soil-contaminated wound<\/td><\/tr><tr><td>Transmitter blocked<\/td><td>Acetylcholine<\/td><td>GABA and glycine<\/td><\/tr><tr><td>Result<\/td><td>Flaccid paralysis<\/td><td>Spastic paralysis<\/td><\/tr><\/table>"}, {"qid": "04-10", "topic": "Molecular mimicry in rheumatic fever", "stem": "<p>A 9-year-old boy has 1 week of migrating pain and swelling in his knees and wrists and 3 days of breathlessness. Five weeks ago he had a severe sore throat with fever and a grey-white exudate on the posterior pharynx and no cough. He now has a new heart murmur and an enlarged heart on chest film. Urinalysis is normal. Serum anti-streptolysin O titer is markedly elevated, and throat culture is now negative.<\/p>", "lead": "Which of the following best explains his cardiac findings?", "choices": ["Bacteria seeded the heart valves and are multiplying within them", "A secreted toxin reached cardiac cells and inhibited their protein synthesis", "Antibodies raised against a bacterial surface protein bind cardiac myosin", "Immune complexes of bacterial antigen and antibody lodged in the myocardium", "Polyclonal T-cell activation released cytokines that depressed cardiac function"], "answer": 2, "explanation": "<p>The sore throat with pharyngeal exudate, fever and no cough is Streptococcus pyogenes pharyngitis, and the high anti-streptolysin O titer with a negative culture confirms a resolved infection weeks earlier. Weeks later a school-age child develops migrating arthritis and carditis, which is rheumatic fever.<\/p><p>The mechanism is molecular mimicry: B cells make antibodies against the M protein of Streptococcus pyogenes, and some of those antibodies cross-react with heart muscle myosin. The resulting inflammation involves the heart (pancarditis), joints, blood vessels and subcutaneous tissues. Diagnosis rests on the clinical findings plus documented evidence of prior infection, since the organism itself is gone. Post-streptococcal glomerulonephritis is the other post-infectious complication, but it is driven by immune complexes in the glomerulus and his urinalysis is normal.<\/p>", "why_wrong": ["The throat culture is negative and the disease began weeks later, so this is not active bacterial invasion of the heart.", "Toxin-mediated protein synthesis inhibition in the heart describes diphtheria, which presents with a pharyngeal pseudomembrane and early cardiac effects.", "Correct: antibodies against M protein cross-react with cardiac myosin, which is molecular mimicry.", "Immune complex deposition is the mechanism of post-streptococcal glomerulonephritis, and his urinalysis is normal.", "Polyclonal T-cell activation by a superantigen causes toxic shock within days, not arthritis and carditis weeks later."], "objective": "Rheumatic fever follows Streptococcus pyogenes pharyngitis by weeks and results from molecular mimicry, in which antibodies against M protein cross-react with cardiac myosin, causing pancarditis, arthritis and subcutaneous involvement.", "table": "<table><tr><th><\/th><th>Rheumatic fever<\/th><th>Post-streptococcal glomerulonephritis<\/th><\/tr><tr><td>Mechanism<\/td><td>Molecular mimicry, antibody to M protein cross-reacts with myosin<\/td><td>Immune complex deposition, type III hypersensitivity<\/td><\/tr><tr><td>Preceding infection<\/td><td>Pharyngitis<\/td><td>Pharyngitis (about 2 weeks) or skin (about 3 weeks)<\/td><\/tr><tr><td>Findings<\/td><td>Carditis, migratory arthritis, subcutaneous nodules<\/td><td>Hematuria, proteinuria, edema, hypertension, low complement<\/td><\/tr><\/table>"}, {"qid": "04-11", "topic": "Minimum inhibitory concentration and clinical resistance", "stem": "<p>A 56-year-old woman with pneumonia is treated empirically with ampicillin. Her sputum isolate is tested, and the minimum concentration of ampicillin that blocks its growth is 180 micrograms per milliliter. The reference value set by an expert committee for this organism and drug is 2.0 micrograms per milliliter. A colleague notes that the organism does still stop growing at the higher concentration and asks whether ampicillin could simply be given at a higher dose.<\/p>", "lead": "Which of the following is the best response?", "choices": ["The isolate is susceptible, since a concentration that blocks growth was found", "The isolate is resistant, because its value exceeds the reference value", "The test is uninterpretable without repeating it in the presence of serum", "The isolate is resistant only if the infection fails to respond to ampicillin", "A higher dose is appropriate, because resistance is defined by growth at any dose"], "answer": 1, "explanation": "<p>The minimum inhibitory concentration is the lowest drug concentration that blocks growth of the organism. Nearly every organism is inhibited by some concentration, so the number alone means little. An isolate is judged resistant when its minimum inhibitory concentration exceeds a reference value, the breakpoint, set by a committee of experts for that organism and drug. At 180 against a breakpoint of 2.0, this isolate is resistant.<\/p><p>Clinical resistance means the approved regimen is unlikely to cure the disease. The breakpoint already accounts for the concentrations an approved regimen can safely achieve in the patient, so simply raising the dose is not a legitimate workaround, and treatment should move to another agent. Waiting for clinical failure before calling it resistant is exactly what susceptibility testing exists to prevent.<\/p>", "why_wrong": ["Finding some inhibitory concentration does not mean susceptible; the value has to be compared with the breakpoint.", "Correct: an isolate is resistant when its minimum inhibitory concentration exceeds the reference breakpoint.", "Standard susceptibility testing does not require serum, and the result here is clear.", "Resistance is defined before treatment by the breakpoint comparison, not retrospectively by clinical failure.", "The breakpoint already reflects achievable safe concentrations, so escalating the dose does not overcome resistance."], "objective": "The minimum inhibitory concentration is the lowest drug concentration that blocks growth, and an isolate is deemed resistant when that value exceeds the expert-committee breakpoint, meaning the approved regimen is unlikely to cure."}, {"qid": "04-12", "topic": "Mechanisms of antibiotic resistance", "stem": "<p>Four Gram-negative isolates
