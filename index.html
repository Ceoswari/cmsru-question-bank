.<\/p>", "lead": "Which step of the viral life cycle is most directly blocked in the treated cultures?", "choices": ["Attachment of the virion to its surface receptor", "Release of the genome from the capsid after internalization", "Synthesis of progeny genomes by a viral polymerase", "Assembly of capsid proteins around new genomes", "Release of progeny virions by lysis of the host cell"], "answer": 1, "explanation": "<p>The experiment separates the early steps of entry from one another. Binding is normal and the particles reach intracellular vesicles, so attachment and penetration both succeeded. What fails is everything downstream of getting the genome out of the capsid: no viral protein is made, and particles recovered from the cell still hold their genome inside an intact capsid.<\/p><p>For many viruses the signal that triggers uncoating is the low pH of the endosome, which drives the conformational change that releases the genome into the cytoplasm. Neutralizing the endosome leaves the virion internalized but sealed, so the genome never reaches the ribosomes and the cycle stops before any gene is expressed.<\/p>", "why_wrong": ["Attachment is intact, since virions bind the cell surface in normal numbers.", "Correct: low endosomal pH triggers genome release, and blocking acidification leaves an internalized but intact virion.", "Genome synthesis is downstream and cannot be tested here, because no viral protein is made at all.", "Assembly requires genomes and proteins that were never produced, so it is a consequence rather than the blocked step.", "Release is the last step of the cycle and is blocked only because nothing was ever replicated."], "objective": "For many viruses, uncoating is triggered by the low pH of the endosome, so blocking endosomal acidification traps an internalized virion with its genome still inside the capsid."}, {"qid": "05-5", "topic": "Structural versus nonstructural proteins", "stem": "<p>A laboratory studies a virus in cultured cells. Lysates of infected cells contain a 90 kD viral protein in large amounts beginning early in infection. When progeny virions are purified from the culture medium and their proteins are analyzed, the 90 kD protein is absent, although several other viral proteins are present. Cells expressing the 90 kD protein alone, with no other viral gene, can copy an added viral genome.<\/p>", "lead": "Which of the following best describes the 90 kD protein?", "choices": ["A capsid protein that packages the genome", "A matrix protein that lines the inner face of the envelope", "A nonstructural protein that functions in genome replication", "An envelope glycoprotein that mediates host cell attachment", "A host protein recruited to the site of virion assembly"], "answer": 2, "explanation": "<p>Viral proteins divide into those that are built into the particle and those that act only inside the infected cell. Anything found in a purified virion is a structural protein: capsid proteins, matrix protein, and envelope glycoproteins. A protein made abundantly in the infected cell but absent from the particle is by definition nonstructural.<\/p><p>The second clue assigns its job. Expressed by itself, the protein can copy a viral genome, which is the activity of a viral polymerase. Nonstructural proteins function mainly in replication and in remodeling the infected cell, and this one is a replication enzyme. Some enzymes are also packaged into virions, which is why absence from the purified particle, not enzymatic activity, is what settles the classification here.<\/p>", "why_wrong": ["A capsid protein would be recovered in the purified virion, and it does not copy genomes.", "A matrix protein is a structural component of the particle and would be present in purified virions.", "Correct: it is abundant in infected cells, absent from the virion, and able to copy a viral genome on its own.", "An envelope glycoprotein is a structural protein present in the particle and mediates attachment rather than replication.", "The protein is encoded by the virus, since it appears only after infection and is detected as a viral protein."], "objective": "Proteins present in the virion are structural, whereas proteins made in the infected cell but absent from the particle are nonstructural and function largely in genome replication."}, {"qid": "05-6", "topic": "Site of genome replication", "stem": "<p>Investigators prepare enucleated cells by removing the nucleus from a cultured human cell line, leaving the cytoplasm and its organelles intact. These cells are then infected with one of two viruses. Virus J produces normal yields of progeny virions in the enucleated cells. Virus K binds, enters and uncoats normally in the same cells, but makes no viral messenger RNA and no progeny. Both viruses replicate well in intact cells of the same line.<\/p>", "lead": "Virus K most likely has which of the following genomes?", "choices": ["Positive-sense single-stranded RNA", "Negative-sense single-stranded RNA", "Double-stranded RNA", "Double-stranded DNA", "Ambisense single-stranded RNA"], "answer": 3, "explanation": "<p>Removing the nucleus removes the compartment in which some viruses must replicate, so the experiment sorts viruses by where their genome is copied and transcribed. Virus J completes a full cycle in cytoplasm alone, which fits the great majority of RNA viruses: they carry or encode their own RNA-dependent RNA polymerase and run the whole cycle in the cytoplasm.<\/p><p>Virus K enters and uncoats but cannot make messenger RNA without a nucleus, which points to a DNA virus. Most DNA viruses replicate and transcribe in the nucleus, using nuclear machinery for at least part of the job. Of the choices, only the double-stranded DNA genome names a virus with that requirement, so Virus K is the DNA virus.<\/p>", "why_wrong": ["A positive-sense RNA genome is translated and replicated in the cytoplasm, so a nucleus is not needed.", "A negative-sense RNA genome is usually copied in the cytoplasm by a polymerase carried in the virion, with influenza virus the familiar exception.", "A double-stranded RNA genome is copied in the cytoplasm inside the viral nucleocapsid.", "Correct: most DNA viruses transcribe and replicate in the nucleus, so an enucleated cell supports entry and uncoating but not gene expression.", "An ambisense RNA genome is still an RNA genome copied in the cytoplasm by a viral RNA polymerase."], "objective": "Most RNA viruses replicate in the cytoplasm, whereas most DNA viruses depend on the nucleus for transcription and genome replication."}, {"qid": "05-7", "topic": "Capsid function", "stem": "<p>A purified preparation of a naked virus is divided into three tubes. Tube 1 is left untreated. Tube 2 is incubated with a nuclease that degrades free nucleic acid. Tube 3 is incubated with a detergent that disrupts protein shells and then with the same nuclease. Intact viral genome is recovered from tubes 1 and 2 in equal amounts, but no intact genome is recovered from tube 3.<\/p>", "lead": "These findings best illustrate which function of the viral capsid?", "choices": ["It protects the genome from enzymatic damage", "It supplies the enzymes that copy the genome", "It generates the energy used for genome packaging", "It inserts the genome into the host chromosome", "It converts the genome into messenger RNA"], "answer": 0, "explanation": "<p>The nuclease alone cannot reach the genome, and only after the protein shell is stripped away does the genome become degradable. The shell is therefore acting as a physical barrier between the nucleic acid and the enzyme.<\/p><p>That is one of the two central jobs of a capsid. It recognizes the host cell and starts infection, through viral attachment proteins on its surface, and it shields a fragile nucleic acid genome from physical, chemical and enzymatic damage while the particle is outside a cell. The capsid is assembled from many copies of individual proteins into progressively larger units with rotational symmetry, an arrangement that gives the greatest strength for the least free energy.<\/p>", "why_wrong": ["Correct: the genome is nuclease resistant until the protein shell is disrupted, showing the capsid shields it.", "Polymerases are separate viral or host proteins, and some are packaged in virions, but the experiment tests protection only.", "Viruses cannot capture or store free energy and make no adenosine triphosphate of their own.", "Integration into host DNA is a property of certain viral enzymes, not a structural function of the capsid.", "Transcription into messenger RNA requires a polymerase, not a protein shell."], "objective": "The capsid both recognizes the host cell and protects the viral genome from physical, chemical and enzymatic damage."}, {"qid": "05-8", "topic": "Obligate intracellular parasitism", "stem": "<p>A technologist tries to grow two agents recovered from patient specimens. Each is placed in a rich cell-free broth containing amino acids, nucleotides, glucose, salts and added adenosine triphosphate, and each is also placed on a monolayer of living human cells. Agent 1 multiplies in the broth and on the monolayer. Agent 2 multiplies only on the monolayer, and its numbers in the broth do not change over 72 hours.<\/p>", "lead": "Which property of agent 2 best explains its failure to multiply in the broth?", "choices": ["It requires a lipid envelope taken from a host membrane", "It lacks ribosomes and cannot translate its own proteins", "It is too small to take up nutrients across its surface", "It requires a temperature that the broth cannot maintain", "It divides by binary fission only in the presence of host DNA"], "answer": 1, "explanation": "<p>The broth supplies everything a free-living organism needs, including a usable energy source, yet agent 2 does not increase. Supplying building blocks and energy is therefore not the limiting factor, and the one thing the broth cannot supply is host cell machinery.<\/p><p>Viruses are not functionally active outside a cell. They possess genes and evolve, but they cannot capture or store free energy, they cannot make adenosine triphosphate, and above all they have no ribosomes, so viral messenger RNA must be translated by the host. That makes a virus an obligate intracellular parasite, completely dependent on the internal environment of a susceptible cell to produce new virions, which are then built by self-assembly of pre-formed components rather than by cell division.<\/p>", "why_wrong": ["Many viruses are naked, so needing an envelope cannot be the general explanation, and envelope acquisition happens inside cells anyway.", "Correct: viruses have no ribosomes and depend on host machinery to translate their proteins, so no broth can support them.", "Size does not prevent growth in broth, and viruses do not take up and metabolize nutrients at all.", "Both agents are held under the same conditions, so temperature cannot separate them.", "Viruses do not divide by binary fission; virions are assembled from components made in the infected cell."], "objective": "Viruses are obligate intracellular parasites because they lack ribosomes and cannot generate energy, so they depend entirely on host cell machinery to replicate."}, {"qid": "05-9", "topic": "Mutation rate of RNA versus DNA genomes", "stem": "<p>Two viruses recovered from patients are each passaged in parallel cultures for one year under identical conditions. Virus P is a naked icosahedral virus whose genome is read directly by host ribosomes as soon as it reaches the cytoplasm. Virus Q is an enveloped virus whose genome is copied in the nucleus by a polymerase with proofreading activity. At the end of the year, antiserum raised against the original isolate of virus P neutralizes very few of the passaged variants, while antiserum against virus Q still neutralizes nearly all of them.<\/p>", "lead": "Which property of virus P best accounts for this difference?", "choices": ["Its genome is copied by an enzyme that largely lacks proofreading", "Its genome is segmented and exchanges segments between particles", "Its capsid lacks an envelope and so tolerates surface changes", "Its genome integrates into host DNA and accumulates host mutations", "Its genome is replicated in the nucleus, where mutagens are concentrated"], "answer": 0, "explanation": "<p>The description of virus P, a genome translated directly by host ribosomes, identifies it as a positive-sense RNA virus, and virus Q as a DNA virus copied by a proofreading DNA polymerase. The loss of neutralization by the original antiserum means the surface proteins of virus P changed substantially over a year, while those of virus Q did not.<\/p><p>That difference follows from replication fidelity. Most RNA viruses replicate with an RNA-dependent RNA polymerase that lacks proofreading, so errors are not corrected, and some RNA viruses evolve ten thousand to a hundred thousand times faster than DNA viruses. Eukaryotic genomes and DNA viruses have far lower mutation rates because proofreading removes most errors. Coronaviruses are the notable exception among RNA viruses, since they do have a proofreading activity.<\/p>", "why_wrong": ["Correct: RNA genomes are copied without proofreading, so variants accumulate rapidly and escape the original antiserum.", "Nothing indicates a segmented genome, and exchange of segments requires co-infection of one cell by two related viruses.", "Lacking an envelope affects environmental stability and transmission, not the rate at which the genome mutates.", "Integration is a feature of specific reverse-transcribing viruses and is not described here.", "Virus P is translated and replicated in the cytoplasm, and the nucleus is where the slower, proofread virus replicates."], "objective": "RNA genomes are copied by polymerases that generally lack proofreading, so RNA viruses mutate and evolve far faster than DNA viruses."}]}, {"id": "06", "title": "Virology II", "week": 1, "subject": "Microbiology", "questions": [{"qid": "06-1", "topic": "Antigenic shift", "stem": "<p>Surveillance teams sequence an influenza A strain that is spreading rapidly worldwide, including among adults who were vaccinated and previously infected. Its hemagglutinin gene matches a strain circulating in birds, while its other gene segments match a human seasonal strain. The new strain first appeared in a region where pigs, poultry and people live in close contact.<\/p>", "lead": "The emergence of this strain is best explained by which process?", "choices": ["Gradual point mutations in the hemagglutinin gene", "Exchange of whole genome segments during co-infection of one cell", "Integration of avian viral DNA into the human genome", "Recombination of viral DNA by host repair enzymes", "Selection of mutants by antibodies in a single human host"], "answer": 1, "explanation": "<p>The new virus carries a whole hemagglutinin gene from a bird strain alongside human segments. Small mutations cannot produce that; it takes swapping entire gene segments. Influenza's genome is segmented, so when two different strains infect the same cell (pigs can host both avian and human strains), new virions can package a mix of segments from each parent. This reassortment is called antigenic shift.<\/p><p>Shift produces a hemagglutinin the population has never seen, so prior infection and vaccination offer little protection, which is why shift is linked to pandemics. Antigenic drift, by contrast, is the steady accumulation of point mutations from the error-prone RNA-dependent RNA polymerase and causes seasonal epidemics.<\/p>", "why_wrong": ["Point mutations describe antigenic drift, which slowly modifies hemagglutinin rather than replacing it with a bird gene.", "Correct: reassortment of segments between strains in one cell is antigenic shift.", "Influenza is an RNA virus with no DNA stage and does not integrate into the host genome.", "Influenza has no DNA genome for host repair enzymes to recombine.", "Immune selection inside one person shapes drift variants; it cannot import a gene from a bird virus."], "objective": "Antigenic shift is reassortment of influenza's segmented genome during co-infection, creating a new hemagglutinin and pandemic potential; antigenic drift is point mutation causing seasonal change."}, {"qid": "06-2", "topic": "Class VI replication", "stem": "<p>A virus contains two identical copies of a positive-sense single-stranded RNA genome. Unlike other positive-sense RNA viruses, its genomic RNA is not translated when it first enters the cytoplasm. In cultured cells pretreated with a drug that inhibits an enzyme carried inside the virion, the virus binds and enters normally, but no viral proteins are ever made and the cells do not become chronically infected.<\/p>", "lead": "The drug most likely blocks which event?", "choices": ["Copying of the RNA genome into double-stranded DNA", "Translation of the genome into a polyprotein", "Cleavage of the viral polyprotein into mature proteins", "Fusion of the viral envelope with the plasma membrane", "Copying of the RNA genome into a negative-sense RNA template"], "answer": 0, "explanation": "<p>A positive-sense RNA genome that is not used directly as mRNA, and whose blockade prevents chronic infection, points to a retrovirus (Baltimore class VI). Its packaged reverse transcriptase copies the RNA into double-stranded DNA, which integrase then inserts into the host chromosome. Only the integrated DNA (the provirus) is transcribed into mRNA.<\/p><p>Block reverse transcriptase and nothing downstream can happen: no DNA, no integration, no viral mRNA, no proteins, and no lasting infection. Entry is untouched, which matches the normal binding and entry in the stem.<\/p>", "why_wrong": ["Correct: retroviral reverse transcriptase makes the DNA copy that every later step depends on.", "The stem states the genome is not translated on entry, so translation is not the first required step.", "Polyprotein cleavage happens late, after proteins are made, and would not stop all protein production.", "Entry was normal in the drug-treated cells, so fusion is not blocked.", "Making a negative-sense RNA copy is how class IV viruses replicate, not class VI."], "objective": "Class VI viruses (retroviruses) carry reverse transcriptase to turn their positive-sense RNA into DNA that integrates; blocking that step stops all later events."}, {"qid": "06-3", "topic": "Interferon and the antiviral state", "stem": "<p>Cultured cells are infected with an RNA virus. Twelve hours later, the culture medium is collected and passed through a filter that removes all virus particles. Fresh cells bathed in this filtered medium for six hours resist infection by an unrelated RNA virus. The protection is lost if the fresh cells are first treated with an antibody that blocks a specific cytokine receptor on their surface.<\/p>", "lead": "The protective factor most likely acts on the fresh cells by which mechanism?", "choices": ["Neutralizing virus particles before they attach", "Inducing proteins that block viral RNA translation and replication", "Killing the fresh cells before the second virus can spread", "Removing the receptors the second virus uses to enter", "Recruiting neutrophils to engulf the second virus"], "answer": 1, "explanation": "<p>The first infected cells released something soluble, non-viral and protective against a different virus, acting through a receptor on neighbor cells. That is type I interferon. Infected cells make it after sensing viral molecules such as double-stranded RNA (a pathogen-associated molecular pattern).<\/p><p>Interferon does not touch the virus itself. It binds its receptor on nearby cells and switches on genes for antiviral proteins that degrade viral RNA and shut down protein synthesis, putting the cells in an antiviral state. Because this response is not specific to any one virus, it protected the fresh cells against an unrelated virus.<\/p>", "why_wrong": ["Neutralizing particles would be specific to one virus and would not require a receptor on the cells.", "Correct: interferon signals through its receptor to induce an antiviral state in neighboring cells.", "The fresh cells survived and resisted infection; they were protected, not killed.", "The fresh cells' viral receptors were not described as changing, and the effect required the cytokine receptor.", "A dish of cultured cells has no neutrophils to recruit."], "objective": "Virus-infected cells sense viral RNA and release type I interferon, which acts on neighboring cells through its receptor to induce a non-specific antiviral state."}, {"qid": "06-4", "topic": "Infectivity of purified genomes", "stem": "<p>Investigators purify genomic RNA away from all protein from two enveloped respiratory viruses and introduce the naked RNA directly into the cytoplasm of cultured cells. RNA from virus R produces viral proteins within an hour and yields infectious progeny. RNA from virus S produces no viral protein and no progeny, even though the same RNA is intact and of full length. Adding purified protein extracted from virus S particles along with its RNA restores progeny production.<\/p>", "lead": "Which of the following best explains the result with virus S?", "choices": ["Its genome must first be reverse transcribed into DNA by an enzyme carried in the particle", "Its genome is complementary to messenger RNA and cannot be translated by host ribosomes", "Its genome must be transported into the nucleus by a capsid protein before translation", "Its genome is double stranded and must be separated into single strands before translation", "Its genome lacks the sequences recognized by host ribosomes and needs a viral ribosome"], "answer": 1, "explanation": "<p>Virus R behaves like a positive-sense RNA virus. Its genome has the same polarity as messenger RNA, so host ribosomes translate it the moment it reaches the cytoplasm, and the first proteins made include the RNA-dependent RNA polymerase. That is why naked positive-sense RNA is infectious on its own: the replicase, which uninfected cells do not have, can be translated straight off the viral RNA.<\/p><p>Virus S behaves like a negative-sense RNA virus. Its genome is complementary to messenger RNA, so ribosomes cannot read it. Before any protein can be made, the genome must be copied into a positive-sense strand, and the only enzyme able to do that is an RNA-dependent RNA polymerase the virus carries inside the particle. Supplying protein from the virion restores replication because it restores that polymerase, which is exactly why purified negative-sense genomes are not infectious by themselves.<\/p>", "why_wrong": ["Reverse transcription is the strategy of retroviruses, and here the deficiency is corrected by virion protein without any DNA intermediate.", "Correct: a negative-sense genome cannot serve as messenger RNA and needs a virion-carried RNA polymerase to make a readable positive strand.", "Nuclear transport is required by influenza virus but does not explain why ribosomes cannot read the genome at all.", "A double-stranded genome would also fail, but it would be described as double stranded, and separating strands would not require virion protein.", "No virus carries ribosomes, and host ribosomes translate positive-sense viral RNA perfectly well."], "objective": "Positive-sense RNA genomes are infectious alone because they are translated directly, whereas negative-sense genomes require an RNA-dependent RNA polymerase carried within the virion."}, {"qid": "06-5", "topic": "Site of replication among RNA viruses", "stem": "<p>Three negative-sense single-stranded RNA viruses are studied in cultured human cells. Fluorescent antibody staining is used to locate newly made viral nucleoprotein complexes early in infection. For two of the viruses the complexes appear only in the cytoplasm. For the third virus the complexes appear within the nucleus, and infection of enucleated cells with this virus yields no progeny. This third virus has a genome made of eight separate RNA segments.<\/p>", "lead": "The third virus is best classified in which of the following families?", "choices": ["Paramyxoviridae", "Rhabdoviridae", "Orthomyxoviridae", "Filoviridae", "Pneumoviridae"], "answer": 2, "explanation": "<p>Two features of the third virus point to one family. Its genome is divided into eight separate negative-sense RNA segments, and its replication requires the nucleus. Among the negative-sense RNA viruses taught, influenza A and B are the ones with eight segments, and they belong to the Orthomyxoviridae.<\/p><p>The nuclear location is the same answer from a different direction. Most RNA viruses, including the other negative-sense families, replicate entirely in the cytoplasm, and the orthomyxoviruses are the stated exception: their polymerase enzymes are carried into the nucleus within a nucleoprotein complex and transcription and replication occur there. The other families listed are all nonsegmented and cytoplasmic.<\/p>", "why_wrong": ["Paramyxoviruses, including measles, mumps and parainfluenza viruses, have a nonsegmented genome and replicate in the cytoplasm.", "Rhabdoviruses, including rabies virus, are nonsegmented and cytoplasmic.", "Correct: the orthomyxoviruses have eight genome segments and are the negative-sense family that replicates in the nucleus.", "Filoviruses, including Ebola and Marburg viruses, are nonsegmented and cytoplasmic.", "Pneumoviruses, including respiratory syncytial virus and human metapneumovirus, are nonsegmented and cytoplasmic."], "table": "<table><tr><th>Family<\/th><th>Genome arrangement<\/th><th>Replication site<\/th><\/tr><tr><td>Orthomyxoviridae (influenza A and B)<\/td><td>Eight segments<\/td><td>Nucleus<\/td><\/tr><tr><td>Paramyxoviridae, Pneumoviridae, Rhabdoviridae, Filoviridae<\/td><td>Nonsegmented<\/td><td>Cytoplasm<\/td><\/tr><tr><td>Hantaviridae<\/td><td>Three segments<\/td><td>Cytoplasm<\/td><\/tr><tr><td>Arenaviridae<\/td><td>Two segments, ambisense<\/td><td>Cytoplasm<\/td><\/tr><\/table>", "objective": "Influenza viruses are segmented negative-sense RNA viruses and the exception among RNA viruses in replicating within the nucleus."}, {"qid": "06-6", "topic": "Shielding of a double-stranded RNA genome", "stem": "<p>A virus recovered from an infant with watery diarrhea is studied in cultured intestinal epithelial cells. Its genome is double-stranded RNA. Fractionation of infected cells shows that newly made viral RNA stays inside intact viral protein shells in the cytoplasm throughout infection, and the genome is never detected free in the cytosol. Cells infected with a mutant whose shells disassemble early release large amounts of interferon and support very little viral replication.<\/p>", "lead": "Keeping the genome inside the protein shell most directly allows this virus to avoid which of the following?", "choices": ["Degradation of the genome by cytoplasmic deoxyribonucleases", "Recognition of the genome as a pathogen-associated molecular pattern", "Binding of neutralizing antibody to the viral attachment protein", "Presentation of viral peptides on class I major histocompatibility complex", "Loss of the genome into the nucleus of the infected cell"], "answer": 1, "explanation": "<p>Human cells make no use of double-stranded RNA in any normal process, and they carry sensors that treat it as a sign of infection. Double-stranded RNA is a pathogen-associated molecular pattern recognized by intracellular Toll-like receptors, and that recognition drives interferon production, which induces resistance to viral replication, activates natural killer cells, and increases antigen presentation.<\/p><p>A virus whose genome is permanently double stranded therefore has a problem no other class has, and the solution seen here is concealment. Replication and transcription occur inside the intact nucleocapsid, where the viral RNA-dependent RNA polymerase acts as both transcriptase and replicase, so the genome is never exposed to the cytosol. The mutant proves the point: when the shell opens early, interferon pours out and replication collapses.<\/p>", "why_wrong": ["The genome is RNA, so deoxyribonucleases are not a threat to it.", "Correct: double-stranded RNA is a pathogen-associated molecular pattern, and hiding it inside the nucleocapsid prevents sensing and interferon induction.", "Antibody acts on surface proteins of extracellular particles, not on genome exposed within the cytoplasm.", "Peptide presentation depends on viral protein synthesis and proteasome processing, which continue regardless of where the genome sits.", "The genome is replicated in the cytoplasm and is not at risk of being pulled into the nucleus."], "objective": "Double-stranded RNA is a pathogen-associated molecular pattern, so viruses with double-stranded RNA genomes replicate inside an intact nucleocapsid to avoid interferon induction."}, {"qid": "06-7", "topic": "Antigenic drift", "stem": "<p>A 58-year-old woman received the current seasonal influenza vaccine in October. In February she develops fever, myalgia and cough, and influenza A is confirmed. Temperature is 38.8 C and pulse is 100/min. Her serum from October neutralizes the vaccine strain well but neutralizes the strain recovered from her nose poorly. Sequencing of the recovered strain shows the same eight gene segments as the vaccine strain, with scattered single-nucleotide substitutions in the segments encoding the two surface proteins.<\/p>", "lead": "Which process best explains why her antibodies failed to protect her?", "choices": ["Accumulated point mutations altering the surface antigens", "Exchange of whole gene segments between two influenza viruses", "Direct spillover of an animal influenza virus into humans", "Integration of viral sequences into the host genome", "Loss of the ability of her B cells to produce antibody"], "answer": 0, "explanation": "<p>The genetic evidence is the key. The circulating strain carries the same eight segments as the vaccine strain, so no segments were swapped, and the only changes are scattered single-nucleotide substitutions in the genes for the two surface proteins. Those two proteins, hemagglutinin and neuraminidase, are the most antigenically variable parts of the virus and the targets of neutralizing antibody.<\/p><p>Point mutations that change hemagglutinin and neuraminidase just enough that existing neutralizing antibodies no longer react well with the new strain are called antigenic drift. Her October serum still recognizes the strain she was vaccinated against, which shows her antibody response worked, but it is a poor match for a drifted strain. This gradual drift is the reason influenza vaccine is reformulated and given every year.<\/p>", "why_wrong": ["Correct: point mutations in the surface antigens leave the segment composition unchanged and let the virus escape existing antibody.", "Segment exchange would show segments of different origin, and here all eight match the vaccine strain.", "A direct animal spillover would introduce a virus whose segments differ from circulating human strains.", "Influenza virus does not integrate into host DNA, and that would not change its surface antigens.", "Her serum neutralizes the vaccine strain well, so her antibody response is intact."], "table": "<table><tr><th><\/th><th>Antigenic drift<\/th><th>Antigenic shift<\/th><\/tr><tr><td>Mechanism<\/td><td>Point mutations in the surface antigen genes<\/td><td>Exchange of whole gene segments between viruses co-infecting one cell, or direct spillover<\/td><\/tr><tr><td>Genetic finding<\/td><td>Same segments, scattered substitutions<\/td><td>Segments traceable to different source viruses<\/td><\/tr><tr><td>Consequence<\/td><td>Seasonal epidemics, annual vaccine reformulation<\/td><td>Pandemic potential<\/td><\/tr><\/table>", "objective": "Antigenic drift is the accumulation of point mutations in influenza hemagglutinin and neuraminidase that allows escape from existing neutralizing antibody and requires annual revaccination."}, {"qid": "06-8", "topic": "Retroviral gene products", "stem": "<p>A retrovirus is engineered so that one of its genes is deleted. Cells transfected with the altered viral DNA release particles in normal numbers. The particles contain viral genomic RNA, display normal surface glycoproteins, and bind and enter fresh target cells. However, no viral DNA is ever detected in the newly infected cells, and no progeny are produced. Particles made from the unaltered virus infect the same target cells normally.<\/p>", "lead": "The deleted gene most likely encodes which of the following?", "choices": ["The polyprotein that yields the viral enzymes", "The polyprotein that yields matrix and capsid proteins", "The envelope glycoproteins used for attachment and fusion", "A regulatory protein that increases transcription from the viral promoter", "An accessory protein that counteracts host restriction factors"], "answer": 0, "explanation": "<p>The mutant particle is built correctly and still does everything that depends on structural proteins. It is assembled and released, it carries genomic RNA, it displays functional surface glycoproteins, and it binds and enters cells. So the structural genes and the envelope gene are intact.<\/p><p>What fails is the first enzymatic step after entry: no viral DNA appears in the infected cell. A retroviral genome is positive-sense RNA that is nevertheless not used as messenger RNA, because the virus first copies it into DNA using reverse transcriptase. Reverse transcriptase is one of the products of the enzyme gene, along with protease and integrase, and it must be carried in the particle since the cell has no such enzyme. Deleting that gene gives exactly this phenotype.<\/p>", "why_wrong": ["Correct: the enzyme gene supplies reverse transcriptase, protease and integrase, and without reverse transcriptase no viral DNA can be made after entry.", "Loss of matrix and capsid proteins would prevent assembly and release of normal particles.", "Loss of the envelope glycoproteins would prevent attachment and fusion, yet entry occurs normally.", "A transcriptional regulatory protein acts after the provirus is established, which is later than the step that failed here.", "An accessory protein would blunt replication but would not abolish synthesis of viral DNA altogether."], "objective": "Retroviral genomes are positive-sense RNA that must first be reverse transcribed into DNA, so reverse transcriptase, a product of the viral enzyme gene, is required in the particle for any infection to proceed."}]}, {"id": "1C", "title": "Intro to Immunology", "week": 1, "subject": "Immunology", "questions": [{"qid": "1C-1", "topic": "Active vs passive immunity", "stem": "<p>A 34-year-old man steps on a rusty nail while gardening. He cannot remember his last tetanus vaccination. In the emergency department he receives an injection of preformed antibodies against tetanus toxin and, in the other arm, a dose of tetanus toxoid vaccine.<\/p>", "lead": "Which best explains why the vaccine is given in addition to the antibodies?", "choices": ["The antibodies protect only after several weeks of delay", "Only the vaccine leads to long-lived memory against the toxin", "The vaccine neutralizes the toxin faster than the antibodies", "The antibodies would otherwise trigger his own antibody production", "The vaccine supplies complement that the antibodies need to work"], "answer": 1, "explanation": "<p>The preformed antibodies give artificial passive immunity: they work immediately, but they come from someone else, so the patient makes no memory and the antibodies are gone within weeks as they are cleared. The toxoid gives artificial active immunity: his own lymphocytes respond, which takes time, but leaves memory cells that protect for years.<\/p><p>Giving both covers the gap. Passive antibodies protect him today, while active immunization builds lasting protection for the next exposure.<\/p>", "why_wrong": ["Passive antibodies work right away; it is the active response that is delayed.", "Correct: active immunization generates memory; passive transfer does not.", "The vaccine needs days to weeks for his own response; it is the slower of the two.", "Transferred antibodies do not stimulate lasting antibody production by the recipient.", "Vaccines do not supply complement; complement is a host plasma system."], "objective": "Passive immunity (transferred antibodies) is immediate but short-lived with no memory; active immunity (vaccination or infection) is slower but produces long-lasting memory."}, {"qid": "1C-2", "topic": "Innate vs adaptive immunity", "stem": "<p>Two strains of mice are infected with the same dose of a bacterium. Strain 1 is normal. Strain 2 has no lymphocytes but normal skin, mucosa, phagocytes and plasma proteins. In the first three days, both strains limit bacterial growth equally well. When surviving mice are infected again with the same bacterium two months later, strain 1 clears it within a day, while strain 2 responds exactly as it did the first time.<\/p>", "lead": "The difference between the strains on the second infection is best explained by the absence of which feature in strain 2?", "choices": ["Physical and chemical barriers", "Recognition of shared microbial patterns", "Specificity and immunological memory", "Phagocytosis by neutrophils", "Complement activation on the bacterial surface"], "answer": 2, "explanation": "<p>Both strains controlled the first few days equally, which is the work of innate immunity: barriers, phagocytes and plasma proteins such as complement, all present in strain 2. Innate immunity responds the same way every time.<\/p><p>Lymphocytes make up adaptive immunity, whose defining features are fine specificity for one antigen and memory. Only strain 1, with lymphocytes, responded faster and better the second time. Strain 2 repeated its first response because it has no adaptive arm to remember the bacterium.<\/p>", "why_wrong": ["Strain 2 has normal skin and mucosa, so barriers are intact.", "Pattern recognition belongs to innate cells, which strain 2 has.", "Correct: specificity and memory come from lymphocytes, the adaptive arm that strain 2 lacks.", "Strain 2 has normal phagocytes and handled the first days normally.", "Complement is a plasma protein system and is normal in strain 2."], "objective": "Innate immunity responds rapidly and identically on every exposure; adaptive immunity, carried by lymphocytes, adds specificity and memory, giving a faster, stronger response on re-exposure."}, {"qid": "1C-3", "topic": "Hematopoietic lineages", "stem": "<p>An infant has repeated severe infections. Blood studies show almost no B cells, T cells or natural killer cells. Neutrophil, monocyte, red blood cell and platelet counts are normal. Bone marrow examination suggests that one type of progenitor cell fails to develop, while the others mature normally.<\/p>", "lead": "Which defense would most likely still function normally in this infant?", "choices": ["Antibody production against a bacterial toxin", "Killing of virus-infected cells by cytotoxic T cells", "Killing of virus-infected cells by NK cells", "Phagocytosis of bacteria by tissue macrophages", "Cytokine help from CD4 T cells to B cells"], "answer": 3, "explanation": "<p>B cells, T cells and NK cells all descend from the common lymphoid progenitor, while neutrophils, monocytes, red cells and platelets come from the common myeloid progenitor. Losing all three lymphoid populations with normal myeloid counts places the defect in the lymphoid progenitor.<\/p><p>Tissue macrophages develop from monocytes, which are myeloid and present in normal numbers. Phagocytosis by macrophages should therefore work. Every other choice depends on a lymphoid cell: B cells make antibody, CD8 T cells kill infected cells, NK cells kill infected cells, and CD4 T cells provide help.<\/p>", "why_wrong": ["Antibody comes from B cells (plasma cells), which are lymphoid and absent.", "Cytotoxic T cells are lymphoid and absent.", "NK cells arise from the lymphoid progenitor and are absent here.", "Correct: macrophages come from monocytes of the myeloid lineage, which is intact.", "CD4 helper T cells are lymphoid and absent."], "objective": "The common lymphoid progenitor gives rise to B, T and NK cells; the common myeloid progenitor gives rise to granulocytes, monocytes and macrophages, red cells and platelets."}, {"qid": "1C-4", "topic": "Humoral vs cell-mediated immunity", "stem": "<p>Donor mice are immunized against two pathogens: pathogen 1, a bacterium that lives outside cells and releases a toxin, and pathogen 2, a virus that replicates inside host cells. Naive recipient mice then receive either cell-free serum or purified T cells from the donors, and all recipients are challenged with both pathogens the next day.<\/p><table class=\"labs\"><tr><th>Transferred from donors<\/th><th>Protected from pathogen 1<\/th><th>Protected from pathogen 2<\/th><\/tr><tr><td>Serum<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>T cells<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><td>Nothing<\/td><td>No<\/td><td>No<\/td><\/tr><\/table>", "lead": "Which of the following best explains why serum protected against pathogen 1 but not pathogen 2?", "choices": ["Serum antibodies act on extracellular pathogens, while infected cells need cell-mediated killing", "Serum carries immunological memory, which takes longer to act against viruses than against bacteria", "Serum contains phagocytes, which can ingest bacteria but cannot ingest viruses", "Passively transferred protection fades within a day, so it was gone before the viral challenge", "The serum strengthened barrier immunity, which blocks the entry of bacteria but not viruses"], "answer": 0, "explanation": "<p>Cell-free serum can transfer protection, as the antitoxin experiments of the 1890s first showed, because it carries secreted molecules, chiefly antibodies (and complement). That is humoral immunity. Transferring T cells instead transfers cell-mediated immunity, carried out directly by cells such as cytotoxic T cells.<\/p><p>The rule of thumb is that humoral immunity acts primarily on extracellular pathogens and their products, such as a circulating toxin. A virus replicating inside host cells is hidden from antibodies in that phase, and infected cells are eliminated by cell-mediated immunity. So serum protected against the extracellular bacterium, and only T cells protected against the intracellular virus. Most real immune responses use both arms together.<\/p>", "why_wrong": ["Correct: serum transfers humoral immunity (antibodies), which acts on extracellular pathogens and toxins; intracellular infection requires cell-mediated immunity.", "Serum is cell free; memory resides in lymphocytes, not in transferred antibodies.", "Serum is cell free and contains no phagocytes.", "Passive immunity is short lived, but it lasts far longer than one day, and both challenges were given at the same time.", "Transferred serum does not build skin or mucosal barriers."], "table": "<table><tr><th><\/th><th>Humoral immunity<\/th><th>Cell-mediated immunity<\/th><\/tr><tr><td>Carried by<\/td><td>Secreted molecules (antibodies, complement)<\/td><td>Cells (cytotoxic T cells, NK cells, activated phagocytes)<\/td><\/tr><tr><td>Transferred by<\/td><td>Cell-free serum<\/td><td>Cells<\/td><\/tr><tr><td>Main targets<\/td><td>Extracellular pathogens and toxins<\/td><td>Infected cells, phagocytosed microbes, tumor cells<\/td><\/tr><\/table>", "objective": "Humoral immunity, transferable by cell-free serum, acts mainly on extracellular pathogens and toxins, while cell-mediated immunity eliminates intracellular pathogens and infected cells."}, {"qid": "1C-5", "topic": "Barrier immunity: chemical barriers", "stem": "<p>In a study, healthy volunteers are given a drug that keeps the stomach contents at a near-neutral pH. They then swallow measured doses of a bacterium that causes intestinal infection. Compared with volunteers not taking the drug, a dose about 100 times smaller is enough to establish infection. Lymphocyte counts, antibody levels, neutrophil counts and the composition of the intestinal flora are the same in both groups.<\/p>", "lead": "The increased susceptibility is best explained by loss of which defense?", "choices": ["Immunological memory from earlier exposures", "Complement-mediated killing in the blood", "Phagocytosis by circulating neutrophils", "The biological barrier of normal microbial flora", "A chemical barrier in the stomach"], "answer": 4, "explanation": "<p>Barriers are the first layer of protective immunity: always active, they prevent pathogens from entering or growing. They come in three kinds. Physical barriers are skin, mucosal epithelia and mucus. Chemical barriers include low pH (stomach acid), enzymes such as lysozyme, and antimicrobial peptides. Biological barriers are the normal microbial flora.<\/p><p>Here the only change is the stomach pH. Acid kills many swallowed bacteria before they reach the intestine, so neutralizing it lets far more survive, and a much smaller dose can cause infection. Every innate and adaptive measure was unchanged, and so was the flora, which isolates the loss to a chemical barrier.<\/p>", "why_wrong": ["Memory is a feature of adaptive immunity, which was not changed.", "Complement acts after pathogens reach tissues or blood; nothing in the stem altered it.", "Neutrophil counts were normal, and the drug acts on stomach pH.", "The intestinal flora was the same in both groups, so the biological barrier was intact.", "Correct: stomach acid is a chemical barrier, and neutralizing it lets more swallowed bacteria survive."], "objective": "Barrier immunity includes physical (skin, mucus), chemical (stomach acid, lysozyme, antimicrobial peptides) and biological (normal flora) defenses that act constantly to prevent pathogen entry or growth."}, {"qid": "1C-6", "topic": "Features of adaptive immunity: specificity", "stem": "<p>Mice recover from infection with virus A. Two months later, one group is challenged with virus A: they show no illness, and antibodies against virus A rise within 2 days to levels far higher than during the first infection. A second group is challenged instead with an unrelated bacterium B. These mice become ill, and their antibody response to bacterium B takes as long and reaches the same level as that of mice never exposed to anything.<\/p>", "lead": "The lack of protection against bacterium B best illustrates which feature of the immune response?", "choices": ["Immunological memory", "Diversity of the response", "Antigen specificity", "Trained innate immunity", "Barrier immunity"], "answer": 2, "explanation": "<p>Immunity that follows an infection has three features, recognized as far back as the ancient description of the Plague of Athens and now attributed to adaptive immunity: specificity (protection against that disease, not others), diversity (it can arise against many different diseases), and memory (lasting protection, with faster and stronger responses on re-exposure).<\/p><p>The virus A group shows memory: a faster, stronger response and no illness. The bacterium B group shows that this memory protects only against virus A; a different pathogen is met as if for the first time. That restriction is specificity, the ability of adaptive immunity to recognize individual molecules (antigens) rather than broad classes.<\/p>", "why_wrong": ["Memory explains the faster, stronger response to virus A, not the lack of protection against bacterium B.", "Diversity is the capacity to respond to many different pathogens, which these mice still have, since they did respond to bacterium B.", "Correct: adaptive immunity is specific for individual antigens, so immunity to virus A does not protect against bacterium B.", "Trained innate immunity would, if anything, give some broad protection, not a response identical to naive mice.", "Barriers are non-specific and were not tested by this experiment."], "objective": "Adaptive immunity is defined by specificity, diversity and memory; specificity means immunity to one pathogen does not protect against an unrelated one."}, {"qid": "1C-7", "topic": "Self vs non-self: two recognition strategies", "stem": "<p>A cell type is isolated from normal mouse tissue and studied in culture. Within 30 minutes of exposure to a cell wall molecule shared by many unrelated bacteria, the cells release inflammatory mediators. They release the same mediators when exposed to the contents of host cells that died by necrosis. Every cell of this type in every mouse tested responds the same way, and the response on a second exposure is no faster or larger than on the first.<\/p>", "lead": "Which of the following best describes how these cells identify their targets?", "choices": ["Each cell carries a receptor selected for one particular antigen", "They recognize classes of molecules broadly associated with danger", "They respond only after dendritic cells bring antigen to lymphoid tissue", "They detect targets through antibodies made by plasma cells", "They tell self from non-self using memory of earlier exposures"], "answer": 1, "explanation": "<p>The immune system must tell apart its own molecules and harmless foreign ones from those that are foreign or signal danger, and it uses two strategies. The first, used primarily by innate immunity, is to recognize types of molecules broadly associated with danger: structures shared across many microorganisms, or signs of cell stress and necrotic death. The second, used exclusively by adaptive immunity, is to be highly selective for one specific target, an antigen.<\/p><p>These cells respond within minutes, to a molecule common to many bacteria and to damaged host cells, uniformly across all cells and animals, and with no memory. That is the pre-set, broadly specific profile of innate immunity, so they identify targets by the first strategy.<\/p>", "why_wrong": ["Selective recognition of one antigen is the strategy of adaptive lymphocytes, which would differ from cell to cell.", "Correct: innate cells recognize broad classes of molecules associated with microbes or cell damage, a pre-set response without memory.", "Dendritic cell transport to lymphoid tissue starts adaptive responses, which take days, not minutes.", "Antibodies are adaptive products; these isolated cells responded on their own within 30 minutes.", "Memory is an adaptive feature, and the repeat response was no faster or larger."], "table": "<table><tr><th><\/th><th>Innate immunity<\/th><th>Adaptive immunity<\/th><\/tr><tr><td>Speed<\/td><td>Minutes to hours<\/td><td>Days to a week<\/td><\/tr><tr><td>Specificity<\/td><td>Broad, classes of danger-associated molecules<\/td><td>High, individual antigens<\/td><\/tr><tr><td>Memory<\/td><td>None (but can be trained)<\/td><td>Lasting memory<\/td><\/tr><\/table>", "objective": "Innate immunity identifies targets by recognizing classes of molecules broadly associated with danger (microbes, cell damage), whereas adaptive immunity is selective for individual antigens."}, {"qid": "1C-8", "topic": "Sequence of an immune response: dendritic cells link innate to adaptive", "stem": "<p>Researchers create mice whose dendritic cells develop normally and capture antigen in tissues but cannot leave the tissue to travel to lymphoid organs. After a bacterial infection of the skin, these mice recruit neutrophils within hours and monocytes later, just like normal mice, and their phagocytes ingest and kill bacteria normally. Two weeks after infection, however, they have no detectable antigen-specific antibodies or T cells.<\/p>", "lead": "If these mice survive and are reinfected with the same bacterium two months later, which response would most likely be seen?", "choices": ["Rapid neutrophil recruitment, with an antigen-specific response no faster than the first time", "No neutrophil recruitment at all, because the tissue sentinel cells cannot detect the bacteria", "A faster and larger antibody response than normal mice mount on reinfection", "Complete protection by skin barriers alone, without any innate response", "Long-lasting protection from antibodies passed on by the first infection"], "answer": 0, "explanation": "<p>An immune response unfolds in steps. Sentinel cells in the tissue (macrophages, mast cells) recognize the pathogen and release inflammatory mediators and chemotactic factors, which recruit neutrophils first and monocytes later. Dendritic cells then jump-start adaptive immunity by carrying antigen to local lymphoid tissue, where T and B cells are activated. These mice have every innate step intact, which is why the early response looked normal, but without dendritic cell migration no adaptive response was ever started.<\/p><p>Memory is a product of adaptive immunity, so if no antigen-specific lymphocytes were activated, none were left behind as memory. On reinfection the innate response would again be rapid, because it is pre-set, but nothing would make the antigen-specific response faster or stronger than the first time.<\/p>", "why_wrong": ["Correct: innate recruitment is intact, but with no adaptive response there is no memory, so reinfection is met as a first encounter.", "Sentinel cells and neutrophil recruitment were normal in these mice.", "A faster, larger secondary response requires memory from a primary adaptive response, which never occurred.", "Barriers were already breached by the first infection and do not replace innate responses.", "No antibodies were made, and antibody-based protection would be short lived without memory cells."], "objective": "Dendritic cells link innate and adaptive immunity by carrying antigen to lymphoid tissue; without that step no adaptive response or memory forms, while pre-set innate responses remain intact."}]}, {"id": "07", "title": "Viral Pathogenesis", "week": 2, "subject": "Microbiology", "questions": [{"qid": "07-1", "topic": "HIV entry and coreceptors", "stem": "<p>A man has had repeated unprotected exposure to a partner with HIV, but serial HIV tests remain negative. Genetic testing shows he is homozygous for a 32 base pair deletion in the gene for a chemokine receptor, so the receptor never reaches his cell surface. His CD4 T cells express normal levels of CD4. The partner's virus uses this chemokine receptor.<\/p>", "lead": "Which step of HIV infection is most directly prevented in this man's cells?", "choices": ["Binding of gp120 to CD4", "Coreceptor binding that triggers gp41-mediated fusion", "Reverse transcription of the viral genome", "Integration of proviral DNA into the host chromosome", "Protease cleavage of Gag polyproteins during maturation"], "answer": 1, "explanation": "<p>HIV entry is a two-part handshake. gp120 first binds CD4, which changes its shape so it can bind a chemokine coreceptor, CCR5 for the R5 strains that dominate early infection. Coreceptor binding exposes gp41, which drives fusion of the viral envelope with the cell membrane.<\/p><p>The CCR5-delta32 deletion keeps CCR5 off the cell surface. gp120 can still bind CD4, but without the coreceptor the fusion step never occurs, so R5 virus cannot enter. This is the same step the drug maraviroc blocks.<\/p>", "why_wrong": ["His cells express normal CD4, so the first gp120 binding step can still happen.", "Correct: without CCR5, gp120 cannot engage a coreceptor and gp41 never mediates fusion.", "Reverse transcription happens after entry, which never occurs here.", "Integration requires a DNA copy made after entry.", "Maturation happens to new virions leaving an infected cell; his cells are not infected."], "objective": "HIV gp120 binds CD4 and then a coreceptor (CCR5 or CXCR4) before gp41 drives fusion; lacking CCR5 (CCR5-delta32) blocks entry of R5 virus."}, {"qid": "07-2", "topic": "Latent HIV reservoir", "stem": "<p>A 41-year-old woman with HIV has taken combination antiretroviral therapy for six years. Her plasma viral RNA has been undetectable for the past five years and her CD4 count is normal. She stops all medications against medical advice. Four weeks later, her plasma viral RNA is again high.<\/p>", "lead": "Which best explains the return of viremia?", "choices": ["Drug-resistant virus that replicated slowly during therapy", "Integrated provirus in resting memory CD4 T cells", "Free virions stored in plasma below the detection limit", "New infection of her cells by virus from a sexual partner", "Viral RNA genomes persisting in red blood cells"], "answer": 1, "explanation": "<p>Antiretroviral drugs block steps of active replication: entry, reverse transcription, integration and maturation. They cannot touch HIV that is already integrated as provirus in a resting memory CD4 T cell and is not being transcribed. That silent DNA forms the latent reservoir, much of it in lymph node follicles.<\/p><p>When therapy stops, some of these cells become activated, transcribe the provirus and release new virions that spread unopposed. This is why current therapy controls HIV but cannot cure it, and why viral load rebounds within weeks of stopping.<\/p>", "why_wrong": ["Resistant virus replicating during therapy would show up as detectable virus while she was on treatment.", "Correct: latent integrated provirus is invisible to the drugs and reactivates when therapy stops.", "Free virions are short-lived and would not survive years of suppression.", "Nothing in the stem suggests a new exposure, and rebound after stopping therapy is expected from the reservoir.", "Red blood cells have no nucleus and are not HIV host cells."], "objective": "Antiretroviral therapy suppresses active replication but cannot clear integrated provirus in resting memory CD4 T cells, the latent reservoir that causes rebound when treatment stops."}, {"qid": "07-3", "topic": "Class VII replication", "stem": "<p>A virus that infects liver cells has a small, partially double-stranded circular DNA genome. After entering the nucleus, the genome is repaired into a complete circle and transcribed by host RNA polymerase. One of the transcripts, a full-length RNA longer than the genome, is packaged into new capsids in the cytoplasm, where it is used as the template for making new genomic DNA.<\/p>", "lead": "Replication of this virus most closely resembles HIV in its need for which enzyme?", "choices": ["RNA-dependent RNA polymerase", "Reverse transcriptase", "Host DNA-dependent DNA polymerase", "Viral thymidine kinase", "Neuraminidase"], "answer": 1, "explanation": "<p>A partially double-stranded DNA genome that is copied from a full-length RNA template describes a Baltimore class VII virus, the hepadnaviruses such as hepatitis B virus. It is a DNA virus that replicates like a retrovirus.<\/p><p>Making DNA from an RNA template requires reverse transcriptase, the same enzyme HIV uses to copy its RNA genome into DNA. The difference is the order: HIV packages RNA and makes DNA after entry, while this virus packages the RNA intermediate and converts it to DNA inside the capsid before release.<\/p>", "why_wrong": ["RNA-dependent RNA polymerase makes RNA from RNA; this virus makes DNA from RNA.", "Correct: copying the RNA pregenome into DNA requires reverse transcriptase, as in HIV.", "Host DNA polymerase copies DNA from DNA and cannot use an RNA template.", "Viral thymidine kinase is a herpesvirus enzyme that activates acyclovir; it does not copy genomes.", "Neuraminidase is an influenza enzyme for virion release."], "objective": "Class VII viruses (hepatitis B virus) have a partially double-stranded DNA genome made from an RNA pregenome by reverse transcriptase, the enzyme they share with retroviruses."}, {"qid": "07-4", "topic": "Coreceptor usage over the course of infection", "stem": "<p>A man with untreated human immunodeficiency virus type 1 subtype B infection has isolates stored from year 1 and from year 9 of infection. Each isolate is tested on two cell lines, both expressing CD4, one expressing only CCR5 and the other only CXCR4. The year 1 isolate enters only the CCR5-expressing line. The year 9 isolate enters both lines. Sequencing shows substitutions in the variable loop of the surface glycoprotein between the two isolates.<\/p>", "lead": "Which of the following best explains the broadened entry of the year 9 isolate?", "choices": ["Acquisition of a second attachment protein that binds CXCR4 directly", "Mutations in the surface glycoprotein that change which coreceptor it can engage", "Loss of the requirement for CD4 as the primary receptor", "Replacement of the fusion protein by a host-derived fusion machinery", "Exchange of surface glycoprotein genes with a second viral strain"], "answer": 1, "explanation": "<p>Entry begins when the surface glycoprotein binds CD4, which exposes the binding domain for a coreceptor, and the transmembrane glycoprotein then fuses the viral and cell membranes. Both isolates still require CD4, since both test lines express it, so the change is at the coreceptor step.<\/p><p>In roughly 40 to 50 percent of patients with chronic untreated subtype B infection, mutations accumulate in the variable loop of the surface glycoprotein and alter coreceptor usage. Early isolates are typically CCR5-using, which is what predominates at transmission, and later populations may become dual-tropic or predominantly CXCR4-using. The year 9 isolate entering both lines is that shift, and it is explained entirely by the sequence changes in the glycoprotein that engages the coreceptor.<\/p>", "why_wrong": ["The virus has one surface attachment glycoprotein, and no second attachment protein is acquired.", "Correct: substitutions in the variable loop of the surface glycoprotein change which coreceptor the virus can use.", "CD4 remains the primary receptor, and both test lines express it, so no loss of that requirement is shown.", "Fusion is mediated by the viral transmembrane glycoprotein, not by host fusion machinery.", "Exchange of genes between strains is not a feature of this virus, and the isolates differ by point substitutions in one loop."], "objective": "Mutations in the variable loop of the human immunodeficiency virus surface glycoprotein can change coreceptor usage from CCR5 to CXCR4 during chronic untreated infection."}, {"qid": "07-5", "topic": "Antiretroviral mechanisms by life cycle step", "stem": "<p>Cultured CD4-positive lymphocytes are infected with human immunodeficiency virus in the presence of one of several investigational drugs. With one drug, full-length linear viral DNA accumulates in the nucleus of the treated cells in amounts equal to untreated controls, but no viral DNA can be recovered in association with host chromosomal DNA, no viral messenger RNA is made, and no progeny virions are released.<\/p>", "lead": "This drug most likely inhibits which of the following viral enzymes?", "choices": ["Reverse transcriptase", "Protease", "Integrase", "The viral attachment glycoprotein", "The viral fusion glycoprotein"], "answer": 2, "explanation": "<p>The result brackets the blocked step on both sides. Full-length viral DNA is present in normal amounts in the nucleus, so entry, reverse transcription and nuclear transport all worked. Nothing downstream happens: the DNA never joins host chromosomal DNA, no viral messenger RNA appears, and no particles are made.<\/p><p>The step between those two observations is integration of the viral DNA into the host genome, carried out by the viral integrase. Integrase inhibitors are one of the standard classes of antiretroviral therapy, alongside entry inhibitors, fusion inhibitors, reverse transcriptase inhibitors and protease inhibitors. Because a productive infection depends on the genome becoming a provirus in host DNA, blocking integration leaves viral DNA stranded and transcriptionally silent.<\/p>", "why_wrong": ["Inhibiting reverse transcriptase would prevent viral DNA from being made at all, yet full-length viral DNA is present.", "Protease acts late, cleaving polyproteins during maturation, so particles would still be released, though noninfectious.", "Correct: viral DNA is made and reaches the nucleus but never joins host DNA, which is the integrase step.", "Blocking attachment would prevent entry, so no viral DNA would be found inside the cell.", "Blocking fusion would also prevent the genome from reaching the cytoplasm in the first place."], "objective": "Integrase inserts human immunodeficiency virus DNA into the host genome, so integrase inhibition leaves full-length unintegrated viral DNA with no viral transcription or progeny."}, {"qid": "07-6", "topic": "Coronavirus entry", "stem": "<p>Two cultured human cell lines are exposed to a betacoronavirus. Line 1 expresses the receptor for the viral surface protein and also a cell surface serine protease. Line 2 expresses the receptor at the same level but lacks that protease. In line 1, viral genomic RNA appears in the cytoplasm within 30 minutes and progeny virions are made. In line 2, virions bind the cell surface in equal numbers but no viral RNA reaches the cytoplasm. Adding the protease to line 2 restores infection.<\/p>", "lead": "The protease is required for which of the following steps?", "choices": ["Binding of the viral surface protein to its receptor", "Fusion of the viral envelope with the host cell membrane", "Translation of the viral genome into polyproteins", "Assembly of structural proteins at intracellular membranes", "Release of progeny virions by exocytosis"], "answer": 1, "explanation": "<p>Attachment is normal in both lines, since virions bind equally well, so the receptor interaction is not what the protease provides. The failure is that the genome never reaches the cytoplasm, which places the defect between binding and genome release.<\/p><p>For highly pathogenic human coronaviruses, receptor binding is followed by proteolytic cleavage of the viral surface protein by a host cell surface serine protease, and that cleavage is what allows the viral and host membranes to fuse. Once fusion occurs, genomic RNA is released into the cytoplasm and translation of the co-terminal polyproteins begins. Without the protease, the particle stays bound and unfused, which is exactly the pattern in line 2.<\/p>", "why_wrong": ["Binding depends on the receptor alone, and binding is equal in both lines.", "Correct: cleavage of the viral surface protein by the host serine protease is required for membrane fusion and genome release.", "Translation happens after the genome reaches the cytoplasm, which never occurs in line 2.", "Assembly occurs late at intracellular membranes and cannot be reached if the genome never enters.", "Exocytosis is the final step and is irrelevant when no replication has taken place."], "objective": "Coronavirus entry requires receptor binding followed by proteolytic cleavage of the viral surface protein by a host serine protease, which permits membrane fusion and release of genomic RNA."}, {"qid": "07-7", "topic": "Acyclovir selectivity", "stem": "<p>A nucleoside analog is tested in two cultures of the same human cell line, one infected with herpes simplex virus and one uninfected. The triphosphate form of the drug accumulates to high concentration in the infected culture and to very low concentration in the uninfected culture. In a cell-free assay, the triphosphate inhibits the viral DNA polymerase at far lower concentrations than it inhibits the cellular DNA polymerase, and DNA strands made in its presence cannot be extended further.<\/p>", "lead": "Which property of the drug best explains why it accumulates in its active form only in infected cells?", "choices": ["It is a poor substrate for cellular kinases until a viral kinase adds the first phosphate", "It diffuses across membranes only when viral proteins alter membrane permeability", "It is degraded by a cellular enzyme that infected cells no longer express", "It binds the viral DNA polymerase, which then transfers phosphates onto it", "It is concentrated in the nucleus by a viral transport protein"], "answer": 0, "explanation": "<p>The drug is a prodrug that has to be phosphorylated three times to work. The first phosphate is added by the viral thymidine kinase, an enzyme present only in infected cells, and cellular kinases then complete the conversion to the triphosphate. That dependence on a viral enzyme for the first step is why the active metabolite accumulates in infected cells and barely appears in uninfected ones.<\/p><p>Selectivity then comes from two layers. The drug is activated preferentially where the virus is, and the triphosphate inhibits the viral DNA polymerase much more strongly than the cellular enzyme. Because the analog lacks a hydroxyl group at the three prime position, incorporation terminates the growing DNA chain, which is why strands made in its presence cannot be extended. This is the basis for treating herpes simplex and varicella zoster infections with acyclovir or its oral prodrug valacyclovir.<\/p>", "why_wrong": ["Correct: the viral thymidine kinase performs the first phosphorylation, so the active triphosphate forms almost only in infected cells.", "Membrane permeability changes are a general cytopathic effect and do not explain selective phosphorylation.", "Infected cells do not lose a degrading enzyme, and the difference observed is in formation of the triphosphate.", "DNA polymerase is the target of the triphosphate, not the enzyme that phosphorylates the drug.", "Nuclear transport would not change how much triphosphate is formed in the cell overall."], "objective": "Acyclovir is activated by viral thymidine kinase and then inhibits viral DNA polymerase with chain termination, which gives it selectivity for infected cells."}, {"qid": "07-8", "topic": "Single-stranded DNA virus replication", "stem": "<p>A very small naked icosahedral virus about 22 nanometers in diameter is studied. Purified virions are found to contain a single linear strand of DNA, and roughly half the particles carry a strand with the same sequence as viral messenger RNA while the other half carry the complementary strand. In infected cells, newly made viral DNA is detected in the nucleus, and the virus grows only in cultures supplemented with dividing erythroid progenitor cells.<\/p>", "lead": "Which of the following best describes how this virus expresses its genes?", "choices": ["Its genome is transcribed into messenger RNA after a complementary DNA strand is made", "Its genome is translated directly by host ribosomes on entry into the cytoplasm", "Its genome is copied into RNA by a polymerase carried within the virion", "Its genome is reverse transcribed from an RNA intermediate before transcription", "Its genome is transcribed in the cytoplasm by a virally encoded RNA polymerase"], "answer": 0, "explanation": "<p>The description identifies a single-stranded DNA virus, the only class in which plus-strand and minus-strand genomes are packaged into separate virions in similar proportion. Among human pathogens this is the parvovirus family, which is small, naked and icosahedral, replicates in the nucleus, and infects erythroid progenitor cells.<\/p><p>Gene expression still follows the conventional route of DNA to messenger RNA to protein. Because the genome is single stranded and may be of either polarity, the cell must first make the complementary strand so that a double-stranded template exists for transcription of messenger RNA, and this happens in the nucleus. No reverse transcription and no viral RNA polymerase are involved.<\/p>", "why_wrong": ["Correct: a single-stranded DNA genome is converted to a double-stranded form in the nucleus and then transcribed into messenger RNA.", "DNA cannot be read by ribosomes, and direct translation of the genome is a property of positive-sense RNA viruses.", "A polymerase carried in the virion to copy the genome into RNA is the strategy of negative-sense and double-stranded RNA viruses.", "Reverse transcription from an RNA intermediate is used by retroviruses and by hepatitis B virus, not by this virus.", "Replication and transcription occur in the nucleus, and the host supplies the RNA polymerase."], "objective": "Single-stranded DNA viruses such as the parvoviruses package plus or minus strands separately and must form a double-stranded intermediate in the nucleus before messenger RNA can be transcribed."}, {"qid": "07-9", "topic": "Reactivation from neuronal latency", "stem": "<p>A 74-year-old man has burning pain across one side of his lower chest, and 3 days later grouped vesicles appear in a single band on that side that stops at the midline. He had chickenpox as a child and has been taking an immunosuppressant for 6 months. Temperature is 37.3 C. Vesicle fluid yields an enveloped double-stranded DNA virus identical to the one he had in childhood.<\/p>", "lead": "Which of the following best explains why his lesions are limited to one narrow band on one side?", "choices": ["Antibody neutralizes virus everywhere except in poorly vascularized skin", "Virus spreads through the bloodstream and settles where the skin is thinnest", "Virus reactivating in one sensory ganglion travels outward along that nerve to the skin", "Virus replicating in circulating T cells is delivered to one dermatome at a time", "Virus persisting in skin keratinocytes reactivates in a single patch of epidermis"], "answer": 2, "explanation": "<p>After the childhood illness, this virus reached sensory neurons by travel along axons from the skin and by bloodborne spread, and it established latency in dorsal root and cranial nerve ganglia. The genome persists there as a circular episome in the nucleus with restricted gene expression, causing no symptoms, sometimes for decades.<\/p><p>Reactivation follows a decline in virus-specific T cell immunity, as with aging or immunosuppression, which is this man's situation. Replication resumes in the neurons of one ganglion and the virus then moves outward along that nerve to the skin it supplies. Because a dermatome is the area of skin innervated by a single spinal nerve, the result is a painful unilateral rash in one band that does not cross the midline. Thoracic levels and the first division of the trigeminal nerve are the common sites.<\/p>", "why_wrong": ["Antibody distribution does not define a dermatome, and reactivation disease occurs in people with antibody present.", "Bloodborne spread produces the widespread rash of the primary illness, not a single band, and skin thickness is not the determinant.", "Correct: reactivation in one sensory ganglion with outward axonal spread confines the rash to that nerve's dermatome.", "T cells carry the virus to the skin during primary infection, which gives a generalized rash rather than one band.", "Latency is established in sensory ganglion neurons, not in skin keratinocytes."], "objective": "Varicella zoster virus establishes latency as an episome in sensory ganglion neurons, and reactivation with spread along one nerve produces a unilateral dermatomal rash."}, {"qid": "07-10", "topic": "Patterns of viral infection", "stem": "<p>Four patients are followed with serial testing. Patient 1 has detectable virus in blood for 6 days with symptoms, then clears it and remains negative. Patient 2 has virus detectable in blood continuously for 8 years at fluctuating levels. Patient 3 has no detectable infectious virus between episodes, but viral DNA is present in sensory ganglia and painful vesicles recur every few years. Patient 4 was infected 9 years ago, has had no symptoms until now, and presents with slowly progressive neurologic decline.<\/p>", "lead": "The pattern in patient 3 is best described as which of the following?", "choices": ["Acute infection followed by clearance", "Persistent chronic infection", "Persistent latent infection", "Persistent slow progressive infection", "Nonproductive abortive infection"], "answer": 2, "explanation": "<p>The four patients illustrate the standard patterns. An acute infection is a brief period of replication followed by clearance, as with influenza virus and rotavirus. A persistent chronic infection means ongoing replication at levels that may fluctuate, as with hepatitis B virus, hepatitis C virus and human immunodeficiency virus. A persistent slow progressive infection has a long symptom-free interval before progressive disease.<\/p><p>Patient 3 matches persistent latency. The viral genome remains in the host, in this case in sensory ganglia, without producing infectious virus during the quiet intervals, and reactivation then produces recurrent disease. Herpes simplex virus and varicella zoster virus are the examples, and the alternating pattern of silence and recurrence is the feature that distinguishes latency from continuous chronic replication.<\/p>", "why_wrong": ["Acute infection ends in clearance with no later recurrences, which is patient 1.", "Chronic infection means virus is continuously replicating and detectable, which is patient 2.", "Correct: the genome persists without producing infectious virus between episodes, with reactivation causing recurrent disease.", "Slow progressive infection has one long silent interval followed by progressive illness, which is patient 4.", "A nonproductive infection makes no progeny at all, so it could not account for recurrent vesicular episodes."], "table": "<table><tr><th>Pattern<\/th><th>Key feature<\/th><th>Examples<\/th><\/tr><tr><td>Acute<\/td><td>Brief replication, then clearance<\/td><td>Influenza virus, rotavirus<\/td><\/tr><tr><td>Persistent chronic<\/td><td>Ongoing replication, levels may fluctuate<\/td><td>Hepatitis B virus, hepatitis C virus, human immunodeficiency virus<\/td><\/tr><tr><td>Persistent latent<\/td><td>Genome persists without infectious virus; reactivation may occur<\/td><td>Herpes simplex virus, varicella zoster virus<\/td><\/tr><tr><td>Persistent slow progressive<\/td><td>Long symptom-free interval, then progressive disease<\/td><td>Measles-associated encephalitis, human immunodeficiency virus<\/td><\/tr><\/table>", "objective": "Viral infections follow acute, persistent chronic, persistent latent or slow progressive patterns, and latency is defined by genome persistence without production of infectious virus between reactivations."}]}, {"id": "08", "title": "Mechanisms of Innate Immunity", "week": 2, "subject": "Immunology", "questions": [{"qid": "08-1", "topic": "Innate vs adaptive target recognition", "stem": "<p>Investigators compare wild-type mice with mutant mice that cannot rearrange the genes for B cell or T cell antigen receptors, so they have no mature B or T lymphocytes. Neither group has been exposed to the bacterium before. Two hours after an intraperitoneal injection of heat-killed bacteria, peritoneal macrophages from both groups secrete similar amounts of inflammatory cytokines and ingest similar numbers of bacteria.<\/p>", "lead": "Which property of the receptors that triggered this response best explains these results?", "choices": ["Each receptor is generated by gene rearrangement unique to one cell", "They are encoded in the germline and expressed on many cells before exposure", "They are expressed only after the first encounter with a given antigen", "Each receptor recognizes a single antigen with very high specificity", "They depend on clonal expansion to reach detectable numbers"], "answer": 1, "explanation": "<p>The mutant mice lack lymphocytes, yet their macrophages respond normally within two hours to a microbe they have never seen. That rules out antigen receptors and points to pattern recognition receptors (PRRs) of the innate system. PRRs are fixed, germline-encoded receptors for broad classes of danger molecules, and they are already present on many cells, so the response is immediate.<\/p><p>Adaptive receptors work the opposite way:
