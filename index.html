 them unlikely.<\/p><p>Tetanus is different: the spores live in soil and enter through wounds, and an infected person does not pass the disease on. The immune status of everyone around her does nothing to reduce her exposure while gardening, so only her own vaccination could protect her.<\/p>", "why_wrong": ["Correct: tetanus is acquired from the environment, not from other people, so herd immunity cannot protect an unvaccinated child.", "Measles spreads person to person, so high community coverage lowers her chance of exposure, although its very high R0 (more than 10) means coverage must stay above about 90%.", "Rubella spreads person to person, so community vaccination reduces her exposure.", "Mumps spreads person to person, so community vaccination reduces her exposure.", "Polio spreads person to person (fecal-oral), so community vaccination reduces her exposure."], "table": "<table><tr><th>Feature<\/th><th>Effect on herd immunity<\/th><\/tr><tr><td>Person-to-person spread<\/td><td>Required; environmental pathogens (tetanus) are not covered<\/td><\/tr><tr><td>High R0 (measles more than 10)<\/td><td>Higher vaccination rate needed, often above 90%<\/td><\/tr><tr><td>Low R0 (Ebola about 2)<\/td><td>Lower vaccination rate is enough<\/td><\/tr><\/table>", "objective": "Herd immunity protects unvaccinated people only against pathogens transmitted from person to person; it offers no protection against environmentally acquired infections such as tetanus."}, {"qid": "17-5", "topic": "Adjuvants and why live vaccines need little", "stem": "<p>Researchers immunize three groups of mice against a viral surface protein. Group 1 receives the purified recombinant protein in saline. Group 2 receives the same protein adsorbed to aluminum salts. Group 3 receives a live attenuated strain of the virus that makes the protein, with no additive. Serum antibody to the protein is measured 4 weeks later.<\/p><table class=\"labs\"><tr><th>Group<\/th><th>Antibody to the protein<\/th><\/tr><tr><td>1. Protein alone<\/td><td>Barely detectable<\/td><\/tr><tr><td>2. Protein with aluminum salts<\/td><td>High<\/td><\/tr><tr><td>3. Live attenuated virus<\/td><td>High<\/td><\/tr><\/table>", "lead": "Which property of the live attenuated virus best explains why it worked well without an additive?", "choices": ["Its antigen binds B cell receptors without needing processing", "Its antigen escapes neutralization by preexisting serum antibody", "Its replication supplies innate signals that activate APCs", "Its antigen stimulates B cells without help from CD4 T cells", "Its antigen is held in a slow-release depot at the injection site"], "answer": 2, "explanation": "<p>A purified protein is only an antigen. On its own it gives innate immune cells no sign of danger, so dendritic cells are not strongly activated and the adaptive response is weak, as in group 1. Adjuvants such as aluminum salts (alum) supply what is missing: they cause low-grade local inflammation (possibly through the NLRP3 inflammasome) and may hold the antigen at the site and release it slowly.<\/p><p>A live attenuated virus still replicates, at a low rate, and so it resembles a real infection. Its nucleic acids and replication products are pathogen-associated patterns that activate antigen-presenting cells (APCs) through innate receptors, which provides the same push an adjuvant gives. That is why most live attenuated vaccines need little or no adjuvant.<\/p>", "why_wrong": ["Protein antigens are recognized by B cell receptors in their native form in all three groups; this does not explain the difference.", "These mice had no preexisting antibody, so escape from neutralization is irrelevant here.", "Correct: a replicating virus supplies its own innate activating signals, doing the job an adjuvant does for a purified protein.", "Protein antigens in every group are T-dependent; live vaccines also rely on CD4 T cell help.", "A depot effect is one proposed action of alum, the additive in group 2, not a feature of a live virus."], "objective": "Adjuvants supply the innate activation that purified antigens lack; live attenuated vaccines replicate and provide their own innate signals, so they need little or no adjuvant."}, {"qid": "17-6", "topic": "Preexisting antibody blocks live attenuated vaccines", "stem": "<p>During a measles outbreak, a study compares two groups of healthy infants who receive the same live attenuated measles vaccine. Group 1 is vaccinated at 6 months of age and group 2 at 12 months. Before vaccination, measles IgG is measured in each infant's blood; none have had measles or a prior dose.<\/p><table class=\"labs\"><tr><th>Group<\/th><th>Measles IgG before vaccination<\/th><th>New measles antibody response<\/th><\/tr><tr><td>6 months<\/td><td>Detectable in most<\/td><td>Often absent<\/td><\/tr><tr><td>12 months<\/td><td>Undetectable in most<\/td><td>Present in nearly all<\/td><\/tr><\/table>", "lead": "Which mechanism best explains the poor response in the 6-month-old infants?", "choices": ["Infant B cells cannot yet respond to viral proteins", "Breast milk IgA destroyed the virus in the infant gut", "Maternal IgG neutralized the vaccine virus on arrival", "The vaccine virus reverted to a more virulent strain", "Infant dendritic cells cannot present viral peptides"], "answer": 2, "explanation": "<p>The measles IgG detected in infants who were never infected or vaccinated is maternal IgG that crossed the placenta. It wanes over the first year of life, which is why most 12-month-olds no longer have it. A live attenuated vaccine works only if the weakened virus can replicate in the host; replication is what produces enough antigen and innate signals for a strong response.<\/p><p>Circulating neutralizing antibody binds the injected vaccine virus and stops it from infecting cells, so it never replicates and the infant mounts little response of their own. The same problem applies after a dose of IVIG (intravenous immunoglobulin). Inactivated and subunit vaccines do not depend on replication, so they are much less affected by preexisting antibody.<\/p>", "why_wrong": ["Infants respond well to protein antigens; the defect of early infancy is the response to pure polysaccharides.", "Measles vaccine is injected, not given by mouth, and the antibody that was measured is IgG in blood.", "Correct: placental maternal IgG neutralizes the attenuated virus so it cannot replicate, and the infant's own response fails.", "Reversion is a problem of oral polio vaccine, and it would cause disease rather than a missing antibody response.", "Infant dendritic cells present peptides; the table points to preexisting antibody as the variable."], "objective": "Preexisting antibody (maternal IgG or IVIG) neutralizes live attenuated vaccine viruses before they replicate, which blunts the response; this is why live measles vaccine is timed after maternal antibody wanes."}, {"qid": "17-7", "topic": "Vaccine-associated paralytic polio", "stem": "<p>In a region that uses oral vaccines, a 28-year-old man who never received any polio vaccine develops fever, then sudden weakness of the left leg with absent reflexes. Sensation is normal. Two months earlier he began caring for his infant nephew, including changing diapers, shortly after the infant received a routine vaccine by mouth. Poliovirus is cultured from the man's stool, and sequencing shows it is closely related to a vaccine strain but carries mutations that restore neurovirulence.<\/p>", "lead": "Use of which of the following for the infant would have prevented the man's illness?", "choices": ["Oral polio vaccine given at a later age", "Oral polio vaccine given with an adjuvant", "Two oral polio doses given one month apart", "Oral polio vaccine given with immune globulin", "Inactivated polio vaccine given by injection"], "answer": 4, "explanation": "<p>The man has paralytic polio caused by a vaccine-derived virus. Oral polio vaccine (OPV) is live attenuated: the weakened virus replicates in the infant's gut and is shed in stool for weeks. During that replication it can mutate back toward a neurovirulent form, and an unvaccinated contact who is exposed to the shed virus can develop vaccine-associated paralytic polio (VAPP), about 1 case per 2 million doses.<\/p><p>The only way to remove that risk is to use a vaccine with nothing that can replicate. Inactivated polio vaccine (IPV) contains whole killed virus, so it cannot be shed, revert or infect a contact. OPV is still used in some regions because it is cheap, easy to give and produces mucosal immunity, but any form of OPV carries the reversion risk.<\/p>", "why_wrong": ["Changing the age of the infant does not change the fact that the live virus replicates, mutates and is shed.", "An adjuvant would not stop the live virus from replicating and reverting in the gut.", "More doses of the live vaccine mean more replication and shedding, not less.", "Immune globulin given with the vaccine would blunt the infant's response and would not protect the unvaccinated contact.", "Correct: inactivated polio vaccine contains killed virus that cannot replicate, revert or be shed, so contacts are not exposed."], "objective": "Oral polio vaccine is live attenuated and can revert to neurovirulence while it replicates and is shed, causing vaccine-associated paralytic polio in contacts; inactivated polio vaccine cannot."}, {"qid": "17-8", "topic": "Influenza antigenic shift versus drift", "stem": "<p>Surveillance laboratories detect a new influenza A strain spreading rapidly across several continents within weeks. Its hemagglutinin and neuraminidase genes come from a bird influenza virus, while its other genes come from a human strain; the two parent viruses appear to have infected the same pig. Attack rates are high in every age group, including adults who received the current seasonal vaccine. Serum from blood donors collected the year before shows almost no antibody that binds the new hemagglutinin.<\/p>", "lead": "Which process best explains the emergence and behavior of this strain?", "choices": ["Point mutations in hemagglutinin selected by immune pressure", "Reassortment of gene segments between distant viruses", "Reversion of a live attenuated vaccine strain to virulence", "Serotype replacement after a vaccine removed common strains", "Waning of antibody made after an acellular vaccine series"], "answer": 1, "explanation": "<p>Influenza changes in two ways. Antigenic drift is the gradual build-up of point mutations in hemagglutinin and neuraminidase, selected by immune pressure in the human population; it produces the slightly different seasonal strains that require a new vaccine every year, but most people keep partial immunity. Antigenic shift is a sudden swap of whole gene segments when two very different viruses infect the same host, often in an animal reservoir such as pigs or birds.<\/p><p>This strain carries surface genes from a bird virus, came out of co-infection of a pig, and is met by almost no preexisting antibody. That is shift. Because nobody has immunity to the new surface proteins, it spreads quickly through all ages and can cause a pandemic, and the seasonal vaccine does not protect.<\/p>", "why_wrong": ["Point mutations are antigenic drift, which yields seasonal variants against which much of the population keeps partial immunity.", "Correct: reassortment of gene segments between distant viruses in a co-infected host is antigenic shift, which produces a strain with almost no preexisting immunity.", "Reversion of an attenuated strain is the mechanism of vaccine-associated paralytic polio, not of a new pandemic influenza.", "Serotype replacement describes pneumococcal serotypes not covered by conjugate vaccines filling the niche.", "Waning immunity after an acellular vaccine explains rising pertussis, not a new influenza strain."], "table": "<table><tr><th><\/th><th>Antigenic drift<\/th><th>Antigenic shift<\/th><\/tr><tr><td>Mechanism<\/td><td>Point mutations under immune pressure<\/td><td>Reassortment between distant viruses in one host<\/td><\/tr><tr><td>Preexisting immunity<\/td><td>Partial<\/td><td>Very low<\/td><\/tr><tr><td>Result<\/td><td>Seasonal epidemics, new vaccine yearly<\/td><td>Pandemics, new type of vaccine needed<\/td><\/tr><\/table>", "objective": "Antigenic shift (reassortment of segments from distant viruses co-infecting one host) creates strains with almost no preexisting immunity and causes pandemics; antigenic drift creates seasonal variants."}, {"qid": "17-9", "topic": "Waning acellular pertussis immunity and the adolescent booster", "stem": "<p>A county health department reviews a decade of whooping cough cases after it switched infant vaccination from a whole-cell pertussis vaccine to an acellular one made of a few purified pertussis proteins. Cases rose steadily. Most occurred in children and teenagers aged 9 to 16 who had completed the full infant series on schedule. Many of the youngest patients were infants under 2 months, too young to have been vaccinated, and in most of these the source was an older sibling with a lingering cough.<\/p>", "lead": "Which public health measure most directly addresses the cause of this pattern?", "choices": ["Returning to an oral live attenuated pertussis vaccine", "Adding an adjuvant to the infant series to replace alum", "Delaying the infant series until maternal antibody wanes", "Giving a pertussis booster to children aged 10 to 18", "Switching the infant series to a pure polysaccharide vaccine"], "answer": 3, "explanation": "<p>Cases are concentrated in fully vaccinated older children, which points to immunity that faded after the infant series rather than to children who were never vaccinated. That fits the acellular pertussis (aP) vaccine: protection wanes about 5 years after vaccination, and the vaccine may not fully block transmission. School-age children and teenagers therefore become a reservoir, and they pass the infection to infants who are too young to be protected.<\/p><p>The response that matches this cause is to restore immunity in the group that lost it. That is why a Tdap booster (tetanus toxoid, reduced diphtheria toxoid, acellular pertussis) was recommended for ages 10 to 18 in 2005. Boosting the older children protects them and also cuts transmission to young infants.<\/p>", "why_wrong": ["There is no oral live attenuated pertussis vaccine in use; the problem is waning immunity, not the vaccine route.", "The infant series already produces protection; the issue is that protection fades years later.", "Delaying the infant series would leave young infants unprotected longer and would not fix waning in teenagers.", "Correct: a booster in the age group whose immunity waned (the Tdap booster at ages 10 to 18) restores protection and reduces spread to infants.", "Pertussis antigens in the vaccine are proteins (toxoid and adhesins); a polysaccharide vaccine would give a weaker T-independent response."], "objective": "Immunity after acellular pertussis vaccine wanes within about 5 years and may not block transmission, so older children become a reservoir; the adolescent Tdap booster addresses this."}, {"qid": "17-10", "topic": "Vaccine excipients and anaphylaxis", "stem": "<p>A 7-year-old boy develops hives, lip swelling and wheezing 5 minutes after receiving an injected influenza vaccine. Blood pressure is 78/40 mm Hg. He improves after intramuscular epinephrine. He has had two prior episodes of throat swelling after eating scrambled eggs. He has received all of his other routine vaccines without any reaction. The vaccine he received is an inactivated vaccine grown in chicken eggs.<\/p>", "lead": "Which vaccine component most likely caused this reaction?", "choices": ["Residual egg protein carried over from vaccine production", "Aluminum salt adjuvant adsorbed to the viral antigens", "Replicating vaccine virus spreading from the injection site", "Influenza antigen forming immune complexes with prior IgG", "Thimerosal preservative added to the multidose vial"], "answer": 0, "explanation": "<p>Hives, angioedema, wheezing and low blood pressure within minutes of exposure is anaphylaxis, an IgE-mediated immediate reaction. He already has IgE to egg proteins, shown by his reactions to eggs. Besides antigen and adjuvant, vaccines contain excipients: molecules carried over from production, such as egg proteins from viruses grown in eggs, antibiotics, or latex from vial caps. Some are antigenic or allergenic.<\/p><p>The best explanation is that egg protein left over in the vaccine bound his preexisting egg-specific IgE on mast cells. Anaphylaxis to a vaccine component is the primary contraindication to vaccination with that product. An inactivated vaccine contains no live virus, so active infection is not a possibility here.<\/p>", "why_wrong": ["Correct: carried-over egg protein is an excipient that can trigger IgE-mediated anaphylaxis in a child already sensitized to egg.", "Alum mainly causes local inflammation at the injection site, and he tolerated other alum-containing vaccines.", "This is an inactivated vaccine, so there is no replicating virus.", "Immune complexes cause an Arthus reaction, a local reaction that develops over hours, not anaphylaxis within minutes.", "Thimerosal has been removed from most vaccines and is not the link to his known egg allergy."], "objective": "Excipients carried over from vaccine production (egg proteins, antibiotics, latex) can cause IgE-mediated anaphylaxis, which is the main contraindication to giving that vaccine."}]}, {"id": "18", "title": "Immunodeficiencies", "week": 3, "subject": "Immunology", "questions": [{"qid": "18-1", "topic": "Leukocyte adhesion deficiency", "stem": "<p>A 3-week-old boy is brought in because his umbilical cord stump is still attached and the skin around it is red and swollen, with no pus. He also has a deep perianal skin infection that has not formed an abscess. Temperature is 38.4 °C.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal for age<\/th><\/tr><tr><td>Leukocytes<\/td><td>48,000/uL<\/td><td>5,000 to 19,500/uL<\/td><\/tr><tr><td>Neutrophils<\/td><td>82%<\/td><td>20 to 50%<\/td><\/tr><tr><td>Hemoglobin<\/td><td>13.5 g/dL<\/td><td>10 to 18 g/dL<\/td><\/tr><\/table><p>A skin biopsy from the infected area shows many neutrophils inside small blood vessels but very few in the surrounding tissue.<\/p>", "lead": "Which step of the neutrophil response is most likely defective?", "choices": ["Integrin-mediated firm adhesion to the vessel wall", "Production of reactive oxygen species after ingestion", "Release of new neutrophils from the bone marrow", "Fusion of granules with phagosomes after ingestion", "Coating of bacteria with complement C3b fragments"], "answer": 0, "explanation": "<p>Delayed separation of the umbilical cord, infections without pus, and a very high blood neutrophil count are the classic picture of leukocyte adhesion deficiency type 1 (LAD-1). The biopsy shows the problem directly: neutrophils are plentiful, but they stay in the blood vessels instead of entering the infected tissue.<\/p><p>To leave a vessel, a neutrophil rolls on selectins, is activated by chemokines, and then firmly adheres through beta-2 integrins such as LFA-1 before squeezing between endothelial cells. LAD-1 is a defect in CD18, the shared beta-2 integrin chain, so firm adhesion and extravasation fail. Neutrophils accumulate in the blood (leukocytosis), no pus forms because few cells reach the site, and bacterial and fungal infections of the skin and mucosa recur.<\/p>", "why_wrong": ["Correct: CD18 (beta-2 integrin) deficiency prevents firm adhesion and extravasation, trapping neutrophils in the blood and leaving infections without pus.", "Failed oxidative burst is chronic granulomatous disease, in which neutrophils reach the site and form granulomas and abscesses.", "Marrow release is intact; the blood is full of neutrophils.", "Defective granule fusion is Chediak-Higashi syndrome, which brings partial albinism and neurological problems, not delayed cord separation.", "Complement deficiencies impair opsonization or killing, but they do not keep neutrophils out of tissue or cause extreme leukocytosis."], "objective": "Leukocyte adhesion deficiency type 1 (CD18 beta-2 integrin defect) blocks firm adhesion and extravasation, causing delayed umbilical cord separation, infections without pus and marked neutrophilia.", "table": "<table class=\"\"><tr><th>Phagocyte defect<\/th><th>Step that fails<\/th><th>Clues<\/th><\/tr><tr><td>LAD-1 (CD18)<\/td><td>Firm adhesion, extravasation<\/td><td>Delayed cord separation, no pus, leukocytosis<\/td><\/tr><tr><td>Chronic granulomatous disease (NADPH oxidase)<\/td><td>Oxidative burst<\/td><td>Abscesses, granulomas, catalase-positive organisms<\/td><\/tr><tr><td>Chediak-Higashi (LYST)<\/td><td>Granule trafficking<\/td><td>Partial albinism, neurologic signs, NK and CTL defect<\/td><\/tr><\/table>"}, {"qid": "18-2", "topic": "Newborn screening with the TREC assay", "stem": "<p>A healthy-appearing boy born at term has routine newborn bloodspot screening on day 2 of life. The panel includes a polymerase chain reaction (PCR) assay for T cell receptor excision circles (TRECs). His TREC result is below the detection limit, and a repeat sample a week later gives the same result. A control gene in both samples amplifies normally, so the DNA in the sample is adequate.<\/p>", "lead": "This result most directly indicates which of the following?", "choices": ["Absent B cells, as in X-linked agammaglobulinemia", "A late complement defect that predisposes to Neisseria", "Few newly made T cells, as in severe combined immunodeficiency", "Absent oxidative burst, as in chronic granulomatous disease", "T cells that are present but cannot polarize their actin"], "answer": 2, "explanation": "<p>When a developing T cell rearranges its receptor genes in the thymus, the stretch of DNA between the joined segments is cut out and closed into a small circle, a T cell receptor excision circle. TRECs are not copied when the cell divides, so they are found mainly in T cells that have only recently completed rearrangement and left the thymus. The number of TRECs in a blood spot is therefore a measure of how many new T cells the thymus is producing.<\/p><p>Undetectable TRECs with adequate DNA mean the infant is making few or no new T cells, which is the defining feature of severe combined immunodeficiency (SCID) of any genetic type, and also of severe thymic defects. That is why the assay has been part of nationwide newborn screening since 2018: it identifies these infants before the first infections, when hematopoietic stem cell transplant or gene therapy works best.<\/p>", "why_wrong": ["TRECs come from T cell receptor rearrangement; an isolated B cell defect leaves TRECs normal.", "Complement deficiencies do not affect T cell receptor rearrangement and are not detected by this assay.", "Correct: TRECs mark recently made T cells, so their absence means the thymus is producing almost no new T cells, the hallmark of SCID.", "Chronic granulomatous disease is tested with the nitroblue tetrazolium or dihydrorhodamine flow test of neutrophils, not by TRECs.", "A cytoskeletal defect such as Wiskott-Aldrich syndrome affects T cell function after rearrangement, so TREC production is not absent."], "objective": "The TREC assay counts DNA circles excised during T cell receptor rearrangement, which mark newly made T cells, so undetectable TRECs on newborn screening indicate severe combined immunodeficiency before infections begin."}, {"qid": "18-3", "topic": "Onset of predominantly antibody deficiencies", "stem": "<p>A 10-month-old boy has had pneumococcal pneumonia, two episodes of otitis media with Haemophilus influenzae and one episode of bacterial sepsis, all since age 6 months. He was well before then and has been bottle-fed since birth. Common colds have resolved normally. His tonsils are barely visible and no lymph nodes are palpable. His maternal uncle died of sepsis at age 2.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal for age<\/th><\/tr><tr><td>IgG<\/td><td>60 mg/dL<\/td><td>300 to 1,200 mg/dL<\/td><\/tr><tr><td>IgM<\/td><td>less than 10 mg/dL<\/td><td>30 to 120 mg/dL<\/td><\/tr><tr><td>IgA<\/td><td>less than 7 mg/dL<\/td><td>10 to 80 mg/dL<\/td><\/tr><tr><td>CD19-positive B cells<\/td><td>less than 1% of lymphocytes<\/td><td>15 to 30%<\/td><\/tr><tr><td>CD3-positive T cells<\/td><td>Normal<\/td><td><\/td><\/tr><\/table>", "lead": "Which best explains why his infections began at about 6 months of age?", "choices": ["B cell development stops at 6 months in affected boys", "Breast milk IgA protected him until he was weaned", "Maternal T cells were cleared from his blood by 6 months", "Maternal IgG that crossed the placenta had largely decayed", "His thymus involuted and stopped making helper T cells"], "answer": 3, "explanation": "<p>Absent B cells, very low levels of every immunoglobulin, small tonsils and lymph nodes, normal T cells, recurrent infections with encapsulated bacteria, and an affected maternal uncle identify X-linked (Bruton) agammaglobulinemia. A defect in Bruton tyrosine kinase (BTK) blocks pre-B cell receptor signaling, so B cells never mature. Normal T cells explain why ordinary viral colds resolve.<\/p><p>The question is why a boy who never makes antibody was well for 6 months. During pregnancy, maternal IgG is actively transported across the placenta, so a newborn starts life with its mother's antibodies. That borrowed IgG decays over the first months, and by about 4 to 8 months there is too little left to protect him. Antibody deficiencies therefore typically present after this window, whereas severe T cell defects such as severe combined immunodeficiency show up in the first weeks.<\/p>", "why_wrong": ["B cell development is blocked from before birth in X-linked agammaglobulinemia; it does not stop at a particular age.", "Milk IgA protects only mucosal surfaces, and he was bottle-fed from birth.", "Maternal T cells are not what protects infants from encapsulated bacteria; antibody is.", "Correct: transplacental maternal IgG protects the infant for the first months, so antibody deficiencies appear once it wanes at about 6 months.", "His T cells are normal, and the thymus does not involute in infancy."], "objective": "Predominantly antibody deficiencies such as X-linked agammaglobulinemia typically present at 6 to 8 months, when maternal IgG transferred across the placenta has decayed, with recurrent encapsulated bacterial infections.", "table": "<table class=\"\"><tr><th>Feature<\/th><th>Predominantly antibody deficiency<\/th><th>Combined (SCID-type) deficiency<\/th><\/tr><tr><td>Typical onset<\/td><td>6 to 8 months<\/td><td>Days to weeks<\/td><\/tr><tr><td>Pathogens<\/td><td>Encapsulated bacteria (pneumococcus, H. influenzae)<\/td><td>Bacteria, viruses, fungi, opportunists<\/td><\/tr><tr><td>Examples<\/td><td>XLA, CVID, IgA deficiency, HIGM2<\/td><td>SCIDs, HIGM1 and 3, BLS<\/td><\/tr><\/table>"}, {"qid": "18-4", "topic": "X-linked SCID and the common gamma chain", "stem": "<p>A 4-month-old boy has had oral thrush since 6 weeks of age that returns after every course of treatment, along with persistent watery diarrhea and poor weight gain. He now has a cough and fast breathing. No tonsils or lymph nodes can be felt. His mother's brother died of infection in infancy. Blood lymphocyte subsets are measured.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal for age<\/th><\/tr><tr><td>CD3+ T cells<\/td><td>40/uL<\/td><td>2,500 to 5,500/uL<\/td><\/tr><tr><td>CD19+ B cells<\/td><td>1,100/uL<\/td><td>300 to 2,000/uL<\/td><\/tr><tr><td>CD16/56+ NK cells<\/td><td>less than 10/uL<\/td><td>170 to 1,100/uL<\/td><\/tr><tr><td>IgG<\/td><td>90 mg/dL<\/td><td>200 to 700 mg/dL<\/td><\/tr><\/table>", "lead": "A loss-of-function mutation in which gene would produce this same pattern of lymphocyte counts in a girl?", "choices": ["RAG1", "ADA", "JAK3", "CIITA", "BTK"], "answer": 2, "explanation": "<p>Severe infections from early infancy with Candida, diarrhea, failure to thrive and absent lymphoid tissue point to severe combined immunodeficiency (SCID). The subset pattern is T cells absent, B cells present, NK cells absent (T-B+NK-), and the affected maternal uncle suggests X-linked inheritance. That is X-linked SCID, caused by loss of the common gamma chain, a subunit shared by the receptors for IL-2, IL-4, IL-7 and IL-15. Without IL-7 signaling T cells do not develop, and without IL-15 signaling NK cells do not develop; B cells are made but cannot get T cell help, so immunoglobulin is low.<\/p><p>The common gamma chain signals through the kinase JAK3, which binds it inside the cell. Loss of JAK3 therefore blocks the same cytokine receptors and gives the same T-B+NK- picture, but JAK3 is autosomal recessive, so it can occur in a girl.<\/p>", "why_wrong": ["RAG1 loss blocks V(D)J recombination in both T and B cells but spares NK cells (T-B-NK+).", "ADA deficiency lets toxic metabolites kill all developing lymphocytes (T-B-NK-).", "Correct: JAK3 transmits the common gamma chain signal, so its autosomal recessive loss reproduces the T-B+NK- pattern in either sex.", "CIITA loss removes MHC class II and lowers CD4 T cells, but B and NK cells develop normally and CD8 T cells remain.", "BTK loss blocks B cell development and spares T and NK cells, the opposite of this pattern."], "table": "<table><tr><th>SCID defect<\/th><th>T<\/th><th>B<\/th><th>NK<\/th><th>Inheritance<\/th><\/tr><tr><td>Common gamma chain<\/td><td>Absent<\/td><td>Present<\/td><td>Absent<\/td><td>X-linked<\/td><\/tr><tr><td>JAK3<\/td><td>Absent<\/td><td>Present<\/td><td>Absent<\/td><td>Autosomal recessive<\/td><\/tr><tr><td>RAG1/2, DNA repair<\/td><td>Absent<\/td><td>Absent<\/td><td>Present<\/td><td>Autosomal recessive<\/td><\/tr><tr><td>ADA<\/td><td>Absent<\/td><td>Absent<\/td><td>Absent<\/td><td>Autosomal recessive<\/td><\/tr><tr><td>IL-7 receptor, CD3<\/td><td>Absent<\/td><td>Present<\/td><td>Present<\/td><td>Autosomal recessive<\/td><\/tr><\/table>", "objective": "X-linked SCID (common gamma chain loss) blocks IL-7 and IL-15 signaling, giving a T-B+NK- pattern; JAK3 deficiency, which disrupts the same receptors, gives the same pattern with autosomal recessive inheritance."}, {"qid": "18-5", "topic": "Bare lymphocyte syndrome type 2", "stem": "<p>A 3-year-old girl has had four bacterial pneumonias, chronic diarrhea and recurrent oral candidiasis. Her parents are first cousins. Flow cytometry of her blood shows the following, and her B cells and monocytes show no staining with an antibody to HLA-DR, while a healthy control's cells stain brightly.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal for age<\/th><\/tr><tr><td>CD4+ T cells<\/td><td>110/uL<\/td><td>700 to 2,000/uL<\/td><\/tr><tr><td>CD8+ T cells<\/td><td>650/uL<\/td><td>500 to 1,400/uL<\/td><\/tr><tr><td>CD19+ B cells<\/td><td>700/uL<\/td><td>300 to 1,000/uL<\/td><\/tr><tr><td>IgG<\/td><td>210 mg/dL<\/td><td>500 to 1,300 mg/dL<\/td><\/tr><\/table>", "lead": "Which best explains her low CD4 T cell count?", "choices": ["Failed negative selection of thymocytes on self peptides", "Failed signaling through the common gamma chain receptor", "Failed loading of peptides onto MHC class I molecules", "Failed costimulation of T cells through CD40 ligand", "Failed positive selection of thymocytes on MHC class II"], "answer": 4, "explanation": "<p>HLA-DR is an MHC class II molecule, and its absence from B cells and monocytes, which normally express it strongly, means she does not express MHC class II. This is bare lymphocyte syndrome type 2 (BLS-2), usually caused by mutations in CIITA, the transcription factor that switches on the MHC class II genes; it is autosomal recessive, which fits her consanguineous parents.<\/p><p>Developing thymocytes become CD4 T cells only if their receptor engages MHC class II on thymic epithelium during positive selection. Without class II, few CD4 T cells are made, while CD8 T cells, selected on class I, are normal. Losing CD4 help explains her bacterial, fungal and gastrointestinal infections and the low IgG. BLS-2 is more severe than BLS-1, in which MHC class I assembly fails and CD8 T cells are low.<\/p>", "why_wrong": ["Failed negative selection would let self-reactive T cells escape and cause autoimmunity, not a low CD4 count.", "Common gamma chain loss removes nearly all T cells and NK cells, not CD4 cells selectively.", "Failed class I loading is BLS-1, which lowers CD8 T cells, not CD4 T cells.", "CD40 ligand loss causes hyper-IgM syndrome type 1 with normal CD4 counts and normal HLA-DR.", "Correct: without MHC class II (CIITA defect), thymocytes cannot be positively selected into the CD4 lineage."], "objective": "Bare lymphocyte syndrome type 2 (CIITA defect) removes MHC class II, so CD4 T cells fail positive selection; it is more severe than BLS-1, the MHC class I defect that lowers CD8 T cells."}, {"qid": "18-6", "topic": "Hyper-IgM type 1 versus type 2", "stem": "<p>Two unrelated children have the same immunoglobulin pattern.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Child 1 (boy)<\/th><th>Child 2 (girl)<\/th><th>Normal<\/th><\/tr><tr><td>IgM<\/td><td>310 mg/dL<\/td><td>290 mg/dL<\/td><td>40 to 180 mg/dL<\/td><\/tr><tr><td>IgG<\/td><td>80 mg/dL<\/td><td>95 mg/dL<\/td><td>500 to 1,300 mg/dL<\/td><\/tr><tr><td>IgA<\/td><td>less than 7 mg/dL<\/td><td>less than 7 mg/dL<\/td><td>40 to 200 mg/dL<\/td><\/tr><\/table><p>Child 1 has had Pneumocystis jirovecii pneumonia and months of Cryptosporidium diarrhea; a maternal uncle had the same illness, and his lymph nodes are small. Child 2 has had only recurrent bacterial sinusitis and otitis, and she has large lymph nodes with very enlarged germinal centers.<\/p>", "lead": "Which best explains why only child 1 has opportunistic infections?", "choices": ["His B cells cannot rearrange the heavy chain V region", "His missing protein also lets T cells activate macrophages", "His B cells cannot signal through the B cell receptor", "His missing protein is needed only for class switching in B cells", "His T cells cannot make the cytokine interferon-gamma"], "answer": 1, "explanation": "<p>Normal or high IgM with low IgG, IgA and IgE means class switching has failed. Child 1 is a boy with an affected maternal uncle and no germinal centers, which fits hyper-IgM syndrome type 1 (HIGM1): X-linked loss of CD40 ligand on helper T cells. Child 2 is a girl with huge germinal centers, which fits HIGM2: autosomal recessive loss of AID, the B cell enzyme needed for class switching and somatic hypermutation.<\/p><p>AID works only inside B cells, so HIGM2 is a pure antibody deficiency with mostly bacterial infections. CD40 ligand, by contrast, is how helper T cells signal not only to B cells but also to dendritic cells and macrophages (CD40 on these cells). Without it, macrophage activation and cell-mediated defenses are weak, so HIGM1 (and HIGM3, CD40 deficiency) behaves as a combined immunodeficiency, with Pneumocystis and Cryptosporidium infections.<\/p>", "why_wrong": ["Heavy chain V region rearrangement is intact in both, since both make plenty of IgM.", "Correct: CD40 ligand also drives T cell activation of macrophages and dendritic cells, so its loss (HIGM1) is a combined defect with opportunistic infections.", "Defective B cell receptor signaling (BTK) blocks B cell development and gives absent IgM, not high IgM.", "A protein needed only for class switching describes AID, the defect in child 2, which causes mainly bacterial infections.", "Loss of interferon-gamma signaling gives mycobacterial disease with normal immunoglobulins, not a hyper-IgM pattern."], "table": "<table><tr><th><\/th><th>HIGM1<\/th><th>HIGM3<\/th><th>HIGM2<\/th><\/tr><tr><td>Defect<\/td><td>CD40 ligand (T cell)<\/td><td>CD40 (B cell, APC)<\/td><td>AID (B cell)<\/td><\/tr><tr><td>Inheritance<\/td><td>X-linked<\/td><td>AR<\/td><td>AR<\/td><\/tr><tr><td>Type of deficiency<\/td><td>Combined<\/td><td>Combined<\/td><td>Antibody only<\/td><\/tr><tr><td>Infections<\/td><td>Bacterial, fungal, opportunistic<\/td><td>Bacterial, fungal, opportunistic<\/td><td>Mostly bacterial, sinopulmonary<\/td><\/tr><tr><td>Germinal centers<\/td><td>Absent<\/td><td>Absent<\/td><td>Hyperplastic<\/td><\/tr><\/table>", "objective": "HIGM1 (CD40 ligand) and HIGM3 (CD40) are combined immunodeficiencies with opportunistic infections because CD40 signaling also activates macrophages and dendritic cells; HIGM2 (AID) is a B cell defect with mainly bacterial infections."}, {"qid": "18-7", "topic": "Hyper-IgM type 2 (AID deficiency)", "stem": "<p>An 8-year-old girl has had recurrent bacterial sinusitis and pneumonia since age 2. Serum IgM is high and IgG and IgA are very low. Her T cells express CD40 ligand normally when activated. In the laboratory, her purified B cells are cultured with CD40 ligand and IL-4, a combination that drives healthy B cells to secrete IgE and IgG. Her B cells proliferate normally and secrete IgM, but they make no IgE or IgG. Sequencing her antibody genes also shows almost no mutations in the variable regions.<\/p>", "lead": "Which other function is most likely missing in her B cells?", "choices": ["Affinity maturation of antibody in germinal centers", "Assembly of the pre-B cell receptor in the marrow", "Presentation of peptide antigen on MHC class II", "Recombination of V, D and J gene segments in the marrow", "Response to T-independent polysaccharide antigens"], "answer": 0, "explanation": "<p>Her T cells provide CD40 ligand normally, yet her own B cells, given the right signals in a dish, still cannot switch isotype. The defect is therefore inside the B cell, after CD40 signaling. Her antibody genes also lack the usual mutations in the variable regions. Both findings point to AID (activation-induced cytidine deaminase), the enzyme that creates the DNA changes needed for both class switch recombination and somatic hypermutation. Its loss is hyper-IgM syndrome type 2 (HIGM2), autosomal recessive.<\/p><p>Somatic hypermutation followed by selection of the best binders in the germinal center is affinity maturation, so it fails too. Because the germinal center reaction keeps going without producing high-affinity, switched B cells, patients typically have enlarged lymph nodes with hyperplastic germinal centers.<\/p>", "why_wrong": ["Correct: AID is also required for somatic hypermutation, so affinity maturation in germinal centers fails along with class switching.", "Pre-B cell receptor assembly occurs early in the marrow and is intact; she has normal B cells that make IgM.", "MHC class II presentation does not depend on AID and is not tested by this experiment.", "V(D)J recombination uses RAG enzymes, not AID, and is intact because she makes IgM.", "T-independent responses are mostly IgM, which needs no AID, so her IgM responses to polysaccharides remain."], "objective": "AID deficiency (HIGM2) abolishes both class switch recombination and somatic hypermutation, so affinity maturation fails; germinal centers become hyperplastic."}, {"qid": "18-8", "topic": "Wiskott-Aldrich syndrome", "stem": "<p>A 14-month-old boy has had itchy eczema on his face and limbs since 3 months of age and three episodes of otitis media with pneumococcus. His mother noticed tiny red-purple spots on his legs and easy bruising. Two of her brothers died in childhood of bleeding and infection.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal<\/th><\/tr><tr><td>Platelets<\/td><td>28,000/uL<\/td><td>150,000 to 400,000/uL<\/td><\/tr><tr><td>Mean platelet volume<\/td><td>5.1 fL (small)<\/td><td>7.5 to 11.5 fL<\/td><\/tr><tr><td>Hemoglobin<\/td><td>11.8 g/dL<\/td><td>10.5 to 13.5 g/dL<\/td><\/tr><tr><td>Leukocytes<\/td><td>8,900/uL<\/td><td>6,000 to 17,500/uL<\/td><\/tr><\/table>", "lead": "The defective protein in this boy normally has which function in his leukocytes and platelets?", "choices": ["Producing superoxide inside the phagolysosome", "Switching on transcription of MHC class II genes", "Moving secretory granules along microtubules to the membrane", "Reorganizing the actin cytoskeleton after signaling", "Transmitting signals from the B cell receptor"], "answer": 3, "explanation": "<p>Eczema, recurrent bacterial infections and a low count of unusually small platelets in a boy with affected maternal uncles is Wiskott-Aldrich syndrome. It is X-linked and caused by mutations in WASP (the Wiskott-Aldrich syndrome protein), so it belongs with the combined immunodeficiencies that have syndromic features.<\/p><p>WASP links receptor signaling to reorganization of the actin cytoskeleton. Leukocytes need that to form immune synapses, migrate and be activated and regulated, so patients get bacterial, fungal and viral infections, allergy (eczema), autoimmunity and a higher risk of blood cancers. Platelets that lack WASP are small and few (microthrombocytopenia), which causes the petechiae and bruising.<\/p>", "why_wrong": ["Superoxide production is the NADPH oxidase, lost in chronic granulomatous disease, which causes abscesses and granulomas but normal platelets.", "MHC class II transcription is driven by CIITA, lost in bare lymphocyte syndrome type 2, which has no eczema or thrombocytopenia.", "Defective granule trafficking is Chediak-Higashi syndrome, with partial albinism and neurological signs rather than eczema and small platelets.", "Correct: WASP couples signaling to actin reorganization in leukocytes and platelets, explaining infections, eczema and small, few platelets.", "B cell receptor signaling depends on BTK, lost in X-linked agammaglobulinemia, which spares platelets and skin."], "objective": "Wiskott-Aldrich syndrome (X-linked WASP defect in actin cytoskeleton reorganization) presents with the triad of infections, eczema and microthrombocytopenia, plus autoimmunity and malignancy risk."}, {"qid": "18-9", "topic": "DiGeorge syndrome (22q11.2 deletion)", "stem": "<p>A 5-month-old girl had surgery in the newborn period for an outflow tract heart defect. During that operation the surgeon could not find thymic tissue. She has a small jaw, low-set ears and a history of low blood calcium with jitteriness in the first week of life. She now has her third episode of oral candidiasis. Genetic testing shows a small deletion on the long arm of chromosome 22.<\/p>", "lead": "Which pattern of blood lymphocytes is most likely in this patient?", "choices": ["Low B cells, normal T cells, normal NK cells", "Low T cells, normal B cells, normal NK cells", "Low T cells, low B cells, low NK cells", "Low CD8 T cells, normal CD4 T cells, normal B cells", "Normal T cells, normal B cells, low NK cells"], "answer": 1, "explanation": "<p>A conotruncal heart defect, facial differences, neonatal hypocalcemia from missing parathyroid glands, and absent thymus in a child with a 22q11.2 deletion is DiGeorge syndrome. The problem is development of the third and fourth pharyngeal pouches, which give rise to the thymus and parathyroid glands.<\/p><p>The lymphoid stem cells themselves are normal, but T cells need a thymus to mature, so T cells are reduced in proportion to how much thymus is missing; B cells and NK cells develop outside the thymus and are normal in number. The T cell deficit explains her recurrent fungal infection. The deficit is variable: most patients have partial thymic hypoplasia, and complete thymic aplasia behaves like SCID.<\/p>", "why_wrong": ["Low B cells with normal T cells is the pattern of X-linked agammaglobulinemia, a B cell development defect.", "Correct: absent thymic development lowers T cells while B and NK cells, which mature outside the thymus, stay normal.", "Loss of all three lineages is the pattern of ADA deficiency, a defect in the lymphocytes themselves.", "A selective CD8 deficit is bare lymphocyte syndrome type 1 (MHC class I), unrelated to thymic development.", "An isolated NK deficit does not fit; her thymic absence affects T cells."], "objective": "DiGeorge syndrome (22q11.2 deletion) disrupts third and fourth pharyngeal pouch development, causing thymic hypoplasia with low T cells but normal B and NK cells, plus hypocalcemia and conotruncal heart defects."}, {"qid": "18-10", "topic": "STAT3 hyper-IgE syndrome and Th17 failure", "stem": "<p>An 11-year-old boy has had eczema since infancy and recurrent Staphylococcus aureus skin abscesses and pneumonias; after one pneumonia, cysts formed in his lung. He has chronic Candida infection of his nails. Two of his baby teeth had to be pulled because the adult teeth could not erupt, and he fractured his forearm after a minor fall. His father had similar problems. Serum IgE is 6,200 IU/mL (normal less than 200), and IgG, IgA and IgM are normal.<\/p>", "lead": "His Staphylococcus and Candida infections are best explained by deficient production of which cytokine?", "choices": ["IL-4", "IL-5", "IL-10", "IL-2", "IL-17"], "answer": 4, "explanation": "<p>Eczema, very high IgE, recurrent staphylococcal abscesses and pneumonias that leave lung cysts (pneumatoceles), retained primary teeth, fractures after minor trauma and an affected father (autosomal dominant) is STAT3 hyper-IgE syndrome, also called Job's syndrome. STAT3 is the signaling molecule for several cytokine receptors, including the signals that make naive CD4 T cells become Th17 cells.<\/p><p>Without STAT3, Th17 differentiation fails and IL-17 is not made. IL-17 normally drives epithelial cells to produce chemokines that recruit neutrophils and antimicrobial peptides at the skin and mucosa, which is the main defense against Staphylococcus aureus and Candida. Loss of that pathway explains both infections, while the high IgE reflects disordered cytokine signaling, not protection.<\/p>", "why_wrong": ["IL-4 drives IgE class switching; his very high IgE shows this pathway is active, not deficient.", "IL-5 supports eosinophils; its loss would not explain staphylococcal and fungal infections of skin and lung.", "IL-10 is an anti-inflammatory cytokine; its loss causes excess inflammation rather than these infections.", "IL-2 drives T cell proliferation; its loss would cause a broad T cell defect, not this specific pattern.", "Correct: STAT3 is needed for Th17 differentiation, and missing IL-17 means poor neutrophil recruitment against Staphylococcus and Candida."], "objective": "STAT3 hyper-IgE (Job's) syndrome blocks Th17 differentiation, so loss of IL-17 leaves patients open to Staphylococcus and Candida, alongside eczema, high IgE and skeletal and dental abnormalities."}, {"qid": "18-11", "topic": "Common variable immunodeficiency", "stem": "<p>A 32-year-old woman has had five episodes of bacterial sinusitis and two pneumonias over the past 4 years; she was healthy as a child. Two years ago she was treated for autoimmune low platelets. She has never had an unusual infection. Three weeks after a tetanus toxoid booster and a pneumococcal polysaccharide vaccine, she shows almost no rise in antibody to either.<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal<\/th><\/tr><tr><td>IgG<\/td><td>240 mg/dL<\/td><td>700 to 1,600 mg/dL<\/td><\/tr><tr><td>IgA<\/td><td>12 mg/dL<\/td><td>70 to 400 mg/dL<\/td><\/tr><tr><td>IgM<\/td><td>30 mg/dL<\/td><td>40 to 230 mg/dL<\/td><\/tr><tr><td>CD19+ B cells<\/td><td>220/uL<\/td><td>100 to 500/uL<\/td><\/tr><tr><td>CD3+ T cells<\/td><td>1,400/uL<\/td><td>700 to 2,100/uL<\/td><\/tr><\/table>", "lead": "This patient is at increased risk for which of the following?", "choices": ["Recurrent Neisseria meningitis", "Disseminated mycobacterial infection", "Lymphoid malignancy", "Attacks of angioedema without hives", "Hypocalcemic seizures"], "answer": 2, "explanation": "<p>Recurrent sinopulmonary bacterial infections beginning in adulthood, low levels of two or more immunoglobulin isotypes (here IgG and IgA, with IgM also low), poor antibody responses to both protein and polysaccharide vaccines, and B cells that are present in normal numbers is common variable immunodeficiency (CVID). It is a heterogeneous group (some cases have known mutations such as ICOS) and is often diagnosed in adults.<\/p><p>CVID is more than an infection problem: patients also develop autoimmunity, like her autoimmune thrombocytopenia, and have an increased risk of lymphoid malignancies such as lymphoma. That separates it from milder isotype deficiencies such as IgA deficiency, which is the most common specific immunodeficiency and is often asymptomatic.<\/p>", "why_wrong": ["Recurrent Neisseria infection points to deficiency of C3, the late complement components or properdin.", "Disseminated mycobacterial infection points to a defect in the IL-12 and interferon-gamma axis.", "Correct: CVID carries an increased risk of lymphoid malignancy along with infections and autoimmunity.", "Angioedema without hives is hereditary angioedema from C1 inhibitor deficiency.", "Hypocalcemic seizures belong to DiGeorge syndrome, from missing parathyroid glands."], "table": "<table><tr><th><\/th><th>IgA deficiency<\/th><th>CVID<\/th><th>XLA<\/th><\/tr><tr><td>Low isotypes<\/td><td>IgA only<\/td><td>Two or more<\/td><td>All<\/td><\/tr><tr><td>B cells<\/td><td>Present<\/td><td>Usually present<\/td><td>Absent<\/td><\/tr><tr><td>Onset<\/td><td>Often asymptomatic<\/td><td>Often adulthood<\/td><td>4 to 8 months<\/td><\/tr><tr><td>Extras<\/td><td>Anaphylaxis to IgA-containing blood products<\/td><td>Autoimmunity, lymphoma<\/td><td>Severe encapsulated bacterial infections<\/td><\/tr><\/table>", "objective": "Common variable immunodeficiency (low levels of two or more isotypes, poor vaccine responses, B cells present, often adult onset) brings recurrent sinopulmonary infections plus autoimmunity and lymphoid malignancy."}, {"qid": "18-12", "topic": "IPEX and peripheral tolerance", "stem": "<p>A 7-month-old boy is admitted with severe watery diarrhea that has lasted 6 weeks and has not responded to dietary changes; stool cultures are negative. He has widespread eczema. Blood glucose is 410 mg/dL, and antibodies against pancreatic islet cells and thyroid tissue are present. Total IgE is markedly elevated. Lymphocyte counts are normal, and his thymus is present on imaging. A brother died at 10 months of age with a similar illness.<\/p>", "lead": "Loss of which cells' function best explains this illness?", "choices": ["Peripheral regulatory T cells", "Medullary thymic epithelial cells", "Natural killer cells in the blood", "Th17 cells at mucosal surfaces", "Cytotoxic CD8 T cells in tissues"], "answer": 0, "explanation": "<p>An infant boy with autoimmune enteropathy, early type 1 diabetes, autoantibodies to several organs, eczema and high IgE, with a similarly affected brother, has IPEX (immune dysregulation, polyendocrinopathy, enteropathy, X-linked). It is caused by mutations in FOXP3, the transcription factor that regulatory T cells (Tregs) need to develop and function, and onset is typically at 6 to 12 months.<\/p><p>Tregs are a main arm of peripheral tolerance: they suppress self-reactive T cells that escaped deletion in the thymus. Without them, autoreactive cells attack the gut, pancreas and thyroid, and allergic responses are unrestrained. This is a group 4 inborn error, a disease of immune dysregulation rather than of infection susceptibility.<\/p>", "why_wrong": ["Correct: FOXP3 loss removes functional regulatory T cells, so peripheral tolerance fails and multiorgan autoimmunity and allergy appear in infancy.", "Medullary thymic epithelial cells (through AIRE) drive central tolerance; their failure is APECED, with candidiasis and endocrine autoimmunity later in childhood.", "NK cell failure causes viral infections and hemophagocytic disease, not autoimmune enteropathy and diabetes.", "Th17 failure causes Candida and Staphylococcus infections, not autoimmunity.", "Loss of cytotoxic T cells would weaken antiviral defense rather than cause autoimmunity."], "table": "<table><tr><th>Disease<\/th><th>Gene<\/th><th>Tolerance step lost<\/th><\/tr><tr><td>APECED<\/td><td>AIRE<\/td><td>Central: negative selection in thymus<\/td><\/tr><tr><td>IPEX<\/td><td>FOXP3<\/td><td>Peripheral: regulatory T cells<\/td><\/tr><tr><td>ALPS<\/td><td>FAS, FASL<\/td><td>Peripheral: apoptosis of activated lymphocytes<\/td><\/tr><\/table>", "objective": "IPEX (FOXP3 mutation) removes regulatory T cells, causing infant-onset enteropathy, type 1 diabetes, thyroiditis, eczema and high IgE; it is a failure of peripheral tolerance."}, {"qid": "18-13", "topic": "Chediak-Higashi syndrome", "stem": "<p>A 3-year-old boy has silvery hair, very light skin compared with his parents, and recurrent skin infections with Staphylococcus aureus. He walks unsteadily and has decreased sensation in his feet. His parents are first cousins. He now has 10 days of high fever, an enlarged liver and spleen, and low counts of all blood cell types; serum ferritin is very high, and a marrow biopsy shows macrophages that have engulfed blood cells. His blood smear shows neutrophils containing a few abnormally large granules.<\/p>", "lead": "A defect in which cellular process best explains this disease?", "choices": ["Pore formation by perforin in target cell membranes", "Production of superoxide by phagocyte NADPH oxidase", "Firm adhesion of leukocytes through beta-2 integrins", "Trafficking of intracellular vesicles and granules", "Apoptosis of activated lymphocytes through Fas"], "answer": 3, "explanation": "<p>Partial albinism, neurological problems, recurrent bacterial infections, giant granules in neutrophils, and consanguineous parents point to Chediak-Higashi syndrome, an autosomal recessive defect in LYST. LYST controls trafficking of vesicles and granules, so melanocytes cannot deliver pigment normally, phagocytes cannot fuse granules properly, and cytotoxic T cells and NK cells cannot release their killing granules.<\/p><p>His current fever, hepatosplenomegaly, cytopenias, very high ferritin and macrophages engulfing blood cells is hemophagocytic lymphohistiocytosis (HLH). When NK and CD8 T cells cannot kill infected cells, the infection persists and activated T cells and macrophages keep releasing cytokines, so the inflammation spirals. Familial HLH from perforin loss shares that mechanism, but it does not cause albinism or giant granules.<\/p>", "why_wrong": ["Perforin loss causes familial HLH but without partial albinism, neuropathy or giant granules.", "NADPH oxidase loss is chronic granulomatous disease, with abscesses and granulomas but normal pigment and granules.", "Beta-2 integrin loss is leukocyte adhesion deficiency type 1, with neutrophilia and infections without pus, not albinism.", "Correct: LYST loss disrupts vesicle and granule trafficking in melanocytes, phagocytes, NK and CD8 T cells, explaining albinism, infections, giant granules and HLH.", "Fas defects cause autoimmune lymphoproliferative syndrome, with lymphadenopathy and autoimmune cytopenias, not albinism."], "objective": "Chediak-Higashi syndrome (LYST defect in vesicle and granule trafficking) causes partial albinism, neurological symptoms, bacterial infections, giant granules and HLH from failed NK and CD8 T cell killing."}, {"qid": "18-14", "topic": "Phenocopies of inborn errors: neutralizing anti-cytokine autoantibodies", "stem": "<p>A 58-year-old woman, previously healthy, has 4 months of fever, weight loss and enlarged lymph nodes. Node biopsy grows Mycobacterium avium complex, and her blood culture grows Salmonella. HIV testing is negative and she takes no immunosuppressive drugs. Sequencing of the IL-12 receptor, interferon-gamma receptor and their signaling genes is normal. In the laboratory, healthy donor macrophages respond to added interferon-gamma normally, but they fail to respond when her serum is added to the culture.<\/p>", "lead": "Which best explains her susceptibility to these infections?", "choices": ["An inherited loss of the interferon-gamma receptor", "An inherited defect in phagocyte NADPH oxidase", "An inherited deficiency of the late complement proteins", "An acquired antibody that neutralizes interferon-gamma", "An acquired loss of CD4 T cells from a viral infection"], "answer": 3, "explanation": "<p>Disseminated Mycobacterium avium complex and Salmonella infections are the classic picture of a broken IL-12 and interferon-gamma axis. In children this is usually Mendelian susceptibility to mycobacterial disease (MSMD), an inherited defect in those receptors or their signaling (group 6). Without interferon-gamma, macrophages are not activated, granulomas do not form well, and intracellular bacteria spread.<\/p><p>Her genes are normal, and the experiment shows that something in her serum blocks interferon-gamma from working on healthy cells. That is a neutralizing autoantibody against interferon-gamma. A non-inherited condition that copies an inborn error this way is called a phenocopy (group 10). Other examples are anti-type 1 interferon antibodies in severe COVID-19, anti-IL-17 and anti-IL-22 antibodies causing candidiasis, and anti-C1 inhibitor antibodies causing angioedema.<\/p>", "why_wrong": ["Her receptor and signaling genes are normal, so an inherited receptor defect is excluded.", "NADPH oxidase defects (chronic granulomatous disease) cause catalase-positive bacterial and Aspergillus abscesses, and her serum would not block healthy macrophages.", "Late complement deficiency causes recurrent Neisseria infections, not mycobacterial disease.", "Correct: a neutralizing anti-interferon-gamma autoantibody in her serum copies MSMD, a phenocopy of an inborn error.", "HIV testing is negative, and the defect transfers with her serum to healthy cells."], "objective": "Neutralizing autoantibodies against cytokines (for example interferon-gamma) can mimic inherited defects such as MSMD; these non-inherited mimics are phenocopies of inborn errors of immunity."}, {"qid": "18-15", "topic": "Familial Mediterranean fever (autoinflammatory)", "stem": "<p>A 19-year-old man has had attacks since age 8 that last 2 to 3 days: fever to 39.5 C, severe abdominal pain with guarding, and sometimes a hot, swollen knee. Between attacks he feels completely well. During attacks his C-reactive protein and neutrophil count are high, but blood and joint fluid cultures are always sterile, and he has never had an unusual infection. Immunoglobulin levels and lymphocyte counts are normal, and autoantibody screens are negative. His older brother has the same attacks.<\/p>", "lead": "Which mechanism best explains his illness?", "choices": ["Failure of central tolerance from an AIRE defect", "Failure of Treg function from a FOXP3 defect", "Persistent C1 activation from a C1 inhibitor deficiency", "Failed lymphocyte apoptosis from a Fas defect", "Uncontrolled inflammasome activity from a pyrin defect"], "answer": 4, "explanation": "<p>Recurrent, self-limited attacks of fever, serositis (here peritonitis) and arthritis with sterile cultures, normal adaptive immunity, no autoantibodies and an affected sibling is an autoinflammatory disorder, and the classic example is familial Mediterranean fever (FMF). Autoinflammatory diseases (group 7) are sterile inflammation driven by the innate immune system, with no increase in infections and no autoantibodies.<\/p><p>FMF is caused by mutations in pyrin, a regulator of the inflammasome. The inflammasome activates spontaneously, releasing IL-1 and recruiting neutrophils, which produces the periodic fevers and serositis. It responds to colchicine. Autoimmune diseases from tolerance failure, by contrast, produce autoantibodies or autoreactive T cells that target specific organs.<\/p>", "why_wrong": ["AIRE defects cause APECED, with autoantibodies, endocrine autoimmunity and candidiasis.", "FOXP3 defects cause IPEX, with infant-onset autoimmune enteropathy and diabetes.", "C1 inhibitor deficiency causes hereditary angioedema, swelling from bradykinin without fever or high neutrophils.", "Fas defects cause ALPS, with persistent lymphadenopathy and autoimmune cytopenias.", "Correct: a pyrin mutation lets the inflammasome activate spontaneously, causing periodic sterile fever and serositis (FMF), treated with colchicine."], "objective": "Familial Mediterranean fever is an autoinflammatory disorder: a pyrin mutation causes spontaneous inflammasome activation, with periodic fever, serositis and arthritis, no infection susceptibility, and a response to colchicine."}, {"qid": "18-16", "topic": "Hereditary angioedema (C1 inhibitor deficiency)", "stem": "<p>A 16-year-old girl has had episodes since age 10 of firm, non-itchy swelling of her lips, hands or eyelids that last 2 to 4 days. Some episodes bring severe cramping abdominal pain and vomiting. Swelling often starts the day after dental work or minor injury. She has never had hives, and antihistamines and steroids do not help. Her mother has had similar attacks, including one that swelled her throat. Serum C4 is low between attacks; C3 and immunoglobulin levels are normal.<\/p>", "lead": "Excess production of which mediator best explains her swelling?", "choices": ["Histamine", "Bradykinin", "Leukotriene", "Complement C5a", "Immunoglobulin E"], "answer": 1, "explanation": "<p>Recurrent swelling of skin and gut wall without hives or itching, triggered by minor trauma, unresponsive to antihistamines, with autosomal dominant inheritance and a low C4, is hereditary angioedema. It is caused by deficiency of C1 inhibitor (C1-INH), a complement deficiency in group 8.<\/p><p>C1-INH normally restrains activated C1 and the contact system. Without it, C1 activates spontaneously and consumes C4, which is why C4 is low, and the contact system generates excess bradykinin. Bradykinin makes small vessels leak, causing deep swelling. Because mast cells are not involved, there are no hives, and drugs aimed at histamine and allergy do not work.<\/p>", "why_wrong": ["Histamine from mast cells causes itchy hives and responds to antihistamines, which she lacks.", "Correct: without C1 inhibitor, the contact system produces excess bradykinin, which causes non-itchy swelling and abdominal attacks.", "Leukotrienes from mast cells contribute to allergic bronchoconstriction and would come with other allergic features.", "C5a is an inflammatory complement fragment; her C3 is normal and her swelling lacks inflammation and neutrophils.", "IgE drives allergic reactions with hives and itching, not trauma-triggered angioedema with low C4."], "table": "<table><tr><th>Complement deficiency<\/th><th>Main consequence<\/th><\/tr><tr><td>C1 inhibitor<\/td><td>Hereditary angioedema (bradykinin)<\/td><\/tr><tr><td>C1, C2, C4<\/td><td>Poor immune complex clearance, lupus-like disease<\/td><\/tr><tr><td>C3<\/td><td>Severe pyogenic infections, all pathways blocked<\/td><\/tr><tr><td>C5 to C8, properdin<\/td><td>Recurrent Neisseria infections<\/td><\/tr><\/table>", "objective": "C1 inhibitor deficiency (hereditary angioedema) causes spontaneous C1 activation with low C4 and excess bradykinin, producing non-itchy, trauma-triggered swelling that does not respond to antihistamines."}, {"qid": "18-17", "topic": "Curative treatment of inborn errors: hematopoietic stem cell transplant", "stem": "<p>A 2-year-old boy has had eczema since infancy, five episodes of bacterial otitis and pneumonia, and frequent nosebleeds with bruising. His platelet count is 22,000/uL and his platelets are smaller than normal. A maternal uncle died in childhood of bleeding. He is treated with antibiotics and platelet transfusions during bleeding episodes, but his parents ask whether any treatment could correct his infections, eczema and low platelets together. A fully matched sibling donor is available.<\/p>", "lead": "Which treatment is most likely to correct all of these problems?", "choices": ["Monthly intravenous immunoglobulin", "Daily antimicrobial prophylaxis", "Regular platelet transfusions", "Allogeneic stem cell transplant", "Long-term topical steroids"], "answer": 3, "explanation": "<p>Eczema, recurrent bacterial infections and a low count of small platelets in a boy with an affected maternal uncle is Wiskott-Aldrich syndrome, from loss of WASP. WASP is made in blood cells, so both the leukocyte defects and the small, few platelets come from a defect that every cell descended from his hematopoietic stem cells carries.<\/p><p>Antibiotics, immunoglobulin and platelet transfusions manage single problems but leave the defective stem cells in place. Replacing the stem cells with healthy donor stem cells through allogeneic hematopoietic stem cell transplant (HSCT) fixes every lineage at once, which is why HSCT, and in some centers gene therapy of the patient's own stem cells, is the curative option for Wiskott-Aldrich syndrome, SCID and several other severe inborn errors of immunity.<\/p>", "why_wrong": ["Immunoglobulin replacement reduces infections but does not fix platelets or eczema.", "Prophylactic antibiotics prevent some infections but leave the immune and platelet defects in place.", "Platelet transfusions treat bleeding episodes only, and the transfused platelets are short-lived.", "Correct: donor stem cells give rise to normal leukocytes and platelets, correcting infections, eczema and thrombocytopenia together.", "Topical steroids calm the eczema only and do nothing for infections or platelets."], "objective": "Inborn errors whose defect lies in all hematopoietic cells (such as Wiskott-Aldrich syndrome and SCID) are cured by allogeneic hematopoietic stem cell transplant or gene therapy; IVIG and antimicrobials only manage them."}, {"qid": "18-18", "topic": "Secondary immunodeficiency: functional asplenia", "stem": "<p>A 7-year-old boy with sickle cell disease is brought to the emergency department with fever of 40.1 C, lethargy and low blood pressure. Blood cultures grow Streptococcus pneumoniae. He has had no prior unusual infections, and his immunoglobulin levels, lymphocyte counts and neutrophil function are normal. His blood smear shows small round nuclear remnants inside many red blood cells. An ultrasound shows a very small, scarred spleen.<\/p>", "lead": "Which best explains his susceptibility to this infection?", "choices": ["Loss of splenic clearance of encapsulated bacteria", "Loss of oxidative killing inside his neutrophils", "Loss of T cell development in a damaged thymus", "Loss of the membrane attack complex of the complement system", "Loss of class switching in his B lymphocytes"], "answer": 0, "explanation": "<p>His immunoglobulins, lymphocytes and neutrophil function are normal, so this is not a primary immunodeficiency. The red cell nuclear remnants and the small, scarred spleen show that his spleen no longer works. In sickle cell disease, repeated sickling blocks small splenic vessels and causes ischemic damage, leaving functional asplenia, one of the causes of secondary (acquired) immunodeficiency.<\/p><p>The spleen filters blood, removes bacteria coated with antibody and complement, and hosts the marginal zone B cells that respond quickly to capsular polysaccharides. Without it, encapsulated bacteria such as pneumococcus can multiply in the blood and cause overwhelming sepsis. Surgical splenectomy has the same effect, which is why conjugate vaccines are recommended for asplenic patients.<\/p>", "why_wrong": ["Correct: ischemic loss of the spleen (functional asplenia) removes clearance of opsonized encapsulated bacteria from the blood.", "His neutrophil function is normal, which excludes an oxidative burst defect such as chronic granulomatous disease.", "Sickle cell disease does not damage the thymus, and his lymphocyte counts are normal.", "Loss of the membrane attack complex causes Neisseria infections, and sickle cell disease does not remove complement proteins.", "His immunoglobulin levels are normal, so class switching is intact."], "objective": "Sickle cell disease causes functional asplenia through ischemic splenic damage, a secondary immunodeficiency that predisposes to sepsis with encapsulated bacteria such as pneumococcus."}]}, {"id": "3A", "title": "Serology and Immunoassays", "week": 3, "subject": "Immunology", "questions": [{"qid": "3A-1", "topic": "Reading direct and indirect Coombs tests", "stem": "<p>A 28-year-old woman at 12 weeks of gestation in her second pregnancy has blood type O, RhD negative. Her first child, born 3 years ago, was RhD positive. She feels well. Hemoglobin is 12.6 g/dL (normal 12 to 16) and bilirubin is normal. Two antiglobulin tests are run:<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Procedure<\/th><th>Result<\/th><\/tr><tr><td>1<\/td><td>Her own red cells are washed, then mixed with anti-human immunoglobulin (Ig) reagent<\/td><td>No agglutination<\/td><\/tr><tr><td>2<\/td><td>Serial dilutions of her serum are incubated with RhD-positive type O red cells, the cells are washed, then anti-human Ig reagent is added<\/td><td>Agglutination up to the 1:64 dilution; none at 1:128<\/td><\/tr><\/table>", "lead": "Which conclusion is best supported by these results?", "choices": ["Her own red cells are coated with anti-RhD autoantibody", "She has no detectable antibody to the RhD antigen", "Anti-A antibody in her serum caused the reaction in test 2", "The fetus is making anti-RhD that has entered her blood", "Her serum contains anti-RhD antibody not bound to her cells"], "answer": 4, "explanation": "<p>Test 1 is a direct Coombs test. It asks whether antibody is already sitting on the patient's own red cells: if her cells were coated with IgG, the anti-human Ig reagent would bridge them and they would clump. They do not, so her red cells are not antibody-coated, which fits her normal hemoglobin and bilirubin. That is expected, because her own cells are RhD negative.<\/p><p>Test 2 is an indirect Coombs test. It asks whether her serum contains antibody against a chosen red cell antigen. Her serum is first allowed to coat RhD-positive cells, and the anti-human Ig reagent then cross-links any bound antibody. Agglutination out to 1:64 means she has free anti-RhD antibody in her serum with a titer of 64, so she was sensitized by her first RhD-positive baby. Type O test cells were used so that her natural anti-A and anti-B antibodies cannot cause a false positive. This antibody matters because maternal IgG can cross the placenta and attack the red cells of an RhD-positive fetus.<\/p>", "why_wrong": ["A negative direct test (test 1) shows her own cells are not coated with antibody.", "Agglutination in test 2 out to 1:64 shows she does have antibody to RhD.", "The test cells were type O, which carry neither A nor B antigen, so anti-A cannot bind them.", "Antibody in her serum is her own; the fetal immune system is not the source of maternal circulating anti-RhD.", "Correct: a negative direct and positive indirect Coombs test mean free anti-RhD antibody circulates in her serum (titer 64) without coating her own RhD-negative cells."], "objective": "The direct Coombs test detects antibody already bound to a patient's red cells, while the indirect Coombs test detects free antibody in serum against chosen red cell antigens, such as anti-RhD in a sensitized RhD-negative pregnant woman.", "table": "<table class=\"\"><tr><th>Test<\/th><th>Question it answers<\/th><th>What is mixed<\/th><th>Example use<\/th><\/tr><tr><td>Direct Coombs<\/td><td>Is antibody already on the patient's red cells?<\/td><td>Patient red cells + anti-human Ig<\/td><td>Autoimmune hemolytic anemia<\/td><\/tr><tr><td>Indirect Coombs<\/td><td>Does the patient's serum contain antibody to a red cell antigen?<\/td><td>Patient serum + test red cells, then anti-human Ig<\/td><td>RhD sensitization in pregnancy<\/td><\/tr><\/table>"}, {"qid": "3A-2", "topic": "Reading a quantitative sandwich ELISA", "stem": "<p>A 58-year-old man with 3 days of fever and cough has his C-reactive protein (CRP) measured by sandwich enzyme-linked immunosorbent assay (ELISA). Wells are coated with anti-CRP antibody, sample is added and washed off, an enzyme-linked second anti-CRP antibody is added, and then substrate. His serum is diluted before testing, and standards of known CRP concentration are run on the same plate. Optical density (OD) readings, in duplicate wells:<\/p><table class=\"labs\"><tr><th>Well contents<\/th><th>OD, well 1<\/th><th>OD, well 2<\/th><\/tr><tr><td>Standard 0 ng/mL (blank)<\/td><td>0.10<\/td><td>0.11<\/td><\/tr><tr><td>Standard 4 ng/mL<\/td><td>0.31<\/td><td>0.30<\/td><\/tr><tr><td>Standard 16 ng/mL<\/td><td>0.55<\/td><td>0.57<\/td><\/tr><tr><td>Standard 63 ng/mL<\/td><td>0.95<\/td><td>0.97<\/td><\/tr><tr><td>Standard 250 ng/mL<\/td><td>1.52<\/td><td>1.50<\/td><\/tr><tr><td>Standard 1,000 ng/mL<\/td><td>1.90<\/td><td>1.92<\/td><\/tr><tr><td>His diluted serum<\/td><td>1.18<\/td><td>1.24<\/td><\/tr><\/table>", "lead": "What is the CRP concentration in his diluted serum sample?", "choices": ["Between 16 and 63 ng/mL", "Between 63 and 250 ng/mL", "Between 250 and 1,000 ng/mL", "Above 1,000 ng/mL, beyond the standards", "Too low to read, close to the blank"], "answer": 1, "explanation": "<p>In a sandwich ELISA, the analyte is caught between two antibodies: the capture antibody on the plate and the enzyme-linked detection antibody. The enzyme can only stay in the well if CRP is there to hold it, so the more CRP in the sample, the more enzyme, the darker the color and the higher the optical density. Signal rises with concentration.<\/p><p>To quantify, the sample's OD is compared with the standard curve built from wells of known concentration. His duplicates average about 1.21, which is above the 63 ng/mL standard (about 0.96) and below the 250 ng/mL standard (about 1.51), so the CRP in the diluted sample lies between 63 and 250 ng/mL. Reading off a plotted curve would give a closer value, and multiplying by the dilution factor gives his actual serum level. A reading above the top standard would not be trustworthy and the sample would be diluted further and rerun.<\/p>", "why_wrong": ["An OD of 1.21 is well above the 63 ng/mL standard (0.96), so the sample is higher than this range.", "Correct: 1.21 falls between the 63 ng/mL (0.96) and 250 ng/mL (1.51) standards, and in a sandwich ELISA OD rises with concentration.", "Values in this range would read between 1.51 and 1.91, higher than his sample.", "His OD is below the top standard, so it lies inside the range of the curve.", "The blank reads about 0.10; his sample is more than ten times that."], "objective": "In a quantitative sandwich ELISA, optical density rises with the amount of analyte, and the sample's concentration is read by placing its OD on a standard curve of known concentrations run on the same plate."}, {"qid": "3A-3", "topic": "Bead agglutination serotyping and serotype replacement", "stem": "<p>A 3-year-old girl received all doses of a 13-valent pneumococcal conjugate vaccine, which covers capsular serotypes 1, 3, 4, 5, 6A, 6B, 7F, 9V, 14, 18C, 19A, 19F and 23F. She now has pneumonia, and her blood culture grows Streptococcus pneumoniae. Bacteria from the culture are mixed with latex beads, each set coated with standard antiserum to a single capsular serotype:<\/p><table class=\"labs\"><tr><th>Bead set<\/th><th>Appearance after mixing<\/th><\/tr><tr><td>Anti-serotype 3<\/td><td>Smooth, diffuse<\/td><\/tr><tr><td>Anti-serotype 6B<\/td><td>Smooth, diffuse<\/td><\/tr><tr><td>Anti-serotype 14<\/td><td>Smooth, diffuse<\/td><\/tr><tr><td>Anti-serotype 19A<\/td><td>Smooth, diffuse<\/td><\/tr><tr><td>Anti-serotype 22F<\/td><td>Visible clumps<\/td><\/tr><tr><td>Anti-serotype 33F<\/td><td>Smooth, diffuse<\/td><\/tr><tr><td>Uncoated beads<\/td><td>Smooth, diffuse<\/td><\/tr><\/table>", "lead": "Which conclusion is best supported by these results?", "choices": ["The girl made no antibody to any of the vaccine serotypes", "The isolate is serotype 19A, which the vaccine covers", "The isolate carries a capsule type her vaccine did not cover", "The test is invalid because uncoated beads did not clump", "Her own serum antibodies caused the beads to clump"], "answer": 2, "explanation": "<p>Read the result first. Antibody-coated beads clump when they meet bacteria carrying the matching antigen, because each antibody has two binding sites and the bacterial capsule has many identical epitopes, so a lattice forms. Only the anti-22F beads clumped, and the uncoated beads stayed smooth, which is the negative control showing the bacteria do not clump beads on their own. The isolate is therefore serotype 22F.<\/p><p>Then compare that with her vaccine. Serotype 22F is not among the 13 serotypes in her vaccine, so this infection does not show that she failed to respond; it shows a strain the vaccine was never designed to cover. When vaccines suppress the serotypes they include, non-vaccine serotypes can fill the gap and cause a growing share of disease, which is called serotype replacement. That is why serotyping is used for surveillance and why newer conjugate vaccines keep adding serotypes.<\/p>", "why_wrong": ["This test identifies the bacterial capsule; it does not measure her antibodies, and the isolate is not a vaccine type.", "The anti-19A beads stayed smooth, so the isolate is not serotype 19A.", "Correct: clumping only with anti-22F beads identifies serotype 22F, which is outside her vaccine and fits serotype replacement.", "Uncoated beads are the negative control; staying smooth is the expected result and makes the test valid.", "Her serum was never added; the antibodies on the beads are standardized antisera."], "objective": "In bead agglutination serotyping, beads coated with antiserum to one capsular serotype clump only with bacteria carrying that capsule; identifying a non-vaccine serotype in a vaccinated child illustrates serotype replacement."}, {"qid": "3A-4", "topic": "Agglutination needs a multivalent antigen", "stem": "<p>A laboratory develops a quick bead test for a small peptide hormone. Colored latex beads are coated with a monoclonal antibody that binds one site on the hormone with high affinity; in a separate binding assay the same antibody captures the hormone efficiently. Results are read by eye.<\/p><table class=\"labs\"><tr><th>Sample added to antibody-coated beads<\/th><th>Result<\/th><\/tr><tr><td>Buffer only<\/td><td>Smooth, no clumps<\/td><\/tr><tr><td>Hormone at low, medium and high concentrations<\/td><td>Smooth, no clumps at any concentration<\/td><\/tr><tr><td>Large carrier protein carrying many copies of the hormone<\/td><td>Visible clumps<\/td><\/tr><\/table>", "lead": "Which best explains why the free hormone gives no clumps?", "choices": ["Monoclonal antibodies cannot form agglutination lattices", "Each hormone molecule can bind only one bead at a time", "The hormone was in excess of the bead antibody at every dose", "The bead antibody binds the hormone with too low an affinity", "The beads need an enzyme-linked antibody to show binding"], "answer": 1, "explanation": "<p>Agglutination happens when antibodies cross-link antigens into a large lattice. Each antibody has two binding sites, so it can bridge two particles, but only if each antigen also offers more than one epitope to grab. A bead test for antigen in solution therefore works only when the antigen is multivalent.<\/p><p>This hormone is small and has a single site for the bead antibody. A hormone molecule can attach to one bead but cannot also attach to a second bead, so no bridges form, no matter how much hormone is added. When many copies of the hormone sit on a large carrier, each particle offers repeated epitopes, beads are linked together and clumps appear. That control also shows that the beads and antibody work.<\/p>", "why_wrong": ["A single-specificity antibody can agglutinate a large antigen with repeate
