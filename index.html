ion of the B cells by regulatory T cells", "New light chain rearrangement that changes specificity", "Clonal deletion of the cells that bound the protein", "Somatic hypermutation of the heavy chain variable region"], "answer": 2, "explanation": "<p>The B cells first bound a membrane self antigen while they were immature cells in the bone marrow. That strong self-recognition triggers central tolerance, and the key clue here is the brief return of RAG expression followed by cells that keep the same heavy chain but carry a new (lambda) light chain. The cells were not killed; their receptor was rewritten.<\/p><p>This is receptor editing, a central tolerance mechanism unique to B cells. Reactivated RAG drives further light chain rearrangement, replacing the self-reactive light chain. If the new heavy plus light pair no longer binds self, the cell survives and leaves the marrow. If editing fails, the cell undergoes clonal deletion. T cells have no equivalent step.<\/p>", "why_wrong": ["Anergy happens in mature peripheral B cells and leaves the original receptor in place; here the receptor itself changed.", "Regulatory T cells suppress activation but cannot change which light chain a B cell expresses.", "Correct: renewed RAG activity rearranged a new light chain, removing self-reactivity, which is receptor editing.", "Deletion removes the cell by apoptosis; these cells survived with a new receptor.", "Somatic hypermutation occurs in germinal centers after activation, alters the variable regions by point mutation, and would not swap kappa for lambda."], "objective": "Immature B cells that strongly bind self antigen in the bone marrow can re-express RAG and rearrange a new light chain (receptor editing); if editing fails they are deleted."}, {"qid": "13-14-9", "topic": "MHC class II deficiency and positive selection", "stem": "<p>An 8-month-old girl has had recurrent pneumonia, chronic diarrhea and persistent oral thrush since age 3 months. Her parents are first cousins. She received her protein-based infant vaccines on schedule. Lymphocyte studies:<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><\/tr><tr><td>CD3+ T cells<\/td><td>Low<\/td><\/tr><tr><td>CD4+ T cells<\/td><td>Very low<\/td><\/tr><tr><td>CD8+ T cells<\/td><td>Normal<\/td><\/tr><tr><td>CD19+ B cells<\/td><td>Normal<\/td><\/tr><tr><td>Human leukocyte antigen (HLA)-DR on B cells and monocytes<\/td><td>Absent<\/td><\/tr><tr><td>Antibody to vaccine proteins<\/td><td>Absent<\/td><\/tr><\/table>", "lead": "Which process most directly explains why she has so few CD4+ T cells?", "choices": ["Failure of positive selection of thymocytes on self MHC class II", "Excess negative selection of thymocytes by thymic epithelium", "Defective rearrangement of the T cell receptor beta chain", "Failure of immature B cells to receive T cell help", "Loss of thymic epithelium from abnormal pharyngeal pouches"], "answer": 0, "explanation": "<p>Absent HLA-DR on her antigen-presenting cells, a recessive pattern in a consanguineous family, and a selective loss of CD4+ cells with normal CD8+ cells point to bare lymphocyte syndrome type 2: a defect in the transcription factors that turn on MHC class II genes. Her lack of antibody to protein vaccines follows, since T-dependent antibody responses need CD4+ help.<\/p><p>The CD4 deficit comes from thymic positive selection. Double-positive (CD4+CD8+) thymocytes survive only if their T cell receptor binds self MHC with modest affinity, and the class of MHC they engage sets their fate: MHC class II gives CD4+ cells, MHC class I gives CD8+ cells. With no MHC class II in the thymus, no thymocyte can be positively selected into the CD4 lineage, while CD8+ cells still develop normally on MHC class I.<\/p>", "why_wrong": ["Correct: without MHC class II, double-positive thymocytes cannot be positively selected into the CD4 lineage.", "Negative selection removes high-affinity self-reactive cells of both lineages and would not spare CD8+ cells selectively.", "A T cell receptor beta chain defect would block both CD4+ and CD8+ T cells, but her CD8+ count is normal.", "B cell help is an outcome of CD4+ T cells, not a step in making them; her B cell numbers are normal.", "Abnormal pharyngeal pouch development (22q11.2 deletion) reduces thymic output of all T cells and does not remove HLA-DR from antigen-presenting cells."], "objective": "Positive selection on self MHC class II or class I determines CD4 or CD8 fate, so loss of MHC class II expression (bare lymphocyte syndrome type 2) causes CD4+ T cell deficiency with normal CD8+ cells.", "table": "<table><tr><th>Defect<\/th><th>MHC lost<\/th><th>T cells affected<\/th><\/tr><tr><td>Bare lymphocyte syndrome type 1 (TAP mutation)<\/td><td>Class I on all cells<\/td><td>CD8+ low<\/td><\/tr><tr><td>Bare lymphocyte syndrome type 2 (MHC II transcription factors)<\/td><td>Class II on antigen-presenting cells<\/td><td>CD4+ low<\/td><\/tr><\/table>"}, {"qid": "13-14-10", "topic": "Thymocyte stages by CD4/CD8 flow cytometry", "stem": "<p>Thymocytes from a normal mouse and from a knockout mouse are stained for CD4 and CD8 and analyzed by flow cytometry. Results are the percent of thymocytes in each quadrant:<\/p><table class=\"labs\"><tr><th>Population<\/th><th>Normal mouse<\/th><th>Knockout mouse<\/th><\/tr><tr><td>CD4-negative CD8-negative<\/td><td>3%<\/td><td>95%<\/td><\/tr><tr><td>CD4-positive CD8-positive<\/td><td>82%<\/td><td>Less than 1%<\/td><\/tr><tr><td>CD4-positive CD8-negative<\/td><td>10%<\/td><td>Less than 1%<\/td><\/tr><tr><td>CD4-negative CD8-positive<\/td><td>5%<\/td><td>Less than 1%<\/td><\/tr><\/table><p>The knockout thymus is small, and its CD4-negative CD8-negative cells express CD25 and recombination-activating gene (RAG) proteins.<\/p>", "lead": "The knockout most likely removed which of the following?", "choices": ["T cell receptor alpha chain", "MHC class II molecules", "Autoimmune regulator (AIRE)", "T cell receptor beta chain", "MHC class I molecules"], "answer": 3, "explanation": "<p>Normal thymocytes move from double negative (CD4-negative CD8-negative) to double positive (CD4-positive CD8-positive) to single positive. The knockout thymocytes are stuck at the first stage: almost everything is double negative, still expressing RAG and CD25, with essentially no double-positive cells. The block therefore sits at the double-negative to double-positive transition.<\/p><p>That step is the T cell version of the pre-B cell checkpoint. A pro-T or pre-T cell first rearranges the T cell receptor beta chain, which pairs with a surrogate pre-T alpha chain to form the pre-T cell receptor. Signaling through the pre-T cell receptor drives proliferation and progression to the double-positive stage. Without a beta chain there is no pre-T cell receptor, so development halts in the double-negative pool.<\/p>", "why_wrong": ["The alpha chain is rearranged at the double-positive stage, so its loss would leave double-positive cells present but no single-positive cells.", "Losing MHC class II blocks positive selection of CD4 single-positive cells only; double-positive and CD8 cells would remain.", "AIRE acts in thymic medullary epithelium during negative selection and does not halt early thymocyte development.", "Correct: without a beta chain no pre-T cell receptor forms, so thymocytes arrest at the double-negative stage.", "Losing MHC class I removes CD8 single-positive cells only, leaving the double-positive pool intact."], "objective": "On CD4 versus CD8 flow cytometry, arrest at the double-negative stage indicates failure of the pre-T cell receptor (T cell receptor beta chain) checkpoint, whereas defects in positive selection remove only one single-positive population."}, {"qid": "13-14-11", "topic": "AIRE and tolerance to tissue-restricted antigens", "stem": "<p>In an experiment, a gene expressed in thymic medullary epithelial cells is knocked out in mice. The mice develop lymphocytic infiltrates and autoantibodies against the retina, stomach, ovary and salivary glands. When thymic epithelium from knockout mice is grafted into athymic mice, the recipients develop the same organ-specific disease; thymic epithelium from normal mice does not cause it. Further study shows that knockout medullary epithelial cells make far less insulin, retinal proteins and gastric enzyme proteins than normal medullary epithelial cells do.<\/p>", "lead": "Which step of T cell development is most directly impaired in the knockout mice?", "choices": ["Positive selection of thymocytes on self MHC class I", "Expression of the pre-T cell receptor in early thymocytes", "Deletion of thymocytes specific for organ-specific proteins", "Peripheral expansion of inducible regulatory T cells", "Upregulation of B7 molecules on resting dendritic cells"], "answer": 2, "explanation": "<p>The defect lives in the thymic stroma (it transfers with grafted thymic epithelium) and leaves medullary epithelial cells unable to produce proteins normally found only in distant tissues. That describes loss of the autoimmune regulator (AIRE), the transcriptional regulator that drives low-level, promiscuous expression of tissue-restricted antigens in medullary thymic epithelium.<\/p><p>Those self proteins are displayed to developing thymocytes so that cells with high-affinity receptors for them can be removed by negative selection (or diverted into regulatory T cells). Without AIRE, thymocytes specific for retinal, gastric or ovarian proteins never meet their antigen in the thymus, leave as naive cells, and later attack those organs. In humans the same defect causes autoimmune polyendocrinopathy syndrome type 1 (APECED).<\/p>", "why_wrong": ["Positive selection uses self MHC with ubiquitous peptides and still occurs normally; the problem is missing tissue proteins, not missing MHC.", "The pre-T cell receptor checkpoint is in early cortical thymocytes and does not depend on medullary epithelium.", "Correct: without AIRE, tissue-restricted antigens are not shown in the thymic medulla, so thymocytes specific for them escape negative selection.", "Inducible regulatory T cells form in the periphery, but the transferable thymic epithelial defect places the problem in the thymus.", "B7 on resting dendritic cells governs peripheral priming, not which self proteins thymic epithelium displays."], "objective": "AIRE in medullary thymic epithelial cells drives expression of tissue-restricted self antigens so autoreactive thymocytes can be deleted; AIRE loss causes multi-organ autoimmunity (APECED)."}, {"qid": "13-14-12", "topic": "Costimulation requirement and T cell anergy", "stem": "<p>In an experiment, naive CD4+ T cells specific for a peptide are cultured with peptide-loaded dendritic cells taken from an uninflamed spleen. The dendritic cells express MHC class II but no CD80 or CD86. After 3 days the T cells have not proliferated or made interleukin (IL)-2. When the same T cells are moved to a second culture with fully activated, CD80/CD86-positive dendritic cells and the same peptide, they still do not respond. A fresh batch of naive T cells placed directly into the second culture proliferates strongly.<\/p>", "lead": "The first culture most likely caused which change in the T cells?", "choices": ["Clonal deletion through Fas-mediated apoptosis", "Differentiation into natural regulatory T cells", "Loss of T cell receptor specificity for the peptide", "Anergy from receptor signaling without signal 2", "Exhaustion from chronic stimulation by the peptide"], "answer": 3, "explanation": "<p>In the first culture the T cells received signal 1 (T cell receptor binding peptide on MHC class II) but no signal 2, because resting dendritic cells that have not been triggered by pattern recognition receptors do not express the B7 ligands CD80 and CD86 that engage CD28. Afterward the cells are still alive and still specific, yet they cannot respond even to fully costimulatory dendritic cells that activate fresh naive cells.<\/p><p>That lasting unresponsiveness is anergy. The requirement for CD28 costimulation acts as a fail-safe: self peptides are presented constantly by resting antigen-presenting cells, and T cells that recognize them without the danger-linked second signal become anergic or die instead of being primed. This is one of the main peripheral tolerance mechanisms for T cells.<\/p>", "why_wrong": ["Clonal deletion would remove the cells, but they survived to be tested in the second culture.", "Natural regulatory T cells arise in the thymus, not from naive peripheral T cells in a 3-day culture.", "The T cell receptor does not change after maturation; the cells simply cannot be activated through it.", "Correct: signal 1 without CD28 costimulation leaves T cells anergic, unresponsive even to later full stimulation.", "Exhaustion follows prolonged activation in chronic infection or cancer, but these cells were never activated."], "objective": "T cell receptor signaling without CD28 binding to B7 (CD80/CD86) on activated antigen-presenting cells leads to anergy, a key mechanism of peripheral T cell tolerance."}, {"qid": "13-14-13", "topic": "MHC restriction and alloreactivity", "stem": "<p>In an experiment, cytotoxic T cells from a strain A mouse that recovered from a viral infection are tested against target cells. They kill virus-infected strain A cells, but not uninfected strain A cells and not virus-infected strain B cells, which carry different MHC alleles. In a separate mixed lymphocyte reaction, T cells from a strain A mouse that has never met strain B tissue proliferate strongly when cultured with irradiated strain B spleen cells. About 5% of all strain A T cells respond, far more than respond to any single viral peptide.<\/p>", "lead": "Which statement best explains both observations?", "choices": ["Strain A T cells were deleted in the thymus if they recognized strain B MHC", "Strain B cells lack the costimulatory molecules needed to activate T cells", "Natural antibodies against strain B antigens direct T cells to those cells", "Strain B MHC molecules cannot present peptides from the virus", "T cells are selected on self MHC, and many cross-react with foreign MHC"], "answer": 4, "explanation": "<p>The first observation is MHC restriction. During positive selection in the thymus, each T cell is kept only if its receptor binds self MHC with modest affinity. A mature strain A T cell therefore recognizes a viral peptide only when it sits in a strain A MHC molecule; the same peptide in strain B MHC is invisible to it.<\/p><p>The second observation is alloreactivity. Because the whole T cell repertoire is tuned to bind MHC, a large fraction of it also binds foreign MHC molecules (with their peptides) that happen to resemble self MHC plus a foreign peptide. Foreign MHC was never present in the thymus, so these clones were not removed by negative selection. The very high frequency of responders is why mismatched (allogeneic) transplants trigger strong rejection.<\/p>", "why_wrong": ["Strain B MHC was absent from the strain A thymus, so cells recognizing it could not have been deleted; they are present and respond.", "Irradiated strain B spleen cells include activated antigen-presenting cells and do stimulate strain A T cells, as the strong proliferation shows.", "Natural antibodies are B1 cell products and do not explain T cell recognition or MHC-restricted killing.", "Strain B MHC may present viral peptides to strain B T cells; the problem is that strain A T cells are restricted to strain A MHC.", "Correct: positive selection makes T cells self-MHC restricted, and their MHC-binding bias makes many of them react to foreign MHC (alloreactivity)."], "objective": "Positive selection makes T cells recognize peptide only in self MHC (MHC restriction), and the repertoire's built-in MHC binding makes a high fraction of T cells react to foreign MHC, the basis of allograft rejection."}]}, {"id": "15-16", "title": "Humoral and Cellular Immunity", "week": 3, "subject": "Immunology", "questions": [{"qid": "15-16-1", "topic": "Follicular dendritic cells and affinity maturation", "stem": "<p>Mice are lethally irradiated and given bone marrow from donor mice whose blood-forming cells all carry a fluorescent label. After the new immune system has fully developed, the mice are immunized with a protein antigen. Two weeks later, lymph node sections show germinal centers containing labeled B cells and labeled helper T cells. Within each germinal center sits a meshwork of unlabeled, radiation-resistant cells with long branching processes. These cells hold intact, unprocessed antigen bound to antibody and complement on their surface for weeks.<\/p>", "lead": "The main role of the unlabeled antigen-holding cells is best described as which of the following?", "choices": ["Presenting processed peptide on MHC class II to naive helper T cells", "Displaying intact antigen to B cells competing on receptor affinity", "Cross-presenting captured antigen on MHC class I to CD8 T cells", "Secreting interleukin 21 that drives somatic hypermutation", "Making the high-affinity antibody that forms the immune complexes"], "answer": 1, "explanation": "<p>The unlabeled cells did not come from the donor marrow, so they are not of hematopoietic origin, and they hold whole antigen as immune complexes rather than chopping it into peptides. These are follicular dendritic cells (FDCs). Despite the name, they are unrelated to dendritic cells and are not antigen-presenting cells: they do not load peptides onto major histocompatibility complex (MHC) molecules for T cells.<\/p><p>Their job is to display intact antigen to germinal center B cells. Those B cells are mutating their receptor genes (somatic hypermutation), and the clones whose new receptors bind antigen best capture more of it from the FDC surface, present more of its peptides to T follicular helper cells, and win the survival and proliferation signals. Lower-affinity clones lose the competition and die. Repeated rounds of mutation and selection on this FDC-held antigen produce affinity maturation.<\/p>", "why_wrong": ["Presenting peptide on MHC class II to naive T cells is the work of dendritic cells; FDCs are not antigen-presenting cells and hold antigen intact.", "Correct: follicular dendritic cells display intact antigen-antibody complexes so that mutated germinal center B cells compete for it, driving affinity maturation.", "Cross-presentation on MHC class I is done by licensed dendritic cells of hematopoietic origin, not by radiation-resistant stromal cells.", "Interleukin 21 comes from T follicular helper cells, which here are labeled donor cells, not the unlabeled meshwork.", "Antibody is made by B cells and plasma cells, which in these mice are donor-derived and labeled."], "objective": "Follicular dendritic cells are non-hematopoietic stromal cells of the germinal center that display intact antigen as immune complexes; they are not antigen-presenting cells, and B cells compete for their antigen, which selects high-affinity clones during affinity maturation."}, {"qid": "15-16-2", "topic": "Linked recognition: the B cell as antigen-presenting cell", "stem": "<p>A small chemical group, hapten H, can bind a B cell receptor but cannot be presented on major histocompatibility complex (MHC) molecules. Mice are immunized with H chemically coupled to carrier protein A. Six weeks later, groups of mice receive a second immunization, and serum IgG against hapten H is measured 7 days after it.<\/p><table class=\"labs\"><tr><th>Group<\/th><th>Second immunization<\/th><th>Anti-H IgG<\/th><\/tr><tr><td>1<\/td><td>H coupled to protein A<\/td><td>High, high affinity<\/td><\/tr><tr><td>2<\/td><td>H coupled to unrelated protein B<\/td><td>Low<\/td><\/tr><tr><td>3<\/td><td>H coupled to protein B, in mice also immunized with protein B alone 6 weeks earlier<\/td><td>High, high affinity<\/td><\/tr><\/table>", "lead": "The difference between groups 1 and 2 is best explained by which requirement of the secondary response?", "choices": ["Hapten-specific helper T cells must recognize H on MHC class II", "Memory B cells must bind the carrier protein with their receptors", "Free hapten must cross-link B cell receptors without T cell help", "Hapten-specific B cells must present carrier peptide to T cells", "Follicular dendritic cells must present carrier peptide to B cells"], "answer": 3, "explanation": "<p>In a T-dependent response the B cell and its helper T cell recognize the same antigen but different parts of it. The hapten-specific memory B cell binds the hapten with its receptor, internalizes the whole hapten-carrier molecule, and displays peptides of the carrier protein on MHC class II. A memory helper T cell specific for one of those carrier peptides then recognizes the B cell and delivers help (CD40 ligand and cytokines) that drives a strong, class-switched, high-affinity response.<\/p><p>In group 1 the carrier is protein A, and the first immunization left A-specific memory T cells behind, so help is available. In group 2 the same hapten sits on protein B, and no B-specific helper T cells exist yet, so the hapten-specific B cells cannot recruit help and the response is weak. Group 3 proves the point: once B-specific helper T cells are created by priming with protein B, hapten on B works again. This linked recognition is also why linking a polysaccharide to a protein carrier improves vaccine responses.<\/p>", "why_wrong": ["T cells recognize peptides on MHC, and the stem states the hapten cannot be presented; T cell help is directed at the carrier.", "The B cells that matter bind the hapten, not the carrier; their receptor specificity is the same in groups 1 and 2.", "If T cell-independent cross-linking were enough, the carrier would not matter and group 2 would respond as well as group 1.", "Correct: the hapten-specific B cell presents carrier peptides on MHC class II, so a strong response needs helper T cells primed to that same carrier.", "Follicular dendritic cells hold intact antigen and are not antigen-presenting cells; peptide presentation to helper T cells is done by the B cell."], "objective": "In T-dependent responses the B cell captures antigen through its receptor and presents peptides of it on MHC class II, so a B cell specific for one epitope gets help only from helper T cells primed to peptides of the same molecule (linked recognition).", "table": "<table class=\"\"><tr><th>Feature<\/th><th>T-dependent (protein)<\/th><th>T-independent (polysaccharide)<\/th><\/tr><tr><td>Main B cell subset<\/td><td>Follicular B cells<\/td><td>Marginal zone and B1-like cells<\/td><\/tr><tr><td>Germinal centers<\/td><td>Yes<\/td><td>No or few<\/td><\/tr><tr><td>Class switching and affinity maturation<\/td><td>Yes<\/td><td>Limited<\/td><\/tr><tr><td>Memory and long-lived plasma cells<\/td><td>Yes<\/td><td>Limited<\/td><\/tr><\/table>"}, {"qid": "15-16-3", "topic": "Hyper-IgM syndromes: CD40 ligand versus AID", "stem": "<p>A 14-month-old boy is hospitalized with Pneumocystis jirovecii pneumonia. Since age 7 months he has had two bacterial pneumonias and chronic diarrhea with Cryptosporidium. His mother's brother died of pneumonia in infancy. Labs:<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><th>Normal for age<\/th><\/tr><tr><td>IgM<\/td><td>310 mg/dL<\/td><td>40 to 140 mg/dL<\/td><\/tr><tr><td>IgG<\/td><td>90 mg/dL<\/td><td>400 to 1,300 mg/dL<\/td><\/tr><tr><td>IgA<\/td><td>less than 7 mg/dL<\/td><td>20 to 100 mg/dL<\/td><\/tr><tr><td>CD19-positive B cells<\/td><td>Normal<\/td><td><\/td><\/tr><tr><td>CD3-positive T cells<\/td><td>Normal number<\/td><td><\/td><\/tr><\/table>", "lead": "Examination of his lymph node tissue would most likely show which finding?", "choices": ["Primary follicles with no germinal centers", "Large, hyperplastic germinal centers", "Absence of B cells from the follicles", "Absence of T cells from the paracortex", "Germinal centers full of IgE-switched B cells"], "answer": 0, "explanation": "<p>High IgM with very low IgG and IgA, normal B cell and T cell numbers, X-linked inheritance through the mother's brother, and opportunistic infections (Pneumocystis, Cryptosporidium) together identify hyper-IgM syndrome type 1. The defect is CD40 ligand, which activated helper T cells raise to engage CD40 on B cells. Because CD40 ligand also activates macrophages and dendritic cells, the boy has a combined defect, which is why opportunists appear rather than only bacteria.<\/p><p>Without the CD40 signal, B cells activated by antigen cannot enter the germinal center pathway: no germinal centers form, there is no class switching and no affinity maturation, so only IgM is made. The node therefore shows primary follicles without germinal centers. The contrast is hyper-IgM type 2, a defect in the enzyme activation-induced deaminase (AID). There, CD40 signaling is intact and germinal centers do form, but the B cells cannot switch or mutate and keep cycling, so the germinal centers become large and hyperplastic.<\/p>", "why_wrong": ["Correct: CD40 ligand deficiency blocks the T cell-B cell signal needed to form germinal centers, so follicles stay primary.", "Hyperplastic germinal centers are the hallmark of AID deficiency (hyper-IgM type 2), an autosomal disease that is a humoral defect without opportunistic infections.", "B cells are present in normal numbers; their problem is the missing CD40 signal, not their development.", "T cell numbers are normal; the defect is in a molecule they express after activation, not in their presence.", "IgE switching requires CD40 signaling plus interleukin 4; this boy cannot switch to any secondary isotype."], "objective": "Hyper-IgM type 1 (X-linked CD40 ligand deficiency) prevents germinal center formation and causes a combined immunodeficiency with opportunistic infections, while AID deficiency (type 2) is a humoral defect with enlarged germinal centers.", "table": "<table class=\"\"><tr><th>Feature<\/th><th>HIGM1 (CD40L, X-linked)<\/th><th>HIGM3 (CD40, AR)<\/th><th>HIGM2 (AID, AR)<\/th><\/tr><tr><td>IgM / switched isotypes<\/td><td>High or normal / low<\/td><td>High or normal / low<\/td><td>High or normal / low<\/td><\/tr><tr><td>Germinal centers<\/td><td>Absent<\/td><td>Absent<\/td><td>Hyperplastic<\/td><\/tr><tr><td>Infections<\/td><td>Bacterial plus opportunists<\/td><td>Bacterial plus opportunists<\/td><td>Mostly bacterial<\/td><\/tr><tr><td>Type of defect<\/td><td>Combined<\/td><td>Combined<\/td><td>Humoral only<\/td><\/tr><\/table>"}, {"qid": "15-16-4", "topic": "Th1 polarization and macrophage activation", "stem": "<p>Mice lacking the receptor for interleukin 12 (IL-12) are infected with an intracellular mycobacterium. Wild-type mice control the infection and form compact granulomas. In the knockout mice, bacteria multiply inside macrophages throughout the liver and spleen and no granulomas form. Their CD4 T cells expand normally after infection, and serum IgM and IgG against the bacteria are similar to those of wild-type mice.<\/p>", "lead": "The failure to control the infection is best explained by a defect in which process?", "choices": ["T helper 2 differentiation, so B cells do not switch to IgE", "T helper 17 differentiation, so neutrophils are not recruited", "Regulatory T cell differentiation, so inflammation is unchecked", "T follicular helper differentiation, so no germinal centers form", "T helper 1 differentiation, so macrophages are not activated"], "answer": 4, "explanation": "<p>Naive CD4 T cells choose an effector program during priming according to polarizing cytokines, mostly from dendritic cells (signal 3). IL-12 is the signal for T helper 1 (Th1) cells: it induces the transcription factor T-bet, and the resulting Th1 cells secrete interferon gamma (IFN-gamma). The knockout mice cannot respond to IL-12, so their CD4 T cells expand but do not become Th1 cells.<\/p><p>IFN-gamma from Th1 cells is what activates macrophages to kill the bacteria they have ingested and to organize granulomas. Mycobacteria live inside macrophages, out of reach of antibody, so normal antibody levels do not help. Without Th1 help the macrophages stay unactivated, the bacteria multiply inside them, and granulomas never form. The same IL-12 to IFN-gamma axis underlies the tuberculin skin test reaction.<\/p>", "why_wrong": ["T helper 2 cells, driven by interleukin 4, promote IgE and eosinophils for helminths; they do not depend on IL-12 or control intracellular bacteria.", "T helper 17 cells, driven by interleukin 6, interleukin 23 and TGF-beta, recruit neutrophils against fungi and extracellular bacteria.", "Regulatory T cell loss would cause excess inflammation and autoimmunity, not failure to form granulomas.", "Antibody levels and class switching are normal, which argues that T follicular helper cells and germinal centers are working.", "Correct: without IL-12 signaling, CD4 T cells do not become IFN-gamma-producing Th1 cells, so macrophages are never activated to kill intracellular bacteria or form granulomas."], "objective": "IL-12 from dendritic cells polarizes naive CD4 T cells into Th1 cells (T-bet), whose interferon gamma activates macrophages to kill intracellular bacteria and form granulomas.", "table": "<table class=\"\"><tr><th>Subset<\/th><th>Polarizing signal<\/th><th>Transcription factor<\/th><th>Effector cytokines<\/th><th>Main job<\/th><\/tr><tr><td>Th1<\/td><td>IL-12, IFN-gamma<\/td><td>T-bet<\/td><td>IFN-gamma, TNF<\/td><td>Activate macrophages; intracellular bacteria<\/td><\/tr><tr><td>Th2<\/td><td>IL-4<\/td><td>GATA-3<\/td><td>IL-4, IL-5, IL-13<\/td><td>IgE, eosinophils; helminths<\/td><\/tr><tr><td>Th17<\/td><td>IL-6, IL-23, TGF-beta<\/td><td>ROR-gamma-t<\/td><td>IL-17, IL-22<\/td><td>Neutrophils; fungi, extracellular bacteria<\/td><\/tr><tr><td>Treg<\/td><td>TGF-beta, IL-2<\/td><td>FOXP3<\/td><td>IL-10, TGF-beta<\/td><td>Suppression<\/td><\/tr><\/table>"}, {"qid": "15-16-5", "topic": "Wiskott-Aldrich syndrome and the immunological synapse", "stem": "<p>A 2-year-old boy has had eczema since infancy, recurrent ear infections and episodes of bloody diarrhea. He bruises easily and has scattered petechiae. His platelet count is 28,000/uL (normal 150,000 to 400,000), and the platelets are smaller than normal on the blood smear. His maternal uncle had a similar illness. When his cytotoxic T cells are mixed with virus-infected target cells in culture, they bind the targets but kill them poorly.<\/p>", "lead": "The poor killing is best explained by a defect in which process?", "choices": ["Display of MHC class I by the infected target cells", "Synthesis of perforin and granzymes inside the cytotoxic T cell", "Actin reorganization that aims granules at the target", "Rearrangement of T cell receptor genes in the thymus", "Peptide transport into the endoplasmic reticulum"], "answer": 2, "explanation": "<p>Eczema, recurrent infections and small, low platelets (microthrombocytopenia) in a boy with an affected maternal uncle form the triad of Wiskott-Aldrich syndrome, an X-linked defect in the Wiskott-Aldrich syndrome protein (WASp). WASp links receptor signaling to the actin cytoskeleton in blood cells, which explains why platelets, lymphocytes and other leukocytes are all affected.<\/p><p>When a cytotoxic T cell (CTL) recognizes its target, it reorganizes its actin cytoskeleton and polarizes toward the contact point, forming an immunological synapse, and its granules of perforin and granzymes are released precisely into that space. Without WASp the cell can still recognize and bind the target, but it cannot properly polarize, so granule release is poorly aimed and killing fails. Helper T cells have the same problem directing cytokines across the synapse.<\/p>", "why_wrong": ["The targets are ordinary infected cells and the CTLs do bind them, so antigen display on MHC class I is intact.", "Perforin deficiency (familial hemophagocytic lymphohistiocytosis) also impairs killing, but it does not cause eczema or small platelets.", "Correct: WASp deficiency prevents the actin rearrangement that polarizes the CTL and focuses granule release at the synapse.", "These T cells have functional receptors that recognize the targets, so receptor gene rearrangement worked.", "TAP defects block MHC class I loading in the target or presenting cell and reduce CD8 T cell numbers; they do not explain platelet findings."], "objective": "Wiskott-Aldrich syndrome (X-linked WASp deficiency) presents with eczema, infections and microthrombocytopenia; lymphocytes cannot reorganize actin at the immunological synapse, so cytotoxic granule and cytokine release are poorly directed."}, {"qid": "15-16-6", "topic": "Cross-presentation and CD4 T cell licensing", "stem": "<p>Mice are injected under the skin with a tumor cell line that expresses protein T. Protein T is made only by the tumor cells, not by dendritic cells (DCs), and the tumor cells never reach the lymph nodes. In normal mice, CD8 T cells that recognize a protein T peptide on major histocompatibility complex (MHC) class I appear in the draining lymph node and then kill the tumor cells. In mice depleted of CD4 T cells before the injection, no protein T-specific cytotoxic T lymphocytes (CTLs) develop. CD8 T cells from the depleted mice respond normally in culture to DCs that have been engineered to make protein T themselves.<\/p>", "lead": "The CD4 T cells are needed in this model mainly for which function?", "choices": ["Licensing DCs to present captured tumor protein on MHC class I", "Killing the tumor cells directly through Fas ligand on their surface", "Carrying tumor protein from the skin to the draining lymph node", "Helping B cells make antibody that coats and opsonizes tumor cells", "Releasing interferon gamma that raises MHC class I on tumor cells"], "answer": 0, "explanation": "<p>Naive CD8 T cells are primed in lymph nodes by DCs showing peptide on MHC class I. Normally MHC class I carries peptides from proteins made inside the presenting cell. Here protein T is made only by tumor cells that never reach the node, yet CD8 T cells are primed anyway. The DCs must therefore have captured protein T as exogenous material in the skin, carried it to the node, and routed it onto MHC class I. This is cross-presentation.<\/p><p>DCs do not cross-present efficiently on their own. CD4 helper T cells that recognize antigen on the same DC license it, turning on the cross-presentation pathway and the costimulation needed to prime CTLs. Remove CD4 T cells and the CD8 response fails, even though the CD8 cells themselves are normal, as the culture with DCs that make protein T internally shows (that route bypasses cross-presentation). Licensed cross-presentation is how CTLs arise against tumors and against viruses that do not infect DCs.<\/p>", "why_wrong": ["Correct: protein T reaches MHC class I only by cross-presentation, which requires CD4 T cell licensing of the dendritic cell.", "Killing by Fas ligand is a CTL and natural killer cell mechanism; here the problem is that CTLs are never primed.", "Dendritic cells, not T cells, carry antigen from tissue to the draining lymph node.", "Antibody and opsonization would not explain the absence of protein T-specific CD8 T cells in the node.", "Raising MHC class I on tumor cells would help killing in the tissue, but the defect is earlier, at CD8 priming in the node."], "objective": "Antigens not made by dendritic cells (tumor antigens, viruses that do not infect DCs) reach MHC class I only by cross-presentation, which requires CD4 helper T cells to license the dendritic cell before it can prime CD8 cytotoxic T cells."}, {"qid": "15-16-7", "topic": "T-dependent versus T-independent antigens", "stem": "<p>In an experiment, normal mice and mice with no thymus (and therefore no mature T cells) are each immunized twice, 4 weeks apart, with either a purified bacterial capsular polysaccharide or a soluble foreign protein. Serum antibody is measured 1 week after the second dose:<\/p><table class=\"labs\"><tr><th>Antigen<\/th><th>Normal mice<\/th><th>Mice with no thymus<\/th><\/tr><tr><td>Polysaccharide<\/td><td>IgM, low affinity, same level after dose 2 as after dose 1<\/td><td>IgM, low affinity, same level after dose 2 as after dose 1<\/td><\/tr><tr><td>Protein<\/td><td>High-affinity IgG, much higher after dose 2<\/td><td>None detected<\/td><\/tr><\/table>", "lead": "Which statement best explains the response to the polysaccharide?", "choices": ["Germinal centers generate memory B cells that are reused after the second dose", "Polysaccharide peptides are presented to helper T cells on MHC class II", "Marginal zone B cells respond to repetitive epitopes without T cell help", "Follicular B cells switch isotype after binding the polysaccharide", "Natural killer cells provide CD40 ligand to polysaccharide-specific B cells"], "answer": 2, "explanation": "<p>The polysaccharide response is identical with or without a thymus, so it needs no T cells. It also never matures: it stays IgM, stays low affinity, and the second dose gives no boost. Those are the features of a T-independent response, made mainly by marginal zone B cells (and B1 cells), which can be activated by polymeric antigens such as capsular polysaccharides that cross-link many B cell receptors at once.<\/p><p>The protein response is the opposite. Proteins are processed into peptides that B cells present on MHC class II to helper T cells, which supply CD40 ligand and cytokines. That help drives germinal centers, class switching, affinity maturation and memory, so the protein response is absent without T cells and much stronger after a second dose. Polysaccharides cannot be presented on MHC, so they cannot recruit that help.<\/p>", "why_wrong": ["Germinal centers and B cell memory require T cell help; the polysaccharide response shows no boost and no switching.", "Polysaccharides are not peptides and are not presented on MHC class II, which is why they cannot recruit T cell help.", "Correct: polymeric antigens activate marginal zone B cells without T cells, giving low-affinity IgM with little memory.", "Follicular B cells make T-dependent responses; the polysaccharide response stays IgM and does not change in mice lacking T cells.", "CD40 ligand comes from activated helper T cells, and these antibody responses do not depend on natural killer cells."], "objective": "T-independent antigens such as capsular polysaccharides activate marginal zone B cells without T cell help, giving low-affinity IgM, little class switching and little memory; protein (T-dependent) antigens need helper T cells for switching, affinity maturation and memory."}, {"qid": "15-16-8", "topic": "Natural antibodies and B1 cells", "stem": "<p>Serum from a healthy newborn is tested at birth. It contains IgM antibodies that bind several bacterial cell wall components, phospholipids and double-stranded DNA, each with low affinity. Because IgM does not cross the placenta, these antibodies were made by the infant. In a parallel experiment, mice raised entirely germ-free, never exposed to microbes, also have serum IgM of this kind. Treatment that removes peritoneal B cells of the innate-like B1 type sharply lowers these antibodies, while removing follicular B cells does not.<\/p>", "lead": "Which statement best describes these antibodies?", "choices": ["They come from memory B cells generated during fetal infection", "They are secreted spontaneously as a polyreactive first line of defense", "They result from germinal center responses to maternal antigens", "They are high-affinity antibodies made after T cell help in the fetus", "They are maternal antibodies carried across the placenta by Fc receptors"], "answer": 1, "explanation": "<p>Antibodies present at birth and in germ-free mice were made without any exposure to the antigens they bind. They are IgM, low affinity and polyreactive (binding microbial components and some self molecules such as phospholipids and DNA), and they depend on B1 cells rather than follicular B cells. These are natural antibodies.<\/p><p>Natural antibodies are secreted spontaneously, form a significant share of circulating immunoglobulin, and act as an innate-like first line of antibody protection before any specific response develops. They also include the antibodies against the A and B blood group antigens, which is why they matter in transfusion reactions and transplant rejection.<\/p>", "why_wrong": ["Memory B cells require prior antigen exposure and germinal centers; germ-free mice have these antibodies without exposure.", "Correct: natural antibodies are spontaneously secreted, low-affinity, polyreactive IgM, made mainly by B1 cells without antigen stimulation.", "Germinal center responses produce switched, high-affinity antibody, not low-affinity IgM.", "These antibodies are low affinity and polyreactive, the opposite of a T-dependent, affinity-matured response.", "IgM does not cross the placenta; only maternal IgG does, so this IgM is the infant's own."], "objective": "Natural antibodies are mostly low-affinity, polyreactive IgM secreted spontaneously by B1 (and possibly marginal zone) B cells without antigen exposure; they include anti-A and anti-B blood group antibodies."}, {"qid": "15-16-9", "topic": "Primary versus secondary antibody responses", "stem": "<p>In an experiment, a mouse is immunized with a protein antigen in adjuvant and boosted with the same protein 6 weeks later. Serum antibody to the protein is measured:<\/p><table class=\"labs\"><tr><th>Feature<\/th><th>After first dose<\/th><th>After booster<\/th><\/tr><tr><td>Lag before antibody appears<\/td><td>About 7 days<\/td><td>About 2 days<\/td><\/tr><tr><td>Peak titer<\/td><td>1:400<\/td><td>1:50,000<\/td><\/tr><tr><td>Main isotype<\/td><td>IgM<\/td><td>IgG<\/td><\/tr><tr><td>Average affinity<\/td><td>Low<\/td><td>High<\/td><\/tr><\/table>", "lead": "The faster, larger response after the booster is mainly produced by which cells?", "choices": ["Naive follicular B cells meeting the protein for the first time", "B1 cells spontaneously releasing natural antibodies", "Short-lived plasma cells left in the lymph node from the first dose", "Memory B cells formed in germinal centers after the first dose", "Marginal zone B cells activated without T cell help"], "answer": 3, "explanation": "<p>The booster response differs from the first response in every feature: shorter lag, far higher titer, IgG instead of IgM, and higher affinity. These are the hallmarks of a secondary (memory) response to a T-dependent antigen.<\/p><p>During the first response, germinal centers produced class-switched, somatically mutated, high-affinity B cells, and some of them became long-lived memory B cells. Memory cells are more numerous than the original naive clone and are already switched and affinity-selected, so on re-exposure they are recruited quickly and differentiate into plasma cells making high-affinity IgG within days. Naive cells, by contrast, need about a week and start with IgM.<\/p>", "why_wrong": ["Naive B cells give the slow, low-affinity IgM pattern seen after the first dose, not the booster pattern.", "Natural antibodies are made without immunization and do not rise sharply after a booster.", "Short-lived plasma cells from the first response die within weeks and cannot expand on re-exposure.", "Correct: germinal-center-derived memory B cells are switched and high affinity and respond quickly and strongly on re-exposure.", "Marginal zone B cells give T-independent responses with limited memory, and the protein here is a T-dependent antigen."], "objective": "Secondary responses to protein antigens come from germinal-center-derived memory B cells and are faster, larger, class switched (IgG, IgA or IgE) and higher in affinity than the IgM-dominated primary response.", "table": "<table><tr><th>Feature<\/th><th>Primary<\/th><th>Secondary<\/th><\/tr><tr><td>Lag<\/td><td>About a week<\/td><td>A few days<\/td><\/tr><tr><td>Magnitude<\/td><td>Smaller<\/td><td>Much larger<\/td><\/tr><tr><td>Isotype<\/td><td>Mostly IgM<\/td><td>IgG, IgA or IgE<\/td><\/tr><tr><td>Affinity<\/td><td>Lower<\/td><td>Higher<\/td><\/tr><tr><td>Responding cells<\/td><td>Naive B cells<\/td><td>Memory B cells<\/td><\/tr><\/table>"}, {"qid": "15-16-10", "topic": "Class switch recombination preserves specificity", "stem": "<p>In an experiment, a single antigen-specific B cell clone from a germinal center is followed. The cells first secrete IgM, then later secrete IgA. Both antibodies bind the same epitope with the same variable region sequence. DNA from the IgA-secreting cells shows that the constant region genes for mu, delta, gamma and the segment of DNA between the mu and alpha switch regions are missing from the expressed heavy chain chromosome. Before the change, germline transcripts of the alpha constant gene were detected.<\/p>", "lead": "Which statement best describes how this change in isotype occurred?", "choices": ["Alternative RNA splicing of a single primary transcript", "Somatic hypermutation of the heavy chain variable region", "A new VDJ rearrangement guided by recombination signal sequences", "Recombination between switch regions with loss of the DNA between", "Reactivation of RAG proteins and rearrangement of a new light chain"], "answer": 3, "explanation": "<p>The clone kept the same variable region, so the same antigen specificity, while trading its IgM constant region for IgA. The DNA has lost the stretch between the mu and alpha switch regions, and the alpha gene was transcribed (in germline form) beforehand. This is class switch recombination.<\/p><p>Heavy chain constant region genes sit in a cluster downstream of the VDJ segment, each preceded by a long, repetitive switch region. Helper T cell cytokines open a chosen constant gene for germline transcription; activation-induced deaminase (AID) then creates DNA breaks at the mu switch region and the target switch region, the intervening DNA loops out and is deleted, and the rearranged VDJ is joined to the new constant gene. Because the change is a deletion, it cannot be reversed back to IgM.<\/p>", "why_wrong": ["Alternative splicing switches an antibody from membrane-bound to secreted form without any loss of DNA, unlike the deletion seen here.", "Somatic hypermutation alters the variable region by point mutations, but the variable region here is unchanged.", "A new VDJ rearrangement would change specificity and uses recombination signal sequences, not switch regions.", "Correct: AID-driven recombination between switch regions deletes the intervening constant genes and joins VDJ to the alpha gene.", "RAG reactivation with new light chain rearrangement is receptor editing in immature B cells and changes specificity, not isotype."], "objective": "Class switching is an AID-mediated DNA recombination between switch regions, guided by cytokine-induced germline transcription, that deletes the intervening constant genes and changes isotype without changing VDJ specificity."}, {"qid": "15-16-11", "topic": "Extrafollicular versus germinal center responses and long-lived plasma cells", "stem": "<p>In an experiment, mice are engineered so that CD4+ T cells cannot express the transcription factor BCL6. Other helper T cell subsets develop normally. The mice are immunized with a protein antigen in adjuvant:<\/p><table class=\"labs\"><tr><th>Finding<\/th><th>Normal mice<\/th><th>Engineered mice<\/th><\/tr><tr><td>Antibody-secreting cells in lymph node medullary cords, day 7<\/td><td>Present<\/td><td>Present<\/td><\/tr><tr><td>Serum antibody, day 10<\/td><td>IgM and some IgG, low affinity<\/td><td>IgM and some IgG, low affinity<\/td><\/tr><tr><td>Secondary follicles with germinal centers, day 14<\/td><td>Many<\/td><td>None<\/td><\/tr><tr><td>Serum antibody, month 6<\/td><td>High-affinity IgG, stable titer<\/td><td>Undetectable<\/td><\/tr><\/table>", "lead": "Which cell population is most likely missing in the engineered mice at month 6?", "choices": ["Short-lived plasma cells in the lymph node medullary cords", "Marginal zone B cells in the splenic marginal zone", "Naive follicular B cells in primary follicles", "B1 cells secreting natural antibodies", "Long-lived plasma cells in bone marrow niches"], "answer": 4, "explanation": "<p>BCL6 is the transcription factor that makes activated CD4+ T cells into T follicular helper cells, the helpers that enter B cell follicles and sustain germinal centers. The engineered mice still mount the early extrafollicular response (antibody-secreting cells in the medullary cords, low-affinity IgM with a little IgG), but they never form germinal centers.<\/p><p>The early extrafollicular response produces short-lived plasma cells that stay local and die within weeks, so it cannot keep antibody in the serum for months. Long-lived plasma cells come out of the germinal center reaction, migrate to bone marrow niches that supply survival signals, and secrete high-affinity antibody for years. Without germinal centers there are no long-lived plasma cells, so the titer falls to nothing.<\/p>", "why_wrong": ["Short-lived plasma cells came from the extrafollicular response, which was intact; they are expected to be gone by month 6 in both groups.", "Marginal zone B cells make T-independent responses and do not depend on follicular helper T cells.", "Naive follicular B cells are present before immunization and are not created by germinal centers.", "B1 cells make natural antibodies spontaneously and do not depend on T cell help.", "Correct: without follicular helper T cells there are no germinal centers, so no long-lived bone marrow plasma cells form to sustain titers."], "objective": "Extrafollicular responses make short-lived, low-affinity plasma cells that stay local, while germinal center responses, which need follicular helper T cells, produce long-lived plasma cells that home to bone marrow and sustain antibody titers.", "table": "<table><tr><th>Feature<\/th><th>Extrafollicular<\/th><th>Germinal center<\/th><\/tr><tr><td>T cell help<\/td><td>Extrafollicular helper T cells<\/td><td>Follicular helper T cells<\/td><\/tr><tr><td>Switching and hypermutation<\/td><td>A little<\/td><td>A lot<\/td><\/tr><tr><td>Affinity<\/td><td>Low<\/td><td>High<\/td><\/tr><tr><td>Plasma cells<\/td><td>Short-lived, stay local<\/td><td>Long-lived, migrate to bone marrow<\/td><\/tr><tr><td>Memory B cells<\/td><td>Few<\/td><td>Yes<\/td><\/tr><\/table>"}, {"qid": "15-16-12", "topic": "Inhibitory Fc gamma receptor IIB and antibody feedback", "stem": "<p>In normal mice, injecting a protein antigen together with preformed IgG antibody to that protein produces a much smaller antibody response than injecting the protein alone. In knockout mice lacking one Fc receptor, the preformed IgG has no such dampening effect. The knockout mice also make unusually large late antibody responses to routine immunizations and, with age, develop antibodies to double-stranded DNA. Isolated knockout B cells show prolonged calcium signaling when their B cell receptors are cross-linked by antigen bound to IgG.<\/p>", "lead": "Which function of the missing receptor best explains these findings?", "choices": ["Inhibiting B cell receptor signaling when IgG immune complexes bind", "Transporting maternal IgG across the placenta to the fetus", "Triggering natural killer cell killing of antibody-coated cells", "Binding IgE to arm mast cells for degranulation", "Activating macrophage phagocytosis of IgG-coated particles"], "answer": 0, "explanation": "<p>The missing receptor normally lets antibody already made against an antigen turn down further B cell activation (antibody feedback), it limits the size of late responses, and it keeps self-reactive B cells from making autoantibodies. Its loss also prolongs signaling when the B cell receptor is engaged by antigen that carries IgG. That describes the inhibitory Fc gamma receptor IIB on B cells.<\/p><p>When an IgG-antigen immune complex binds both the B cell receptor and Fc gamma receptor IIB on the same cell, the inhibitory receptor damps the activating signal. This becomes important late in a response, when IgG levels are high, and it is one of the mechanisms proposed for how high-dose intravenous immunoglobulin calms some autoimmune and inflammatory diseases.<\/p>", "why_wrong": ["Correct: Fc gamma receptor IIB on B cells inhibits B cell receptor signaling when IgG immune complexes co-engage it, providing antibody feedback regulation.", "Placental IgG transport is mediated by the neonatal Fc receptor and does not regulate B cell signaling.", "Antibody-dependent killing by natural killer cells uses the activating Fc gamma receptor III (CD16).", "Arming mast cells with IgE uses Fc epsilon receptor I, which plays no role in IgG feedback.", "Phagocytosis of IgG-coated particles uses activating Fc gamma receptors on macrophages, and its loss would weaken, not enlarge, responses."], "objective": "The inhibitory Fc gamma receptor IIB on B cells dampens B cell receptor signaling when IgG immune complexes bind, limiting late antibody responses and autoantibody production; activating Fc receptors (Fc gamma RI, Fc gamma RIII/CD16) drive phagocytosis and antibody-dependent cytotoxicity."}, {"qid": "15-16-13", "topic": "Th2 polarization in helminth immunity", "stem": "<p>In an experiment, mice are engineered so that naive CD4+ T cells cannot express the transcription factor induced in them by interleukin (IL)-4 during priming. The mice are infected with an intestinal helminth. Compared with normal mice, they have:<\/p><table class=\"labs\"><tr><th>Finding<\/th><th>Normal mice<\/th><th>Engineered mice<\/th><\/tr><tr><td>Serum IgE<\/td><td>Markedly increased<\/td><td>Undetectable<\/td><\/tr><tr><td>Blood eosinophils<\/td><td>Markedly increased<\/td><td>Normal (low)<\/td><\/tr><tr><td>Interferon-gamma from CD4+ T cells<\/td><td>Low<\/td><td>Increased<\/td><\/tr><tr><td>Worms in the gut, day 21<\/td><td>Cleared<\/td><td>Many remain<\/td><\/tr><\/table>", "lead": "Loss of which cytokine from the missing cells best explains the eosinophil finding?", "choices": ["Interleukin-17", "Interleukin-5", "Interleukin-12", "Interleukin-10", "Interferon-gamma"], "answer": 1, "explanation": "<p>IL-4 during priming induces GATA-3, the transcription factor that directs naive CD4+ T cells into T helper 2 cells. Without it, the mice cannot make T helper 2 cells, and the T cells drift toward the T helper 1 profile instead (more interferon-gamma). The missing T helper 2 response explains each finding: no IgE, no eosinophils and failure to clear the worms.<\/p><p>T helper 2 cells make IL-4, IL-5 and IL-13. IL-4 (with IL-13) drives B cells to switch to IgE, while IL-5 is the cytokine that recruits and activates eosinophils. Together these type 2 responses, along with alternatively activated (M2) macrophages, are how the body expels helminths.<\/p>", "why_wrong": ["IL-17 comes from T helper 17 cells and recruits neutrophils, not eosinophils.", "Correct: T helper 2 cells make IL-5, which recruits and activates eosinophils; losing T helper 2 cells removes it.", "IL-12 is made by dendritic cells and macrophages to drive T helper 1 differentiation, not by the missing T cells.", "IL-10 is a regulatory cytokine that suppresses responses and does not drive eosinophilia.", "Interferon-gamma is a T helper 1 cytokine, and it is actually increased in these mice."], "objective": "IL-4 induces GATA-3 and T helper 2 differentiation; T helper 2 cells make IL-4 and IL-13 (IgE switching) and IL-5 (eosinophil recruitment and activation), which together clear helminths."}, {"qid": "15-16-14", "topic": "AID, RAG and translocations in B cell malignancy", "stem": "<p>Two B cell lymphoma cell lines are studied. Line 1 came from a tumor of germinal center B cells; its cells carry heavily mutated variable regions, and a chromosome translocation joins the MYC oncogene to a switch region of the immunoglobulin heavy chain locus on chromosome 14. Line 2 carries a translocation that joins the BCL2 gene to a heavy chain joining (J) segment at the site where VDJ recombination normally occurs, an event dated to the earliest stages of B cell development in the bone marrow.<\/p>", "lead": "The DNA breaks behind the translocation in line 1 were most likely made by which enzyme?", "choices": ["Recombination-activating gene (RAG) proteins", "Terminal deoxynucleotidyl transferase", "Activation-induced deaminase", "Bruton tyrosine kinase", "Calcineurin"], "answer": 2, "explanation": "<p>Line 1 came from germinal center B cells, shows heavy somatic hypermutation and has its breakpoint in a heavy chain switch region. Both somatic hypermutation and class switch recombination are driven by activation-induced deaminase (AID), which deaminates cytosine to uracil and triggers DNA repair that can leave double-strand breaks. Occasionally such a break is joined to another chromosome, such as at MYC, producing the t(8;14) translocation.<\/p><p>Line 2 shows the other source of risk. Its breakpoint is at a J segment, where RAG proteins cut DNA during VDJ recombination in developing B cells, as in the t(14;18) translocation that places BCL2 under heavy chain control. Every stage at which B cells deliberately break their own DNA is a window for malignant transformation.<\/p>", "why_wrong": ["RAG proteins cut DNA at recombination signal sequences during VDJ recombination in the bone marrow, the mechanism behind line 2, not a switch region break in a germinal center cell.", "Terminal deoxynucleotidyl transferase adds nucleotides at VDJ junctions and does not create the breaks.", "Correct: AID acts in germinal center B cells, causing switch region and variable region DNA damage that can produce MYC translocations.", "Bruton tyrosine kinase is a signaling enzyme downstream of the B cell receptor and does not cut DNA.", "Calcineurin is a phosphatase in T cell receptor signaling that drives IL-2 production, not a DNA-modifying enzyme."], "objective": "Programmed DNA breaks make B cells prone to translocations: RAG during VDJ recombination (for example t(14;18), BCL2) and AID during class switching and somatic hypermutation in germinal centers (for example t(8;14), MYC)."}, {"qid": "15-16-15", "topic": "IL-2 and the high-affinity IL-2 receptor in clonal expansion", "stem": "<p>In an experiment, naive CD4+ T cells are stimulated with antibodies that engage both the T cell receptor and CD28. Cultures are run with or without a drug added at the start:<\/p><table class=\"labs\"><tr><th>Finding at 72 hours<\/th><th>No drug<\/th><th>Drug<\/th><th>Drug plus added interleukin (IL)-2<\/th><\/tr><tr><td>IL-2 messenger RNA<\/td><td>High<\/td><td>Absent<\/td><td>Absent<\/td><\/tr><tr><td>CD25 (IL-2 receptor alpha chain)<\/td><td>High<\/td><td>Low<\/td><td>High<\/td><\/tr><tr><td>Proliferation<\/td><td>Strong<\/td><td>None<\/td><td>Strong<\/td><\/tr><\/table>", "lead": "The drug most likely acts by which mechanism?", "choices": ["Blocking CD28 binding to B7 molecules", "Blocking signaling downstream of the IL-2 receptor", "Depleting T cells that express CD25", "Preventing T cell receptor binding to MHC", "Inhibiting calcineurin so IL-2 is not transcribed"], "answer": 4, "explanation": "<p>The drug stops IL-2 gene transcription even though both signal 1 and signal 2 were delivered by antibodies, and it leaves the cells able to respond to IL-2 once IL-2 is supplied. So the block is upstream of IL-2 production, inside the T cell, not at the receptor or the costimulatory step. This is what cyclosporine does: it inhibits calcineurin, the phosphatase that activates the transcription factor for the IL-2 gene after T cell receptor signaling.<\/p><p>Primed T cells depend on IL-2 acting in an autocrine and paracrine way, together with upregulation of CD25 to form the high-affinity IL-2 receptor, to drive clonal expansion. Without IL-2, CD25 stays low and the clone does not expand, which is why drugs targeting these steps are used against graft rejection and some autoimmune diseases.<\/p>", "why_wrong": ["CD28 was engaged directly by antibody, so a drug blocking B7 binding would not prevent the response here.", "Added IL-2 restored proliferation, so IL-2 receptor signaling is intact; rapamycin-type drugs act at that later step.", "Depleting CD25-positive cells would not prevent IL-2 transcription, and added IL-2 could not rescue absent cells.", "The T cell receptor was engaged by antibody without MHC, so blocking MHC binding would not explain the result.", "Correct: calcineurin inhibition prevents IL-2 transcription, and adding back IL-2 restores CD25 and proliferation."], "objective": "After priming, T cells make IL-2 and upregulate CD25 (the high-affinity IL-2 receptor) to drive clonal expansion; calcineurin inhibitors such as cyclosporine block IL-2 transcription, while other drugs block the IL-2 receptor or proliferation."}, {"qid": "15-16-16", "topic": "Th17 cells, IL-17 and fungal defense", "stem": "<p>In an experiment, mice are engineered so that naive CD4+ T cells cannot express the transcription factor induced by IL-6 and transforming growth factor beta during priming. The mice are given an oral Candida infection. Compared with normal mice:<\/p><table class=\"labs\"><tr><th>Finding, day 5<\/th><th>Normal mice<\/th><th>Engineered mice<\/th><\/tr><tr><td>Interferon-gamma from CD4+ T cells<\/td><td>Present<\/td><td>Present<\/td><\/tr><tr><td>IL-4 from CD4+ T cells<\/td><td>Low<\/td><td>Low<\/td><\/tr><tr><td>Neutrophils in oral mucosa<\/td><td>Many<\/td><td>Few<\/td><\/tr><tr><td>Candida burden in oral mucosa<\/td><td>Low<\/td><td>High<\/td><\/tr><\/table>", "lead": "The persistence of Candida is best explained by the loss of which effector function?", "choices": ["Neutrophil recruitment driven by IL-17", "Macrophage activation driven by interferon-gamma", "IgE class switching driven by IL-4", "Eosinophil activation driven by IL-5", "Immune suppression driven by IL-10"], "answer": 0, "explanation": "<p>IL-6 and transforming growth factor beta (with IL-23) during priming induce ROR-gamma-t, the transcription factor for T helper 17 cells. These mice keep their T helper 1 cytokine (interferon-gamma) and their low T helper 2 cytokine (IL-4), so only the T helper 17 subset is missing.<\/p><p>T helper 17 cells make IL-17 and IL-22, pro-inflammatory cytokines that recruit and activate neutrophils (and macrophages). That response is protective against extracellular organisms, especially fungi such as Candida, and against extracellular bacteria. Without it, neutrophils fail to reach the mucosa and the fungus persists. The same link explains the chronic candidiasis seen in people with autoantibodies to IL-17.<\/p>", "why_wrong": ["Correct: without T helper 17 cells there is no IL-17 to recruit neutrophils, which are essential against Candida.", "Interferon-gamma is still produced normally, so macrophage activation by T helper 1 cells is intact.", "IgE switching by IL-4 is a T helper 2 function aimed at parasites and is low in both groups.", "Eosinophil activation by IL-5 is a T helper 2 function and is not the defense against fungi.", "IL-10 is suppressive; losing it would increase inflammation, and regulatory T cells use a different transcription factor."], "objective": "IL-6, transforming growth factor beta and IL-23 induce ROR-gamma-t and T helper 17 cells, whose IL-17 and IL-22 recruit neutrophils and protect against fungi and extracellular bacteria."}, {"qid": "15-16-17", "topic": "Perforin deficiency and cytotoxic killing", "stem": "<p>A 5-month-old boy has 3 weeks of fever after a viral illness, a markedly enlarged liver and spleen, and low counts of all blood cell lines. An older brother died of a similar illness in infancy. He has normal skin and hair color. His serum shows very high levels of inflammatory cytokines. Studies of his blood lymphocytes:<\/p><table class=\"labs\"><tr><th>Test<\/th><th>Result<\/th><\/tr><tr><td>Natural killer and CD8+ T cell numbers<\/td><td>Normal<\/td><\/tr><tr><td>Conjugate formation with target cells<\/td><td>Normal<\/td><\/tr><tr><td>Granzyme released into the medium on contact<\/td><td>Normal<\/td><\/tr><tr><td>Lysis of target cells<\/td><td>Absent<\/td><\/tr><\/table>", "lead": "Which step of cytotoxic killing is most likely defective in this patient?", "choices": ["Fusion of cytotoxic granules with the cell membrane", "Formation of pores that let granzymes enter targets", "Actin reorganization that polarizes the granules", "Recognition of target cells lacking MHC class I", "Expression of Fas ligand on the killer cell surface"], "answer": 1, "explanation": "<p>An infant with prolonged fever, hepatosplenomegaly, cytopenias and a cytokine storm, with a sibling who died the same way, fits familial hemophagocytic lymphohistiocytosis. His natural killer and CD8+ cytotoxic T cells are present, bind targets and release granzyme, but nothing dies. The defect is therefore at the final delivery step, which in the classic form of the disease is a mutation in perforin.<\/p><p>Perforin, released with granzymes, forms pores in the target cell membrane so granzymes can enter and trigger apoptosis. Without perforin, infected cells and activated antigen-presenting cells are not eliminated, antigen persists, and T cells and macrophages stay activated, which drives the uncontrolled systemic inflammation. Natural killer cells and cytotoxic T cells share this killing machinery, so both fail together.<\/p>", "why_wrong": ["Granule fusion fails in Chediak-Higashi syndrome, but here granzyme is released normally and pigment is normal.", "Correct: granzymes are released but cannot enter targets without perforin pores, the defect in familial hemophagocytic lymphohistiocytosis.", "Actin polarization fails in Wiskott-Aldrich syndrome, but these cells form conjugates and release granules toward targets.", "Missing-self recognition applies only to natural killer cells, and the CD8+ T cells fail as well.", "Fas ligand gives a second, granule-independent killing route; its loss would not abolish granule-mediated lysis."], "objective": "Cytotoxic T cells and natural killer cells kill through perforin pores that let granzymes enter targets (and through Fas ligand); perforin deficiency causes familial hemophagocytic lymphohistiocytosis with uncontrolled T cell and macrophage activation.", "table": "<table><tr><th>Disorder<\/th><th>Defective step<\/th><\/tr><tr><td>Wiskott-Aldrich syndrome<\/td><td>Actin reorganization and granule polarization at the synapse<\/td><\/tr><tr><td>Chediak-Higashi syndrome<\/td><td>Granule exocytosis (fusion)<\/td><\/tr><tr><td>Familial hemophagocytic lymphohistiocytosis<\/td><td>Perforin pore formation<\/td><\/tr><\/table>"}, {"qid": "15-16-18", "topic": "Antiviral defense: type I interferon, NK cells and CTLs", "stem": "<p>In an experiment, normal mice and mice lacking the receptor for interferon-alpha and interferon-beta are infected with the same dose of a virus. In normal mice, viral titers rise slowly over the first 3 days, natural killer cell activity in the spleen peaks on day 3, virus-specific cytotoxic T cells appear around day 7, and the virus is cleared by day 10. In the knockout mice, viral titers in the liver and spleen are 1,000 times higher by day 2, and uninfected liver cells near infected ones show no increase in MHC class I. Most knockout mice die before day 6.<\/p>", "lead": "Which defense most likely failed in the knockout mice?", "choices": ["Priming of CD8+ T cells by cross-presenting dendritic cells", "Killing of infected cells by Fas ligand on cytotoxic T cells", "Neutralizing IgG produced by long-lived plasma cells", "Help from CD4+ T cells to virus-specific B cells", "An antiviral state induced in neighboring uninfected cells"], "answer": 4, "explanation": "<p>The knockout mice fail in the first 2 days, long before cytotoxic T cells or antibodies could appear, and their uninfected cells do not raise MHC class I. Both point to loss of type I interferon signaling, the earliest antiviral defense.<\/p><p>Infected cells release interferon-alpha and interferon-beta, which act on nearby cells to induce the antiviral state: viral replication is inhibited and MHC class I is upregulated. Natural killer cells then kill infected cells over the next few days, and finally virus-specific cytotoxic T cells and antibodies clear the infection and leave memory. Without the first step, the virus outruns the slower adaptive response.<\/p>", "why_wrong": ["Cross-presentation primes cytotoxic T cells around day 7, too late to explain uncontrolled virus by day 2.", "Cytotoxic T cells are not yet present on day 2, so loss of their killing could not cause this early failure.", "Long-lived plasma cells need a germinal center response and take weeks to form in a primary infection.", "CD4+ help to B cells shapes antibody responses later in infection, not viral control in the first 2 days.", "Correct: without the type I interferon receptor, neighboring cells cannot enter the antiviral state or raise MHC class I."], "objective": "In a primary viral infection, type I interferons first induce an antiviral state (blocked viral replication, increased MHC class I), natural killer cells then kill infected cells, and cytotoxic T cells and antibodies finally clear the virus and provide memory."}]}, {"id": "17", "title": "Vaccine Mechanisms", "week": 3, "subject": "Immunology", "questions": [{"qid": "17-1", "topic": "Conjugate vaccines", "stem": "<p>A study compares two Haemophilus influenzae type b (Hib) vaccines in healthy 12-month-old children. One contains purified Hib capsular polysaccharide alone. The other contains the same polysaccharide chemically linked to tetanus toxoid. Serum antibody against the capsular polysaccharide is measured after each dose.<\/p><table class=\"labs\"><tr><th>Measurement<\/th><th>Polysaccharide alone<\/th><th>Polysaccharide linked to toxoid<\/th><\/tr><tr><td>Anti-capsule IgM after dose 1<\/td><td>Low<\/td><td>Moderate<\/td><\/tr><tr><td>Anti-capsule IgG after dose 1<\/td><td>Very low<\/td><td>Moderate<\/td><\/tr><tr><td>Anti-capsule IgG after a booster dose<\/td><td>No rise<\/td><td>Large, rapid rise<\/td><\/tr><\/table>", "lead": "Which mechanism best explains the response to the linked vaccine?", "choices": ["The toxoid acts as an adjuvant that triggers the inflammasome", "Marginal zone B cells form memory cells without T cell help", "Antibodies made to the toxoid cross-react with the capsule", "Toxoid peptides on capsule-specific B cells recruit T cell help", "The toxoid lets the capsule itself be shown on MHC class II to T cells"], "answer": 3, "explanation": "<p>A purified polysaccharide is a T-independent antigen. It can cross-link B cell receptors on marginal zone B cells, but it cannot be processed into peptides for major histocompatibility complex (MHC) molecules, so no helper T cells are recruited. The result is mostly low-affinity IgM, little class switching and no memory, which is why a booster gives no rise. Young children respond especially poorly to T-independent antigens, which is why they are at risk from encapsulated bacteria.<\/p><p>Linking the polysaccharide to a protein carrier changes the pathway. A B cell whose receptor binds the capsule internalizes the whole conjugate and presents peptides of the tetanus toxoid on MHC class II. Toxoid-specific helper T cells recognize those peptides and give that capsule-specific B cell help: class switching to IgG, germinal centers, affinity maturation and memory, seen as the strong booster response. The antibody is still against the capsule; the carrier simply supplies the T cell epitopes. This is how conjugate vaccines (Hib, pneumococcal conjugate, meningococcal ACWY) protect young children.<\/p>", "why_wrong": ["Adjuvants such as alum boost responses through local inflammation, but they do not convert a T-independent response into a T-dependent one with memory.", "Marginal zone B cells make T-independent antibody with limited memory, which is the poor pattern of the polysaccharide-alone vaccine.", "Toxoid antibodies bind the toxoid; the rising IgG measured here is specific for the capsular polysaccharide.", "Correct: capsule-specific B cells take up the conjugate and present carrier peptides on MHC class II, recruiting toxoid-specific helper T cells for switching and memory.", "Polysaccharides are not presented on MHC class II; T cells recognize only the carrier peptides, not the capsule."], "objective": "Conjugate vaccines link a T-independent polysaccharide to a protein carrier so capsule-specific B cells can present carrier peptides to helper T cells, producing class-switched, high-affinity, memory responses even in young children.", "table": "<table class=\"\"><tr><th>Vaccine<\/th><th>Antigen<\/th><th>Response<\/th><\/tr><tr><td>Purified polysaccharide (PPSV23)<\/td><td>Polysaccharide<\/td><td>Antibody, T-independent, little memory<\/td><\/tr><tr><td>Conjugate (Hib, PCV, MenACWY)<\/td><td>Polysaccharide + protein carrier<\/td><td>Antibody, T-dependent, memory<\/td><\/tr><tr><td>Inactivated, subunit, toxoid<\/td><td>Protein<\/td><td>Antibody and CD4 T cells<\/td><\/tr><tr><td>Live attenuated, mRNA, viral vector<\/td><td>Protein made by host cells<\/td><td>Antibody, CD4 and CD8 T cells<\/td><\/tr><\/table>"}, {"qid": "17-2", "topic": "Live attenuated vaccines and CD8 T cell responses", "stem": "<p>Healthy adult volunteers receive either an injected whole inactivated influenza vaccine or an intranasal live attenuated influenza vaccine. Four weeks later, both groups have similar serum antibody titers against the viral hemagglutinin. Blood T cells are then stimulated with influenza peptides and tested.<\/p><table class=\"labs\"><tr><th>Measurement<\/th><th>Inactivated vaccine<\/th><th>Live attenuated vaccine<\/th><\/tr><tr><td>Influenza-specific CD4 T cells<\/td><td>Present<\/td><td>Present<\/td><\/tr><tr><td>Influenza-specific CD8 cytotoxic T cells<\/td><td>Rare<\/td><td>Readily detected<\/td><\/tr><\/table>", "lead": "Which feature of the live vaccine best explains the difference in CD8 T cell responses?", "choices": ["It contains more viral hemagglutinin per dose", "Viral proteins are made inside the host's own cells", "Its adjuvant drives stronger B7 expression on DCs", "It is given by the natural mucosal route of infection", "Its proteins are not damaged by heat or formalin"], "answer": 1, "explanation": "<p>CD8 T cells recognize peptides on major histocompatibility complex (MHC) class I, and MHC class I normally carries peptides from proteins made inside a cell. An inactivated vaccine delivers only ready-made protein. Antigen-presenting cells take it up as exogenous antigen and present it mainly on MHC class II, so the vaccine generates antibody and CD4 T cell help but few CD8 cytotoxic T cells.<\/p><p>A live attenuated virus still infects host cells and replicates, at a low rate, so viral proteins are synthesized inside those cells, including dendritic cells. That endogenous antigen enters the MHC class I pathway and primes CD8 T cells, much as a natural infection does. Nucleic acid vaccines (mRNA and viral vectors) share this property because host cells make the antigen. The same feature explains why live vaccines usually need fewer doses and little adjuvant, and why they can cause disease in an immunocompromised host.<\/p>", "why_wrong": ["Antibody titers were similar, so antigen dose is not what differs; more protein still enters the exogenous, MHC class II route.", "Correct: replicating vaccine virus makes its proteins inside host cells, so peptides reach MHC class I and prime CD8 cytotoxic T cells.", "Live attenuated vaccines generally need little or no adjuvant; their advantage comes from replication, not a stronger adjuvant.", "The mucosal route favors mucosal immunity, but what puts antigen on MHC class I is synthesis inside infected cells.", "Preserved protein shape helps antibody recognition of native epitopes, but it does not route antigen onto MHC class I."], "objective": "Live attenuated (and nucleic acid) vaccines have antigen synthesized inside host cells, so it is presented on MHC class I and primes CD8 cytotoxic T cells, whereas inactivated and subunit vaccines mainly give antibody and CD4 T cell responses."}, {"qid": "17-3", "topic": "Contraindications to live attenuated vaccines", "stem": "<p>A 34-year-old man received a kidney transplant 1 year ago. He takes cyclosporine and a corticosteroid every day to prevent rejection, and his graft function is stable. He comes for a pre-travel visit and asks which vaccines he can safely receive today. He has no fever and no allergies.<\/p>", "lead": "Which of the following vaccines should be withheld from him?", "choices": ["Recombinant hepatitis B vaccine", "Tetanus and diphtheria toxoid vaccine", "Pneumococcal conjugate vaccine", "Injected inactivated influenza vaccine", "Measles, mumps and rubella vaccine"], "answer": 4, "explanation": "<p>First, recognize his immune state. Cyclosporine inhibits calcineurin and blocks interleukin 2 production, so T cells cannot undergo the clonal expansion that drives cell-mediated immunity, and corticosteroids add broad suppression. A transplant recipient on these drugs is an immunosuppressed host.<\/p><p>Next, apply that to vaccine type. Live attenuated vaccines contain a weakened pathogen that still replicates. In a person with intact T cell immunity the replication is controlled, but in an immunosuppressed host the vaccine strain can cause active, even transmissible, infection. Measles, mumps and rubella (MMR) is a live attenuated viral vaccine, so it is withheld. Toxoid, recombinant subunit, conjugate and inactivated vaccines cannot replicate and are safe, although his response to them may be weaker. Household contacts should still receive their routine vaccines, which protects him through herd immunity.<\/p>", "why_wrong": ["Recombinant hepatitis B vaccine is a protein (virus-like particle) made in yeast and cannot replicate, so it is safe.", "Tetanus and diphtheria toxoids are inactivated toxins; nothing in them can replicate.", "Pneumococcal conjugate vaccine is polysaccharide linked to a protein carrier and is recommended for many immunosuppressed patients.", "The injected influenza vaccine is inactivated; it is the intranasal live attenuated form that is contraindicated.", "Correct: MMR is live attenuated, and replicating vaccine virus can cause disease in a host whose T cell immunity is suppressed by cyclosporine and corticosteroids."], "objective": "Live attenuated vaccines (such as MMR, varicella, intranasal influenza and oral polio) are contraindicated in immunosuppressed patients, including transplant recipients on calcineurin inhibitors, because the vaccine strain can replicate and cause disease; non-replicating vaccines remain safe."}, {"qid": "17-4", "topic": "Herd immunity and person-to-person transmission", "stem": "<p>A 6-year-old girl is seen for a school entry visit. Her parents declined all childhood vaccines. They say she does not need them because 96% of children in their town are fully vaccinated, and outbreaks there have not occurred for many years. She is healthy, and her examination is normal. She plays outdoors often and gardens with her grandmother.<\/p>", "lead": "Against which of the following infections does the high vaccination rate in her town give her the least protection?", "choices": ["Tetanus", "Measles", "Rubella", "Mumps", "Polio"], "answer": 0, "explanation": "<p>Herd immunity protects a non-immune person only when the pathogen must travel from one infected human to the next. When most of the population is immune, chains of transmission break, so the few unvaccinated people are rarely exposed. Measles, mumps, rubella and polio all spread from person to person, so a 96% vaccination rate makes her exposure to
