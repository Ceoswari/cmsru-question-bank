the functional, receptor-blocking form of type II injury. Contrast it with the other examples taught: a hemolytic reaction to a blood group antigen is the cytotoxic form, and antibody to a basement membrane component is the inflammatory form. Type III disease requires complexes forming in solution and then depositing, and type IV is T cell mediated.<\/p>", "why_wrong": ["Immunoglobulin E and mast cells produce immediate allergic reactions, which do not fit a fluctuating weakness with receptor-bound antibody.", "Correct: antibody bound to a surface receptor blocking its function is the functional form of type II hypersensitivity.", "Cell destruction was specifically absent on biopsy.", "No circulating complexes or tissue deposition were found, which excludes the type III mechanism.", "A T cell mediated reaction would not be explained by receptor-bound immunoglobulin G blocking a ligand."], "table": "<table><tr><th>Type<\/th><th>Mediator<\/th><th>Mechanism<\/th><th>Example taught<\/th><\/tr><tr><td>I<\/td><td>IgE<\/td><td>Mast cell and basophil activation<\/td><td>Allergy, systemic anaphylaxis<\/td><\/tr><tr><td>II<\/td><td>IgG against tissue antigen<\/td><td>Cell destruction, local inflammation, or altered receptor function<\/td><td>Hemolytic blood group reaction, antibody to basement membrane, receptor blockade<\/td><\/tr><tr><td>III<\/td><td>IgG or IgM with soluble antigen<\/td><td>Immune complexes deposit and activate complement<\/td><td>Local reaction after immunization in a sensitized host<\/td><\/tr><tr><td>IV<\/td><td>T cells<\/td><td>Cell-mediated<\/td><td>Not antibody mediated<\/td><\/tr><\/table>", "objective": "Type II hypersensitivity can injure by destroying cells, by causing local inflammation on extracellular antigen, or by blocking or stimulating a cell surface receptor without destroying the cell."}, {"qid": "12-14", "topic": "Complement in clearance of complexes and dead cells", "stem": "<p>A study follows people with an inherited deficiency of an early classical pathway component. They do not have an increased rate of severe bacteremic infection with encapsulated organisms, and their lytic capacity measured on antibody-coated red cells is only mildly reduced because the other pathways remain. Instead they show a high rate of a systemic autoimmune disorder with antibodies against nuclear material, and their phagocytes are slow to clear apoptotic cells and antigen-antibody complexes in vitro.<\/p>", "lead": "Which function of the missing component best explains the autoimmune risk?", "choices": ["Formation of the pore that lyses target cells", "Release of mediators that recruit neutrophils", "Stabilization of the alternative pathway convertase", "Opsonic tagging that promotes clearance of complexes and dying cells", "Transport of immunoglobulin across mucosal surfaces"], "answer": 3, "explanation": "<p>Besides killing microbes, complement does quiet housekeeping. Fragments deposited on immune complexes, cell debris and apoptotic bodies are recognized by complement receptors on phagocytes and on other cells, which promotes their uptake and removal. That clearance limits inflammation, supports tolerance and tissue repair, and also delivers antigen to antigen-presenting cells where it helps regulate the adaptive response.<\/p><p>When an early classical component is missing, this clearance function suffers even though microbial lysis is largely preserved by the other pathways. Apoptotic material accumulates and nuclear antigens persist where the immune system can respond to them, which is the accepted explanation for the strong association of early classical pathway deficiencies with systemic autoimmunity. Deficiencies of C3, properdin or the terminal components produce the opposite clinical pattern, recurrent severe infection with encapsulated organisms.<\/p>", "why_wrong": ["Pore formation is a terminal component function, and lytic capacity was only mildly reduced here.", "Neutrophil recruitment by anaphylatoxins is preserved through the other activation pathways.", "The alternative pathway convertase is stabilized by properdin, which is not an early classical component.", "Correct: complement fragments tag complexes and apoptotic cells for phagocyte clearance, and losing that promotes autoimmunity.", "Mucosal immunoglobulin transport is carried out by a transport receptor, not by complement."], "objective": "Early classical pathway components promote clearance of immune complexes and apoptotic cells, so their deficiency predisposes to systemic autoimmunity rather than to severe pyogenic infection."}]}, {"id": "2A", "title": "Cells, Molecules and Organs of the Immune System", "week": 2, "subject": "Immunology", "questions": [{"qid": "2A-1", "topic": "Monocytes as precursors", "stem": "<p>Blood leukocytes with bi-lobed nuclei, making up about 7% of white cells, are purified from a donor mouse, labeled with a fluorescent dye and injected intravenously into recipient mice. One group of recipients has an inflamed skin wound; the other has intact skin. Two days later, labeled cells are abundant in the wound but rare in normal skin. In the wound, the labeled cells no longer look like the injected cells: some are large phagocytes full of debris, and others have long branching processes and express high levels of antigen-presenting molecules.<\/p>", "lead": "Which best describes the injected cells?", "choices": ["Neutrophils that became tissue mast cells", "Lymphoid progenitors that became NK cells", "Basophils that became tissue macrophages", "Monocytes that became tissue phagocytes", "Eosinophils that became Langerhans cells"], "answer": 3, "explanation": "<p>A circulating cell that makes up 5 to 10% of white cells, is recruited by inflammation, and then turns into tissue phagocytes and branching antigen-presenting cells is the monocyte. Monocytes are circulating, mostly inflammatory phagocytes. When inflammatory signals (PAMPs, cytokines) call them into a tissue, they differentiate into recruited macrophages and inflammatory dendritic cells.<\/p><p>That is why monocytes are described as precursors: they keep tissue phagocyte pools topped up and supply new macrophages and dendritic cells during inflammation. Some tissue-resident macrophages instead come from embryonic precursors, which is one reason resident macrophages are so varied (Kupffer cells, microglia, osteoclasts).<\/p>", "why_wrong": ["Neutrophils are the most abundant white cells and die in tissues rather than becoming mast cells.", "NK cells come from lymphoid progenitors in the bone marrow, not from circulating phagocytes.", "Basophils are the least abundant granulocyte and are not macrophage precursors.", "Correct: monocytes differentiate into recruited macrophages and inflammatory dendritic cells.", "Eosinophils do not give rise to dendritic cells, and Langerhans cells are resident epidermal dendritic cells."], "objective": "Blood monocytes (5 to 10% of white cells) are recruited by inflammation and differentiate into tissue macrophages and inflammatory dendritic cells."}, {"qid": "2A-2", "topic": "M1 versus M2 macrophages", "stem": "<p>Macrophages are isolated from mouse skin wounds at two times after injury and studied in culture.<\/p><table class=\"labs\"><tr><th><\/th><th>Day 1 macrophages<\/th><th>Day 7 macrophages<\/th><\/tr><tr><td>TNF, IL-1, IL-6, IL-12<\/td><td>High<\/td><td>Low<\/td><\/tr><tr><td>IL-10, TGF-β<\/td><td>Low<\/td><td>High<\/td><\/tr><tr><td>Killing of ingested bacteria<\/td><td>High<\/td><td>Low<\/td><\/tr><tr><td>Collagen production by co-cultured fibroblasts<\/td><td>Unchanged<\/td><td>Increased<\/td><\/tr><\/table>", "lead": "The day 7 macrophages are best described as which of the following?", "choices": ["Inflammatory macrophages activated by interferon gamma", "Alternatively activated macrophages that promote repair", "Inflammatory dendritic cells migrating to lymph nodes", "Tissue mast cells releasing preformed mediators", "Monocytes that have not yet differentiated"], "answer": 1, "explanation": "<p>Day 1 macrophages make the pro-inflammatory cytokines TNF, IL-1, IL-6 and IL-12 and kill microbes well: the M1, inflammatory profile, typically activated by PAMPs, DAMPs and interferon gamma. By day 7 the same tissue holds macrophages that make IL-10 and TGF-β, kill poorly and push fibroblasts to lay down collagen. That is the M2, alternatively activated profile.<\/p><p>M2 macrophages handle the late phase of inflammation: they dampen the response with anti-inflammatory factors and drive tissue repair and remodeling. The shift from M1 to M2 is part of how inflammation actively resolves.<\/p>", "why_wrong": ["Interferon gamma-activated macrophages are M1, matching the day 1 profile.", "Correct: IL-10, TGF-β and repair activity define M2 macrophages.", "Dendritic cells present antigen in lymph nodes; they are not defined by fibroblast collagen stimulation.", "Mast cells release histamine and lipid mediators; they are not wound macrophages.", "Undifferentiated monocytes would not show a specialized repair profile."], "objective": "M1 macrophages (activated by PAMPs and interferon gamma) kill microbes and secrete TNF, IL-1, IL-6 and IL-12; M2 macrophages secrete IL-10 and TGF-β and drive tissue repair late in inflammation."}, {"qid": "2A-3", "topic": "Neutrophil extracellular traps", "stem": "<p>Human neutrophils are stimulated in vitro and then mixed with a fungus. Within 3 hours many neutrophils have died, and fluorescence microscopy shows long extracellular strands that stain with a DNA dye and contain neutrophil granule enzymes. Fungal cells are stuck in the strands. Adding deoxyribonuclease (an enzyme that digests DNA) dissolves the strands and frees the fungal cells, even though phagocytosis by the remaining live neutrophils is unchanged.<\/p>", "lead": "Which neutrophil function is being demonstrated?", "choices": ["Release of preformed histamine", "Phagocytosis followed by an oxidative burst", "Secretion of chemokines that recruit more cells", "Fas ligand-mediated killing of infected cells", "Formation of extracellular traps of chromatin"], "answer": 4, "explanation": "<p>The strands are made of DNA (they stain with a DNA dye and dissolve with deoxyribonuclease), carry granule enzymes, appear as neutrophils die, and capture the fungus outside the cell. These are neutrophil extracellular traps (NETs): a form of neutrophil death in which chromatin is released to catch microbes.<\/p><p>NETs sit alongside the other neutrophil tools: phagocytosis (especially of extracellular bacteria and fungi), granule release of NADPH oxidase products, myeloperoxidase, lysozyme, elastase and defensins, and secretion of cytokines and chemokines. Many of these also damage host tissue, which is why neutrophils are a double-edged sword.<\/p>", "why_wrong": ["Histamine release is a mast cell and basophil function.", "Phagocytosis was unchanged by deoxyribonuclease, so it is not what the strands represent.", "Chemokine secretion recruits cells but does not trap microbes in DNA strands.", "Fas ligand killing is used by NK cells and cytotoxic T cells against host cells.", "Correct: neutrophils release chromatin as extracellular traps that capture microbes."], "objective": "Neutrophils capture microbes by phagocytosis, toxic granules and neutrophil extracellular traps (NETs), in which dying neutrophils release chromatin and granule enzymes."}, {"qid": "2A-4", "topic": "Eosinophils and IL-5", "stem": "<p>Wild-type mice and mice lacking interleukin 5 (IL-5) are infected with an intestinal helminth. By week 2, wild-type mice have 25% eosinophils on the blood differential (baseline 2%), while the deficient mice stay at 2%. Neutrophil, lymphocyte, mast cell and basophil numbers are similar in both groups.<\/p>", "lead": "Compared with wild-type mice, the infected tissue of the deficient mice would most likely contain much less of which of the following?", "choices": ["Major basic protein", "Mature IL-1β", "Perforin", "Myeloperoxidase-derived hypochlorous acid from neutrophils", "Histamine from mast cells"], "answer": 0, "explanation": "<p>The deficient mice fail to raise blood eosinophils even with a parasite, which is the classic trigger for eosinophilia, while every other cell type is normal. That fits IL-5, the key inducer of eosinophil production and activation. So the step to reason through is: no IL-5, so no eosinophil expansion, so less of whatever eosinophils uniquely deliver.<\/p><p>Eosinophil granules contain cytotoxic proteins, chiefly major basic protein, eosinophil-derived neurotoxin and eosinophil peroxidase, plus tissue-remodeling enzymes. These are aimed at parasites too large to be phagocytosed. Eosinophilia on a differential points toward parasitic infection, allergy (type 2 inflammation) and some malignancies.<\/p>", "why_wrong": ["Correct: major basic protein is an eosinophil granule protein, and eosinophils fail to expand without IL-5.", "Mature IL-1β comes from inflammasome activity in macrophages and other cells, not eosinophils.", "Perforin is made by NK cells and cytotoxic T cells.", "Neutrophil numbers were unchanged, so their myeloperoxidase products would be preserved.", "Mast cell numbers were similar, so histamine release would be preserved."], "objective": "IL-5 drives eosinophil production and activation; eosinophils (raised in parasitic infection and allergy) release cytotoxic granule proteins such as major basic protein."}, {"qid": "2A-5", "topic": "Mast cell activation through FcεRI", "stem": "<p>Cultured mast cells are incubated with IgE antibody specific for a small chemical group, then washed. All cells now carry the bound IgE. They are exposed to one of two reagents, and histamine release is measured after 5 minutes.<\/p><table class=\"labs\"><tr><th>Reagent<\/th><th>Copies of the chemical group per molecule<\/th><th>Histamine released<\/th><\/tr><tr><td>Chemical group linked to a single amino acid<\/td><td>1<\/td><td>None<\/td><\/tr><tr><td>Chemical group linked to a carrier protein<\/td><td>About 20<\/td><td>Large<\/td><\/tr><\/table><p>An excess of the single-copy reagent added first prevents release by the multi-copy reagent.<\/p>", "lead": "Which best explains why only the multi-copy reagent triggers release?", "choices": ["It is processed and presented to helper T cells", "It activates complement to generate C3a and C5a", "It links neighboring IgE-bound receptors together", "It binds a Toll-like receptor on the mast cell", "It is needed to load IgE onto the receptor"], "answer": 2, "explanation": "<p>Both reagents bind the same IgE, and the single-copy reagent actually occupies the binding sites (it blocks the other one), yet it never triggers release. The difference is valency. A molecule carrying many copies of the target can bridge two or more IgE molecules sitting on adjacent high-affinity IgE receptors (FcεRI). That cross-linking, the aggregation of receptors, is the activating signal.<\/p><p>Mast cells and basophils are passively coated with IgE, so they are armed in advance. Once an allergen cross-links the receptors, the cells degranulate within minutes, releasing preformed histamine, chemokines and enzymes, then go on to make prostaglandins, leukotrienes and cytokines.<\/p>", "why_wrong": ["The response occurs in 5 minutes in a pure mast cell culture with no T cells.", "There is no complement source in washed mast cell cultures.", "Correct: multivalent antigen cross-links IgE-bound FcεRI, which activates degranulation.", "The trigger depends on IgE specificity, not on a pattern recognition receptor.", "The IgE was already bound before either reagent was added."], "objective": "Mast cells and basophils carry IgE on high-affinity FcεRI; a multivalent antigen that cross-links these receptors triggers rapid degranulation."}, {"qid": "2A-6", "topic": "Immunophenotyping lymphocyte subsets", "stem": "<p>Blood lymphocytes from a healthy volunteer are separated by flow cytometry into populations using monoclonal antibodies against cluster of differentiation (CD) markers. One population, about 8% of lymphocytes, has the following profile.<\/p><table class=\"labs\"><tr><td>CD3<\/td><td>Negative<\/td><\/tr><tr><td>CD19, CD20<\/td><td>Negative<\/td><\/tr><tr><td>CD56<\/td><td>Positive<\/td><\/tr><tr><td>CD16 (FcγRIII)<\/td><td>Positive<\/td><\/tr><\/table><p>The sorted cells are mixed, without prior immunization or culture, with several target cell lines.<\/p>", "lead": "Which target would these cells most likely kill?", "choices": ["A cell line presenting viral peptide on MHC class II", "A normal fibroblast line with high MHC class I", "A B cell line displaying a foreign protein on its antibody receptor", "A tumor line that has lost surface MHC class I", "An encapsulated extracellular bacterium in suspension"], "answer": 3, "explanation": "<p>No CD3 means these are not T cells, and no CD19 or CD20 means they are not B cells. CD56 with CD16 marks natural killer (NK) cells, innate lymphocytes that make up under 10% of blood lymphocytes and need no prior sensitization. That is the identification step the CD nomenclature exists for: a specific marker combination defines a cell type in any lab.<\/p><p>The second step is function. NK cells have no antigen receptor; they read inhibitory receptors for MHC class I and activating receptors for stress markers. A tumor cell that has lost MHC class I removes the brake and is killed (missing self). A normal cell with high MHC class I is spared.<\/p>", "why_wrong": ["Peptide on MHC class II is recognized by CD4 helper T cells, which are CD3-positive.", "High MHC class I engages NK inhibitory receptors and protects normal cells.", "Recognizing a specific foreign protein requires an antigen receptor, which NK cells lack.", "Correct: CD3-negative CD56-positive CD16-positive cells are NK cells, which kill cells lacking MHC class I.", "Free extracellular bacteria are handled by phagocytes and antibody, not NK cytotoxicity."], "table": "<table><tr><th>Cell<\/th><th>Defining markers<\/th><\/tr><tr><td>Helper T cell<\/td><td>CD3+ CD4+<\/td><\/tr><tr><td>Cytotoxic T cell<\/td><td>CD3+ CD8+<\/td><\/tr><tr><td>Regulatory T cell<\/td><td>CD3+ CD4+ CD25+<\/td><\/tr><tr><td>B cell<\/td><td>CD19+ CD20+ CD21+, surface Ig<\/td><\/tr><tr><td>NK cell<\/td><td>CD3- CD56+ CD16+<\/td><\/tr><\/table>", "objective": "Cell subsets are defined by CD marker combinations (immunophenotyping); CD3-negative CD56-positive CD16-positive cells are NK cells, which kill MHC class I-deficient targets without sensitization."}, {"qid": "2A-7", "topic": "Lymph node zones and primary lymphoid organs", "stem": "<p>A strain of mice is born without a thymus because of a defect in development of the third and fourth pharyngeal pouches. Their bone marrow is normal. Lymph nodes from adult mice of this strain are examined after immunostaining with antibodies against CD20 and CD3 and compared with nodes from normal mice.<\/p>", "lead": "Which region of the lymph node would most likely be depleted of cells in the mutant mice?", "choices": ["Cortical follicles", "The paracortex", "The subcapsular sinus", "The medullary cords and sinuses", "The follicular mantle zones"], "answer": 1, "explanation": "<p>The thymus is the primary lymphoid organ where T cell progenitors from the bone marrow complete maturation. With no thymus, there are almost no mature T cells, while B cells and NK cells, which mature in the bone marrow, are produced normally.<\/p><p>The second step is anatomy: lymph nodes separate B and T cells into zones. B cells (CD20) sit in cortical follicles; T cells (CD3) occupy the interfollicular region, the paracortex. So in these mice, CD3 staining is lost and the paracortex is thin and empty, while follicles look normal. The medulla, holding macrophages and plasma cells, and the sinuses carrying lymph are not T cell zones.<\/p>", "why_wrong": ["Follicles are B cell areas, and B cells mature normally in the bone marrow.", "Correct: the paracortex is the T cell zone, which empties without a thymus.", "The subcapsular sinus is where afferent lymph enters, not a lymphocyte zone.", "The medulla contains macrophages and plasma cells, not the main T cell population.", "The mantle zone surrounds germinal centers and is made of B cells."], "objective": "T cells mature in the thymus while B and NK cells mature in the bone marrow; in lymph nodes, B cells occupy cortical follicles and T cells occupy the paracortex."}, {"qid": "2A-8", "topic": "Chemokine homing in lymphoid organs", "stem": "<p>Mice lacking a single chemokine have lymph nodes and spleens of normal size. Immunostaining shows that T cells cluster normally in the paracortex of lymph nodes and around splenic arterioles, but B cells are scattered diffusely instead of forming follicles. When labeled normal B cells are injected into these mice, they enter lymph nodes normally through blood vessels but also fail to form follicles. Lymphocytes leave the nodes into lymph at normal rates.<\/p>", "lead": "Which chemokine is most likely missing?", "choices": ["CCL19 and CCL21", "CXCL8 (interleukin 8)", "CCL2", "Sphingosine 1-phosphate", "CXCL13"], "answer": 4, "explanation": "<p>The defect is precise: entry into the node works, T cell zones form, exit works, and only B cell positioning within the node fails. Lymphoid organs sort lymphocytes into zones using chemokine gradients. CXCL13 attracts B cells into follicles, while CCL19 and CCL21 attract T cells (and dendritic cells) into T cell zones.<\/p><p>Exit is controlled separately by sphingosine 1-phosphate (S1P), a lipid present at higher concentration in blood and lymph; blocking its receptor traps lymphocytes inside nodes. CXCL8, the one inflammatory chemokine to know by name, recruits neutrophils to inflamed tissue.<\/p>", "why_wrong": ["CCL19 and CCL21 attract T cells to T cell zones, which formed normally.", "CXCL8 recruits neutrophils to inflamed tissues, not B cells to follicles.", "CCL2 recruits monocytes during inflammation and does not organize follicles.", "Sphingosine 1-phosphate is a lipid exit signal, not a chemokine, and exit was normal.", "Correct: CXCL13 attracts B cells into follicles."], "objective": "Chemokine gradients organize lymphoid organs: CXCL13 draws B cells into follicles, CCL19 and CCL21 draw T cells into T cell zones, and sphingosine 1-phosphate controls exit."}, {"qid": "2A-9", "topic": "Spleen versus lymph nodes", "stem": "<p>Fluorescently labeled, heat-killed bacteria are given to mice by two routes. In one group they are injected into the footpad; in the other, into a tail vein. Tissues are examined 30 minutes later.<\/p><table class=\"labs\"><tr><th>Route<\/th><th>Draining popliteal lymph node<\/th><th>Spleen<\/th><\/tr><tr><td>Footpad<\/td><td>Many labeled bacteria in sinus macrophages<\/td><td>Almost none<\/td><\/tr><tr><td>Tail vein<\/td><td>Almost none<\/td><td>Many, in red pulp macrophages and the marginal zone<\/td><\/tr><\/table>", "lead": "Which best explains the distribution of bacteria after the intravenous injection?", "choices": ["The spleen filters blood, whereas lymph nodes filter lymph", "Lymph nodes exclude bacteria that lack a capsule", "Dendritic cells carry blood-borne bacteria only to the spleen", "The spleen receives lymph from all tissues of the body", "Bacteria in blood are destroyed before reaching any lymphoid organ"], "answer": 0, "explanation": "<p>Each secondary lymphoid organ samples a different fluid. Lymph nodes sit along lymphatic vessels and filter lymph drained from tissues, so bacteria injected into the footpad arrive in the popliteal node through afferent lymphatics. The spleen is highly vascular and receives antigen directly from the circulation, so blood-borne bacteria end up there.<\/p><p>Inside the spleen, red pulp macrophages clear microbes and damaged red cells from the blood, and the marginal zone (specialized B cells and macrophages) sits at the edge of the white pulp to catch blood-borne antigen. That is why the spleen is important in defense against blood-borne infections.<\/p>", "why_wrong": ["Correct: the spleen samples blood and lymph nodes sample lymph.", "Both groups received the same bacteria; only the route differed.", "The bacteria reached the spleen in 30 minutes by the bloodstream, not by dendritic cell transport.", "The spleen does not receive lymphatic drainage from tissues; lymph returns to blood through the thoracic duct.", "Many labeled bacteria were found in the spleen, so they were not destroyed first."], "objective": "Lymph nodes filter lymph from tissues while the spleen filters blood; red pulp macrophages and marginal zone cells capture blood-borne microbes."}, {"qid": "2A-10", "topic": "Thymus structure and T cell maturation", "stem": "<p>A biopsy is taken from tissue in the anterior mediastinum of a 2-year-old during heart surgery. It shows lobules surrounded by a fibrous capsule. Each lobule has a dark outer zone packed with small lymphocytes and a paler inner zone with fewer lymphocytes, a network of epithelial cells and scattered concentric whorls of keratinized squamous cells. Labeling studies in animals show that lymphocytes in this organ change markers progressively over several days.<\/p>", "lead": "Which best describes the movement of lymphocytes in this organ as they mature?", "choices": ["From the inner zone outward, to exit through the capsule", "From blood into follicles, where they form germinal centers", "From the outer zone inward, signaled by epithelial cells", "From the keratinized whorls into the outer zone, where they become plasma cells", "From afferent lymphatics into sinuses, where they meet antigen"], "answer": 2, "explanation": "<p>An anterior mediastinal organ in a child, with lobules, a lymphocyte-dense outer cortex, a paler medulla and keratinized whorls (Hassall's corpuscles, a good marker of the thymus medulla) is the thymus. It is a primary lymphoid organ built on a network of epithelial cells and populated by developing T cells (thymocytes).<\/p><p>Thymocytes mature progressively as they move from the cortex into the medulla, interacting with thymic epithelial cells and thymic dendritic cells, which deliver survival and selection signals. The thymus has no follicles, germinal centers or afferent lymphatics; those belong to secondary lymphoid organs where mature lymphocytes meet antigen. It is large in childhood and involutes with age.<\/p>", "why_wrong": ["Maturation runs from cortex to medulla, not outward.", "Follicles and germinal centers are features of secondary lymphoid organs, not the thymus.", "Correct: thymocytes migrate from cortex to medulla while receiving signals from epithelial and dendritic cells.", "Hassall's corpuscles are not a source of lymphocytes, and plasma cells are B-lineage cells.", "Afferent lymphatics and sinuses belong to lymph nodes."], "objective": "In the thymus (anterior mediastinum, cortex, medulla with Hassall's corpuscles), thymocytes mature as they move from cortex to medulla, receiving survival and selection signals from epithelial and dendritic cells."}, {"qid": "2A-11", "topic": "Mucosa-associated lymphoid tissue", "stem": "<p>Mice are fed fluorescent particles about the size of a bacterium. One hour later, sections of the ileum show almost no particles in the tissue under ordinary villi. Over dome-shaped lymphoid aggregates in the wall, however, particles are seen inside a specialized type of epithelial cell and in the underlying tissue, where they are taken up by dendritic cells and macrophages next to B cell follicles.<\/p>", "lead": "Which best describes the role of the specialized epithelial cells?", "choices": ["They secrete IgE onto the mucosal surface", "They kill particles with an oxidative burst before uptake", "They are the main site of T cell maturation in the gut", "They carry luminal antigen across to lymphoid tissue", "They form a mucus barrier that excludes particles from the dome"], "answer": 3, "explanation": "<p>The dome-shaped aggregates in the ileal wall are Peyer's patches, part of gut-associated lymphoid tissue, one branch of mucosa-associated lymphoid tissue (MALT). Particles cross the epithelium only over these patches, and they are found inside specialized epithelial cells on their way to the dendritic cells and macrophages beneath. Those specialized cells are M cells, which transport antigen from the lumen across the mucosa.<\/p><p>MALT works like the other secondary lymphoid organs, with B and T cell zones and a delivery system for antigen, but its source is the mucosal lumen rather than lymph or blood. Some mucosal dendritic cells also reach through the epithelium with their dendrites. MALT is central to mucosal immunity, tolerance and barrier function, and includes tonsils, adenoids and the appendix.<\/p>", "why_wrong": ["Epithelial cells do not produce antibody; plasma cells do.", "The particles arrive intact in the tissue below, so they were not destroyed in the epithelium.", "T cells mature in the thymus, not in gut lymphoid tissue.", "Correct: M cells carry luminal antigen across the epithelium to the underlying lymphoid tissue.", "Particles passed through these cells, the opposite of exclusion."], "objective": "Mucosa-associated lymphoid tissue (Peyer's patches, tonsils, adenoids, appendix) samples the mucosal lumen through M cells and dendritic cells that move antigen to underlying B and T cell zones."}, {"qid": "2A-12", "topic": "Primary and secondary follicles", "stem": "<p>Two lymph nodes are compared. One is a popliteal node from an unimmunized mouse housed in clean conditions. The other is the popliteal node from a mouse that received a protein injection in the footpad 10 days earlier; that node is enlarged. In the unimmunized node, cortical follicles are uniform, dense collections of small B cells. In the immunized node, many follicles have a pale central region filled with large, dividing B cells, surrounded by a rim of small, dense lymphocytes.<\/p>", "lead": "The pale central regions indicate which of the following?", "choices": ["Resting B cells that have not met antigen", "An ongoing adaptive B cell response to antigen", "Developing T cells undergoing selection", "Collections of macrophages clearing dead neutrophils", "A tertiary lymphoid structure formed by chronic inflammation"], "answer": 1, "explanation": "<p>Uniform, dense follicles of small B cells are primary follicles: resting, with no germinal center. Ten days after antigen enters through the footpad, the draining node enlarges and its follicles develop pale centers full of large, dividing B cells. Those are germinal centers, and a follicle containing one is a secondary follicle, the sign that B cells in that node are responding to antigen. The dense rim is the mantle zone of resting B cells pushed aside.<\/p><p>The same picture explains a reactive lymph node in a patient: a node draining an infection becomes larger, firmer and often tender, with more cells retained and germinal centers forming as the adaptive response gets going.<\/p>", "why_wrong": ["Resting B cells form primary follicles without pale dividing centers, as in the unimmunized node.", "Correct: germinal centers in secondary follicles mark an active B cell response.", "T cell development happens in the thymus, not in lymph node follicles.", "Macrophage clearance would not produce zones of dividing B cells inside follicles.", "Tertiary lymphoid structures form in chronically inflamed non-lymphoid tissue, not inside a lymph node."], "objective": "Primary follicles are resting B cell zones without germinal centers; secondary follicles, with germinal centers and a mantle, signal an active adaptive response in a reactive node."}, {"qid": "2A-13", "topic": "Dendritic cell migration and function", "stem": "<p>A fluorescent protein is painted onto the ear skin of mice together with a microbial product that activates pattern recognition receptors. At 2 hours, fluorescence is found in branched cells in the epidermis. By 48 hours, those epidermal cells have largely disappeared from the skin, and fluorescent cells with long, interdigitating processes appear in the paracortex of the draining cervical lymph node, in close contact with T cells. When the microbial product is left out, far fewer fluorescent cells reach the node.<\/p>", "lead": "What is the main purpose of this migration?", "choices": ["To phagocytose and destroy the protein in the node medulla", "To release histamine near lymph node vessels", "To deliver antigen to B cell follicles for germinal center formation", "To replenish the pool of resting epidermal cells", "To present antigen to T cells and start an adaptive response"], "answer": 4, "explanation": "<p>The branched epidermal cells are Langerhans cells, resting dendritic cells of the skin. Activation through pattern recognition receptors makes them mature, take up antigen and leave the tissue for the draining lymph node, which is why fewer arrive without the microbial product. In the node they settle in the T cell zone as interdigitating dendritic cells and present antigen to T cells.<\/p><p>Dendritic cells are the specialized antigen-presenting cells that link innate detection to adaptive immunity: they sample tissues, carry what they find to lymphoid organs and initiate T cell responses there. Some subsets have extra roles, such as plasmacytoid dendritic cells, which detect viruses and secrete type I interferons.<\/p>", "why_wrong": ["Dendritic cells carry antigen to present it, not to destroy it in the medulla, and they settled in the paracortex.", "Histamine release is a mast cell and basophil function.", "The cells settled in the T cell paracortex, not B cell follicles.", "The cells left the skin; they were not replenishing it.", "Correct: activated dendritic cells migrate to draining nodes to present antigen to T cells."], "objective": "Tissue dendritic cells (such as epidermal Langerhans cells) mature after pattern recognition receptor activation, carry antigen to the T cell zones of draining lymph nodes and initiate adaptive responses."}, {"qid": "2A-14", "topic": "Plasmacytoid dendritic cells", "stem": "<p>Mice are engineered so that one rare dendritic cell subset can be selectively removed with a toxin. In control mice infected with a virus, serum interferon alpha peaks at 36 hours. In mice depleted of the subset just before infection, serum interferon alpha is barely detectable, while neutrophil, macrophage and conventional dendritic cell numbers are normal. Viral titers in the organs of depleted mice are 50-fold higher at day 3.<\/p>", "lead": "In the depleted mice, which early defense is most likely impaired in uninfected cells near infected ones?", "choices": ["Upregulation of stress markers for NK recognition", "Production of reactive oxygen species", "Induction of an antiviral state", "Opsonization by acute phase proteins", "Formation of neutrophil extracellular traps"], "answer": 2, "explanation": "<p>Removing a single dendritic cell subset wiped out the early interferon alpha surge while sparing other innate cells, so the subset is the plasmacytoid dendritic cell, the specialist that detects viruses and secretes large amounts of type I interferon. Identifying the cell is the first step.<\/p><p>The second is what that interferon does. Type I interferons act on nearby uninfected cells to induce an antiviral state that inhibits viral replication and spread. Without it, the virus moves from cell to cell unopposed, which explains the 50-fold higher titers. The other defenses listed belong to phagocytes, the liver or NK recognition, and none of them is the main job of plasmacytoid dendritic cells.<\/p>", "why_wrong": ["Stress marker upregulation happens in infected or damaged cells and is not a product of type I interferon signaling to neighbors.", "Reactive oxygen species are a phagocyte killing tool, mainly against bacteria and fungi.", "Correct: loss of type I interferon prevents the antiviral state in neighboring cells.", "Acute phase opsonins are made by the liver in response to IL-6, not by this subset.", "Neutrophil extracellular traps are made by neutrophils, which were normal."], "objective": "Plasmacytoid dendritic cells detect viruses and secrete type I interferons, which induce an antiviral state in neighboring cells and limit early viral spread."}, {"qid": "2A-15", "topic": "Co-receptors versus co-stimulatory molecules", "stem": "<p>Purified helper T cells are mixed with antigen-presenting cells displaying the peptide the T cells recognize, and two blocking antibodies are tested. Antibody 1 reduces the number and duration of stable T cell contacts with the antigen-presenting cells, so fewer T cells are triggered at all. Antibody 2 leaves contact formation and early signaling unchanged, yet the T cells that are triggered fail to proliferate or secrete cytokines and instead become unresponsive.<\/p>", "lead": "The molecule blocked by antibody 2 is best classified as which of the following?", "choices": ["A co-stimulatory molecule", "A co-receptor", "An adhesion molecule", "A chemokine receptor", "A pattern recognition receptor"], "answer": 0, "explanation": "<p>Immune cell responses come from integrating several signals at the contact between cells. Blocking antibody 1 weakened the contact itself, the job of co-receptors (such as CD4 on helper T cells), which stabilize the antigen receptor's interaction, and of adhesion molecules, which hold the cells together and polarize them toward the contact site.<\/p><p>Antibody 2 left the contact and the antigen signal intact but changed what the T cell did with it: no proliferation, no cytokines, unresponsiveness instead. Modulating the outcome of another receptor's signal, positively or negatively, is the definition of a co-stimulatory molecule. Cell contact signals like this are as central to immune communication as secreted cytokines.<\/p>", "why_wrong": ["Correct: co-stimulatory molecules modulate the outcome of antigen receptor signaling without being needed for contact.", "Co-receptors stabilize receptor-ligand binding, which matches antibody 1, not antibody 2.", "Adhesion molecules hold cells together; blocking them would reduce contacts.", "Chemokine receptors guide migration, not the outcome of a formed contact.", "Pattern recognition receptors detect PAMPs and DAMPs, not peptides on antigen-presenting cells."], "objective": "Co-receptors (such as CD4 and CD8) and adhesion molecules stabilize cell contacts, while co-stimulatory molecules modulate the outcome of antigen receptor signals."}]}, {"id": "2C", "title": "Virology Interactive Review", "week": 2, "subject": "Microbiology", "questions": [{"qid": "2C-1", "topic": "Timing of virion maturation", "stem": "<p>Three enveloped viruses are compared in cultured cells. Particles of virus D are collected the instant they leave the cell and are found to be noninfectious, containing large uncleaved precursor proteins; the same particles become infectious after a further period outside the cell. Particles of virus E are already infectious when collected at the moment of release, and electron microscopy shows its capsids being filled and completed within the nucleus. Particles of virus F are fully formed within intracellular membrane compartments before leaving the cell.<\/p>", "lead": "Which process occurring outside the cell best accounts for the change in virus D?", "choices": ["Cleavage of precursor polyproteins by a protease within the particle", "Acquisition of additional envelope glycoproteins from the extracellular fluid", "Loss of a host protein that had blocked the viral attachment protein", "Condensation of the genome by host enzymes present in the medium", "Removal of the outer envelope by extracellular proteases"], "answer": 0, "explanation": "<p>Maturation is the morphological transition that makes a particle infectious, and the step is essential for some virus families. Depending on the virus, it happens during assembly, during budding, or only after release. Virus D is the last pattern: it buds as an immature particle whose structural and enzymatic proteins are still joined in large precursors, and it becomes infectious only once those precursors are cut.<\/p><p>The enzyme that performs that cleavage is the viral protease, packaged in the particle along with the precursors it acts on. Cutting them lets the capsid condense into its mature form and releases functional viral enzymes, which is why the immature particle can be made but cannot infect. Virus E shows maturation completed inside the cell, as with the herpesviruses, and virus F shows maturation at intracellular membranes before exocytosis, as with the coronaviruses.<\/p>", "why_wrong": ["Correct: the particle buds immature, and its own protease cleaves the precursor polyproteins to produce an infectious virion.", "Envelope glycoproteins are acquired from host membranes during budding, not from extracellular fluid.", "Nothing indicates a blocking host protein, and the finding described is uncleaved viral precursors.", "Genome condensation is driven by cleavage of viral structural precursors, not by enzymes in the medium.", "The envelope is required for infectivity, so removing it would not create an infectious particle."], "objective": "Maturation can occur during assembly, during budding or after release, and for viruses that mature after release a viral protease must cleave precursor polyproteins to yield an infectious virion."}, {"qid": "2C-2", "topic": "Syncytium formation as a cytopathic effect", "stem": "<p>A nasopharyngeal specimen from an infant with a lower respiratory infection is inoculated onto cultured respiratory epithelial cells. Over 48 hours the monolayer develops large cells containing many nuclei within a single shared cytoplasm. Staining shows a viral glycoprotein on the surface of infected cells at the points where neighboring cell membranes have merged. Antibody directed against that glycoprotein prevents the multinucleated cells from forming without reducing the amount of virus that enters cells.<\/p>", "lead": "Formation of the multinucleated cells is best explained by which of the following?", "choices": ["Repeated division of the nucleus without division of the cytoplasm in infected cells", "Fusion of neighboring cell membranes by a viral glycoprotein on the cell surface", "Engulfment of dying neighboring cells by a single surviving infected cell", "Failure of infected cells to detach from the culture surface as they die", "Transfer of nuclei between cells through virus-induced membrane pores"], "answer": 1, "explanation": "<p>The staining locates a viral glycoprotein on the surface of the infected cell exactly where membranes have merged, and blocking that glycoprotein with antibody prevents the giant cells from forming. That identifies the glycoprotein as the agent of the fusion rather than a bystander.<\/p><p>Viral fusion proteins are made during infection and inserted into the host cell membrane, where they can fuse that cell with its neighbors. The result is a syncytium, a large cell with many nuclei in one cytoplasm, and it is one of the visible cytopathic effects of viral infection, alongside cell rounding, detachment from the culture surface, shrinkage, aggregation and lysis. That the antibody blocks fusion without reducing entry shows these are two separate activities of the same kind of protein.<\/p>", "why_wrong": ["The nuclei come from separate cells whose membranes merged, not from repeated division of one nucleus.", "Correct: a viral fusion glycoprotein displayed on the infected cell surface merges adjacent cell membranes into a syncytium.", "Engulfment of neighboring cells is a phagocytic process and is not how these giant cells arise.", "Loss of adherence is a separate cytopathic effect and would not place several nuclei in one cytoplasm.", "Nuclei are not transported between intact cells, and the finding here is merged membranes."], "objective": "Syncytium formation is a cytopathic effect in which a viral fusion glycoprotein expressed on the infected cell surface fuses neighboring cells into one multinucleated cell."}, {"qid": "2C-3", "topic": "Determinants of disease severity", "stem": "<p>During one outbreak of a single respiratory virus, a public health team records very different outcomes. A 29-year-old healthy man has 3 days of mild fever and cough. A 79-year-old woman taking an immunosuppressant is hospitalized with respiratory distress. A 34-year-old woman has virus detectable on a nasal swab for 4 days with no symptoms at all. Sequencing of the isolates from all three shows the same strain with no differences in the surface protein genes.<\/p>", "lead": "Which of the following best accounts for the range of illness in this outbreak?", "choices": ["Differences in the mutation rate of the virus within each host", "Differences in host factors and in the exposure each person received", "Differences in the capsid symmetry of the circulating particles", "Differences in whether the virus established a latent infection in each person", "Differences in the receptor used by the virus in each person"], "answer": 1, "explanation": "<p>The isolates are the same strain with no differences in the surface protein genes, which removes viral variation as the explanation. Virulence is the degree of disease severity a virus can cause, but the severity actually seen in a given person reflects more than the virus.<\/p><p>Disease severity reflects viral characteristics together with exposure factors, meaning the size of the inoculum and the route of entry, and host factors, meaning age, immune status, underlying disease and medications. The older woman on an immunosuppressant has host factors that favor severe disease, while the asymptomatic woman shows that infection can be productive and still cause no symptoms, since the outcome depends on both the virus and the permissiveness of the host and its cells.<\/p>", "why_wrong": ["Sequencing shows the same strain in all three, so within-host variation is not what separates them.", "Correct: severity reflects inoculum size and route of entry together with host age, immune status, comorbidity and medications.", "Capsid symmetry is a fixed property of the virus and is identical across isolates of one strain.", "Latency is not described here, and all three had an acute respiratory infection with virus detectable for days.", "Receptor usage is a property of the virus and would not differ between people infected by the same strain."], "objective": "Disease severity in viral infection depends on viral characteristics, exposure factors such as inoculum size and route, and host factors including age, immune status and medications."}, {"qid": "2C-4", "topic": "Envelope and route of transmission", "stem": "<p>Two viruses cause outbreaks in the same long-term care facility. Virus G spreads among residents who share a dining room, is recovered from doorknobs and bed rails 2 days after cleaning was stopped, and infects volunteers who swallow it in a capsule-free liquid. Virus H spreads only among residents in adjacent beds, cannot be recovered from surfaces after an hour of drying, and does not infect volunteers who swallow it, although it readily infects those given it as an aerosol.<\/p>", "lead": "Which structural difference best explains the behavior of virus G?", "choices": ["It has a segmented genome, whereas virus H does not", "It has a larger genome than virus H", "It lacks the lipid envelope that virus H possesses", "It replicates in the nucleus, whereas virus H replicates in the cytoplasm", "It has a helical capsid, whereas virus H has an icosahedral capsid"], "answer": 2, "explanation": "<p>Virus G survives drying on surfaces and survives being swallowed, and virus H does neither. Both of those properties track with one structural feature, the presence or absence of a lipid envelope taken from host membranes.<\/p><p>Non-enveloped viruses are generally stable to drying and heat and resistant to acid, bile and detergents, so they often survive passage through the gastrointestinal tract and spread by the fecal-oral route and by contaminated surfaces. Enveloped viruses are generally less stable, are sensitive to acid, bile and detergents, and are usually inactivated in the gut, so they spread by routes that avoid those conditions, such as respiratory droplets, direct contact, blood and sexual contact, vectors and bites. Virus G behaves as a naked virus, virus H as an enveloped one.<\/p>", "why_wrong": ["Segmentation allows exchange of segments between related viruses and says nothing about environmental stability.", "Genome size does not determine survival on surfaces or in the gastrointestinal tract.", "Correct: lacking a lipid envelope makes a virus stable to drying and resistant to acid and bile, which fits fomite and fecal-oral spread.", "Replication site is an intracellular property and has no bearing on survival outside the host.", "Capsid symmetry does not by itself determine resistance to drying, acid or bile."], "table": "<table><tr><th>Property<\/th><th>Non-enveloped<\/th><th>Enveloped<\/th><\/tr><tr><td>Stability to drying and heat<\/td><td>Generally high<\/td><td>Generally low<\/td><\/tr><tr><td>Acid, bile, detergents<\/td><td>Generally resistant<\/td><td>Generally sensitive<\/td><\/tr><tr><td>Gastrointestinal survival<\/td><td>Often survives<\/td><td>Usually inactivated<\/td><\/tr><tr><td>Transmission<\/td><td>Fecal-oral, fomites, respiratory, direct contact<\/td><td>Respiratory, direct contact, blood and sexual contact, vectors, bites<\/td><\/tr><tr><td>Protective immunity<\/td><td>Antibody often sufficient, T cells contribute<\/td><td>Antibody plus T cells, cell-mediated immunity often critical<\/td><\/tr><\/table>", "objective": "Absence of a lipid envelope confers stability to drying, acid and bile, which allows fecal-oral and fomite transmission, whereas enveloped viruses depend on routes that avoid those conditions."}, {"qid": "2C-5", "topic": "Host receptors for attachment", "stem": "<p>Cultured respiratory epithelial cells are pretreated with an enzyme that removes terminal sialic acid residues from cell surface glycans, then exposed to one of three viruses. Infection by virus J falls to nearly zero in the treated cells and is unchanged in untreated cells. Infection by the other two viruses, one of which uses intercellular adhesion molecule 1 and one of which uses angiotensin-converting enzyme 2, is unaffected by the enzyme.<\/p>", "lead": "The attachment protein of virus J is most likely which of the following?", "choices": ["Hemagglutinin", "Spike protein", "A capsid surface protein", "Glycoprotein 120", "The H protein"], "answer": 0, "explanation": "<p>Stripping sialic acid from the cell surface abolishes infection by virus J alone, so sialic acid on cell surface glycans is the receptor that virus J requires. The two control viruses use protein receptors, intercellular adhesion molecule 1 and angiotensin-converting enzyme 2, so removing a carbohydrate does not affect them.<\/p><p>Among the viruses taught, the one that attaches to sialic acid is influenza, and its attachment protein is hemagglutinin. Hemagglutinin is unusual in serving as both the attachment protein and the fusion protein for that virus. Identifying a receptor this way is how receptor usage determines which cells and which tissues a virus can infect.<\/p>", "why_wrong": ["Correct: influenza hemagglutinin binds sialic acid on cell surface glycans, so removing sialic acid blocks attachment.", "The spike protein binds angiotensin-converting enzyme 2, which is one of the unaffected control viruses.", "Capsid surface proteins mediate attachment for non-enveloped viruses using protein receptors such as intercellular adhesion molecule 1 or the poliovirus receptor.", "Glycoprotein 120 binds CD4 with a chemokine coreceptor, not sialic acid, and not on respiratory epithelium.", "The H protein of measles virus binds CD150 or nectin-4, which are proteins rather than sialic acid."], "table": "<table><tr><th>Virus<\/th><th>Receptor or coreceptor<\/th><th>Attachment protein<\/th><th>Fusion protein<\/th><\/tr><tr><td>Rhinovirus (major group)<\/td><td>Intercellular adhesion molecule 1<\/td><td>Capsid proteins<\/td><td>None<\/td><\/tr><tr><td>Poliovirus<\/td><td>CD155<\/td><td>Capsid proteins<\/td><td>None<\/td><\/tr><tr><td>Influenza A and B<\/td><td>Sialic acid on cell surface glycans<\/td><td>Hemagglutinin<\/td><td>Hemagglutinin<\/td><\/tr><tr><td>Measles virus<\/td><td>CD150 or nectin-4<\/td><td>H protein<\/td><td>F protein<\/td><\/tr><tr><td>Human immunodeficiency virus 1<\/td><td>CD4 plus CCR5 or CXCR4<\/td><td>Glycoprotein 120<\/td><td>Glycoprotein 41<\/td><\/tr><tr><td>SARS-CoV-2<\/td><td>Angiotensin-converting enzyme 2<\/td><td>Spike protein S1<\/td><td>Spike protein S2<\/td><\/tr><\/table>", "objective": "Each virus attaches through a defined host molecule, and influenza hemagglutinin binds sialic acid on cell surface glycans."}, {"qid": "2C-6", "topic": "Attachment versus fusion proteins", "stem": "<p>An enveloped virus displays two different surface glycoproteins. Investigators prepare monoclonal antibodies against each. Antibody 1 prevents virions from binding to the surface of susceptible cells at all. Antibody 2 allows virions to bind the cell surface in normal numbers, but the viral and cell membranes never merge and no genome reaches the cytoplasm. Neither antibody affects assembly or release of particles from cells already infected before the antibody was added.<\/p>", "lead": "Antibody 2 is most likely directed against a glycoprotein with which of the following functions?", "choices": ["Engagement of the primary host receptor", "Merging of the viral envelope with the host cell membrane", "Cleavage of host surface glycans to release progeny virions from the cell", "Lining of the inner face of the viral envelope", "Copying of the viral genome after entry"], "answer": 1, "explanation": "<p>The two antibodies separate the two halves of entry. Antibody 1 blocks binding, so its target is the attachment protein that engages the host receptor. Antibody 2 leaves binding intact but stops the membranes from merging, so its target acts after attachment.<\/p><p>That is the job of a viral fusion protein. For several enveloped viruses the two functions sit on two different proteins, as with measles virus H and F, with glycoprotein 120 and glycoprotein 41 of the human immunodeficiency virus, and with the S1 and S2 portions of the coronavirus spike protein. Influenza virus is the exception in which one protein, hemagglutinin, does both. Blocking fusion leaves a bound particle that cannot deliver its genome, which is exactly the result described.<\/p>", "why_wrong": ["Engaging the primary receptor is the function blocked by antibody 1, since that antibody prevents binding.", "Correct: the fusion protein merges the viral envelope with the cell membrane after attachment, and blocking it leaves virions bound but unable to deliver the genome.", "An enzyme that cleaves host surface glycans acts at release of progeny, and neither antibody affected release.", "A matrix protein lines the inner face of the envelope and is not accessible to antibody on the particle surface.", "Genome replication occurs inside the cell and is not a function of a surface glycoprotein."], "objective": "Entry of enveloped viruses requires an attachment protein that binds the host receptor and a fusion protein that merges the viral and cell membranes, functions that are often carried by separate glycoproteins."}]}, {"id": "13-14", "title": "Lymphoid Development and Immunological Tolerance", "week": 3, "subject": "Immunology", "questions": [{"qid": "13-14-1", "topic": "B cell developmental checkpoints", "stem": "<p>Investigators create a mouse strain in which both the kappa and the lambda immunoglobulin (Ig) light chain loci are deleted. The heavy chain loci, expression of the recombination-activating genes (RAG1 and RAG2) and the signaling chains Ig-alpha and Ig-beta are all normal. Bone marrow cells are analyzed by flow cytometry and compared with those of a wild-type littermate.<\/p><table class=\"labs\"><tr><th>Bone marrow population<\/th><th>Knockout<\/th><th>Wild type<\/th><\/tr><tr><td>CD19-positive cells containing mu heavy chain<\/td><td>Increased<\/td><td>Present<\/td><\/tr><tr><td>CD19-positive cells with surface IgM<\/td><td>Absent<\/td><td>Present<\/td><\/tr><tr><td>CD19-positive cells with surface IgM and IgD<\/td><td>Absent<\/td><td>Present (few)<\/td><\/tr><\/table><p>The spleen of the knockout mouse contains no B cells.<\/p>", "lead": "B cell development in the knockout mouse is most likely arrested at which stage?", "choices": ["Common lymphoid progenitor, before any heavy chain rearrangement", "Pro-B cell, before a pre-B cell receptor is assembled", "Pre-B cell, expressing heavy chain with surrogate light chains", "Immature B cell, expressing surface IgM without IgD", "Mature naive B cell, expressing both IgM and IgD"], "answer": 2, "explanation": "<p>B cells rearrange their genes in a fixed order. The heavy chain locus rearranges first, in the pro-B cell. A productive mu heavy chain pairs with two invariant surrogate light chains to form the pre-B cell receptor (pre-BCR), which signals through Ig-alpha and Ig-beta. That is checkpoint 1: it confirms the heavy chain works and moves the cell to the pre-B stage, where it proliferates and then begins light chain rearrangement. In this mouse the heavy chain is made and the signaling chains are normal, so checkpoint 1 is passed and cells collect in large numbers containing mu.<\/p><p>Checkpoint 2 requires a complete B cell receptor, a heavy chain paired with a real kappa or lambda light chain, displayed as surface IgM on an immature B cell. With both light chain loci deleted, no complete IgM can ever form, so no cell reaches the immature stage, none matures to IgM plus IgD, and the spleen stays empty. The cells pile up at the last stage they can reach, the pre-B cell.<\/p>", "why_wrong": ["Common lymphoid progenitors have not started rearranging; this mouse makes mu heavy chain, so it has moved past that stage.", "A block at the pro-B to pre-B transition (as with BTK, Ig-alpha or Ig-beta defects) would prevent pre-BCR signaling, but here heavy chain and signaling chains are normal.", "Correct: the pre-BCR checkpoint is passed, but without any light chain the cell cannot build surface IgM, so it arrests as a pre-B cell.", "Immature B cells are defined by surface IgM, which requires a light chain; the knockout has no surface IgM.", "Mature B cells co-express IgM and IgD in the periphery; none form here, and the spleen has no B cells."], "objective": "Developing B cells pass two receptor checkpoints: the pre-BCR (heavy chain with surrogate light chains) at the pro-B to pre-B step, and the complete BCR (surface IgM) at the pre-B to immature step, so loss of both light chains arrests cells at the pre-B stage.", "table": "<table class=\"\"><tr><th>Stage<\/th><th>Gene status<\/th><th>Receptor<\/th><th>Checkpoint passed<\/th><\/tr><tr><td>Pro-B<\/td><td>Heavy chain rearranging<\/td><td>None<\/td><td>None yet<\/td><\/tr><tr><td>Pre-B<\/td><td>Heavy chain done, light chain rearranging<\/td><td>Pre-BCR (mu + surrogate light chains)<\/td><td>1: functional heavy chain<\/td><\/tr><tr><td>Immature B<\/td><td>Heavy and light chains done<\/td><td>Surface IgM<\/td><td>2: functional light chain<\/td><\/tr><tr><td>Mature B (periphery)<\/td><td>Same<\/td><td>Surface IgM + IgD<\/td><td>Survived tolerance checks<\/td><\/tr><\/table>"}, {"qid": "13-14-2", "topic": "Central versus peripheral B cell tolerance", "stem": "<p>In an experiment, every B cell in a transgenic mouse carries the same B cell receptor, specific for protein X, a protein mice do not normally make. These mice are bred into two lines. In line 1, protein X is expressed as a membrane protein on bone marrow stromal cells. In line 2, protein X is expressed only as a soluble protein circulating in the blood. Later, both lines are immunized with protein X alone, without adjuvant.<\/p><table class=\"labs\"><tr><th>Finding<\/th><th>Line 1<\/th><th>Line 2<\/th><\/tr><tr><td>Transgenic B cells in the spleen<\/td><td>Very few<\/td><td>Normal number<\/td><\/tr><tr><td>Binding of protein X by splenic B cells<\/td><td>Not tested<\/td><td>Yes<\/td><\/tr><tr><td>Surface IgM level on splenic B cells<\/td><td>Not tested<\/td><td>Reduced<\/td><\/tr><tr><td>Helper T cells specific for protein X<\/td><td>None<\/td><td>None<\/td><\/tr><tr><td>Antibody to protein X after immunization<\/td><td>None<\/td><td>None<\/td><\/tr><\/table>", "lead": "Which mechanism best explains the lack of antibody in line 2?", "choices": ["Anergy of mature B cells meeting self antigen without T cell help", "Clonal deletion of immature B cells by apoptosis in the bone marrow", "Receptor editing that replaced the transgenic light chain", "Antigen exclusion that kept protein X away from the B cells", "Allelic exclusion that silenced the transgenic heavy chain"], "answer": 0, "explanation": "<p>Because protein X is present from birth in these mice, it behaves as a self antigen for the transgenic B cells. Line 1 shows central tolerance: B cells that strongly engage a membrane-bound self antigen in the bone marrow are removed (clonal deletion) or rescued by receptor editing, so few reach the spleen. Line 2 is different. Its B cells reach the spleen in normal numbers and still bind protein X, so they were neither deleted nor edited. Yet they make no antibody, show reduced surface IgM, and do not respond to immunization.<\/p><p>That pattern is anergy, a peripheral tolerance mechanism. A mature B cell that meets self antigen in a secondary lymphoid organ without the second signals that normally come with a real threat (here, no inflammation and no antigen-specific helper T cells) becomes functionally unresponsive rather than activated. Layered, redundant tolerance like this is why a self-reactive clone that slips through the bone marrow still usually stays silent.<\/p>", "why_wrong": ["Correct: the B cells are present and still bind antigen but cannot be activated, which defines anergy after self-antigen encounter without T cell help.", "Clonal deletion would remove the cells; line 2 has a normal number of transgenic B cells in the spleen, and deletion describes line 1.", "Receptor editing would change the light chain and abolish binding, but the line 2 B cells still bind protein X.", "Antigen exclusion means physical separation from the antigen, yet protein X circulates in the blood that bathes the spleen.", "Allelic exclusion stops rearrangement of a second allele after a productive one; it does not silence the receptor a cell already expresses."], "objective": "B cells that meet a self antigen in the bone marrow are deleted or edited (central tolerance), while mature B cells that meet self antigen in the periphery without T cell help or inflammation become anergic (peripheral tolerance).", "table": "<table class=\"\"><tr><th>Mechanism<\/th><th>Where<\/th><th>What the cell looks like afterward<\/th><\/tr><tr><td>Clonal deletion<\/td><td>Bone marrow (and periphery)<\/td><td>Gone (apoptosis)<\/td><\/tr><tr><td>Receptor editing<\/td><td>Bone marrow only<\/td><td>Present, new light chain, no longer self-reactive<\/td><\/tr><tr><td>Anergy<\/td><td>Secondary lymphoid organs<\/td><td>Present, binds antigen, cannot be activated<\/td><\/tr><tr><td>Suppression by regulatory T cells<\/td><td>Lymphoid organs and inflamed tissue<\/td><td>Present, actively inhibited<\/td><\/tr><tr><td>Antigen exclusion<\/td><td>Barrier sites<\/td><td>Never meets the antigen<\/td><\/tr><\/table>"}, {"qid": "13-14-3", "topic": "Negative selection and natural regulatory T cells", "stem": "<p>A transgenic mouse expresses a single T cell receptor (TCR) that binds with high affinity to a self peptide presented on major histocompatibility complex (MHC) class II by medullary thymic epithelial cells. Its thymus is compared with that of a mouse carrying a different transgenic TCR with intermediate affinity for self peptide on MHC class II.<\/p><table class=\"labs\"><tr><th>Thymocyte population<\/th><th>High-affinity TCR mouse<\/th><th>Intermediate-affinity TCR mouse<\/th><\/tr><tr><td>CD4 and CD8 double positive<\/td><td>Normal<\/td><td>Normal<\/td><\/tr><tr><td>CD4 single positive, total number<\/td><td>Markedly reduced<\/td><td>Normal<\/td><\/tr><tr><td>CD4 single positive cells expressing FOXP3<\/td><td>About 60%<\/td><td>About 5%<\/td><\/tr><\/table><p>Mature T cells have not yet left the thymus in either analysis.<\/p>", "lead": "The FOXP3-expressing CD4 cells in the high-affinity TCR mouse most likely arose by which process?", "choices": ["Positive selection of thymocytes with weak affinity for self MHC", "Death by neglect of thymocytes that failed to bind self MHC", "Peripheral induction after the self peptide was met in tissues", "Receptor editing that lowered the affinity of the transgenic TCR", "Escape from deletion with diversion into the regulatory lineage"], "answer": 4, "explanation": "<p>Thymic selection sorts thymocytes by how strongly their TCR binds self peptide on self MHC. No or very weak binding means death by neglect. Intermediate binding means positive selection and survival as an ordinary naive T cell. High affinity binding to self, which is what this transgenic TCR has, normally triggers negative selection, so most of these cells die, which is why total CD4 single positive cells are sharply reduced.<\/p><p>Not every high-affinity CD4 thymocyte dies, though. Some escape deletion and switch on the transcription factor FOXP3, becoming natural regulatory T cells (nTregs) that carry their self-reactivity into the periphery and use it to suppress responses there. These cells are still inside the thymus, so they did not arise from peripheral induction. The large FOXP3 fraction among the few survivors is the signature of this thymic diversion.<\/p>", "why_wrong": ["Weak, intermediate affinity produces ordinary naive T cells; the FOXP3 cells here came from the high-affinity TCR that normally drives negative selection.", "Death by neglect removes thymocytes that cannot bind self MHC at all; it leaves no survivors to become regulatory cells.", "Inducible regulatory T cells form in the periphery after antigen exposure, but these cells were analyzed before any had left the thymus.", "Receptor editing is a B cell mechanism that rewrites the light chain; T cells do not edit their receptors to escape selection.", "Correct: high-affinity self-reactive CD4 thymocytes either die by negative selection or escape and differentiate into FOXP3-positive natural regulatory T cells."], "objective": "In the thymus, high-affinity binding to self peptide on MHC causes most CD4 thymocytes to die by negative selection, but some are diverted into FOXP3-positive natural regulatory T cells that enforce tolerance in the periphery.", "table": "<table class=\"\"><tr><th>Affinity for self peptide on MHC<\/th><th>Outcome in the thymus<\/th><\/tr><tr><td>None or very low<\/td><td>Death by neglect<\/td><\/tr><tr><td>Intermediate<\/td><td>Positive selection: naive CD4 or CD8 T cell<\/td><\/tr><tr><td>High<\/td><td>Negative selection (death), or diversion into natural regulatory T cells<\/td><\/tr><\/table>"}, {"qid": "13-14-4", "topic": "CTLA-4 and peripheral T cell tolerance", "stem": "<p>Mice lacking a single inhibitory surface receptor appear normal at birth. By 3 weeks of age they have massive enlargement of the lymph nodes and spleen, and by 4 weeks they die with heart, lung and pancreas infiltrated by activated T cells. Thymic development and the numbers of FOXP3-positive regulatory T cells are normal. In normal mice, this receptor is absent from naive T cells, appears on T cells after they are activated, and is constitutively present on some regulatory T cells.<\/p>", "lead": "In normal mice, this receptor limits T cell activation mainly by which action?", "choices": ["Secreting interleukin 10 that quiets nearby antigen-presenting cells", "Outcompeting CD28 for B7 molecules on antigen-presenting cells", "Blocking the T cell receptor from binding peptide on MHC", "Deleting self-reactive thymocytes in the thymic medulla", "Switching on FOXP3 in newly activated CD4 T cells"], "answer": 1, "explanation": "<p>Full T cell activation needs signal 1 (the T cell receptor engaging peptide on major histocompatibility complex, MHC) and signal 2 (CD28 on the T cell binding B7 molecules, CD80 and CD86, on an activated antigen-presenting cell, APC). Requiring CD28 costimulation is a fail-safe: a T cell that sees self peptide on a resting APC without B7 becomes anergic or dies. The receptor described here appears only after activation and on some regulatory T cells, which is the pattern of CTLA-4.<\/p><p>CTLA-4 binds the same B7 ligands as CD28 but more avidly, so it outcompetes CD28 and shuts off the second signal. On activated T cells it acts as a brake that ends a response, and on regulatory T cells it strips B7 function from APCs. Without it, normal thymic selection and normal Treg numbers are not enough: T cells activate without limit and destroy multiple organs, which shows how much peripheral tolerance depends on this checkpoint.<\/p>", "why_wrong": ["A receptor does not secrete cytokines; interleukin 10 is made by regulatory T cells but is not how this surface molecule works.", "Correct: CTLA-4 binds B7 (CD80 and CD86) more strongly than CD28 does, removing signal 2 and stopping activation.", "Signal 1 itself is intact in these mice; CTLA-4 acts on the costimulatory signal, not on peptide-MHC recognition.", "Thymic negative selection is normal in this mouse; the defect is in the periphery after activation.", "FOXP3 is a transcription factor induced by polarizing cytokines such as TGF-beta and IL-2, and Treg numbers here are normal."], "objective": "CTLA-4, expressed on activated T cells and regulatory T cells, outcompetes CD28 for B7 on antigen-presenting cells and removes signal 2, so its loss causes uncontrolled T cell activation and multi-organ autoimmunity."}, {"qid": "13-14-5", "topic": "SCID classification by lineage", "stem": "<p>A 4-month-old girl has had persistent oral thrush, chronic watery diarrhea and poor weight gain since age 6 weeks. Her parents are healthy first cousins. No tonsils or lymph nodes are found on examination. Red cell, platelet and neutrophil counts are normal. Blood lymphocyte subsets by flow cytometry:<\/p><table class=\"labs\"><tr><th>Population<\/th><th>Patient<\/th><th>Normal for age<\/th><\/tr><tr><td>CD3-positive T cells<\/td><td>20/uL<\/td><td>2,500 to 5,500/uL<\/td><\/tr><tr><td>CD19-positive B cells<\/td><td>10/uL<\/td><td>300 to 2,000/uL<\/td><\/tr><tr><td>CD16/CD56-positive natural killer (NK) cells<\/td><td>450/uL<\/td><td>170 to 1,100/uL<\/td><\/tr><\/table><p>Red cell adenosine deaminase activity is normal.<\/p>", "lead": "If her bone marrow were examined, the most advanced stage of B cell development present would most likely be which of the following?", "choices": ["Common lymphoid progenitor", "Pre-B cell with a pre-B cell receptor", "Immature B cell with surface IgM", "Pro-B cell without a heavy chain", "Mature B cell with IgM and IgD"], "answer": 3, "explanation": "<p>Start with the lineage pattern. This infant has severe combined immunodeficiency (SCID) with absent T cells and B cells but normal natural killer cells (T-negative, B-negative, NK-positive), autosomal recessive inheritance suggested by consanguinity, and normal adenosine deaminase. Natural killer cells do not rearrange receptor genes, while T and B cells both need V(D)J recombination. A defect that removes only the two rearranging lineages points to the V(D)J recombination machinery, classically RAG1 or RAG2 deficiency.<\/p><p>Now apply that to B cell development. The first rearrangement, of the heavy chain, happens in the pro-B cell. Without RAG, no heavy chain can be assembled, so there is no mu chain, no pre-B cell receptor, and no signal to move forward. B lineage cells are therefore arrested at the pro-B stage, and nothing beyond it appears.<\/p>", "why_wrong": ["Common lymphoid progenitors do form normally and go on to become pro-B cells; the block comes later, at the first rearrangement.", "A pre-B cell needs a rearranged heavy chain to build its pre-B cell receptor, which is impossible without V(D)J recombination.", "Surface IgM requires both heavy and light chain rearrangements, neither of which can happen here.", "Correct: T-negative, B-negative, NK-positive SCID means defective V(D)J recombination, so B lineage cells stop at the pro-B stage where heavy chain rearrangement should begin.", "Mature B cells require complete receptors and peripheral migration; she has almost no B cells in the blood at all."], "objective": "In T-negative, B-negative, NK-positive SCID (RAG deficiency), V(D)J recombination fails, so B cell development arrests at the pro-B stage and T cell development at the pro-T stage, while natural killer cells, which do not rearrange receptor genes, are spared.", "table": "<table class=\"\"><tr><th>SCID pattern<\/th><th>Defect<\/th><th>Why<\/th><\/tr><tr><td>T-, B-, NK-<\/td><td>Adenosine deaminase (AR)<\/td><td>Toxic purine metabolites kill all lymphocytes<\/td><\/tr><tr><td>T-, B-, NK+<\/td><td>RAG1/RAG2 (AR)<\/td><td>No V(D)J recombination<\/td><\/tr><tr><td>T-, B+, NK-<\/td><td>Common gamma chain (X-linked)<\/td><td>No IL-2, IL-4, IL-7, IL-15 signaling<\/td><\/tr><tr><td>T-, B+, NK+<\/td><td>IL-7 receptor, CD3 chains (AR)<\/td><td>T cell-specific developmental block<\/td><\/tr><\/table>"}, {"qid": "13-14-6", "topic": "22q11.2 deletion (DiGeorge) syndrome", "stem": "<p>A 5-month-old girl had a cleft palate and a heart outflow tract defect repaired in the newborn period. She has needed calcium supplements since birth because of low serum calcium with low parathyroid hormone. She has had oral thrush twice and a viral respiratory infection that lasted 5 weeks. On examination she has widely spaced eyes and low-set ears. Hemoglobin and neutrophil count are normal.<\/p>", "lead": "Flow cytometry of her blood lymphocytes is most likely to show which pattern?", "choices": ["Low T cells, low B cells, low NK cells", "Low T cells, low B cells, normal NK cells", "Low T cells, normal B cells, normal NK cells", "Normal T cells, low B cells, normal NK cells", "Normal T cells, normal B cells, reduced NK cells"], "answer": 2, "explanation": "<p>The combination of a cardiac outflow defect, cleft palate, characteristic facial features and hypoparathyroidism (low calcium with low parathyroid hormone) points to a defect of the third and fourth pharyngeal pouches. That is 22q11.2 deletion syndrome, also called DiGeorge syndrome. The same pouches give rise to the thymus, so the thymus is hypoplastic or, rarely, absent.<\/p><p>T cells must mature in the thymus, so they are reduced, and the degree depends on how much thymic tissue is left; her thrush and prolonged viral illness fit a T cell deficit. B cells and natural killer (NK) cells develop in the bone marrow and do not need the thymus, so their numbers are normal. This separates DiGeorge syndrome from the severe combined immunodeficiencies, which remove T cells together with B cells, NK cells or both.<\/p>", "why_wrong": ["Loss of all three lineages fits adenosine deaminase deficiency, a bone marrow-wide toxicity, not a thymic defect.", "Low T and B cells with normal NK cells is the pattern of RAG deficiency, where V(D)J recombination fails in both lineages.", "Correct: a pharyngeal pouch defect leaves a small thymus, so T cells are reduced while marrow-derived B and NK cells are normal.", "Low B cells with normal T cells fits a B cell developmental block such as X-linked agammaglobulinemia, not this syndrome.", "Isolated loss of NK cells does not explain the cardiac, palatal and parathyroid findings or a thymic problem."], "objective": "22q11.2 deletion (DiGeorge) syndrome causes thymic hypoplasia from a third and fourth pharyngeal pouch defect, so T cells are reduced while bone marrow-derived B cells and natural killer cells are normal."}, {"qid": "13-14-7", "topic": "Allelic exclusion and monospecificity", "stem": "<p>In an experiment, single B cells are sorted from the spleen of a normal mouse, and the immunoglobulin (Ig) heavy chain and light chain genes of each cell are sequenced. Every cell carries two heavy chain alleles and four light chain alleles (two kappa, two lambda). In most cells, one heavy chain allele is productively rearranged and the other is either unrearranged or nonproductive. Each cell expresses only one heavy chain and one light chain on its surface. In a second mouse, a mutation removes the feedback signal that normally follows a productive heavy chain rearrangement, and many of its B cells express two different heavy chains.<\/p>", "lead": "Which property of the immune response is most directly threatened in the mutant mouse?", "choices": ["Activation-dependent switching from IgM to IgG", "Clonal selection of B cells with one antigen specificity", "Assembly of the pre-B cell receptor with surrogate light chain", "Survival of B cells that fail to bind any antigen", "Signaling through the Ig-alpha and Ig-beta chains"], "answer": 1, "explanation": "<p>The normal mouse shows allelic exclusion. Once a developing B cell makes a productive rearrangement on one heavy chain allele, a feedback signal shuts down recombination on the other allele, and the same happens at the light chain loci. The result is that each B cell, and every antibody its clone ever makes, has a single antigen-binding site.<\/p><p>That single specificity is what clonal selection depends on: antigen picks out the clone whose receptor binds it, and that clone expands into cells making the same antibody. A B cell expressing two heavy chains makes receptors with two specificities, so antigen selecting the cell for one specificity would also expand a second, unrelated (possibly self-reactive) one. Allelic exclusion protects the one cell, one specificity rule.<\/p>", "why_wrong": ["Class switching changes the constant region during activation and is unrelated to how many heavy chain alleles are expressed.", "Correct: allelic exclusion keeps each clone monospecific, which clonal selection requires.", "The pre-B cell receptor still forms from any productive heavy chain plus surrogate light chain; a second heavy chain does not prevent it.", "Cells with two receptors still bind antigen; the problem is dual specificity, not lack of binding.", "Ig-alpha and Ig-beta signal for whichever heavy chain is present and are not affected by losing allelic exclusion."], "objective": "Allelic exclusion shuts down rearrangement of the other alleles once a productive one is made, so each B cell clone expresses one heavy and one light chain and is monospecific, as clonal selection requires."}, {"qid": "13-14-8", "topic": "Receptor editing in central B cell tolerance", "stem": "<p>In an experiment, mice are engineered so that all developing B cells carry a prerearranged heavy chain and kappa light chain encoding a receptor that binds a protein expressed on the surface of every cell in the body. In the bone marrow, immature B cells bearing this receptor bind the self protein and briefly re-express recombination-activating gene (RAG) proteins. Weeks later, most B cells in the spleen still carry the original transgenic heavy chain, but they now express lambda light chains and no longer bind the self protein.<\/p>", "lead": "Which statement best describes the process that rescued these B cells?", "choices": ["Peripheral anergy that lowers surface IgM after binding", "Suppress
