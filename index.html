 "objective": "Serum IgG in healthy infants rarely falls below about 40% of adult levels; far lower values as maternal IgG fades (4 to 8 months) point to an antibody deficiency."}, {"qid": "4B-4", "topic": "Protective early exposures", "stem": "<p>A birth cohort follows 400 infants through their first year. Infants are grouped by household exposures: one group lives on farms with livestock and dogs and has two or more older siblings; the other lives in urban apartments with no pets or siblings. Antibiotic use and delivery mode are similar between groups. At 12 months, stool from the farm group shows more Bifidobacterium, greater microbial diversity and more short-chain fatty acids.<\/p>", "lead": "Which immune finding is most likely in the farm group at 12 months?", "choices": ["More IgE class switching with Th2 priming", "More mucosal IgA and IgG4 with Treg activation", "Fewer naive T cells with oligoclonal memory", "Higher maternal IgG levels from the placenta", "Lower innate immune activation in the gut"], "answer": 1, "explanation": "<p>Rural or farm life, pets and older siblings are the protective early exposures. They are linked to more Bifidobacterium colonization, more microbiome diversity and more short-chain fatty acids, which is the stool picture in the farm group.<\/p><p>That microbiome is in turn linked to innate immune activation, more IgG4 and mucosal IgA, Th1 priming and Treg activation: the trained regulatory network the hygiene hypothesis says protects against allergy and autoimmunity. The urban pattern runs the other way, toward Th2 priming, IgE class switching and impaired Treg function.<\/p>", "why_wrong": ["This is the harmful-exposure pattern (urban life, antibiotics), opposite to the farm group's microbiome.", "Correct: protective exposures go with more IgG4 and mucosal IgA, Th1 priming and Treg activation.", "Fewer naive T cells and oligoclonality are features of immune aging, not of a 1-year-old.", "Maternal IgG has faded by 12 months and does not depend on household exposures.", "Protective exposures increase, not decrease, innate immune activation."], "objective": "Protective early exposures (farm, pets, older siblings) increase Bifidobacterium and diversity and are linked to mucosal IgA, IgG4, Th1 priming and Treg activation.", "table": "<table><tr><th><\/th><th>Protective (farm, pets, siblings)<\/th><th>Harmful (urban, antibiotics)<\/th><\/tr><tr><td>Microbiome<\/td><td>More Bifidobacterium, diversity, SCFAs<\/td><td>Fewer Bifidobacterium, dysbiosis<\/td><\/tr><tr><td>Immune result<\/td><td>Innate activation, IgG4 and mucosal IgA, Th1 priming, Treg activation<\/td><td>Th2 priming, IgE switching, impaired Tregs<\/td><\/tr><\/table>"}, {"qid": "4B-5", "topic": "Exhausted T cells in aging", "stem": "<p>An 83-year-old man receives a vaccine containing a protein antigen he has never encountered. Four weeks later he shows almost no T cell response to it, while young controls respond strongly. His lymphocyte count is normal. Flow cytometry shows that most of his CD8+ T cells lack the surface molecule CD28, a population that is rare in young adults, and T cell receptor sequencing shows a few large clones. His dendritic cells express normal levels of B7 molecules.<\/p>", "lead": "Which defect best explains why this CD8+ population responds poorly to a new antigen?", "choices": ["Absence of MHC class I on his antigen-presenting cells", "Neutralization of the vaccine by circulating antibody", "Failure of thymic selection of these CD8+ cells", "Autoantibodies blocking type I interferon", "Loss of the receptor for costimulatory signal 2"], "answer": 4, "explanation": "<p>CD8+ CD28-negative T cells are the chronically stimulated cytotoxic T cells that accumulate with age, alongside the expanded memory clones produced by homeostatic proliferation after thymic involution. They are part of the shift toward memory, exhausted and senescent lymphocytes that defines immunosenescence.<\/p><p>CD28 is the T cell receptor for B7 on antigen-presenting cells, the costimulatory second signal needed to activate a T cell to a new antigen (Lecture 11). His dendritic cells offer normal B7, so the problem lies in the T cells: without CD28 they cannot receive signal 2. Together with a narrow repertoire, this is why older adults respond weakly to new antigens and vaccines.<\/p>", "why_wrong": ["Nothing suggests missing MHC class I; the defect described is on the T cells.", "A protein vaccine in an elderly man is not blocked by maternal antibody, and no antibody is described.", "These cells were selected and expanded; the problem is chronic stimulation with age, not failed selection.", "Anti-interferon autoantibodies impair antiviral defense, not CD28 costimulation.", "Correct: CD28-negative chronically stimulated CD8+ T cells cannot receive B7 costimulation, so they respond poorly to new antigens."], "objective": "Chronically stimulated CD8+ CD28-negative T cells accumulate with age; lacking CD28, they cannot receive B7 costimulation, weakening responses to new antigens."}, {"qid": "4B-6", "topic": "Conjugate vaccines in young children", "stem": "<p>Two vaccines against pneumococcus are tested in healthy 18-month-old children. Vaccine 1 contains purified capsular polysaccharide alone. Vaccine 2 contains the same polysaccharides linked to a carrier protein. One month later, the children given vaccine 1 show little rise in anti-capsule IgG, while those given vaccine 2 show a strong, class-switched response with memory. Their total IgG and IgG1 are normal for age, and their IgG2 is low by adult standards but normal for their age.<\/p>", "lead": "Which explanation best accounts for the difference in response?", "choices": ["The carrier protein blocks maternal IgG against the capsule", "The polysaccharide vaccine triggers Th2 skewing and IgE", "The polysaccharide vaccine needs a mature thymus to work", "The carrier protein recruits T cell help to the response", "The carrier protein expands NK cells that kill bacteria"], "answer": 3, "explanation": "<p>Responses to polysaccharide antigens are T-independent, carried largely by IgG2, and they mature slowly and variably in childhood, reaching adult levels only later in childhood. A plain polysaccharide vaccine therefore produces little antibody in a toddler, which is why young children are susceptible to encapsulated bacteria such as pneumococcus and Hib.<\/p><p>Linking the polysaccharide to a protein carrier makes it a T-dependent antigen: the B cell presents carrier peptides to helper T cells and receives their help, giving class switching and memory (Lecture 17). That is the reason conjugate vaccines are used for pneumococcus and Hib in young children.<\/p>", "why_wrong": ["Maternal IgG has faded by 18 months, and the carrier does not act on it.", "Neither vaccine is described as causing IgE; the issue is weak T-independent antibody.", "T-independent responses do not depend on the thymus, and an 18-month-old's thymus is at full output.", "Correct: conjugation turns a T-independent polysaccharide into a T-dependent antigen that a toddler can answer.", "NK cells do not produce the anti-capsule antibody measured here."], "objective": "Young children make weak T-independent (IgG2) responses to polysaccharides; conjugate vaccines add T cell help, which is why they are used for pneumococcus and Hib."}, {"qid": "4B-7", "topic": "Hematopoiesis in early gestation", "stem": "<p>An embryo at 7 weeks of gestation is examined after a spontaneous pregnancy loss. Blood islands are found outside the embryo proper, and the circulating cells are almost entirely nucleated red cells, with very few lymphocytes. The liver and long bones show little or no blood cell production, and no thymus is yet identifiable.<\/p>", "lead": "Which organ is producing most of this embryo's blood cells?", "choices": ["Bone marrow", "Fetal liver", "Yolk sac", "Spleen", "Thymus"], "answer": 2, "explanation": "<p>Primary hematopoiesis moves through three sites over gestation. In the first trimester it takes place in the yolk sac, which produces mostly erythrocytes and only a few lymphocytes. In the second trimester the fetal liver takes over, with a smaller contribution from the spleen and the thymus starting later in the trimester. In the third trimester the bone marrow becomes the main site and stays so for life.<\/p><p>At 7 weeks this embryo is in the first trimester, its blood cells are almost all red cells, and the liver and bones are not yet making blood. That fits the yolk sac.<\/p>", "why_wrong": ["Bone marrow becomes the main site only in the third trimester.", "The fetal liver dominates in the second trimester, and this liver shows little production.", "Correct: the first-trimester site is the yolk sac, making mostly red cells and few lymphocytes.", "The spleen contributes a little in the second trimester and never dominates.", "The thymus produces T lymphocytes from later in the second trimester and is not yet present here."], "objective": "First-trimester hematopoiesis occurs in the yolk sac (mostly erythrocytes, few lymphocytes), before the fetal liver (second trimester) and bone marrow (third)."}]}, {"id": "WS2", "title": "Development of the Microbiome", "week": 4, "subject": "Immunology", "questions": [{"qid": "WS2-1", "topic": "Microbiome across the lifespan", "stem": "<p>A pediatric practice collects stool samples from 40 healthy children born at term, once at 1 month of age and again at 3 years of age. At each time point the investigators measure two things: how many different bacterial groups are present in each child (diversity), and how much the bacterial makeup differs from one child to the next (interindividual variability).<\/p>", "lead": "Which pattern is most likely when the 3-year samples are compared with the 1-month samples?", "choices": ["Diversity falls and variability between children rises", "Diversity and variability between children both fall", "Diversity rises and variability between children falls", "Diversity and variability between children both rise", "Neither changes once colonization is complete at birth"], "answer": 2, "explanation": "<p>The fetal intestine is only minimally colonized. After birth the gut fills with microbes, and over the first few years two things move in opposite directions: bacterial diversity climbs steadily, while the differences between one child and the next shrink. By about 2 to 3 years of age the gut microbiome looks adult-like.<\/p><p>So a 1-month sample is low in diversity but highly individual (it depends heavily on delivery mode, feeding and antibiotics), while a 3-year sample is diverse and more similar across children. The microbiome keeps changing across the whole lifespan afterward, with diet, antibiotics, disease and aging.<\/p>", "why_wrong": ["Both directions are reversed: diversity rises with age and children become more alike.", "Diversity does not fall in early childhood; it climbs toward an adult-like gut.", "Correct: diversity rises and interindividual variability falls toward an adult-like gut by 2 to 3 years.", "Children's microbiomes converge with age rather than diverging.", "Colonization is not complete at birth; the fetal gut is minimally colonized and the microbiome evolves for years."], "objective": "From birth to 2 to 3 years, gut bacterial diversity rises while variability between individuals falls, reaching an adult-like microbiome."}, {"qid": "WS2-2", "topic": "Breastfed versus formula-fed gut", "stem": "<p>A 4-week-old boy born vaginally at term has been fed infant formula exclusively since birth. He is growing well and has no illness. As part of a feeding study, his stool microbiota is sequenced and compared at the phylum and family level with that of breastfed infants of the same age.<\/p>", "lead": "Which description best fits his stool microbiota compared with the breastfed infants'?", "choices": ["Firmicutes lead, with a mix of many families", "Actinobacteria near 70%, mostly Bifidobacteriaceae", "Proteobacteria near 70%, mostly Enterobacteriaceae", "Almost no bacteria, as in the fetal gut", "Bacteroidetes near 70%, an adult-like profile"], "answer": 0, "explanation": "<p>At 4 weeks, breastfed and formula-fed infants carry clearly different gut communities. In breastfed infants one phylum dominates, Actinobacteria at about 70%, and within it one family, Bifidobacteriaceae, also at about 70%. Human milk oligosaccharides explain this: they reach the colon undigested, and Bifidobacterium carries the genes to metabolize them.<\/p><p>A formula-fed infant has no such selective substrate, so no single family takes over. Firmicutes lead (about 45%), with Actinobacteria and Proteobacteria behind, and the families are mixed: streptococci, Veillonella, enterococci and many others, with bifidobacteria a minority.<\/p>", "why_wrong": ["Correct: formula-fed infants show Firmicutes leading and a mixed spread of families.", "This is the breastfed pattern, driven by milk oligosaccharides that feed bifidobacteria.", "Proteobacteria are present in formula-fed infants but do not dominate at this level.", "Only the fetal intestine is minimally colonized; a 4-week-old gut is well colonized.", "An adult-like profile arrives at 2 to 3 years, not at 4 weeks."], "objective": "Breastfed infants are Actinobacteria/Bifidobacteriaceae-dominated (about 70%); formula-fed infants are Firmicutes-led with mixed families.", "table": "<table><tr><th><\/th><th>Breastfed<\/th><th>Formula-fed<\/th><\/tr><tr><td>Leading phylum<\/td><td>Actinobacteria (about 70%)<\/td><td>Firmicutes (about 45%)<\/td><\/tr><tr><td>Leading family<\/td><td>Bifidobacteriaceae (about 70%)<\/td><td>Mixed, no single winner<\/td><\/tr><tr><td>Why<\/td><td>HMOs feed bifidobacteria<\/td><td>No selective substrate<\/td><\/tr><\/table>"}, {"qid": "WS2-3", "topic": "GALT maturation and the first 1,000 days", "stem": "<p>A boy born at term develops a series of serious infections in his first year and receives repeated courses of broad-spectrum antibiotics. Stool samples at 6, 12 and 18 months show very low bacterial diversity, far below age-matched children. At 2 years, a research endoscopy with mucosal biopsy (done with parental consent for an unrelated reason) is examined for the organization of lymphoid tissue in the intestinal wall.<\/p>", "lead": "Which change in his gut immune tissue is most likely?", "choices": ["Overgrowth of goblet cells thickening the mucus layer", "Absorption of secretory IgA into the lamina propria", "Excess regulatory T cells crowding the lamina propria", "Poorly organized isolated lymphoid follicles with fewer Treg", "Loss of Paneth and stem cells from the crypt base"], "answer": 3, "explanation": "<p>Gut-associated lymphoid tissue (GALT) is the immune system's training camp: 70 to 80% of all immune cells live in the gut. It does not mature on a fixed program; it needs to see diverse bacteria. The lecture puts the window at the first 1,000 days: if the gut does not see enough diverse bacteria in that time, the GALT does not mature properly.<\/p><p>The microbiome plays an active role here. It organizes the isolated lymphoid follicle (ILF) and educates the immune system through short-chain fatty acids and regulatory T cell development. Repeated antibiotics in year one left this child with a low-diversity gut during exactly that window, so the expected result is poorly organized follicles and weaker Treg development.<\/p>", "why_wrong": ["Goblet cells and mucus are part of the barrier, but low diversity is not tied to their overgrowth.", "Secretory IgA is not absorbed by the infant; it stays on the mucosa.", "The microbiome drives Treg development through SCFA, so a depleted microbiome means fewer Treg, not more.", "Correct: the microbiome organizes the ILF and drives Treg via SCFA; without diverse bacteria in the first 1,000 days, the GALT does not mature properly.", "Paneth and stem cells sit at the crypt base on the GALT figure, but the lecture does not tie low diversity to their loss."], "objective": "The microbiome organizes isolated lymphoid follicles and drives Treg via SCFA; without diverse bacteria in the first 1,000 days, GALT does not mature properly."}, {"qid": "WS2-4", "topic": "Milk modulation of TLR2", "stem": "<p>Milk samples from a group of breastfeeding mothers are analyzed for soluble immune molecules. One mother's milk is unusually rich in soluble Toll-like receptor 2 (sTLR2) and soluble CD14 (sCD14), with ordinary levels of lactoferrin, lactadherin and beta-defensin 2. Her 2-month-old daughter is healthy, with a gut heavily colonized by commensal bacteria and no signs of intestinal inflammation.<\/p>", "lead": "Signaling in response to which organisms is this milk best suited to dampen?", "choices": ["Gram-negative pathogens that carry lipopolysaccharide", "Viruses sensed through TLR7 inside the cell", "Pathogens bound by milk oligosaccharide decoys", "Gram-negative organisms sensed through TLR5", "Gram-positive bifidobacteria sensed through TLR2"], "answer": 4, "explanation": "<p>Two Toll-like receptors carry the colonization story. TLR4 binds lipopolysaccharide (LPS) from Gram-negative pathogens, and TLR2 binds Gram-positive bifidobacteria. Both are needed for proper colonization, but unchecked signaling would inflame the gut against its own commensals.<\/p><p>Human milk solves this with soluble receptors that soak up ligand before it reaches the epithelial cell. Soluble TLR2 and soluble CD14 are anti-inflammatory via TLR2, so milk rich in them blunts the response to Gram-positive bifidobacteria and lets the infant host them in a symbiotic relationship. Lactoferrin and lactadherin, which act on TLR4, are only at ordinary levels here.<\/p>", "why_wrong": ["LPS-bearing Gram-negative pathogens signal through TLR4, which milk dampens mainly through lactoferrin, lactadherin, sCD14 and 2'-fucosyllactose.", "Milk acts on TLR7 through beta-defensin 2, which is at ordinary levels here.", "Oligosaccharide decoys block pathogen adhesion; they are not soluble TLR2.", "TLR5 is listed among the receptors milk components can modulate, but sTLR2 and sCD14 act on TLR2.", "Correct: soluble TLR2 and soluble CD14 dampen TLR2 signaling, the receptor that senses Gram-positive bifidobacteria."], "objective": "TLR2 senses Gram-positive bifidobacteria and TLR4 senses LPS of Gram-negative pathogens; milk sTLR2 and sCD14 dampen TLR2 so commensals are hosted."}, {"qid": "WS2-5", "topic": "Feeding and immune cell ontogeny", "stem": "<p>Blood samples from exclusively breastfed and exclusively formula-fed infants are compared at 1.5, 4 and 6 months of age by flow cytometry. Across all three time points, one population of innate lymphocytes is consistently higher in the breastfed infants. The formula-fed infants show an ongoing maturation of adaptive immune cells and a delayed recruitment of innate immune cells.<\/p>", "lead": "Which function does the lecture attribute to the innate lymphocyte population that is higher in breastfed infants?", "choices": ["Switching B cells from IgM to IgA", "Surveillance for cancer and diseased self cells", "Organizing isolated lymphoid follicles", "Delivering maternal antigens to the thymus", "Driving Th2 responses to food allergens"], "answer": 1, "explanation": "<p>Comparing blood immune cells at 1.5, 4 and 6 months shows that feeding steers immune development. Formula-fed infants have ongoing maturation of adaptive immune cells, which the lecture links to allergy, and delayed recruitment of innate immune cells, which it links to infection.<\/p><p>The innate lymphocytes that run higher in breastfed infants are natural killer (NK) cells. The lecture flags them as important in cancer surveillance and in detecting diseased self, so breastfed infants carry more of this early, innate line of defense.<\/p>", "why_wrong": ["IgA switching is driven by colostral TGF-beta acting on B cells, not by NK cells.", "Correct: NK cells, higher in breastfed infants, carry out cancer surveillance and detect diseased self.", "Organizing the isolated lymphoid follicle is a job of the microbiome, especially bifidobacteria.", "Maternal T cells reach the infant thymus through microchimerism; NK cells are not described doing this.", "Th2 responses are the allergy side and are damped, not driven, in breastfed infants."], "objective": "Breastfed infants have more NK cells (cancer surveillance, detecting diseased self); formula-fed infants show early adaptive maturation (allergy) and delayed innate recruitment (infection)."}, {"qid": "WS2-6", "topic": "Breastfeeding rates and barriers", "stem": "<p>A 28-year-old woman who planned to breastfeed exclusively for 6 months stops at 7 weeks. She explains that when she returned to her job, she had no scheduled break time to express milk and no private place to do it other than a restroom stall. Her pediatrician notes that her experience is common and that national exclusive breastfeeding rates at 6 months fall well short of the Healthy People 2030 goal.<\/p>", "lead": "Which barrier category does her experience represent, and which policy was aimed at it?", "choices": ["Healthcare barrier; the WHO Code on formula marketing", "Social barrier; the PUMP Act of 2022", "Work and child care barrier; the PUMP Act of 2022", "Historical barrier; the WHO Code on formula marketing", "Family support barrier; parental leave policies"], "answer": 2, "explanation": "<p>The American Academy of Pediatrics recommends exclusive breastfeeding for 6 months. The Healthy People 2030 goals are 42.4% exclusive at 6 months and 54.1% any breastfeeding at 12 months, but the actual exclusive rate is only about 25.5%.<\/p><p>The lecture sorts the barriers into categories: social (norms, culture, formula marketing without the WHO Code), family and social support, healthcare (little access to lactation specialists or support), work and child care, individual factors, policies, equipment and privacy, and historical trauma and marginalization. Losing breastfeeding because there is no break time or private space at work is a work barrier, and the lecture notes it is better now with the PUMP Act of 2022.<\/p>", "why_wrong": ["Healthcare barriers are about lactation support and health workers, and the WHO Code addresses formula marketing.", "Social barriers are norms, attitudes and formula marketing; her problem arose at work.", "Correct: no break time or private space at work is a work and child care barrier, improved by the PUMP Act of 2022.", "Historical barriers are the legacy of trauma, slavery and marginalization, not workplace conditions.", "Family support concerns family and friends; her barrier was the workplace."], "objective": "AAP recommends 6 months of exclusive breastfeeding; actual exclusive rates (about 25.5%) trail the 42.4% HP 2030 goal, and workplace barriers were addressed by the PUMP Act of 2022."}, {"qid": "WS2-7", "topic": "TGF-beta and IgA switching", "stem": "<p>A preterm girl born at 33 weeks receives her mother's colostrum from day 1. A soluble factor in the colostrum is measured at about 10 times its level in maternal serum; the neonatal team values it because it helps seal tight junctions in the gut and dampens the inflammatory responses behind necrotizing enterocolitis. Over the next weeks the girl's own intestinal B cells are followed with mucosal sampling as part of a research protocol.<\/p>", "lead": "Which change in her intestinal B cells is this factor expected to promote?", "choices": ["Absorption of maternal secretory IgA into her blood", "Isotype switching from IgM toward IgA", "Isotype switching toward IgE against food antigens", "Arrest of her B cells at IgM production", "Replacement of her B cells by maternal T cells"], "answer": 1, "explanation": "<p>A soluble colostral factor at about 10 times the serum concentration that seals tight junctions and helps prevent necrotizing enterocolitis is TGF-beta. Its jobs reach well beyond the barrier: it establishes oral immune tolerance through regulatory T cells, aids growth and repair of the gut epithelium and GALT, and helps the thymus proliferate.<\/p><p>For B cells, TGF-beta stimulates the newborn's own IgA production by isotype switching from IgM, through IgG, to IgA, and it accelerates the switch to secretory IgA, which reduces the effector response to food allergens and regulates atopic responses. The infant is therefore pushed to make her own mucosal IgA rather than to depend on anything absorbed from milk.<\/p>", "why_wrong": ["Secretory IgA is not absorbed by the infant; it stays on the mucosa.", "Correct: colostral TGF-beta drives the newborn's isotype switching from IgM toward IgA and secretory IgA.", "TGF-beta lowers allergic responses; switching toward IgE would be the atopic outcome it opposes.", "TGF-beta moves B cells past IgM toward IgA rather than holding them at IgM.", "Maternal microchimerism sends maternal T cells to the thymus, not into the infant's B cell compartment."], "objective": "Colostral TGF-beta (about 10 times serum) drives the newborn's own isotype switch from IgM toward IgA and secretory IgA, besides sealing tight junctions and preventing NEC.", "table": "<table><tr><th>Job of colostral TGF-beta<\/th><th>What it does<\/th><\/tr><tr><td>Tolerance<\/td><td>Oral tolerance via Treg<\/td><\/tr><tr><td>Antibody<\/td><td>Switch IgM to IgG to IgA; faster sIgA<\/td><\/tr><tr><td>Barrier<\/td><td>Seals tight junctions, repairs gut and GALT<\/td><\/tr><tr><td>Inflammation<\/td><td>Prevents NEC<\/td><\/tr><tr><td>Thymus<\/td><td>Thymic proliferation (CD4 and CD8 T cells)<\/td><\/tr><\/table>"}, {"qid": "WS2-8", "topic": "Why colonization requires tolerance", "stem": "<p>In a newborn's intestine, dendritic cells extend dendrites between epithelial cells to sample the lumen. Within days of birth they encounter both commensal bifidobacteria and a small number of pathogenic bacteria. Both kinds of organism engage the same Toll-like receptors on these cells. Over the following months, the infant ends up colonized by commensals without mounting damaging responses to them.<\/p>", "lead": "Which feature of gut microbes makes developing tolerance during colonization necessary?", "choices": ["Commensals and pathogens share PAMPs", "Commensals carry no PAMPs at all", "Infant gut cells do not yet express TLRs", "Pathogens are recognized only by antibody", "Commensals remain confined to the fetal gut"], "answer": 0, "explanation": "<p>The newborn gut has to be colonized shortly after birth, but it also has to tell pathogens from commensals, and the two share pathogen-associated molecular patterns (PAMPs). Pattern recognition receptors such as TLRs therefore cannot separate them on pattern alone.<\/p><p>The solution is a trained response: the immune response to flora leads both to colonization with commensal bacteria and to immunologic tolerance, shaped by the microbiome itself and by milk factors that tune TLR signaling. When exposure or the handling of flora fails (cesarean delivery, formula instead of human milk), the hygiene hypothesis predicts allergy.<\/p>", "why_wrong": ["Correct: commensals and pathogens share PAMPs, so tolerance must be learned during colonization.", "Commensals do carry PAMPs; bifidobacteria are sensed through TLR2.", "Infant gut cells express TLRs, and specific TLRs are needed for proper colonization.", "Pathogens are also sensed by innate receptors such as TLR4, not only by antibody.", "The fetal gut is minimally colonized; commensals arrive after birth."], "objective": "Commensals and pathogens share PAMPs, so the infant gut must develop immunologic tolerance while being colonized; failure (hygiene hypothesis) leads to allergy."}, {"qid": "WS2-9", "topic": "Thymus development and feeding", "stem": "<p>Twin boys born at term are fed differently from birth: one is given his mother's colostrum and then exclusively breastfed, the other receives formula only and never receives colostrum or human milk. The formula-fed twin is given a probiotic, and by 3 months his stool carries bifidobacteria and butyrate at levels similar to his brother's. At 4 months, chest radiographs taken for an unrelated reason still show the breastfed twin's thymus nearly twice the size of his brother's. Research blood testing finds no T cells of maternal origin in either twin.<\/p>", "lead": "Which mechanism best accounts for the remaining difference in thymus size?", "choices": ["TGF-beta driving thymic epithelial proliferation", "Bifidobacteria sending T cells from gut follicles", "Butyrate stimulating regulatory T cell production", "Maternal T cells reaching the thymus from colostrum", "Lactoferrin dampening TLR4 signaling in the gut"], "answer": 0, "explanation": "<p>Breastfed infants can have a thymus nearly twice the size of a formula-fed infant's at 4 months. The lecture gives four mechanisms: TGF-beta and its receptor promote proliferation of cells throughout the body, including thymic epithelium; bifidobacteria organize the isolated lymphoid follicle and send T cells to the developing thymus; short-chain fatty acids from fermentation make butyrate, which stimulates regulatory T cell production; and maternal microchimerism, mainly from colostrum, sends maternal T cells to the thymus.<\/p><p>The stem removes three of them. The probiotic gave the formula-fed twin bifidobacteria and butyrate like his brother's, and no maternal T cells were found in either twin. What remains is colostral TGF-beta, concentrated about 10 times above serum, which the formula-only twin never received and which the lecture also lists as helping the thymus proliferate.<\/p>", "why_wrong": ["Correct: colostral TGF-beta drives proliferation of thymic epithelium, and only the breastfed twin received it.", "Both twins carry bifidobacteria after the probiotic, so this mechanism cannot explain the difference.", "Stool butyrate is similar in both twins, so butyrate-driven Treg production does not explain it.", "No maternal T cells were found in either twin, which argues against microchimerism here.", "Lactoferrin dampens TLR4 in the gut and is not one of the thymic mechanisms."], "objective": "Breastfed infants' larger thymus comes from TGF-beta on thymic epithelium, bifidobacteria and the ILF, butyrate-driven Treg, and maternal microchimerism from colostrum."}]}]}];</script>
<script>
(function(){
"use strict";
const BANKS = window.QBANKS || [];
const LET = "ABCDEFGHIJ";
const STORE_KEY = "qbank-v1";
const TIMED_SECS = 90;

/* ---------- storage ---------- */
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s && s.tests) return s; }catch(e){} return {tests:[], q:{}, bank: BANKS[0] && BANKS[0].id, fs:16, seq:0}; }
let S = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- bank index ---------- */
const QMAP = {}; // key bank:qid -> {q, sess, bank}
BANKS.forEach(b => b.sessions.forEach(s => s.questions.forEach((q,i) => { QMAP[b.id+":"+q.qid] = {q, sess:s, bank:b, idx:i}; })));
function bank(){ return BANKS.find(b=>b.id===S.bank) || BANKS[0]; }
function qkey(qid, b){ return (b||bank()).id+":"+qid; }
function qs(key){ return S.q[key] || (S.q[key] = {}); }
function qStatus(key){ const st = S.q[key]; return st && st.status || "unused"; }

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmtTime(t){ t=Math.max(0,Math.round(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?String(h).padStart(2,"0")+":":"00:")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function fmtSpent(t){ t=Math.round(t||0); const m=Math.floor(t/60), s=t%60; return (m? m+" min"+(m>1?"s":"")+", ":"")+s+" sec"+(s!==1?"s":""); }
function fmtDate(ms){ return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function modal({title, body, ok="OK", cancel="Cancel", wide=false, onOk}){
  const sc=document.createElement("div"); sc.className="scrim";
  sc.innerHTML=`<div class="modal${wide?" wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h4>${esc(title)}</h4><div class="mb">${body}</div><div class="mf">${cancel?`<button class="btn ghost" data-x>${esc(cancel)}</button>`:""}<button class="btn" data-ok>${esc(ok)}</button></div></div>`;
  document.body.appendChild(sc);
  const close=()=>{ sc.remove(); document.removeEventListener("keydown",kd,true); };
  const kd=e=>{ if(e.key==="Escape"){ e.stopPropagation(); close(); } };
  document.addEventListener("keydown",kd,true);
  sc.addEventListener("click",e=>{ if(e.target===sc||e.target.hasAttribute("data-x")) close(); if(e.target.hasAttribute("data-ok")){ if(onOk && onOk(sc)===false) return; close(); }});
  setTimeout(()=>{ const f=sc.querySelector("textarea")||sc.querySelector("[data-ok]"); f&&f.focus(); },0);
  return sc;
}
const IC = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  create:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  perf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  font:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 20l6-16 6 16M6.5 14h7M17 10h6M20 7v6"/></svg>',
  contrast:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  keys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M10 8v8M14 8v8"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  hl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h16"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h11l-1.5 4L16 12H7v9z"/></svg>',
  flagO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4h11l-1.5 4L16 12H7"/></svg>',
};

/* ---------- shell ---------- */
let view = "create";
const root = document.getElementById("app");
function setTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); S.theme=t||null; save(); }
if(S.theme) document.documentElement.setAttribute("data-theme",S.theme);
function isDark(){ const a=document.documentElement.getAttribute("data-theme"); return a ? a==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }

function renderShell(title, inner, sub){
  const b = bank();
  const navItems = [["create","Build a test"],["previous","My tests"],["performance","Progress"]];
  root.innerHTML = `<div class="app">
    <header class="appbar"><div class="appbar-in">
      <div class="logo"><span class="glyph">QB</span><div><b>Question Bank</b><small>${esc(b?b.short:"")}</small></div></div>
      <nav class="tabs" aria-label="Sections">${navItems.map(([v,l])=>`<button data-view="${v}"${v===view||(v==="previous"&&view==="results")?' aria-current="page"':""}>${l}</button>`).join("")}</nav>
      <span class="spacer"></span>
      ${BANKS.length>1?`<select id="bankSel" aria-label="Question bank">${BANKS.map(x=>`<option value="${esc(x.id)}"${x.id===b.id?" selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}
      <button class="iconbtn" id="themeBtn" aria-label="${isDark()?"Switch to light mode":"Switch to dark mode"}" title="${isDark()?"Light mode":"Dark mode"}">${IC.contrast}</button>
    </div></header>
    <main class="page"><div class="page-h"><h2>${esc(title)}</h2>${sub?`<p>${sub}</p>`:""}</div>${inner}</main></div>`;
  root.querySelectorAll("[data-view]").forEach(el=>el.onclick=()=>{ view=el.dataset.view; render(); });
  $("#themeBtn").onclick=()=>{ setTheme(isDark()?"light":"dark"); render(); };
  const bs=$("#bankSel"); if(bs) bs.onchange=()=>{ S.bank=bs.value; save(); render(); };
}
function countBank(b){ return b? b.sessions.reduce((n,s)=>n+s.questions.length,0) : 0; }

/* ---------- create test ---------- */
const C = { tutor:true, timed:false, modes:new Set(["unused"]), order:"lecture", subjects:null, sessions:new Set(), n:null };
function modeMatch(key){
  const st = S.q[key]||{};
  const status = st.status||"unused";
  return (C.modes.has("unused") && status==="unused") || (C.modes.has("incorrect") && status==="incorrect") ||
         (C.modes.has("correct") && status==="correct") || (C.modes.has("omitted") && status==="omitted") || (C.modes.has("marked") && !!st.marked);
}
function pool(){
  const b=bank(); const out=[];
  b.sessions.forEach(s=>{ if(!C.sessions.has(s.id)) return; if(C.subjects && !C.subjects.has(s.subject)) return; s.questions.forEach(q=>{ if(modeMatch(qkey(q.qid,b))) out.push(q.qid); }); });
  return out;
}
function renderCreate(){
  const b=bank();
  if(!b){ renderShell("Create Test",`<div class="card empty">No question bank is loaded.</div>`); return; }
  if(!C.subjects) C.subjects=new Set(b.sessions.map(s=>s.subject));
  const all = b.sessions.flatMap(s=>s.questions.map(q=>qkey(q.qid,b)));
  const cnt = m => all.filter(k=> m==="marked" ? !!(S.q[k]||{}).marked : qStatus(k)===m).length;
  const weeks = [...new Set(b.sessions.map(s=>s.week))].sort((a,b)=>a-b);
  const subjects = [...new Set(b.sessions.map(s=>s.subject))];
  const availIn = s => s.questions.filter(q=>modeMatch(qkey(q.qid,b))).length;
  const P = pool();
  const n = Math.min(C.n||P.length, P.length);
  const modes=[["unused","Unused"],["incorrect","Incorrect"],["marked","Marked"],["omitted","Omitted"],["correct","Correct"]];
  const nLec = b.sessions.filter(s=>C.sessions.has(s.id)).length;
  renderShell("Build a test", `<div class="create">
   <div class="card">
    <div class="sec"><h3>How it runs</h3><div class="mode-cards">
      <label class="mode"><input type="checkbox" id="mTutor"${C.tutor?" checked":""}><span class="box"></span><span><b>Tutor</b><span class="d">See the answer and explanation after each question.</span></span></label>
      <label class="mode"><input type="checkbox" id="mTimed"${C.timed?" checked":""}><span class="box"></span><span><b>Timed</b><span class="d">90 seconds per question, counted down for the block.</span></span></label>
    </div></div>
    <div class="sec"><h3>Which questions <span class="count">${all.length}</span></h3><div class="row">
      ${modes.map(([m,l])=>`<label class="opt"><input type="checkbox" data-mode="${m}"${C.modes.has(m)?" checked":""}>${l} <span class="count">${cnt(m)}</span></label>`).join("")}
    </div></div>
    <div class="sec"><h3>Subject</h3><div class="row">${subjects.map(sj=>`<label class="opt"><input type="checkbox" data-subj="${esc(sj)}"${C.subjects.has(sj)?" checked":""}>${esc(sj)} <span class="count">${b.sessions.filter(s=>s.subject===sj).reduce((n,s)=>n+availIn(s),0)}</span></label>`).join("")}</div></div>
    <div class="sec"><h3>Order</h3><div class="seg" role="group" aria-label="Order">
      <button data-order="lecture" aria-pressed="${C.order==="lecture"}">Lecture by lecture</button><button data-order="shuffle" aria-pressed="${C.order==="shuffle"}">Shuffled</button></div>
      <p class="help">Lecture by lecture keeps each lecture's questions together, in the order the lecture teaches them.</p></div>
   </div>
   <div class="card">
    <div class="lec-head"><h3>Lectures</h3><button class="linkbtn" id="allLec">${b.sessions.every(s=>C.sessions.has(s.id))?"Clear all":"Select all"}</button></div>
      ${weeks.map(w=>{ const ss=b.sessions.filter(s=>s.week===w); const allOn=ss.every(s=>C.sessions.has(s.id));
        return `<div class="week"><div class="week-h"><b>Week ${w}</b><span class="count">${ss.reduce((n,s)=>n+availIn(s),0)}</span><button class="linkbtn" data-week="${w}" data-on="${allOn?1:0}">${allOn?"Clear week":"Whole week"}</button></div><div class="lec-list">
        ${ss.map(s=>{ const a=availIn(s); const off=C.subjects && !C.subjects.has(s.subject); return `<label class="lec${off?" dis":""}"><input type="checkbox" data-sess="${esc(s.id)}"${C.sessions.has(s.id)?" checked":""}${off?" disabled":""}><span class="id">${esc(s.id)}</span><span class="t">${esc(s.title)}</span><span class="count">${a}</span></label>`; }).join("")}
        </div></div>`; }).join("")}
   </div>
  </div>
  <div class="startbar"><div class="startbar-in">
    <div class="sum">${P.length} question${P.length===1?"":"s"} ready<small>${nLec} lecture${nLec===1?"":"s"} selected, ${C.tutor?"tutor":"no tutor"}, ${C.timed?"timed":"untimed"}</small></div>
    <label for="nQ">Use<input type="number" id="nQ" min="1" max="${P.length}" value="${n}" ${P.length?"":"disabled"}></label>
    <button class="btn" id="genBtn"${P.length?"":" disabled"}>Start test</button>
  </div></div>`, "Pick the lectures, then start. Questions you have already answered can be filtered out.");
  $("#mTutor").onchange=e=>{C.tutor=e.target.checked; renderCreate();};
  $("#mTimed").onchange=e=>{C.timed=e.target.checked; renderCreate();};
  root.querySelectorAll("[data-mode]").forEach(el=>el.onchange=()=>{ el.checked?C.modes.add(el.dataset.mode):C.modes.delete(el.dataset.mode); C.n=null; renderCreate(); });
  root.querySelectorAll("[data-order]").forEach(el=>el.onclick=()=>{ C.order=el.dataset.order; renderCreate(); });
  root.querySelectorAll("[data-subj]").forEach(el=>el.onchange=()=>{ el.checked?C.subjects.add(el.dataset.subj):C.subjects.delete(el.dataset.subj); C.n=null; renderCreate(); });
  root.querySelectorAll("[data-sess]").forEach(el=>el.onchange=()=>{ el.checked?C.sessions.add(el.dataset.sess):C.sessions.delete(el.dataset.sess); C.n=null; renderCreate(); });
  root.querySelectorAll("[data-week]").forEach(el=>el.onclick=()=>{ const on=el.dataset.on!=="1"; b.sessions.filter(s=>s.week==el.dataset.week).forEach(s=> on?C.sessions.add(s.id):C.sessions.delete(s.id)); C.n=null; renderCreate(); });
  $("#allLec").onclick=()=>{ const on=!b.sessions.every(s=>C.sessions.has(s.id)); b.sessions.forEach(s=> on?C.sessions.add(s.id):C.sessions.delete(s.id)); C.n=null; renderCreate(); };
  const nq=$("#nQ"); if(nq) nq.oninput=()=>{ C.n=Math.max(1,Math.min(P.length,parseInt(nq.value)||1)); };
  $("#genBtn").onclick=()=>{
    let ids=pool(); if(!ids.length) return;
    if(C.order==="shuffle"){ for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; } }
    const want=Math.min(C.n||ids.length, ids.length);
    if(C.order==="shuffle") ids=ids.slice(0,want); else ids=ids.slice(0,want);
    const sessIds=[...new Set(ids.map(id=>QMAP[qkey(id,b)].sess.id))];
    S.seq=(S.seq||0)+1;
    const t={id:"t"+Date.now(), num:S.seq, bank:b.id, created:Date.now(), tutor:C.tutor, timed:C.timed, qids:ids, sessions:sessIds,
      ans:{}, sub:{}, strike:{}, time:{}, elapsed:0, cur:0, done:false};
    S.tests.unshift(t); save(); openTest(t.id, false);
  };
}

/* ---------- previous tests ---------- */
function testScore(t){ const n=t.qids.length; const c=t.qids.filter(id=>t.sub[id] && t.ans[id]===QMAP[t.bank+":"+id].q.answer).length; return {c, n, pct: n? Math.round(100*c/n):0}; }
function renderPrevious(){
  const tests=S.tests.filter(t=>t.bank===bank().id);
  renderShell("My tests", tests.length? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Score</th><th>Test</th><th>Date</th><th>Mode</th><th>Lectures</th><th># Qs</th><th>Actions</th></tr></thead><tbody>
    ${tests.map(t=>{ const sc=testScore(t); return `<tr><td><div class="ring" style="--p:${t.done?sc.pct:0}"><span>${t.done?sc.pct+"%":"..."}</span></div></td><td class="num">#${t.num}${t.done?"":' <span class="tag om">In progress</span>'}</td><td class="num">${fmtDate(t.created)}</td><td>${t.tutor?"Tutored":"Untutored"}, ${t.timed?"Timed":"Untimed"}</td><td>${esc(t.sessions.join(", "))}</td><td class="num">${t.qids.length}</td>
      <td><div class="acts">${t.done?`<button data-rev="${t.id}">Review</button><button data-res="${t.id}">Results</button>`:`<button data-resume="${t.id}">Resume</button>`}<button class="del" data-del="${t.id}">Delete</button></div></td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="card empty">No tests yet. Build one from the Build a test tab.</div>`);
  root.querySelectorAll("[data-rev]").forEach(el=>el.onclick=()=>openTest(el.dataset.rev,true));
  root.querySelectorAll("[data-resume]").forEach(el=>el.onclick=()=>openTest(el.dataset.resume,false));
  root.querySelectorAll("[data-res]").forEach(el=>el.onclick=()=>{ resultsId=el.dataset.res; view="results"; render(); });
  root.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>modal({title:"Delete test",body:"Delete this test? Its answers stay counted in Question Mode and Performance.",ok:"Delete",onOk:()=>{ S.tests=S.tests.filter(t=>t.id!==el.dataset.del); save(); render(); }}));
}

/* ---------- results ---------- */
let resultsId=null;
function renderResults(){
  const t=S.tests.find(x=>x.id===resultsId); if(!t){ view="previous"; render(); return; }
  const sc=testScore(t); const avg=t.qids.length? (Object.values(t.time).reduce((a,b)=>a+b,0)/t.qids.length):0;
  renderShell(`Test #${t.num} results`, `<div class="stats">
      <div class="card stat"><div class="k">Your Score</div><div class="v num">${sc.pct}% <small>${sc.c} of ${sc.n} correct</small></div></div>
      <div class="card stat"><div class="k">Taken</div><div class="v num" style="font-size:18px;padding-top:5px">${fmtDate(t.created)}</div></div>
      <div class="card stat"><div class="k">Avg time per question</div><div class="v num">${Math.round(avg)} <small>secs</small></div></div>
      <div class="card stat"><div class="k">Mode</div><div class="v" style="font-size:16px;padding-top:6px">${t.tutor?"Tutored":"Untutored"}, ${t.timed?"Timed":"Untimed"}</div></div>
    </div>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th></th><th>#</th><th>Q ID</th><th>Lecture</th><th>Topic</th><th>Your answer</th><th>Time</th></tr></thead><tbody>
    ${t.qids.map((id,i)=>{ const m=QMAP[t.bank+":"+id]; const a=t.ans[id]; const sub=t.sub[id]; const ok=sub && a===m.q.answer;
      return `<tr data-go="${i}" class="click"><td>${!sub||a==null?'<span class="tag om">Omitted</span>':ok?'<span class="tag ok">&#10003; Correct</span>':'<span class="tag no">&#10005; Incorrect</span>'}</td><td class="num">${i+1}</td><td class="num">${esc(id)}</td><td>${esc(m.sess.id)} ${esc(m.sess.title)}</td><td>${esc(m.q.topic||"")}</td><td class="num">${a!=null?LET[a]:"-"} <span class="muted">(key ${LET[m.q.answer]})</span></td><td class="num">${Math.round(t.time[id]||0)}s</td></tr>`; }).join("")}
    </tbody></table></div>
    <div><button class="btn" id="revBtn">Review this test</button></div>`);
  $("#revBtn").onclick=()=>openTest(t.id,true);
  root.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{ t.cur=+el.dataset.go; save(); openTest(t.id,true); });
}

/* ---------- performance ---------- */
function renderPerformance(){
  const b=bank();
  const rows=b.sessions.map(s=>{ const keys=s.questions.map(q=>qkey(q.qid,b)); const used=keys.filter(k=>qStatus(k)!=="unused"); const cor=keys.filter(k=>qStatus(k)==="correct").length; const inc=keys.filter(k=>qStatus(k)==="incorrect").length; return {s, total:keys.length, used:used.length, cor, inc}; });
  const tot=rows.reduce((a,r)=>({total:a.total+r.total,used:a.used+r.used,cor:a.cor+r.cor,inc:a.inc+r.inc}),{total:0,used:0,cor:0,inc:0});
  const ans=tot.cor+tot.inc;
  renderShell("Progress", `<div class="stats">
      <div class="card stat"><div class="k">Correct</div><div class="v num">${ans?Math.round(100*tot.cor/ans):0}% <small>${tot.cor} of ${ans} answered</small></div></div>
      <div class="card stat"><div class="k">Bank usage</div><div class="v num">${tot.total?Math.round(100*tot.used/tot.total):0}% <small>${tot.used} of ${tot.total} used</small></div></div>
      <div class="card stat"><div class="k">Tests</div><div class="v num">${S.tests.filter(t=>t.bank===b.id).length}</div></div>
    </div>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Lecture</th><th>Week</th><th>Used</th><th>Correct</th><th style="width:28%">Score</th></tr></thead><tbody>
    ${rows.map(r=>{ const a=r.cor+r.inc; const p=a?Math.round(100*r.cor/a):null; return `<tr><td><span class="lecpill">${esc(r.s.id)}</span> ${esc(r.s.title)}</td><td class="num">${r.s.week}</td><td class="num">${r.used}/${r.total}</td><td class="num">${r.cor}/${a}</td><td><div style="display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1"><span style="width:${p||0}%"></span></div><span class="num" style="width:38px">${p==null?"-":p+"%"}</span></div></td></tr>`; }).join("")}
    </tbody></table></div>
    <div><button class="btn warn" id="resetBtn">Reset progress for this bank</button></div>`);
  $("#resetBtn").onclick=()=>modal({title:"Reset progress",body:"This clears every answer, mark, note and test for this bank on this browser. It cannot be undone.",ok:"Reset",onOk:()=>{ Object.keys(S.q).forEach(k=>{ if(k.startsWith(b.id+":")) delete S.q[k]; }); S.tests=S.tests.filter(t=>t.bank!==b.id); save(); render(); toast("Progress reset"); }});
}

/* ---------- test interface ---------- */
let T=null, review=false, timer=null, lastTick=0;
function openTest(id, isReview){
  T=S.tests.find(t=>t.id===id); if(!T) return;
  review=!!isReview || T.done; view="test"; if(!T.marked) T.marked={};
  render();
}
function cur(){ return T.qids[T.cur]; }
function curM(){ return QMAP[T.bank+":"+cur()]; }
function revealed(id){ return review || (T.tutor && T.sub[id]); }
function startTimer(){ stopTimer(); lastTick=Date.now(); timer=setInterval(tick,1000); }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function tick(){
  if(!T || review || view!=="test"){ stopTimer(); return; }
  const now=Date.now(); const dt=(now-lastTick)/1000; lastTick=now;
  T.elapsed+=dt; const id=cur(); if(!(T.tutor && T.sub[id])) T.time[id]=(T.time[id]||0)+dt;
  const tb=$("#timeBox"); if(tb){ if(T.timed){ const rem=TIMED_SECS*T.qids.length-T.elapsed; tb.textContent=fmtTime(rem)+" left"; tb.classList.toggle("low",rem<60); if(rem<=0){ endBlock(true); } } else tb.textContent=fmtTime(T.elapsed); }
  if(Math.round(T.elapsed)%10===0) save();
}
function renderTest(){
  const id=cur(), m=curM(), q=m.q;
  const rev=revealed(id); const a=T.ans[id]; const struck=new Set(T.strike[id]||[]);
  const correct = a===q.answer;
  if(!T.hl) T.hl={}; if(!T.hlx) T.hlx={};
  const wide = matchMedia("(min-width: 1100px)").matches;
  const chips=T.qids.map((qid,i)=>{ const qq=QMAP[T.bank+":"+qid].q; const shown=revealed(qid)&&T.sub[qid]; const cls=["chip"];
    let gl="";
    if(shown && T.ans[qid]!=null){ const ok=T.ans[qid]===qq.answer; cls.push(ok?"ok":"no"); gl=ok?", correct":", incorrect"; }
    else if(T.ans[qid]!=null) cls.push("ans");
    return `<button class="${cls.join(" ")}" data-q="${i}"${i===T.cur?' aria-current="true"':""} aria-label="Question ${i+1}${gl}${T.marked[qid]?", marked":""}">${i+1}${T.marked[qid]?`<span class="fl">${IC.flag}</span>`:""}</button>`; }).join("");
  const choices=q.choices.map((c,i)=>{ const cls=["ch"]; if(!rev&&a===i) cls.push("sel"); if(struck.has(i)) cls.push("struck"); if(rev) cls.push("locked");
    let res="";
    if(rev && i===q.answer){ cls.push("right"); res=`<span class="res">&#10003; ${a===i?"Correct, your answer":"Correct answer"}</span>`; }
    else if(rev && a===i){ cls.push("wrong"); res=`<span class="res">&#10005; Your answer</span>`; }
    return `<div class="${cls.join(" ")}" data-c="${i}" role="radio" aria-checked="${a===i}" tabindex="${rev?-1:0}"><span class="let">${LET[i]}</span><span class="txt">${esc(c)}</span>${rev?(res||"<span></span>"):`<button class="ab" data-ab="${i}" aria-label="Strike out choice ${LET[i]}" title="Strike out">ab</button>`}</div>`; }).join("");
  const om = !T.sub[id]||a==null;
  const verdict = rev ? `<div class="verdict${om?" om":correct?" ok":""}"><span class="big">${om?"Omitted":correct?"&#10003; Correct":"&#10005; Incorrect"}</span><span>Answer <b>${LET[q.answer]}</b></span><span class="num">${fmtSpent(T.time[id])}</span></div>` : "";
  const why = (q.why_wrong||[]).map((w,i)=> i===q.answer?"":`<p class="choice-why"><b>Choice ${LET[i]}.</b> ${esc(String(w).replace(/^Incorrect:\s*/i,""))}</p>`).join("");
  const xinner = T.hlx[id] || `${q.explanation||""}${q.table?`<div class="tbl-wrap">${q.table}</div>`:""}${why}<div class="obj"><b>The takeaway</b>${esc(q.objective||"")}</div>`;
  const xcard = rev ? `<div class="xcard"><h4>Explanation</h4><div class="xbody hlzone" data-zone="x">${xinner}</div>
      <div class="xfoot"><div><span class="k">Subject</span>${esc(m.sess.subject)}</div><div><span class="k">Lecture</span>${esc(m.sess.id)} ${esc(m.sess.title)}</div><div><span class="k">Topic</span>${esc(q.topic||"")}</div></div></div>` : "";
  const qinner = T.hl[id] || `<div class="stem">${q.stem}</div><p class="lead">${esc(q.lead||"")}</p>`;
  const clock = review? `${T.timed?"Used":"Time"} ${fmtTime(T.elapsed)}` : T.timed? fmtTime(TIMED_SECS*T.qids.length-T.elapsed)+" left" : fmtTime(T.elapsed);
  root.innerHTML = `<div class="ti${rev?" split":""}${wide?"":" stack"}${hlOn?" hl-on":""}" id="ti">
    <header class="ti-top">
      <div class="ti-meta"><span class="qno">Question ${T.cur+1} of ${T.qids.length}</span><span class="qid">ID ${esc(id)}${review?" &middot; review":""}</span></div>
      <div class="ti-nav"><button class="navbtn" id="prevB"${T.cur===0?" disabled":""} aria-label="Previous question">${IC.left}<span class="lbl">Prev</span></button><button class="navbtn" id="nextB"${T.cur===T.qids.length-1?" disabled":""} aria-label="Next question"><span class="lbl">Next</span>${IC.right}</button></div>
      <div class="ti-tools">
        <button class="tbtn" id="hlB" aria-pressed="${hlOn}" aria-label="Highlighter" title="Highlighter: select text to highlight, click a highlight to remove it">${IC.hl}</button>
        <button class="tbtn" id="noteB" aria-label="Notes" title="Notes">${IC.note}</button>
        <button class="tbtn" id="fontB" aria-label="Text size" title="Text size">${IC.font}</button>
        <button class="tbtn" id="themeB" aria-label="Light or dark" title="Light or dark">${IC.contrast}</button>
        <button class="tbtn" id="keysB" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">${IC.keys}</button>
        <button class="tbtn" id="fullB" aria-label="Full screen" title="Full screen">${IC.full}</button>
      </div>
      <span class="clock" id="timeBox">${clock}</span>
      ${review? `<button class="endbtn alt" id="resB">Results</button><button class="endbtn" id="exitB">Done</button>`
              : `<button class="endbtn alt" id="suspB">Pause</button><button class="endbtn" id="endB">End test</button>`}
    </header>
    <nav class="ti-rail" aria-label="Questions">${chips}</nav>
    <div class="ti-body">
      <div class="pane q" id="paneQ"><div class="qcard">
        <div class="qtop"><span class="lecpill">${esc(m.sess.id)} &middot; ${esc(m.sess.title)}</span><label class="markq"><input type="checkbox" id="markC"${T.marked[id]?" checked":""}>${T.marked[id]?IC.flag:IC.flagO} ${T.marked[id]?"Marked":"Mark"}</label></div>
        <div class="hlzone" data-zone="q">${qinner}</div>
        <div class="choices" role="radiogroup" aria-label="Answer choices">${choices}</div>
        ${!rev && T.tutor ? `<div class="submit"><button class="btn" id="subB"${a==null?" disabled":""}>Check answer</button><span class="muted">or press Enter</span></div>` : ""}
        ${verdict}
        <div class="inline-x">${xcard}</div>
      </div></div>
      <div class="pane x" id="paneX">${xcard}</div>
    </div></div>`;
  document.documentElement.style.setProperty("--fs",(S.fs||17)+"px");
  root.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>go(+el.dataset.q));
  const curChip=root.querySelector('.chip[aria-current="true"]'); if(curChip) curChip.scrollIntoView({block:"nearest",inline:"center"});
  $("#prevB").onclick=()=>go(T.cur-1); $("#nextB").onclick=()=>go(T.cur+1);
  $("#markC").onchange=e=>{ T.marked[id]=e.target.checked; qs(T.bank+":"+id).marked=e.target.checked; save(); renderTest(); };
  root.querySelectorAll("[data-c]").forEach(el=>{
    el.onclick=e=>{ if(e.target.closest(".ab")||rev) return; choose(+el.dataset.c); };
    el.oncontextmenu=e=>{ if(rev) return; e.preventDefault(); strike(+el.dataset.c); };
    el.onkeydown=e=>{ if(e.key===" "){ e.preventDefault(); if(!rev) choose(+el.dataset.c); } };
  });
  root.querySelectorAll("[data-ab]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); strike(+el.dataset.ab); });
  const sb=$("#subB"); if(sb) sb.onclick=submit;
  $("#hlB").onclick=()=>{ hlOn=!hlOn; S.hlOn=hlOn; save(); renderTest(); toast(hlOn?"Highlighter on: select text to highlight":"Highlighter off"); };
  $("#noteB").onclick=()=>{ const k=T.bank+":"+id; modal({title:"Notes for "+id,body:`<label for="noteT" class="muted" style="font-size:13.5px;display:block;margin-bottom:6px">Saved with this question in this browser.</label><textarea id="noteT">${esc((S.q[k]||{}).note||"")}</textarea>`,ok:"Save",onOk:sc=>{ qs(k).note=$("#noteT",sc).value; save(); toast("Note saved"); }}); };
  $("#fontB").onclick=()=>{ const sizes=[15.5,17,18.5,20]; const i=sizes.indexOf(S.fs||17); S.fs=sizes[(i+1)%sizes.length]; save(); document.documentElement.style.setProperty("--fs",S.fs+"px"); };
  $("#themeB").onclick=()=>{ setTheme(isDark()?"light":"dark"); };
  $("#fullB").onclick=()=>{ try{ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>toast("Full screen is not available here")); }catch(e){ toast("Full screen is not available here"); } };
  $("#keysB").onclick=()=>modal({title:"Keyboard shortcuts",cancel:null,body:`<p><span class="kbd">A</span> to <span class="kbd">E</span> pick an answer, <span class="kbd">Enter</span> check it, then go on</p><p><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> previous and next, <span class="kbd">M</span> mark the question</p><p>Right-click a choice, or tap <span class="kbd">ab</span>, to strike it out.</p><p>With the highlighter on, select words in the question or explanation to highlight them. Click a highlight to remove it.</p>`});
  if(review){ $("#resB").onclick=()=>{ resultsId=T.id; view="results"; render(); }; $("#exitB").onclick=()=>{ view="previous"; T=null; render(); }; }
  else { $("#suspB").onclick=()=>{ save(); stopTimer(); view="previous"; T=null; render(); toast("Test paused. Resume it from My tests."); };
         $("#endB").onclick=()=>modal({title:"End this test?",body:"Questions you have not answered will count as omitted.",ok:"End test",onOk:()=>endBlock(false)}); startTimer(); }
  $("#paneQ").scrollTop=0; $("#paneX").scrollTop=0;
}

/* ---------- highlighter ---------- */
let hlOn = S.hlOn!==false;
function zoneOf(node){ const el = node && (node.nodeType===1?node:node.parentElement); return el && el.closest(".hlzone"); }
function saveZone(zone){
  if(!T) return; const id=cur();
  if(zone.dataset.zone==="q") T.hl[id]=zone.innerHTML; else T.hlx[id]=zone.innerHTML;
  // keep the duplicate explanation (stacked layout) in step
  if(zone.dataset.zone==="x") root.querySelectorAll('.hlzone[data-zone="x"]').forEach(z=>{ if(z!==zone) z.innerHTML=zone.innerHTML; });
  save();
}
function applyHighlight(){
  const sel=getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return false;
  const r=sel.getRangeAt(0); const zone=zoneOf(r.commonAncestorContainer); if(!zone) return false;
  const nodes=[]; const w=document.createTreeWalker(zone, NodeFilter.SHOW_TEXT, {acceptNode:n=> r.intersectsNode(n) && n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT});
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    let s=0, e=n.nodeValue.length;
    if(n===r.startContainer) s=r.startOffset;
    if(n===r.endContainer) e=r.endOffset;
    if(s>=e || n.parentElement.closest("mark.hl")) return;
    const mid=n.splitText(s); mid.splitText(e-s);
    const mk=document.createElement("mark"); mk.className="hl"; mid.parentNode.insertBefore(mk,mid); mk.appendChild(mid);
  });
  sel.removeAllRanges(); saveZone(zone); return true;
}
function onHighlightEnd(e){
  if(view!=="test" || !T || !hlOn || document.querySelector(".scrim")) return;
  setTimeout(()=>{
    if(applyHighlight()) return;
    const mk = e.target && e.target.closest && e.target.closest("mark.hl");
    const sel=getSelection();
    if(mk && (!sel || sel.isCollapsed)){ const zone=zoneOf(mk); const p=mk.parentNode; while(mk.firstChild) p.insertBefore(mk.firstChild,mk); p.removeChild(mk); p.normalize(); saveZone(zone); }
  },0);
}
document.addEventListener("mouseup",onHighlightEnd);
document.addEventListener("touchend",onHighlightEnd);
function go(i){ if(i<0||i>=T.qids.length) return; T.cur=i; save(); renderTest(); }
function choose(i){ const id=cur(); if(revealed(id)) return; T.ans[id]=i; save(); renderTest(); }
function strike(i){ const id=cur(); const s=new Set(T.strike[id]||[]); s.has(i)?s.delete(i):s.add(i); T.strike[id]=[...s]; save(); renderTest(); }
function record(id){ const m=QMAP[T.bank+":"+id]; const st=qs(T.bank+":"+id); const a=T.ans[id]; st.status = a==null? "omitted" : (a===m.q.answer?"correct":"incorrect"); }
function submit(){ const id=cur(); if(T.ans[id]==null) return; T.sub[id]=true; record(id); save(); renderTest(); }
function endBlock(auto){
  stopTimer();
  T.qids.forEach(id=>{ if(!T.sub[id]){ T.sub[id]=true; record(id); } });
  T.done=true; save(); resultsId=T.id; T=null; view="results"; render(); if(auto) toast("Time is up. Test ended.");
}
document.addEventListener("keydown",e=>{
  if(view!=="test"||!T||document.querySelector(".scrim")) return;
  if(e.target.matches("input,textarea,select")) return;
  const k=e.key; const id=cur(); const m=curM();
  if(/^[a-eA-E]$/.test(k) && m.q.choices.length>"abcde".indexOf(k.toLowerCase()) && !e.metaKey && !e.ctrlKey){ choose("abcde".indexOf(k.toLowerCase())); }
  else if(k==="ArrowRight") go(T.cur+1);
  else if(k==="ArrowLeft") go(T.cur-1);
  else if(k==="m"||k==="M"){ T.marked[id]=!T.marked[id]; qs(T.bank+":"+id).marked=T.marked[id]; save(); renderTest(); }
  else if(k==="Enter"){ if(e.target.closest("button")) return; if(!revealed(id) && T.tutor && T.ans[id]!=null) submit(); else go(T.cur+1); }
});
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(view==="test"&&T){ const el=$("#ti"); if(el) el.classList.toggle("stack",!matchMedia("(min-width: 1100px)").matches); } },120); });
addEventListener("pagehide",save);

/* ---------- router ---------- */
function render(){
  if(view!=="test") stopTimer();
  if(view==="test" && T) return renderTest();
  if(view==="previous") return renderPrevious();
  if(view==="performance") return renderPerformance();
  if(view==="results") return renderResults();
  view="create"; renderCreate();
}
// default selection: the most recent week
(function(){ const b=bank(); if(!b) return; const w=Math.max(...b.sessions.map(s=>s.week)); b.sessions.filter(s=>s.week===w).forEach(s=>C.sessions.add(s.id)); })();
render();
})();

</script>
</body></html>
