 each one is made by gene rearrangement in a single lymphocyte, is specific for one antigen, and that rare clone must expand before a response is visible, which takes days. The innate system trades breadth of targets for speed; its \"learning\" happened over evolutionary time.<\/p>", "why_wrong": ["Gene rearrangement creating a unique receptor per cell is the adaptive strategy, absent in these mice.", "Correct: pattern recognition receptors are germline-encoded and ready to go on many cells.", "Innate receptors are expressed before any exposure; induced expression after antigen describes clonal selection.", "Very high specificity for a single antigen is a property of B and T cell receptors.", "Clonal expansion is needed only when each receptor is on one or a few cells, as in adaptive immunity."], "table": "<table><tr><th><\/th><th>Innate (PRRs)<\/th><th>Adaptive (BCR, TCR)<\/th><\/tr><tr><td>Receptor origin<\/td><td>Germline, fixed<\/td><td>Gene rearrangement in each cell<\/td><\/tr><tr><td>Number of targets<\/td><td>About 10<sup>2<\/sup> to 10<sup>3<\/sup> patterns<\/td><td>Essentially unlimited<\/td><\/tr><tr><td>Cells bearing a receptor<\/td><td>Many cells<\/td><td>One clone<\/td><\/tr><tr><td>Speed<\/td><td>Minutes to hours<\/td><td>Days (needs expansion)<\/td><\/tr><tr><td>Memory<\/td><td>No<\/td><td>Yes<\/td><\/tr><\/table>", "objective": "Innate pattern recognition receptors are germline-encoded and widely expressed, so they respond immediately to broad danger patterns, whereas antigen receptors are clonally distributed and need time to expand."}, {"qid": "08-2", "topic": "DAMPs", "stem": "<p>Germ-free mice, which carry no microorganisms, undergo a sterile crush injury of the thigh muscle. Within 6 hours, large numbers of neutrophils accumulate in the injured muscle, and levels of a chromatin-associated nuclear protein rise in the tissue fluid. Pretreating the mice with an antibody that neutralizes this nuclear protein sharply reduces neutrophil recruitment. Injecting cells that died by apoptosis into uninjured muscle produces no recruitment.<\/p>", "lead": "Which of the following best describes the signal that triggered the inflammatory response?", "choices": ["A conserved component of bacterial cell walls", "A self peptide presented to helper T cells", "Phosphatidylserine exposed on apoptotic cell surfaces", "An intracellular host molecule released by necrotic cells", "Preexisting antibody bound to injured muscle fibers"], "answer": 3, "explanation": "<p>No microbes are present, so no pathogen-associated molecular pattern (PAMP) can be responsible. The trigger is a nuclear protein that normally sits inside cells and appears in tissue fluid only when cells are damaged and burst. Molecules like this (high mobility group box 1, heat shock proteins, ATP, histones, uric acid) are damage-associated molecular patterns (DAMPs), and pattern recognition receptors read them as danger.<\/p><p>The control matters: cells that die quietly by apoptosis keep their contents packaged and do not alarm the innate system. Necrosis spills intracellular contents, which is why tissue injury alone can start inflammation in a sterile setting.<\/p>", "why_wrong": ["The mice are germ-free, so no bacterial cell wall PAMP is present.", "Peptide presentation to T cells is adaptive, too slow for a 6-hour response in a first injury.", "Apoptotic cells injected alone caused no recruitment, so apoptotic surface changes are not the trigger.", "Correct: a nuclear protein released from damaged cells is a DAMP.", "The response was blocked by neutralizing a nuclear protein, not by any antibody mechanism, and no prior sensitization occurred."], "objective": "Damage-associated molecular patterns are intracellular host molecules released by necrotic or damaged cells that activate innate immunity even without infection; orderly apoptosis does not."}, {"qid": "08-3", "topic": "PRR cellular compartments", "stem": "<p>Cultured macrophages are treated with a drug that blocks maturation and acidification of endosomes but leaves the plasma membrane and cytosol unaffected. The cells are then stimulated separately with three microbial products. Cytokine secretion is measured.<\/p><table class=\"labs\"><tr><th>Stimulus<\/th><th>Untreated cells<\/th><th>Drug-treated cells<\/th><\/tr><tr><td>Lipopolysaccharide (LPS)<\/td><td>High<\/td><td>High<\/td><\/tr><tr><td>Flagellin<\/td><td>High<\/td><td>High<\/td><\/tr><tr><td>Unmethylated CpG DNA<\/td><td>High<\/td><td>Absent<\/td><\/tr><\/table>", "lead": "These results best indicate that the receptor for unmethylated CpG DNA is located in which compartment?", "choices": ["The membranes of intracellular vesicles", "The cytosol, as part of an inflammasome", "The outer surface of the plasma membrane", "The plasma, as a secreted soluble protein", "The nucleus, bound to host chromatin"], "answer": 0, "explanation": "<p>Responses to LPS and flagellin survive the drug, so the cell surface receptors and the signaling machinery downstream of them still work. Only the response to unmethylated CpG DNA disappears, and the only thing the drug disrupted was the endosome. The receptor for this ligand must therefore sit on endosomal membranes.<\/p><p>Pattern recognition receptors are spread across compartments on purpose: some Toll-like receptors face the outside of the cell, others line endosomes where ingested microbes are broken open and their nucleic acids exposed, still others (NOD-like receptors) patrol the cytosol, and soluble ones circulate in plasma. Where a receptor sits determines what it can see.<\/p>", "why_wrong": ["Correct: losing the response only when endosomes are disrupted places the receptor on endosomal membranes.", "The drug spared the cytosol, so a cytosolic sensor would still respond.", "Surface receptors (shown by the intact LPS and flagellin responses) were unaffected by the drug.", "A secreted plasma protein would not depend on the macrophage's endosomes.", "Pattern recognition receptors for microbial DNA are not nuclear chromatin proteins in this lecture's scheme."], "objective": "Pattern recognition receptors sit in distinct compartments (cell surface, endosomal, cytosolic, soluble), and a Toll-like receptor's location determines which microbial products it can detect."}, {"qid": "08-4", "topic": "Soluble PRRs and opsonization", "stem": "<p>Yeast cells are incubated in serum from a volunteer whose plasma lacks mannose-binding lectin, then washed and mixed with normal neutrophils. Few yeast are ingested. When the same yeast are first incubated in this serum supplemented with purified mannose-binding lectin, ingestion increases several-fold. Adding the lectin directly to the neutrophils, without pre-coating the yeast, has no effect.<\/p>", "lead": "The purified protein most likely increases ingestion by which mechanism?", "choices": ["Activating neutrophil NADPH oxidase", "Inducing an antiviral state in neutrophils", "Killing the yeast directly by forming pores", "Increasing neutrophil chemotaxis toward yeast", "Tagging microbial surface sugars for phagocytes"], "answer": 4, "explanation": "<p>The lectin works only when it is on the yeast, not when it is given to the neutrophils. That tells you it acts by binding the microbe and marking it. Mannose-binding lectin is a soluble pattern recognition receptor that recognizes carbohydrates with terminal mannose on microbial surfaces; once bound, it is recognized by phagocytes, which then engulf the coated particle. That process is opsonization.<\/p><p>Many soluble pattern recognition receptors behave this way (complement C3b, C-reactive protein, serum amyloid P), and several are acute phase proteins made by the liver. They extend innate recognition into the plasma and hand the target to professional phagocytes.<\/p>", "why_wrong": ["NADPH oxidase drives killing after ingestion; it does not explain why pre-coating the yeast matters.", "The antiviral state is induced by type I interferons and protects against viruses, not yeast uptake.", "Direct pore-forming killing would reduce live yeast without any need for neutrophils.", "The ingestion assay mixes cells directly, and lectin given to neutrophils had no effect, so chemotaxis is not the mechanism.", "Correct: mannose-binding lectin opsonizes mannose-rich microbial surfaces for phagocytosis."], "objective": "Soluble pattern recognition receptors such as mannose-binding lectin, C3b and C-reactive protein coat microbes (opsonization) so phagocytes can recognize and ingest them."}, {"qid": "08-5", "topic": "NADPH oxidase and the oxidative burst", "stem": "<p>Neutrophils are isolated from wild-type mice and from mice lacking the catalytic membrane subunit of the phagocyte enzyme complex that is assembled on phagosome membranes after activation. When the cells ingest opsonized bacteria, wild-type neutrophils show a sharp rise in oxygen consumption within minutes and become strongly fluorescent after loading with dihydrorhodamine. Mutant neutrophils ingest bacteria normally, but oxygen consumption does not rise and fluorescence stays at baseline.<\/p>", "lead": "The missing enzyme most directly catalyzes which reaction?", "choices": ["Hydrogen peroxide to water and oxygen", "L-arginine to nitric oxide and citrulline", "Molecular oxygen to superoxide", "Hydrogen peroxide and chloride to hypochlorous acid", "Superoxide to hydrogen peroxide"], "answer": 2, "explanation": "<p>Ingestion is normal, so engulfment and phagosome formation are intact. What fails is the burst of oxygen consumption and the signal in the dihydrorhodamine assay, which fluoresces when superoxide is present. The enzyme assembled on phagosome membranes that consumes oxygen in an activated phagocyte is NADPH oxidase, and its job is to transfer electrons to molecular oxygen, making superoxide. This is the oxidative burst, the main source of reactive oxygen species (ROS) in activated phagocytes.<\/p><p>Everything downstream depends on that first step: superoxide dismutase converts superoxide to hydrogen peroxide, myeloperoxidase turns hydrogen peroxide into hypochlorous acid, and catalase detoxifies hydrogen peroxide. Without NADPH oxidase, the whole chain starves.<\/p>", "why_wrong": ["Converting hydrogen peroxide to water and oxygen is catalase, a detoxifying enzyme.", "Nitric oxide is made from arginine by inducible nitric oxide synthase, a separate enzyme.", "Correct: NADPH oxidase reduces oxygen to superoxide, the first step of the oxidative burst.", "Making hypochlorous acid is myeloperoxidase, which acts downstream of the oxidase.", "Superoxide dismutase converts superoxide to hydrogen peroxide; it needs superoxide to work on."], "objective": "Phagocyte NADPH oxidase converts oxygen to superoxide in the oxidative burst, the primary source of reactive oxygen species that feed hydrogen peroxide and hypochlorous acid production."}, {"qid": "08-6", "topic": "Catalase and survival in CGD phagocytes", "stem": "<p>Neutrophils from a child with recurrent skin abscesses are activated in vitro with nitroblue tetrazolium dye; no blue precipitate forms, while control neutrophils turn deep blue. The child's neutrophils are then tested against two bacterial strains that are identical except that one has been engineered to express catalase.<\/p><table class=\"labs\"><tr><th>Strain<\/th><th>Control neutrophils, % killed<\/th><th>Child's neutrophils, % killed<\/th><\/tr><tr><td>Catalase-negative<\/td><td>95<\/td><td>80<\/td><\/tr><tr><td>Catalase-expressing<\/td><td>93<\/td><td>10<\/td><\/tr><\/table>", "lead": "Which best explains why the child's neutrophils still kill the catalase-negative strain?", "choices": ["The child's cells still produce small amounts of superoxide", "Residual hydrogen peroxide in the phagolysosome is not destroyed", "Catalase-negative bacteria cannot escape from the phagosome", "Opsonins bind catalase-negative bacteria more strongly", "Nitric oxide synthesis is triggered only by catalase-negative bacteria"], "answer": 1, "explanation": "<p>A negative nitroblue tetrazolium test means the neutrophils cannot generate superoxide: the NADPH oxidase defect of chronic granulomatous disease (CGD). These phagocytes still ingest microbes but lack the oxidative burst. Yet some hydrogen peroxide still reaches the phagolysosome from other sources, and if the microbe leaves it intact, that residual hydrogen peroxide can still be used for killing.<\/p><p>The catalase-expressing strain breaks that hydrogen peroxide down to water and oxygen, removing the last oxidant the defective neutrophil has. That is why catalase-positive organisms (staphylococci, Aspergillus) are the classic infections in CGD, and why they cause abscesses and granulomas: they survive inside phagocytes that cannot finish them off.<\/p>", "why_wrong": ["A negative nitroblue tetrazolium test indicates no detectable superoxide, and residual superoxide would not explain the difference between strains.", "Correct: without catalase, the microbe leaves residual hydrogen peroxide intact for killing.", "The strains differ only in catalase, not in any escape mechanism.", "Opsonization affects ingestion, and both strains are otherwise identical surfaces.", "Nothing in the setup links nitric oxide to catalase status; the variable is hydrogen peroxide destruction."], "table": "<table><tr><th><\/th><th>Catalase-negative microbe<\/th><th>Catalase-positive microbe<\/th><\/tr><tr><td>Residual hydrogen peroxide in CGD phagolysosome<\/td><td>Persists, can still kill<\/td><td>Destroyed by microbial catalase<\/td><\/tr><tr><td>Outcome in CGD<\/td><td>Usually controlled<\/td><td>Survives: abscesses, granulomas<\/td><\/tr><\/table>", "objective": "In chronic granulomatous disease phagocytes cannot make superoxide, so catalase-positive organisms, which destroy residual hydrogen peroxide, survive inside phagolysosomes."}, {"qid": "08-7", "topic": "Genetics and diagnosis of CGD", "stem": "<p>A 6-year-old boy has had recurrent skin abscesses and a lung infection with Aspergillus fumigatus; a skin biopsy shows large granulomas. His maternal uncle died of infection in infancy. Neutrophils from the family are loaded with dihydrorhodamine, activated in vitro and analyzed by flow cytometry.<\/p><table class=\"labs\"><tr><th>Subject<\/th><th>Fluorescence after activation<\/th><\/tr><tr><td>Boy<\/td><td>Single population, no increase<\/td><\/tr><tr><td>Mother<\/td><td>Two populations: one bright, one with no increase<\/td><\/tr><tr><td>Father<\/td><td>Single bright population<\/td><\/tr><\/table>", "lead": "The boy's mutation most likely affects which of the following?", "choices": ["An autosomal superoxide dismutase gene", "An autosomal myeloperoxidase gene", "An X-linked integrin chain needed for leukocyte adhesion", "An X-linked catalytic subunit of phagocyte NADPH oxidase", "An autosomal lysosomal trafficking regulator gene"], "answer": 3, "explanation": "<p>The boy's neutrophils show no rise in dihydrorhodamine fluorescence, so they make no superoxide. Combined with catalase-positive infections (Aspergillus) and granulomas, this is chronic granulomatous disease, a defect of NADPH oxidase. The next question is which gene. An affected maternal uncle and a mother with two neutrophil populations, half normal and half silent, point to X-linked inheritance: in a carrier female, each neutrophil inactivates one X at random, so some cells use the normal copy and some the mutant one.<\/p><p>The most common CGD mutation is in gp91phox (NOX2), the catalytic membrane subunit of the oxidase, which is encoded on the X chromosome. The flow-based dihydrorhodamine assay has largely replaced the nitroblue tetrazolium slide test because it quantifies the burst cell by cell, which is exactly what reveals the carrier's mixed pattern.<\/p>", "why_wrong": ["Superoxide dismutase acts after superoxide is made, would not block the dihydrorhodamine signal, and is not X-linked.", "Myeloperoxidase works downstream of the oxidase, so superoxide would still be detected, and it is not X-linked.", "Adhesion defects block extravasation, not the oxidative burst measured in this assay.", "Correct: gp91phox (NOX2) is X-linked and is the most common cause of CGD.", "The lysosomal trafficking defect causes Chediak-Higashi syndrome, with giant granules rather than an absent burst."], "objective": "Chronic granulomatous disease is most often X-linked (gp91phox/NOX2); the dihydrorhodamine flow assay shows absent burst in affected boys and a mixed population in carrier mothers."}, {"qid": "08-8", "topic": "Type I interferon and the antiviral state", "stem": "<p>A layer of cultured epithelial cells is infected with a virus. After 12 hours, the culture fluid is collected and filtered to remove all virus particles. Fresh, uninfected cells are incubated in this filtered fluid for 6 hours and then exposed to the same virus; viral replication in them is reduced 100-fold compared with cells incubated in fluid from uninfected cultures. The protection is abolished if the filtered fluid is pretreated with an antibody that blocks the type I interferon receptor on the fresh cells.<\/p>", "lead": "Which best explains the protection of the fresh cells?", "choices": ["Antibodies in the fluid neutralized the virus before it entered", "Natural killer cells in the fluid destroyed newly infected cells", "A secreted factor induced intracellular mechanisms that inhibit viral replication", "Complement deposited on the virus tagged it for phagocytosis", "The infected cells lowered expression of inhibitory natural killer ligands"], "answer": 2, "explanation": "<p>The protective activity is in cell-free, virus-free fluid, and it works only if the fresh cells can receive a type I interferon signal. So infected cells, sensing viral products with their internal pattern recognition receptors, secreted type I interferons (interferon alpha and beta). These act on neighboring cells as paracrine signals, switching on genes that block viral replication and spread. That is the antiviral state.<\/p><p>This is a prevention strategy. Viruses are hard to kill directly and replicate too fast to clear once infection is established, so the innate system protects uninfected cells and, separately, eliminates the infected ones (natural killer cells). Both strategies reappear in adaptive antiviral immunity.<\/p>", "why_wrong": ["A culture of epithelial cells makes no antibody, and the effect required the interferon receptor on the fresh cells.", "The fluid was cell-free, so it contained no natural killer cells.", "Correct: type I interferons induce an antiviral state in neighboring cells.", "Epithelial culture fluid contains no complement system or phagocytes in this setup.", "Changes in natural killer ligands affect killing by natural killer cells, which are absent here."], "objective": "Virus-infected cells secrete type I interferons that act on nearby cells to induce an antiviral state, limiting viral replication and spread."}, {"qid": "08-9", "topic": "NK cells: missing self", "stem": "<p>Two lines of a mouse tumor are mixed with purified natural killer (NK) cells from a healthy mouse, and target cell death is measured after 4 hours. Flow cytometry of the targets is shown.<\/p><table class=\"labs\"><tr><th>Target line<\/th><th>Surface MHC class I<\/th><th>Stress-associated surface markers<\/th><th>% killed<\/th><\/tr><tr><td>Parental<\/td><td>High<\/td><td>Low<\/td><td>4<\/td><\/tr><tr><td>Variant<\/td><td>Undetectable<\/td><td>Low<\/td><td>62<\/td><\/tr><\/table>", "lead": "Which best explains why the variant line is killed?", "choices": ["Loss of a ligand for NK inhibitory receptors", "Gain of ligands for NK activating receptors", "Coating of the variant cells with antibody", "Recognition of a tumor peptide by an NK antigen receptor", "Release of damage-associated molecules by the variant"], "answer": 0, "explanation": "<p>The two lines differ in only one measured feature: the variant has lost MHC class I, while stress markers stay low on both. MHC class I is the main ligand for NK inhibitory receptors. A normal cell keeps its NK cell neighbors quiet by displaying it; a cell that downregulates it (as virus-infected and transformed cells often do) removes the brake, and the activating signals that are always present win out.<\/p><p>NK activation is a balance between activating and inhibitory receptor signals. One form of \"altered self\" is missing inhibitory signals, shown here; the other is upregulation of activating ligands. NK cells have no antigen-specific receptor, which is why they can respond within hours.<\/p>", "why_wrong": ["Correct: loss of MHC class I removes the inhibitory signal (missing self).", "Stress markers were low on both lines, so activating ligands did not change.", "No antibody was added; this is a purified cell system.", "NK cells lack rearranged antigen receptors and do not recognize specific peptides.", "Damage-associated molecules activate pattern recognition receptors; they do not explain selective killing of one live line."], "objective": "NK cells kill targets that lose MHC class I, the ligand for their inhibitory receptors (missing self), because the balance shifts toward activating signals."}, {"qid": "08-10", "topic": "NK cells: induced stress ligands", "stem": "<p>Normal epithelial cells are exposed to a low dose of a DNA-damaging agent that does not kill them. Flow cytometry afterward shows unchanged MHC class I but a 20-fold rise in a family of stress-associated surface proteins. The treated cells are now killed by natural killer (NK) cells, whereas untreated cells are not. Killing of the treated cells is abolished by an antibody that blocks one NK receptor carrying an immunoreceptor tyrosine-based activation motif (ITAM) in its signaling domain.<\/p>", "lead": "Which best explains killing of the treated cells despite normal MHC class I?", "choices": ["The inhibitory receptor lost its ITAM signaling domain", "MHC class I became an activating ligand after DNA damage", "The treated cells began secreting type I interferon", "Activating signals outweighed the intact inhibitory signal", "The treated cells released histones that activated Toll-like receptors"], "answer": 3, "explanation": "<p>MHC class I is unchanged, so the inhibitory brake is still on. What changed is the appearance of stress markers, and blocking an activating receptor (one with an ITAM, the activating motif) prevents killing. So the stress ligands engaged activating NK receptors strongly enough to override the inhibitory signal.<\/p><p>This is the second form of \"altered self\": upregulation of activating ligands. NK cells integrate both kinds of input, and the net balance decides whether they kill. Stress and senescence markers, some viral proteins and bound antibody can all push the balance toward activation.<\/p>", "why_wrong": ["Inhibitory NK receptors signal through ITIMs (inhibitory motifs), and nothing in the setup altered the NK cells.", "MHC class I is an inhibitory ligand; its level did not change.", "Interferon would induce an antiviral state, and the blocking experiment points to an NK activating receptor.", "Correct: induced stress ligands engaged activating receptors and tipped the balance.", "The cells were not killed by the agent, and blocking an NK activating receptor alone abolished the effect."], "objective": "NK cells can kill cells with normal MHC class I when stress-induced ligands engage activating (ITAM-bearing) receptors strongly enough to outweigh inhibition."}, {"qid": "08-11", "topic": "Antibody-dependent cellular cytotoxicity", "stem": "<p>Cells expressing a viral envelope protein on their surface, with normal MHC class I, are mixed with natural killer (NK) cells. Few targets die. Adding IgG antibody against the viral protein increases killing to 70%. Adding the same antibody stripped of its Fc region does not increase killing, and an antibody that blocks CD16 on the NK cells prevents the increase.<\/p>", "lead": "The increased killing depends on NK recognition of which of the following?", "choices": ["Viral peptide displayed on target MHC class I", "The constant region of IgG bound to the target", "Stress-induced ligands on the target cell surface", "Lipopolysaccharide released by infected cells", "Fas expressed on the antibody-coated target"], "answer": 1, "explanation": "<p>Antibody increases killing only if it keeps its Fc region and only if CD16 on the NK cell is available. CD16 is an Fc receptor (FcγRIII) for IgG. The antibody's variable regions bind the viral protein on the target, its constant (Fc) region sticks out, and CD16 on the NK cell grabs that Fc region and delivers an activating signal.<\/p><p>This is antibody-dependent cellular cytotoxicity (ADCC), and it is a bridge between the two arms of immunity: the adaptive system makes the antibody that picks the target, and an innate killer does the killing. Bound antibody is therefore one of the activating NK ligands.<\/p>", "why_wrong": ["NK cells have no antigen receptor to read peptide on MHC class I.", "Correct: CD16 binds the Fc region of target-bound IgG, triggering antibody-dependent cellular cytotoxicity.", "Stress ligands do not depend on added antibody or its Fc region.", "Lipopolysaccharide is a bacterial product, not present on virus-protein-expressing cells.", "Fas is a death receptor that NK cells use to kill, not how they recognize antibody-coated targets."], "objective": "In antibody-dependent cellular cytotoxicity, CD16 (FcγRIII) on NK cells binds the Fc region of IgG coating a target cell and activates killing."}, {"qid": "08-12", "topic": "NK cytotoxicity mechanisms", "stem": "<p>Natural killer (NK) cells from wild-type mice and from mice lacking perforin are mixed with two target lines, both of which lack surface MHC class I. One target line expresses Fas (CD95); the other has had the Fas gene deleted.<\/p><table class=\"labs\"><tr><th>Effector<\/th><th>Fas-expressing target, % killed<\/th><th>Fas-deleted target, % killed<\/th><\/tr><tr><td>Wild-type NK<\/td><td>70<\/td><td>65<\/td><\/tr><tr><td>Perforin-deficient NK<\/td><td>45<\/td><td>3<\/td><\/tr><\/table>", "lead": "Treating the perforin-deficient NK cells with which agent would most likely abolish their remaining killing?", "choices": ["A granzyme B inhibitor", "A blocking antibody against CD16", "A blocking antibody against MHC class I", "An NADPH oxidase inhibitor", "A blocking antibody against Fas ligand"], "answer": 4, "explanation": "<p>Both targets lack MHC class I, so wild-type NK cells kill both by missing self. Without perforin, granules can no longer deliver granzymes into the target, and the Fas-deleted target survives. The Fas-expressing target is still killed, so the perforin-deficient NK cells are using a second, granule-independent route that requires Fas on the target. That route is Fas ligand (FasL, CD95L) on the NK cell engaging the Fas death receptor, which triggers apoptosis through its death domain.<\/p><p>NK cells therefore kill in two ways: granule release (perforin forms the entry route for granzyme B) and death receptor engagement (FasL to Fas, TRAIL to the TRAIL receptor). Blocking FasL would shut down the only remaining pathway in this experiment.<\/p>", "why_wrong": ["Granzyme B needs perforin to enter the target; without perforin it is already inactive, so inhibiting it changes nothing.", "CD16 mediates antibody-dependent killing, and no antibody is present here.", "The targets have no MHC class I to block, and MHC class I is inhibitory anyway.", "NADPH oxidase is the phagocyte oxidative burst enzyme, not an NK killing mechanism.", "Correct: the residual, Fas-dependent killing is mediated by Fas ligand on the NK cell."], "table": "<table><tr><th>NK killing route<\/th><th>NK molecule<\/th><th>Target molecule<\/th><\/tr><tr><td>Granule release<\/td><td>Perforin plus granzyme B<\/td><td>Target membrane<\/td><\/tr><tr><td>Death receptor<\/td><td>Fas ligand (CD95L)<\/td><td>Fas (CD95)<\/td><\/tr><tr><td>Death receptor<\/td><td>TRAIL<\/td><td>TRAIL receptor<\/td><\/tr><\/table>", "objective": "Activated NK cells kill by perforin-dependent granzyme delivery or by death receptor engagement (Fas ligand to Fas, TRAIL to its receptor), both causing apoptosis."}]}, {"id": "09", "title": "Inflammation and the Immune System", "week": 2, "subject": "Immunology", "questions": [{"qid": "09-1", "topic": "Leukocyte extravasation: firm adhesion", "stem": "<p>Intravital microscopy is used to watch venules in the inflamed ear skin of wild-type mice and of mice lacking CD18. In both groups, leukocytes slow down and roll along the activated endothelium at similar rates. In wild-type mice, rolling cells soon stop and spread, then migrate into the tissue; in mutant mice, rolling cells detach and return to the flow. The mutant mice have a blood neutrophil count about eight times normal, yet almost no neutrophils reach the inflamed skin.<\/p>", "lead": "Which interaction is most likely missing in the mutant mice?", "choices": ["Selectin binding to its carbohydrate ligand", "CXCL8 (interleukin 8) binding to its receptor", "Leukocyte integrin binding to endothelial ICAM-1", "PECAM-1 binding between endothelial cells and leukocytes", "Fas ligand binding to endothelial Fas"], "answer": 2, "explanation": "<p>Rolling is normal, so the selectin step works. The failure comes next: cells cannot stop and stick. Firm arrest depends on leukocyte integrins such as LFA-1 binding endothelial adhesion molecules such as ICAM-1, and CD18 is the beta chain of LFA-1 and related integrins. Without it, neutrophils roll and drift off, never transmigrate, and pile up in the blood.<\/p><p>This is leukocyte adhesion deficiency type 1 (LAD1). The very high white count with no neutrophils at the site of inflammation is the signature of all leukocyte adhesion deficiencies: the cells are made, but they cannot leave the vessel.<\/p>", "why_wrong": ["Selectin binding mediates rolling, which was normal.", "Chemokine signaling could alter activation, but the missing molecule named is CD18, an integrin chain.", "Correct: CD18 is the integrin beta chain of LFA-1, needed for firm adhesion to ICAM-1.", "PECAM-1 acts during diapedesis, after firm adhesion, which never occurred.", "Fas ligand and Fas mediate apoptosis, not leukocyte adhesion."], "objective": "Firm leukocyte adhesion requires integrins (LFA-1, which contains CD18) binding endothelial ICAM-1; CD18 deficiency (LAD1) leaves rolling intact but blocks arrest and extravasation."}, {"qid": "09-2", "topic": "Leukocyte adhesion deficiency type 2", "stem": "<p>A 10-month-old boy has had repeated skin and gum infections that form no pus. His white blood cell count is 38,000/mm<sup>3<\/sup> (normal 6,000 to 17,500), mostly neutrophils. Flow cytometry shows normal CD18 on his neutrophils. His neutrophils are perfused over a layer of cytokine-activated endothelial cells in a flow chamber; unlike control neutrophils, almost none tether or roll, and very few adhere.<\/p>", "lead": "The underlying defect most likely involves which process?", "choices": ["Glycosylation of leukocyte surface proteins", "Assembly of phagocyte NADPH oxidase", "Conversion of integrins to a high-affinity state", "Fusion of lysosomes with phagosomes", "Production of chemokines by endothelium"], "answer": 0, "explanation": "<p>The infant has the leukocyte adhesion deficiency picture: very high neutrophil counts but no pus, so neutrophils cannot reach tissue. CD18 is normal, which argues against LAD1, and his cells fail at the very first step, tethering and rolling. Rolling is mediated by selectins binding carbohydrate ligands on the leukocyte surface.<\/p><p>Those ligands are built by glycosylation, the enzymatic addition of sugars to surface proteins. A glycosylation defect means the selectin ligands are absent, which is leukocyte adhesion deficiency type 2 (LAD2). Placing the failed step first (rolling, not arrest) and then naming what builds the ligand for that step is the two-step reasoning here.<\/p>", "why_wrong": ["Correct: absent selectin ligands from a glycosylation defect block rolling (LAD2).", "An NADPH oxidase defect impairs killing inside phagocytes, not rolling on endothelium.", "A defect in integrin activation (LAD3) spares rolling and blocks firm adhesion.", "Lysosome fusion defects affect killing after ingestion, not adhesion.", "The endothelium is normal donor tissue in this assay; the patient's cells are the variable."], "table": "<table><tr><th><\/th><th>Step that fails<\/th><th>Defect<\/th><th>Rolling<\/th><\/tr><tr><td>LAD1<\/td><td>Firm adhesion<\/td><td>No CD18 integrin chain<\/td><td>Normal<\/td><\/tr><tr><td>LAD2<\/td><td>Tethering and rolling<\/td><td>Glycosylation: no selectin ligands<\/td><td>Absent<\/td><\/tr><tr><td>LAD3<\/td><td>Firm adhesion<\/td><td>Integrins present but not switched to high affinity<\/td><td>Normal<\/td><\/tr><\/table>", "objective": "Leukocyte adhesion deficiency type 2 is a glycosylation defect that removes selectin ligands, so leukocytes cannot roll; all LADs produce high white counts without pus."}, {"qid": "09-3", "topic": "Integrin activation (inside-out signaling)", "stem": "<p>Neutrophils from a child with recurrent bacterial infections and a white blood cell count of 45,000/mm<sup>3<\/sup> are compared with control neutrophils. CD18 and other integrin chains are present at normal levels by flow cytometry, and the cells roll normally on activated endothelium. Cells are then exposed to CXCL8 (interleukin 8), and binding of a soluble ICAM-1 probe is measured.<\/p><table class=\"labs\"><tr><th><\/th><th>ICAM-1 binding, resting<\/th><th>ICAM-1 binding after CXCL8<\/th><\/tr><tr><td>Control<\/td><td>Low<\/td><td>10-fold increase<\/td><\/tr><tr><td>Patient<\/td><td>Low<\/td><td>No increase<\/td><\/tr><\/table>", "lead": "Which step of leukocyte recruitment is most directly impaired?", "choices": ["Selectin-mediated tethering to endothelium", "Chemokine-induced shift of integrins to high affinity", "Production of integrin proteins by the neutrophil", "Migration between endothelial cells after arrest", "Release of neutrophils from bone marrow stores"], "answer": 1, "explanation": "<p>The integrins are there, and rolling works. What fails is the change after chemokine signaling: normal neutrophils bind ICAM-1 ten times more strongly once CXCL8 tells them they have reached an inflamed site, but the patient's cells do not. Integrins circulate in a low-affinity shape and must be switched to a high-affinity conformation by signals inside the cell before they can grip the endothelium.<\/p><p>That switch is missing in leukocyte adhesion deficiency type 3 (LAD3). The result looks like LAD1 functionally, with rolling but no arrest, even though integrin levels are normal. Recruitment is a regulated sequence: rolling, chemokine activation, integrin affinity change, firm adhesion, then diapedesis.<\/p>", "why_wrong": ["Tethering and rolling were normal.", "Correct: the chemokine-triggered conformational change to high-affinity integrins fails (LAD3).", "Flow cytometry shows normal integrin levels, so production is intact.", "Diapedesis comes after firm adhesion, which cannot occur without integrin activation.", "The very high blood count shows neutrophils leave the marrow readily."], "objective": "Chemokine signals switch leukocyte integrins from low to high affinity; failure of this step (LAD3) blocks firm adhesion despite normal integrin expression."}, {"qid": "09-4", "topic": "Inflammasomes and IL-1", "stem": "<p>Macrophages are cultured under three conditions, and interleukin 1 beta (IL-1β) is measured in the cell lysate and in the culture fluid.<\/p><table class=\"labs\"><tr><th>Condition<\/th><th>Inactive precursor in cells<\/th><th>Mature IL-1β secreted<\/th><\/tr><tr><td>Lipopolysaccharide (LPS) alone<\/td><td>High<\/td><td>None<\/td><\/tr><tr><td>LPS, then extracellular ATP<\/td><td>Reduced<\/td><td>High<\/td><\/tr><tr><td>Caspase-1-deficient cells, LPS then ATP<\/td><td>High<\/td><td>None<\/td><\/tr><\/table>", "lead": "ATP most likely promotes IL-1β secretion by which mechanism?", "choices": ["Activating Toll-like receptor 4 to drive IL-1β gene transcription", "Inducing NADPH oxidase to oxidize the precursor protein", "Binding the IL-1 receptor to amplify its own production", "Assembling a cytosolic sensor complex that activates caspase-1", "Triggering degranulation of stored mature IL-1β"], "answer": 3, "explanation": "<p>LPS alone fills the cell with inactive pro-IL-1β but nothing is released, so the first signal (Toll-like receptor signaling) drives synthesis only. ATP, a damage-associated molecule, supplies the second signal, and it fails without caspase-1. ATP is sensed in the cytosol by a NOD-like receptor, which assembles with adaptor proteins and caspase-1 into an inflammasome. Active caspase-1 cleaves pro-IL-1β (and pro-IL-18) into the active cytokine, which is then secreted.<\/p><p>The inflammasome integrates signals from pathogen and damage molecules, including crystals such as urate (gout) and calcium pyrophosphate (pseudogout), and can also cause pyroptosis, an inflammatory cell death. Because it controls IL-1 release, too much inflammasome activity produces disease.<\/p>", "why_wrong": ["Transcription is already high with LPS alone; ATP is needed for processing, not synthesis.", "NADPH oxidase makes reactive oxygen species; it does not process cytokine precursors.", "The precursor must first be cleaved before IL-1 can engage its receptor, and caspase-1 loss blocks everything.", "Correct: ATP activates an NLR-containing inflammasome, which activates caspase-1 to cleave pro-IL-1β.", "IL-1β is not stored in mature form; the lysate shows only precursor."], "objective": "IL-1β release needs two signals: Toll-like receptor-driven pro-IL-1β synthesis, then inflammasome (NLR plus caspase-1) activation by PAMPs or DAMPs that cleaves it to the active form."}, {"qid": "09-5", "topic": "Autoinflammatory syndromes and IL-1 blockade", "stem": "<p>An 8-year-old girl has had episodes of fever, an itchy hive-like rash and painful swollen knees every few weeks since infancy, often after exposure to cold. Her father and paternal aunt have the same episodes. During an attack, temperature is 39.1 °C (102.4 °F).<\/p><table class=\"labs\"><tr><td>White blood cell count<\/td><td>16,500/mm<sup>3<\/sup>, mostly neutrophils<\/td><\/tr><tr><td>C-reactive protein<\/td><td>98 mg/L (normal &lt;10)<\/td><\/tr><tr><td>Blood and joint fluid cultures<\/td><td>Negative<\/td><\/tr><tr><td>Autoantibody panel<\/td><td>Negative<\/td><\/tr><\/table><p>Genetic testing finds a gain-of-function variant in a gene for a cytosolic pattern recognition receptor.<\/p>", "lead": "Which therapy would most likely prevent her episodes?", "choices": ["A soluble TNF receptor", "An H1 histamine receptor antagonist", "An anti-IL-6 receptor antibody", "An H2 histamine receptor antagonist", "A recombinant IL-1 receptor antagonist"], "answer": 4, "explanation": "<p>Recurrent sterile inflammation (negative cultures), no autoantibodies, and dominant inheritance of a gain-of-function variant in a cytosolic pattern recognition receptor describe a hereditary autoinflammatory syndrome. Here the overactive sensor is the NOD-like receptor component of the inflammasome (cold-triggered attacks fit a cryopyrin-associated periodic syndrome). An inflammasome that switches on too easily keeps activating caspase-1, which keeps releasing active IL-1.<\/p><p>The disease is driven by excess IL-1, so blocking IL-1 is the targeted treatment: anakinra, a recombinant IL-1 receptor antagonist, or canakinumab, an anti-IL-1 antibody. TNF and IL-6 blockers act on downstream or parallel arms and are not the first choice, and antihistamines treat mast cell-driven itching rather than inflammasome output.<\/p>", "why_wrong": ["TNF blockers treat diseases such as rheumatoid arthritis and Crohn disease, but IL-1 is the cytokine inflammasomes produce.", "H1 antagonists block histamine effects; they do not touch the IL-1 cascade driving fever and arthritis.", "IL-6 blockade lowers the acute phase response but does not target the inflammasome product directly.", "H2 antagonists reduce gastric acid secretion.", "Correct: excess inflammasome activity means excess IL-1, which an IL-1 receptor antagonist blocks."], "objective": "Hereditary autoinflammatory syndromes (such as cryopyrin-associated periodic syndromes and familial Mediterranean fever) come from overactive inflammasomes that release IL-1, so they respond to IL-1 blockade."}, {"qid": "09-6", "topic": "Acute phase response", "stem": "<p>Wild-type mice and interleukin 6 (IL-6)-deficient mice receive an injection of a sterile chemical irritant into the thigh muscle. Over the next 24 hours both groups develop local swelling and neutrophil infiltration, but serum levels of serum amyloid P and other plasma opsonins rise 50-fold in wild-type mice and barely change in the deficient mice. A single injection of recombinant IL-6 into the deficient mice restores the rise.<\/p>", "lead": "The restored proteins are mainly produced by which cells in response to IL-6?", "choices": ["Hypothalamic neurons", "Bone marrow neutrophil precursors", "Hepatocytes", "Vascular endothelial cells", "Tissue mast cells"], "answer": 2, "explanation": "<p>Serum amyloid P and related plasma opsonins (C-reactive protein, mannose-binding lectin) are acute phase proteins. Their production surges during inflammation, and the experiment shows that surge depends on IL-6. IL-6, together with IL-1 and TNF, acts on the liver, where hepatocytes switch on synthesis of acute phase proteins and release them into the blood.<\/p><p>The early cytokine triad has local and systemic effects: endothelial activation at the site, fever through the hypothalamus, neutrophil production and release from the bone marrow, and the acute phase response from the liver. Local inflammation was preserved here, which shows IL-6 is not required for every effect but is the dominant driver of the hepatic response. A high C-reactive protein in a patient is read the same way: a marker of systemic IL-6 activity.<\/p>", "why_wrong": ["The hypothalamus mediates fever, not plasma protein synthesis.", "Bone marrow responds by producing and releasing neutrophils, not plasma opsonins.", "Correct: hepatocytes produce acute phase proteins in response to IL-6.", "Endothelial cells respond with activation, adhesion molecules and leakiness.", "Mast cells release histamine and lipid mediators, not acute phase proteins."], "objective": "IL-6 (with IL-1 and TNF) drives the hepatic acute phase response, in which hepatocytes secrete proteins such as C-reactive protein, serum amyloid P and mannose-binding lectin."}, {"qid": "09-7", "topic": "Fever and eicosanoids", "stem": "<p>Rabbits receive an intravenous injection of interleukin 1 (IL-1). Within 90 minutes core temperature rises by 1.5 °C, and over 24 hours serum acute phase proteins rise. Rabbits pretreated with a drug that irreversibly acetylates the enzyme that converts arachidonic acid to the common precursor of prostaglandins and thromboxanes show no temperature rise, but their acute phase protein response is unchanged.<\/p>", "lead": "The drug most likely prevented fever by blocking which of the following?", "choices": ["Leukotriene B4 production by neutrophils", "Prostaglandin E2 acting on the hypothalamus", "Histamine release acting on H1 receptors", "IL-6 production by macrophages", "Lipoxin production by acetylated enzyme"], "answer": 1, "explanation": "<p>The drug acetylates cyclooxygenase (COX), the enzyme that turns arachidonic acid into the precursor of prostaglandins and thromboxanes (aspirin works this way). It blocked fever but left the acute phase response alone, so IL-1 must act on the liver directly while it raises temperature through a COX product. That product is prostaglandin E2 (PGE2), which acts on the hypothalamus to reset the temperature set point.<\/p><p>Reading the mediator tables this way pays off: fever is listed under IL-1, IL-6, TNF and PGE2 because the cytokines are the signal and PGE2 is the local messenger in the brain. Leukotrienes come from a different enzyme (5-lipoxygenase) and would not be affected.<\/p>", "why_wrong": ["Leukotriene B4 is made by 5-lipoxygenase, not cyclooxygenase, and drives chemotaxis rather than fever.", "Correct: cyclooxygenase blockade stops prostaglandin E2, the hypothalamic mediator of cytokine-induced fever.", "Histamine is a stored mast cell amine, not a cyclooxygenase product, and is not a fever mediator in this scheme.", "If IL-6 production were blocked, the acute phase response would also have fallen.", "Acetylated cyclooxygenase actually shifts toward pro-resolution lipids; that would not explain loss of fever."], "objective": "Cytokines such as IL-1 cause fever by inducing cyclooxygenase-derived prostaglandin E2 in the hypothalamus; cyclooxygenase inhibitors block fever without blocking the hepatic acute phase response."}, {"qid": "09-8", "topic": "TNF in chronic inflammation", "stem": "<p>Transgenic mice carrying a human TNF gene that lacks its normal regulatory sequences produce TNF continuously. By 3 to 7 months of age they develop swollen joints, and histology shows proliferating inflamed synovium with erosion of cartilage and bone, closely resembling a human chronic autoimmune joint disease. No infection is found.<\/p>", "lead": "Starting treatment early with which agent would most likely prevent the joint disease in these mice?", "choices": ["An H1 histamine receptor antagonist", "An IL-1 receptor antagonist", "An S1P receptor modulator", "A soluble TNF receptor", "A complement C5a antagonist"], "answer": 3, "explanation": "<p>The only manipulation is unregulated TNF, and that alone is enough to cause chronic, progressive, erosive arthritis like rheumatoid arthritis. TNF is a highly pleiotropic cytokine made by macrophages, Th1 cells and others, and in this model it is the cause, so neutralizing TNF should prevent the disease.<\/p><p>A soluble TNF receptor (etanercept) acts as a decoy that soaks up TNF before it reaches cell receptors; anti-TNF antibodies (infliximab, adalimumab) do the same job. These TNF inhibitors have transformed treatment of rheumatoid arthritis, psoriasis and inflammatory bowel disease, the human diseases in which TNF is a key driver.<\/p>", "why_wrong": ["Histamine drives acute vascular changes and itch, not chronic erosive synovitis.", "IL-1 blockade is the targeted treatment for inflammasome-driven disease; here the driver is TNF.", "S1P receptor modulators trap lymphocytes in lymph nodes and are not the targeted fix for excess TNF.", "Correct: a soluble TNF receptor neutralizes the TNF driving the arthritis.", "C5a antagonism would not remove the continuous TNF signal causing the disease."], "objective": "Dysregulated TNF alone can cause chronic erosive arthritis; TNF inhibitors (soluble receptor etanercept, antibodies infliximab and adalimumab) treat rheumatoid arthritis, psoriasis and inflammatory bowel disease."}, {"qid": "09-9", "topic": "Early signals direct the type of inflammation", "stem": "<p>Immature dendritic cells are exposed in vitro to a synthetic viral nucleic acid product, washed, and cultured with naive CD4 T cells that recognize a peptide the dendritic cells are presenting. The dendritic cells secrete large amounts of interleukin 12 (IL-12). After 5 days, most of the T cells produce interferon gamma, and very few produce IL-4 or IL-17. Adding a neutralizing anti-IL-12 antibody to the co-culture sharply reduces the interferon gamma-producing T cells.<\/p>", "lead": "This response program is best suited to which type of threat?", "choices": ["Viruses and intracellular bacteria", "Helminth parasites", "Extracellular bacteria and fungi", "Harmless environmental antigens needing tolerance", "Damaged tissue needing repair"], "answer": 0, "explanation": "<p>Pattern recognition receptors do more than say \"danger\": they tell the immune system what kind of danger. A viral product triggered IL-12 from the dendritic cell, and IL-12 drove the T cells to make interferon gamma, the signature of a type 1 (Th1) response. Type 1 inflammation activates macrophages and cytotoxic mechanisms, which is what infected cells and microbes living inside cells require.<\/p><p>Other early signals steer elsewhere: IL-4 toward type 2 responses against parasites, IL-6, IL-23 and TGF-β toward type 3 (Th17, IL-17) responses against extracellular bacteria and fungi, and regulatory signals toward tolerance. The early innate read of the pathogen shapes dendritic cell maturation and the adaptive response that follows.<\/p>", "why_wrong": ["Correct: IL-12 and interferon gamma define type 1 responses against viruses and intracellular bacteria.", "Parasite responses are type 2, driven by IL-4, which was nearly absent.", "Extracellular bacteria and fungi call for type 3 (IL-17) responses, which were rare.", "Tolerogenic responses rely on regulatory signals, not IL-12 and interferon gamma.", "Repair programs involve M2 macrophages and growth factors, not an IL-12-driven T cell response."], "table": "<table><tr><th>Program<\/th><th>Early signal<\/th><th>Signature cytokine<\/th><th>Main targets<\/th><\/tr><tr><td>Type 1<\/td><td>IL-12<\/td><td>Interferon gamma<\/td><td>Viruses, intracellular bacteria<\/td><\/tr><tr><td>Type 2<\/td><td>IL-4<\/td><td>IL-4, IL-5, IL-13<\/td><td>Parasites<\/td><\/tr><tr><td>Type 3<\/td><td>IL-6, IL-23, TGF-β<\/td><td>IL-17, IL-22<\/td><td>Extracellular bacteria, fungi<\/td><\/tr><tr><td>Regulatory<\/td><td>TGF-β, IL-10<\/td><td>IL-10, TGF-β<\/td><td>Tolerance, anti-inflammatory<\/td><\/tr><\/table>", "objective": "Early innate signals from pattern recognition receptors determine which inflammatory program follows; IL-12 from dendritic cells drives type 1 (interferon gamma) responses against viruses and intracellular bacteria."}, {"qid": "09-10", "topic": "Nitric oxide synthases", "stem": "<p>Macrophages are taken from wild-type mice and from mice with a deletion of one gene. After stimulation with interferon gamma and lipopolysaccharide, wild-type macrophages kill 90% of ingested intracellular bacteria and release large amounts of nitrite into the culture fluid; mutant macrophages kill 30% and release almost no nitrite. The mutant mice have normal resting blood pressure, normal vascular relaxation responses and normal neurological function. Their neutrophils show a normal oxidative burst.<\/p>", "lead": "Which enzymatic activity is most likely absent in the mutant macrophages?", "choices": ["Constitutive nitric oxide synthesis in endothelium", "Conversion of oxygen to superoxide on phagosomes", "Decarboxylation of histidine", "Oxidation of arachidonic acid by 5-lipoxygenase", "Cytokine-induced nitric oxide synthesis from arginine"], "answer": 4, "explanation": "<p>Nitrite in the culture fluid is a stable breakdown product of nitric oxide (NO), and its loss along with poor killing means the macrophages cannot make NO after activation. NO is made from L-arginine (leaving citrulline) by three nitric oxide synthases. Two are constitutive: endothelial NOS, which controls vascular tone, and neural NOS, used in neurotransmission and pain signaling. Those are clearly intact here, since blood pressure, vascular relaxation and nerve function are normal.<\/p><p>The missing one is inducible NOS (iNOS), switched on through NF-κB by inflammatory signals (TNF, IL-1, interferon gamma) and pathogen products. In phagocytes, NO is antimicrobial and cytotoxic, and it can combine with superoxide to form peroxynitrite. It also contributes to vasodilation and vascular leak at inflamed sites.<\/p>", "why_wrong": ["Endothelial NO synthesis is constitutive, and normal vascular function shows it is intact.", "The oxidative burst was normal, so NADPH oxidase works.", "Histidine decarboxylase makes histamine, unrelated to nitrite production.", "5-Lipoxygenase makes leukotrienes and does not produce nitrite.", "Correct: inducible nitric oxide synthase is switched on by cytokines and PAMPs in macrophages."], "objective": "Inducible nitric oxide synthase, switched on by inflammatory cytokines and PAMPs, makes antimicrobial nitric oxide from L-arginine in phagocytes; endothelial and neural NOS are constitutive."}, {"qid": "09-11", "topic": "Innate versus antigen-triggered inflammation", "stem": "<p>Naive mice receive an intradermal injection of either lipopolysaccharide (LPS) or ovalbumin, a harmless egg protein. LPS causes swelling and neutrophil influx within 4 hours; ovalbumin causes nothing. Mice are then injected with ovalbumin several times over 3 weeks. When rechallenged in the skin, they develop swelling within 15 minutes. Serum from these mice is transferred into new naive mice, which also swell within 15 minutes when first given ovalbumin in the skin.<\/p>", "lead": "The reaction in the serum recipients is best classified as which of the following?", "choices": ["An innate response to a pathogen-associated pattern", "An antibody-mediated hypersensitivity reaction", "A T cell-mediated hypersensitivity reaction", "An inflammasome-driven autoinflammatory reaction", "A dysregulated systemic cytokine storm"], "answer": 1, "explanation": "<p>LPS triggers inflammation on the first encounter because pattern recognition receptors detect it directly. Ovalbumin is not a danger signal and does nothing the first time, so the later reaction must come from the adaptive system responding to a specific antigen after sensitization. Reactions like this, exaggerated responses to a harmless antigen, are immunological hypersensitivities.<\/p><p>The next step is to decide which arm carries it. Serum is cell-free, so the transferred component is antibody, and the rapid onset fits that too. In the Gell-Coombs classification, Types 1 to 3 are antibody-mediated and Type 4 is T cell-mediated, which could not be transferred by serum and would take a day or two to develop.<\/p>", "why_wrong": ["Ovalbumin did nothing in naive mice, so it is not acting as a pathogen pattern.", "Correct: a response to a harmless antigen that needs sensitization and transfers with serum is antibody-mediated hypersensitivity.", "T cell-mediated (Type 4) reactions transfer with cells, not serum, and take a day or more.", "Autoinflammatory reactions are antigen-independent and arise spontaneously, not after sensitization to a specific protein.", "A cytokine storm is a systemic dysregulated loop, not a local reaction to one antigen."], "objective": "Innate signals (PAMPs, DAMPs) trigger inflammation on first exposure; antigen-triggered inflammation needs prior sensitization, and these hypersensitivities are antibody-mediated (Types 1 to 3) or T cell-mediated (Type 4)."}, {"qid": "09-12", "topic": "Bradykinin and the contact system", "stem": "<p>Plasma from a healthy volunteer is briefly exposed to a negatively charged glass surface, which activates the contact pathway of coagulation. A small amount of this treated plasma is then injected into the forearm skin of volunteers. Within minutes they report pain at the site and develop local redness and swelling. Pretreatment with an H1 histamine receptor antagonist does not reduce either effect. Pre-incubating the treated plasma with an enzyme that degrades small peptides abolishes both effects.<\/p>", "lead": "The mediator responsible is most likely which of the following?", "choices": ["Histamine", "Leukotriene C4", "Interleukin 1", "Bradykinin", "Serotonin"], "answer": 3, "explanation": "<p>The mediator is made in plasma when the contact pathway is activated, it is a small peptide (destroyed by a peptide-degrading enzyme), and it acts independently of H1 receptors. Bradykinin fits all three: it is generated by the contact activation cascade, a side branch of the intrinsic coagulation pathway, and it causes vasodilation, vascular permeability and pain.<\/p><p>Inflammatory mediators come from very different sources: cytokines from cells, histamine and serotonin from stored granules, eicosanoids from membrane lipids, and some (bradykinin, complement fragments) from plasma protein cascades. Pain is a good example of overlap: bradykinin, prostaglandin E2, substance P, histamine, TNF and serotonin all contribute.<\/p>", "why_wrong": ["Histamine effects would be blocked by the H1 antagonist, and histamine is an amine, not a peptide.", "Leukotrienes are lipids made by cells, not peptides generated in plasma.", "Interleukin 1 is a cytokine secreted by cells such as macrophages, not produced by plasma on glass contact.", "Correct: bradykinin is a peptide from the contact activation cascade causing pain, vasodilation and leak.", "Serotonin is a tryptophan derivative stored in cells, not a plasma peptide."], "objective": "Bradykinin is a peptide produced by the plasma contact activation cascade that causes vasodilation, vascular permeability and pain independently of histamine."}, {"qid": "09-13", "topic": "Active resolution of inflammation", "stem": "<p>A sterile irritant that is fully cleared from the tissue within 24 hours is injected into the peritoneum of wild-type mice and of mice that cannot synthesize lipoxins or resolvins. In both groups neutrophils arrive by 6 hours and the irritant is gone by 24 hours. In wild-type mice the exudate clears by day 3; in mutant mice neutrophils, pro-inflammatory cytokines and swelling persist past day 7. A single dose of purified resolvin given to the mutant mice at 24 hours restores clearance by day 4.<\/p>", "lead": "These results best support which conclusion?", "choices": ["Inflammation stops once its initiating stimulus has been removed", "Lipoxins and resolvins are required for neutrophil recruitment", "Ending inflammation requires active pro-resolution signals", "Resolvins act mainly by killing remaining microbes", "Persistent inflammation here reflects a hypersensitivity reaction"], "answer": 2, "explanation": "<p>The irritant was removed on schedule in both groups, yet inflammation persisted only in mice that cannot make pro-resolution lipid mediators, and replacing one of them fixed it. So removing the trigger is necessary but not enough: resolution is an active program. Pro-resolution eicosanoids (lipoxins, resolvins, maresins, protectins), regulatory cytokines (IL-10, TGF-β) and specialized cells (M2 macrophages, regulatory T cells) switch the tissue from attack to cleanup and repair.<\/p><p>When active resolution fails, or the stimulus or dead cells are not cleared, acute inflammation becomes chronic. That is the link between a normal protective response and chronic inflammatory disease.<\/p>", "why_wrong": ["The stimulus was cleared in both groups, but only wild-type mice resolved, so stimulus removal alone was not enough.", "Neutrophils arrived on time in mutant mice, so recruitment did not need these lipids.", "Correct: resolution needs active pro-resolution signals such as resolvins and lipoxins.", "The irritant was sterile; resolvins promote resolution, not microbial killing.", "No antigen sensitization was involved, so this is not a hypersensitivity reaction."], "objective": "Resolution of inflammation is active: pro-resolution lipids (lipoxins, resolvins, maresins), IL-10 and TGF-β, M2 macrophages and regulatory T cells are needed, and their failure leads to chronic inflammation."}]}, {"id": "10", "title": "Antigen Receptors and Immunoglobulin Antigen Recognition", "week": 2, "subject": "Immunology", "questions": [{"qid": "10-1", "topic": "Proteolytic fragments of immunoglobulin", "stem": "<p>A purified IgG antibody that binds a protein on the surface of red blood cells is digested with a protease, and the fragments are separated. Each fraction is tested in three assays and compared with intact IgG.<\/p><table class=\"labs\"><tr><th>Assay<\/th><th>Fraction 1<\/th><th>Fraction 2<\/th><th>Intact IgG<\/th><\/tr><tr><td>Binds red cell surface protein<\/td><td>Yes<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><td>Clumps red cells together (agglutination)<\/td><td>No<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><td>Binds receptors on macrophages<\/td><td>No<\/td><td>Yes<\/td><td>Yes<\/td><\/tr><\/table>", "lead": "Fraction 1 most likely consists of which portion of the antibody?", "choices": ["A single antigen-binding arm with one binding site", "Two antigen-binding arms joined at the hinge", "The paired constant domains of the two heavy chains", "An isolated light chain constant domain", "An isolated heavy chain variable domain"], "answer": 0, "explanation": "<p>Fraction 1 binds the red cell protein, so it contains a complete antigen-binding site, which is formed by one heavy chain variable region paired with one light chain variable region. It cannot clump cells, so it has only one binding site and cannot bridge two cells. A fragment with one antigen-binding site is a fragment antigen-binding (Fab).<\/p><p>A fragment with two binding sites joined at the hinge, F(ab)2, would cross-link two cells and agglutinate them. Fraction 2 binds macrophage receptors but no antigen, which identifies it as the fragment crystallizable (Fc), the constant region that carries effector functions. Splitting the antibody this way shows the division of labor: variable regions bind antigen, constant regions engage the rest of the immune system.<\/p>", "why_wrong": ["Correct: one binding site explains binding without agglutination, and the lack of constant heavy chain domains explains no macrophage binding; this is the Fab fragment.", "F(ab)2 has two binding sites and would cross-link red cells, but fraction 1 did not agglutinate.", "The paired heavy chain constant domains form the Fc fragment, which matches fraction 2, not fraction 1.", "A light chain constant domain alone has no variable region and cannot bind antigen.", "A heavy chain variable domain alone lacks the light chain variable partner that together form the binding site."], "table": "<table><tr><th>Fragment<\/th><th>Antigen-binding sites<\/th><th>Cross-links antigen<\/th><th>Effector function<\/th><\/tr><tr><td>Fab<\/td><td>1<\/td><td>No<\/td><td>No<\/td><\/tr><tr><td>F(ab)2<\/td><td>2<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>Fc<\/td><td>0<\/td><td>No<\/td><td>Yes (Fc receptors)<\/td><\/tr><\/table>", "objective": "Fab carries one antigen-binding site, F(ab)2 carries two and can cross-link antigen, and Fc carries the effector functions of the constant region."}, {"qid": "10-2", "topic": "Complementarity-determining regions", "stem": "<p>Researchers sequence the heavy and light chains of 200 different monoclonal antibodies, each with a different antigen specificity. The constant regions fall into a few shared sequences. Within the variable regions, most positions are similar across all 200 antibodies, but three short stretches in each heavy chain variable region and three in each light chain variable region differ greatly from one antibody to the next. Swapping only these six stretches from antibody X into antibody Y makes antibody Y bind the antigen of antibody X.<\/p>", "lead": "Which statement best describes the six stretches?", "choices": ["They form the hinge that lets the two arms move apart", "They form the conserved sheets that fold each domain", "They are loops that together form the antigen-binding pocket", "They are the sites that bind the signaling chains of the receptor", "They are the sites that bind Fc receptors on phagocytes"], "answer": 2, "explanation": "<p>Each variable region is an immunoglobulin domain built from a stable framework of paired beta sheets. Three short loops project from that framework, and these loops carry most of the sequence diversity of the variable region, which is why they are called hypervariable regions. The three loops of the heavy chain variable region and the three of the light chain variable region come together to form the antigen-binding pocket, so they are also called complementarity-determining regions (CDRs).<\/p><p>The swap experiment proves the point: moving only the six CDRs moves the specificity, even though the rest of antibody Y is unchanged. The conserved framework between the loops simply holds them in position, and the constant regions do not decide what is bound at all.<\/p>", "why_wrong": ["The hinge lies between the antigen-binding arms and the Fc portion in the heavy chain constant region, not within the variable regions.", "The conserved beta sheets are the framework regions, which are similar across antibodies rather than highly variable.", "Correct: the hypervariable loops of the heavy and light chain variable regions form the binding site, so transferring them transfers specificity.", "The signaling chains associate with the membrane portion of the B cell receptor, not with the variable region loops.", "Fc receptor binding is a property of the heavy chain constant region, which is shared among antibodies of the same class."], "objective": "Three hypervariable loops, the complementarity-determining regions, from each of the heavy and light chain variable regions form the antigen-binding site and determine specificity."}, {"qid": "10-3", "topic": "Isotype versus allotype", "stem": "<p>Purified IgG from a healthy volunteer is injected into rabbits, and the rabbit serum is first absorbed with IgG pooled from many people so that only the antibodies left over remain. The absorbed rabbit serum binds IgG from the volunteer and from some unrelated people, but not from others. It binds the volunteer's IgG regardless of which antigen that IgG recognizes, and it does not bind the volunteer's IgM or IgA. Binding maps to the heavy chain constant region.<\/p>", "lead": "The rabbit antibodies most likely recognize which feature of the volunteer's IgG?", "choices": ["An isotype shared by the IgG of essentially every person", "An allotype, an inherited constant region variant", "A unique antigen-binding site of one antibody clone", "A light chain isotype found in many antibody classes", "A conformational epitope on the antigen being bound"], "answer": 1, "explanation": "<p>Constant regions come in a few types, the isotypes (IgM, IgD, IgG subclasses, IgE, IgA subclasses, and kappa or lambda light chains), and every individual makes all of them. Isotypes can also exist in several inherited allelic forms that differ slightly in amino acid sequence from one person to another. These variants are allotypes.<\/p><p>Absorbing the rabbit serum with pooled human IgG removed antibodies against features every person shares, which is why what remains does not react with everyone. The leftover antibodies bind only some people's IgG, bind it whatever its specificity, ignore other classes, and map to the heavy chain constant region. A constant region feature that varies between individuals is an allotype.<\/p>", "why_wrong": ["An isotype is present in essentially everyone, so the rabbit serum would have bound IgG from all donors, and those antibodies were absorbed away.", "Correct: a heavy chain constant region variant present in some people but not others is an allotype.", "A unique antigen-binding site would be present on only one antibody clone and would sit in the variable region, not the constant region.", "Light chain isotypes are shared by IgM and IgA as well, but the serum did not bind those classes and binding mapped to the heavy chain.", "A conformational epitope is a feature of the antigen being bound, not of the antibody, and binding here did not depend on specificity."], "objective": "Isotypes are constant region types present in all individuals, while allotypes are inherited allelic variants of those constant regions that differ between individuals."}, {"qid": "10-4", "topic": "Haptens and carriers", "stem": "<p>A small drug molecule (molecular weight about 300) is injected repeatedly into mice, and no antibody against it is detected. In a second group of mice, the same drug is chemically attached to a large foreign protein before injection. These mice make antibody that binds the free drug in solution and also antibody that binds the protein. Mice injected with the protein alone make antibody to the protein but none to the drug.<\/p>", "lead": "Which term best describes the drug in this experiment?", "choices": ["Carrier", "Allotype", "Superantigen", "Hapten", "Isotype"], "answer": 3, "explanation": "<p>An antigen is any molecule, protein, lipid or carbohydrate, that can be bound specifically by an antibody. Some small molecules can be bound by antibody but cannot by themselves elicit a response. When such a molecule is attached to a larger molecule, the carrier, the conjugate does provoke a response, and some of the resulting antibodies bind the small molecule even when it is free again.<\/p><p>The drug here fits that definition exactly: alone it induced nothing, attached to the protein it induced drug-specific antibody, and that antibody recognizes free drug. A small molecule that is antigenic but not immunogenic on its own is a hapten, and the large protein is its carrier.<\/p>", "why_wrong": ["The carrier is the large protein that made the drug immunogenic, not the drug itself.", "An allotype is an inherited variant of an antibody constant region, not a molecule that antibodies are raised against.", "A superantigen activates many lymphocyte clones without specific recognition, which does not describe a small drug that needs a carrier.", "Correct: a small molecule that elicits a specific response only when attached to a larger carrier is a hapten.", "An isotype is a constant region type of an antibody, not a property of the antigen."], "objective": "A hapten is a small molecule that is not immunogenic on its own but elicits a specific antibody response when attached to a larger carrier."}, {"qid": "10-5", "topic": "Affinity versus avidity", "stem": "<p>Two antibody preparations are raised against the same bacterial surface carbohydrate and share the same variable regions. Preparation 1 is a pentamer with ten binding sites. Preparation 2 is a monomer with two binding sites. Binding of each single site to a single carbohydrate unit, measured with free carbohydrate in solution, is identical for the two preparations. On intact bacteria, whose surface carries the carbohydrate repeated thousands of times, preparation 1 stays bound after extensive washing while preparation 2 washes off.<\/p>", "lead": "Which statement best explains the difference seen on intact bacteria?", "choices": ["Preparation 1 has higher affinity per binding site", "Preparation 1 engages more sites at once, giving higher avidity", "Preparation 1 binds a different epitope on the carbohydrate", "Preparation 2 binds antigen only in a denatured configuration", "Preparation 2 forms covalent bonds that break during washing"], "answer": 1, "explanation": "<p>Affinity is the strength of binding of one binding site to one epitope. Measured against free carbohydrate, the two preparations are identical, which is expected because they share the same variable regions, and so the same complementarity-determining loops. Affinity therefore cannot be the variable here.<\/p><p>Avidity is the combined strength of all the binding sites engaging all the available epitopes. Each individual antibody-antigen interaction is non-covalent and reversible, so a single site releases often. When ten sites can grip a surface that repeats the epitope thousands of times, the chance that all of them release at the same moment is very small, and the complex survives washing. This is why pentameric IgM holds tightly to repetitive microbial surfaces even though its individual sites are typically of lower affinity.<\/p>", "why_wrong": ["Affinity per site was measured as identical, and the shared variable regions predict that.", "Correct: more binding sites engaging a repeated epitope raises avidity, so the whole complex dissociates far more slowly.", "Both preparations share the same variable regions, so they bind the same epitope.", "Antibodies recognize antigen in its native configuration, and preparation 2 did bind free carbohydrate normally.", "Antibody-antigen binding is non-covalent for both preparations, which is exactly why washing can remove a low-avidity complex."], "table": "<table><tr><th><\/th><th>Affinity<\/th><th>Avidity<\/th><\/tr><tr><td>What it measures<\/td><td>One site to one epitope<\/td><td>All sites to all epitopes<\/td><\/tr><tr><td>Depends on<\/td><td>Variable region loops<\/td><td>Affinity, valence, epitope spacing, flexibility<\/td><\/tr><tr><td>Example<\/td><td>IgM sites often of lower affinity<\/td><td>IgM pentamer: 10 sites, high avidity<\/td><\/tr><\/table>", "objective": "Avidity is the combined binding strength of all engaged sites, so a multivalent antibody can bind a repetitive surface tightly even when the affinity of each site is unchanged."}, {"qid": "10-6", "topic": "Clonal expression of antigen receptors", "stem": "<p>Serum protein electrophoresis from an older adult with bone pain shows one sharp, narrow band in the gamma region, and the rest of the gamma region is reduced. Sequencing of the immunoglobulin heavy and light chain variable regions from the cells producing that band shows one single sequence. Serum from a healthy control shows a broad smear in the same region, and sequencing of variable regions from control plasma cells shows thousands of different sequences.<\/p>", "lead": "Which principle of adaptive immunity best explains the single sharp band?", "choices": ["Each lymphocyte and its progeny express one antigen receptor specificity", "Constant regions exist in only a few isotypes in all individuals", "Antigen-binding sites are built from paired variable region loops", "Receptor signaling depends on associated chains bearing activation motifs", "Antibody responses leave long-lived memory after a first exposure"], "answer": 0, "explanation": "<p>Antigen receptors are expressed clonally: a lymphocyte rearranges its receptor genes once, and every daughter cell inherits that same receptor and therefore the same specificity. Healthy serum contains antibody from a huge number of different clones, so electrophoresis shows a broad smear of many sequences and charges.<\/p><p>When the antibody in serum comes from the descendants of a single cell, every molecule has the same variable region, the same charge and the same size, so it migrates as one narrow band. Finding a single variable region sequence confirms that the band is the product of one expanded clone. The same logic in reverse is why a single clone can be tracked by its receptor sequence.<\/p>", "why_wrong": ["Correct: one clone makes one receptor specificity, so its antibody migrates as a single narrow band rather than a smear.", "A limited number of isotypes is true of everyone, including the healthy control who shows a broad smear, so it cannot explain the band.", "How a binding site is assembled does not explain why only one sequence is present.", "Signaling chains carrying activation motifs explain how antigen triggers a cell, not why the antibody is uniform.", "Memory explains a faster second response, not a single uniform antibody species."], "objective": "Antigen receptors are expressed clonally, so antibody produced by the progeny of one lymphocyte appears as a single narrow band with one variable region sequence."}, {"qid": "10-7", "topic": "Signaling chains of the antigen receptor complexes", "stem": "<p>A transfected cell line is made to express a membrane immunoglobulin heavy and light chain pair on its surface, with nothing else from a lymphocyte. The surface immunoglobulin binds its antigen normally, but adding antigen produces no rise in intracellular calcium and no new gene transcription. When two additional small transmembrane chains are introduced along with the immunoglobulin, antigen now triggers tyrosine phosphorylation, a calcium rise and transcription. The added chains do not change antigen binding.<\/p>", "lead": "The added chains most likely contribute which feature?", "choices": ["Additional antigen-binding loops that stabilize the antigen", "Cytoplasmic activation motifs that recruit tyrosine kinases", "A cleft that displays processed peptide to the receptor", "A hinge that allows the two binding arms to spread apart", "A surface that binds receptors on phagocytic cells"], "answer": 1, "explanation": "<p>Membrane immunoglobulin and the T cell receptor chains bind antigen, but their own cytoplasmic portions do almost nothing. Each is part of a larger signaling complex. Membrane immunoglobulin associates with Ig-alpha and Ig-beta (CD79a and CD79b), and the T cell receptor associates with the CD3 chains together with the zeta chains. These associated chains carry immunoreceptor tyrosine-based activation motifs (ITAMs) in their cytoplasmic tails.<\/p><p>When antigen brings receptors together, the motifs are phosphorylated by early tyrosine kinases, and the phosphorylated motifs become docking sites that assemble the rest of the cascade. That leads to phospholipid-derived second messengers, a calcium rise, and activation of transcription factors. Without the associated chains the receptor binds antigen and nothing more happens, which is exactly the result in this cell line.<\/p>", "why_wrong": ["Antigen binding was already normal without the added chains, and the binding site is formed only by the heavy and light chain variable regions.", "Correct: the associated chains carry cytoplasmic activation motifs that are phosphorylated and recruit the kinases that start the cascade.", "A peptide-displaying cleft is a feature of major histocompatibility complex molecules, which do not signal for the B cell receptor.", "The hinge lies in the heavy chain and affects flexibility, not signaling.", "Binding phagocyte receptors is a function of the secreted antibody constant region, not a signaling chain."], "table": "<table><tr><th>Receptor<\/th><th>Binds antigen<\/th><th>Associated signaling chains<\/th><\/tr><tr><td>B cell receptor<\/td><td>Membrane immunoglobulin<\/td><td>Ig-alpha and Ig-beta (CD79a, CD79b)<\/td><\/tr><tr><td>T cell receptor<\/td><td>Alpha and beta chains<\/td><td>CD3 chains plus zeta<\/td><\/tr><\/table>", "objective": "Antigen receptors signal through associated chains, Ig-alpha and Ig-beta for the B cell receptor and the CD3 complex for the T cell receptor, whose cytoplasmic activation motifs recruit tyrosine kinases."}, {"qid": "10-8", "topic": "Negative regulation of T cell activation", "stem": "<p>Mice are engineered so that one inhibitory surface molecule on T cells can no longer bind its ligands on antigen-presenting cells, while the stimulatory receptor that binds the same ligands is intact. The animals are not immunized. By 4 weeks they show expanded activated T cells in many organs, enlarged lymph nodes and spleen, and lymphocytic infiltration of heart and pancreas. T cells from these animals proliferate more strongly than control T cells when presented with antigen by normal antigen-presenting cells.<\/p>", "lead": "Loss of which function best explains this phenotype?", "choices": ["Delivery of the second signal that completes activation", "Competitive dampening of the second signal", "Stabilization of receptor binding to a presenting molecule", "Recruitment of tyrosine kinases to activation motifs", "Degradation of cytosolic proteins into peptides"], "answer": 1, "explanation": "<p>Full T cell activation needs the antigen receptor signal plus a second signal from costimulatory receptors, most importantly CD28 binding CD80 and CD86 on the antigen-presenting cell, supported by cytokines such as interleukin 2. That same pair of ligands is also bound by CTLA-4, an inhibitory receptor that counteracts costimulation. The two receptors competing for the same ligands make the system a dimmer rather than an o
