n-off switch, and together they decide the outcome of receptor triggering.<\/p><p>In these mice the stimulatory receptor still works while the inhibitory one cannot engage its ligands, so the brake is gone and the accelerator is untouched. T cells then respond excessively to ordinary antigens, including self antigens, which produces lymphoproliferation and infiltration of tissues without any immunization. Blocking the stimulatory receptor instead would have the opposite effect, weaker responses.<\/p>", "why_wrong": ["Losing the second signal would weaken responses, not cause spontaneous expansion.", "Correct: the inhibitory receptor normally competes for the same ligands and dampens costimulation, so losing it removes the brake on activation.", "Co-receptors that stabilize binding to presenting molecules determine which subset is engaged; losing that would reduce activation.", "Activation motifs lie in the receptor-associated signaling chains, and this mouse has an intact signaling complex.", "Degradation of cytosolic proteins supplies peptides for presentation and is not a regulator of costimulation."], "objective": "CD28 and CTLA-4 compete for CD80 and CD86, so losing the inhibitory receptor removes a brake on T cell activation and allows excessive responses."}, {"qid": "10-9", "topic": "Co-receptor boosting of B cell receptor signaling", "stem": "<p>Purified B cells are cultured with two forms of the same protein antigen. Form 1 is the protein alone. Form 2 is the protein with a complement fragment covalently attached, which is bound by complement receptor 2 (CR2, also called CD21) on the B cell surface. Both forms are bound equally well by the B cell receptor. Proliferation is measured at several antigen concentrations.<\/p><table class=\"labs\"><tr><th>Antigen concentration<\/th><th>Form 1 (protein alone)<\/th><th>Form 2 (protein plus complement fragment)<\/th><\/tr><tr><td>High<\/td><td>Strong proliferation<\/td><td>Strong proliferation<\/td><\/tr><tr><td>Low<\/td><td>None<\/td><td>Strong proliferation<\/td><\/tr><\/table><p>Adding an antibody that blocks CR2 abolishes the advantage of form 2.<\/p>", "lead": "Which statement best explains the response to form 2 at low antigen concentration?", "choices": ["The complement fragment increases the affinity of the receptor for the protein", "CR2 presents the protein as peptide to the B cell receptor", "CR2 engagement adds to the receptor signal and lowers the threshold for activation", "CR2 replaces the need for the receptor-associated signaling chains", "The complement fragment cross-links receptors for immunoglobulin constant regions"], "answer": 2, "explanation": "<p>B cell receptor signaling is not a simple on-off switch. It behaves like a dimmer, where the size and quality of the total input decides whether the cell responds. Other surface receptors feed into the same phosphorylation cascade and shift that threshold. CR2 is one of them: when the antigen also carries a complement fragment, the B cell receptor and CR2 are engaged together and the signals add.<\/p><p>At high antigen concentration the receptor alone gathers enough signal, so both forms work. At low concentration only the combined input crosses the threshold, which is why the complement-tagged antigen still activates the cell. Blocking CR2 removes the extra input and the advantage disappears, which shows the effect is co-receptor signaling and not a change in antigen binding.<\/p>", "why_wrong": ["Both forms were bound equally well, so the affinity of the receptor for the protein is unchanged.", "Peptide presentation is how T cells see antigen; the B cell receptor binds the native protein directly.", "Correct: engaging CR2 together with the B cell receptor sums the signals and lowers the amount of antigen needed for activation.", "The signaling chains associated with the receptor are still required; CR2 modulates that cascade rather than replacing it.", "Receptors for immunoglobulin constant regions bind antibody, not a complement fragment attached to antigen."], "objective": "B cell receptor signaling is quantitative, and co-receptors such as CR2 (CD21) add to the signal so that less antigen is needed to activate the cell."}, {"qid": "10-10", "topic": "Membrane and secreted forms of the antigen receptors", "stem": "<p>A resting lymphocyte from a healthy donor binds a specific protein antigen with a surface receptor. The cell is activated and cultured, and after several days the culture supernatant contains a soluble protein that binds the same antigen, has two binding sites, and is recognized by receptors on macrophages. A second lymphocyte line from the same donor also binds antigen specifically through a surface receptor, but no antigen-binding protein ever appears in its supernatant, and its receptor has one binding site.<\/p>", "lead": "Which statement best describes the receptors on these two cells?", "choices": ["Both are immunoglobulins, differing only in the attached signaling chains", "Both are T cell receptors, differing in which co-receptor they use", "The first is a T cell receptor and the second is an immunoglobulin", "The first is an immunoglobulin and the second is a T cell receptor", "Both are pattern recognition receptors for conserved microbial molecules"], "answer": 3, "explanation": "<p>Immunoglobulins are tetramers of two identical heavy chains and two identical light chains, with two antigen-binding sites. They exist both as a membrane form, which serves as the B cell receptor, and as a secreted form. After activation, B cells can become plasma cells that secrete the molecule as antibody, which then works in plasma, interstitial fluid and secretions, and whose constant region is bound by receptors on cells such as macrophages.<\/p><p>T cell receptors are dimers of two chains with a single antigen-binding site, and they exist only in a membrane form. No soluble antigen-binding product is ever released. The cell that secretes a divalent antigen-binding protein is therefore the B lineage cell, and the cell whose monovalent receptor stays on the membrane is the T cell.<\/p>", "why_wrong": ["Two immunoglobulin-bearing cells cannot differ in valence, since immunoglobulin always has two binding sites.", "T cell receptors are never secreted, so neither cell could release a soluble antigen-binding protein.", "This reverses the findings: the secreting, divalent receptor belongs to the B lineage cell.", "Correct: the divalent receptor that is also secreted is an immunoglobulin, and the monovalent membrane-only receptor is a T cell receptor.", "Both cells bind one specific protein antigen, which is adaptive recognition rather than pattern recognition."], "table": "<table><tr><th><\/th><th>Immunoglobulin<\/th><th>T cell receptor<\/th><\/tr><tr><td>Chains<\/td><td>2 heavy plus 2 light<\/td><td>2 (alpha and beta, or gamma and delta)<\/td><\/tr><tr><td>Binding sites<\/td><td>2 (divalent)<\/td><td>1 (monovalent)<\/td><\/tr><tr><td>Forms<\/td><td>Membrane and secreted<\/td><td>Membrane only<\/td><\/tr><\/table>", "objective": "Immunoglobulins are divalent and exist in membrane and secreted forms, while T cell receptors are monovalent and exist only on the membrane."}, {"qid": "10-11", "topic": "Innate versus adaptive target recognition", "stem": "<p>Two receptor families are studied in mice. Family X is made of a few dozen receptor types encoded intact in the germline. Every macrophage expresses the same set, and cells respond within minutes to molecules shared by many classes of microbes. Family Y is assembled from gene segments in each developing lymphocyte, so each cell and its progeny carry one receptor of unique specificity. A mouse is injected with a newly synthesized protein that has never existed in nature.<\/p>", "lead": "Which of the following best describes how the two receptor families respond to this protein?", "choices": ["Family X recognizes it at once, while Family Y needs prior exposure", "Neither family can recognize it, since it was never selected in evolution", "Family Y can recognize it through rare clones, while Family X likely cannot", "Both families recognize it equally, since each receptor binds many shapes", "Family X recognizes it only after Family Y has generated memory cells"], "answer": 2, "explanation": "<p>Family X has the features of innate pattern recognition receptors: a small, fixed set encoded in the germline, expressed broadly on every cell of a type and ready to act. That set was shaped by natural selection over evolutionary time to detect molecules broadly associated with danger, such as shared microbial products. A molecule that never existed in nature is not among those preset targets, so innate receptors are unlikely to see it.<\/p><p>Family Y has the features of adaptive antigen receptors: assembled from gene segments, expressed clonally and so diverse that the number of possible targets is essentially unlimited. Somewhere in that repertoire a few clones will bind the new protein. The tradeoff is that each specificity sits on very few cells, so the response takes time to build, and learning happens within the individual through clonal selection.<\/p>", "why_wrong": ["Innate receptors respond quickly, but only to their preset targets, which a novel synthetic protein is not.", "Adaptive receptors are not limited to targets selected during evolution, which is their main advantage.", "Correct: the clonal, highly diverse adaptive repertoire can include rare cells specific for a target never seen before.", "Each receptor in both families is specific; the breadth of adaptive immunity comes from the number of different receptors, not from promiscuous binding.", "Innate recognition does not depend on adaptive memory; the two strategies use separate receptors."], "table": "<table><tr><th><\/th><th>Innate (Family X)<\/th><th>Adaptive (Family Y)<\/th><\/tr><tr><td>Number of receptor types<\/td><td>Small, fixed<\/td><td>Vast (over 10^12)<\/td><\/tr><tr><td>Expression<\/td><td>Same set on many cells<\/td><td>Clonal, one per cell<\/td><\/tr><tr><td>Targets<\/td><td>Shared danger molecules<\/td><td>Essentially any antigen<\/td><\/tr><tr><td>Speed<\/td><td>Ready to go<\/td><td>Takes time to expand<\/td><\/tr><tr><td>How it learns<\/td><td>Natural selection<\/td><td>Clonal selection in the individual<\/td><\/tr><\/table>", "objective": "Innate receptors are few, germline encoded and broadly expressed but limited to preset danger molecules, while adaptive receptors are clonal and diverse enough to recognize essentially any antigen, at the cost of a slower start."}]}, {"id": "11", "title": "T Cell Antigen Recognition and the Origin of Receptor Diversity", "week": 2, "subject": "Immunology", "questions": [{"qid": "11-1", "topic": "Class I versus class II molecular composition", "stem": "<p>Two surface molecules are purified from human cells and analyzed. Molecule 1 is a dimer of a membrane-anchored chain whose gene is highly polymorphic in the population, paired with a small extracellular chain whose gene sequence is the same in everyone. Molecule 2 is a dimer of two membrane-anchored chains, and the genes for both chains are polymorphic. Both molecules hold a short peptide in a surface groove.<\/p>", "lead": "Molecule 2 is best identified as which of the following?", "choices": ["A class I human leukocyte antigen molecule", "A class II human leukocyte antigen molecule", "A T cell receptor heterodimer", "A membrane immunoglobulin", "A lipid-presenting molecule related to class I"], "answer": 1, "explanation": "<p>Class I human leukocyte antigen (HLA) molecules are dimers of a polymorphic membrane-bound heavy chain, encoded by HLA-A, HLA-B or HLA-C, paired with beta-2 microglobulin, a small extracellular chain that is invariant. That composition matches molecule 1. Class II molecules are dimers of two membrane-anchored chains, an alpha and a beta chain, and both are polymorphic. The three class II types, HLA-DR, HLA-DP and HLA-DQ, each have an alpha and a beta chain. That matches molecule 2.<\/p><p>Both classes form a cleft that holds a peptide, which is why both hold peptide in this experiment. The distinguishing feature here is not the cleft but the chains: one polymorphic chain plus one invariant chain means class I, two polymorphic membrane chains means class II.<\/p>", "why_wrong": ["Class I pairs a polymorphic heavy chain with the invariant beta-2 microglobulin, which describes molecule 1.", "Correct: two polymorphic membrane-anchored chains forming a peptide-binding cleft describes a class II molecule.", "A T cell receptor reads peptide presented by another molecule and does not itself hold peptide in a cleft.", "Membrane immunoglobulin binds native antigen directly and is a tetramer of heavy and light chains.", "Lipid-presenting molecules related to class I display lipids rather than short peptides and are not built from two polymorphic membrane chains."], "table": "<table><tr><th><\/th><th>Class I<\/th><th>Class II<\/th><\/tr><tr><td>Chains<\/td><td>Heavy chain plus beta-2 microglobulin<\/td><td>Alpha chain plus beta chain<\/td><\/tr><tr><td>Polymorphic<\/td><td>Heavy chain only<\/td><td>Both chains<\/td><\/tr><tr><td>Loci<\/td><td>HLA-A, HLA-B, HLA-C<\/td><td>HLA-DR, HLA-DP, HLA-DQ<\/td><\/tr><\/table>", "objective": "Class I molecules pair a polymorphic heavy chain with invariant beta-2 microglobulin, while class II molecules are made of two polymorphic membrane chains."}, {"qid": "11-2", "topic": "Where major histocompatibility polymorphism lies", "stem": "<p>The amino acid sequences of many human leukocyte antigen (HLA) alleles at one class I locus are compared. Positions that differ between alleles cluster in the residues that line and surround the peptide groove, while the rest of the molecule is nearly identical across alleles. Peptides are then eluted from cells of two people who carry different alleles at that locus, and the two sets of eluted peptides overlap very little, even though both people were infected with the same virus.<\/p>", "lead": "These observations are best explained by which consequence of the polymorphism?", "choices": ["Different alleles bind and display different sets of peptides", "Different alleles pair with different invariant light chains", "Different alleles are expressed on different cell types", "Different alleles use different co-receptors on T cells", "Different alleles use different pathways to acquire peptide"], "answer": 0, "explanation": "<p>Most of the sequence variation between class I alleles sits at the residues around the peptide-binding cleft, which are precisely the residues that decide which peptides fit. Each cleft can accommodate a range of peptides, but the range depends on the shape and chemistry of that particular cleft, so two different alleles select largely different peptides from the same pool of proteins.<\/p><p>That is why eluted peptide sets from two people with different alleles overlap little even after the same infection, and it is the reason the polymorphism exists at the population level: having many alleles lets a population display a wide array of peptides. It also underlies the fact that a T cell receptor is specific for one allele plus one peptide, and the fact that matching for transplantation is difficult.<\/p>", "why_wrong": ["Correct: polymorphic residues around the cleft determine which peptides can be bound, so each allele displays a different peptide set.", "The light chain partner of class I, beta-2 microglobulin, is invariant and the same for all alleles.", "Class I expression is on all nucleated cells regardless of which allele is carried.", "Co-receptor use is set by the class of the molecule, not by which allele within that class.", "All class I molecules at a given locus acquire peptide by the same intracellular route."], "objective": "Major histocompatibility polymorphism concentrates at the peptide-binding cleft, so different alleles display different sets of peptides."}, {"qid": "11-3", "topic": "Class II expression determines which T cells can be activated", "stem": "<p>A fibroblast line is infected with a virus and used as a stimulator in culture. It triggers proliferation of a CD8 T cell clone specific for a viral peptide, but not of a CD4 T cell clone specific for a peptide from the same viral protein. The fibroblasts are then transfected so that they express both chains of a human leukocyte antigen (HLA)-DR molecule, infected again, and retested. Now the CD4 clone proliferates as well. The viral protein is made in equal amounts in both experiments.<\/p>", "lead": "Which statement best explains the original failure to stimulate the CD4 clone?", "choices": ["Fibroblasts do not synthesize beta-2 microglobulin", "Fibroblasts cannot degrade cytosolic proteins into peptides", "Fibroblasts lack the molecules that display peptide to CD4 cells", "Fibroblasts lack the inhibitory ligands that CD4 cells require", "Fibroblasts cannot transport peptides into the endoplasmic reticulum"], "answer": 2, "explanation": "<p>Class I molecules are present on essentially all nucleated cells, so any infected nucleated cell can show viral peptide to CD8 cytotoxic T cells. That is why the untransfected fibroblasts stimulated the CD8 clone. Class II molecules are largely restricted to professional antigen-presenting cells, mainly dendritic cells, macrophages and B cells, plus a few others such as thymic epithelial cells.<\/p><p>CD4 cells use CD4 to engage class II, so a cell with no class II cannot activate them no matter how much antigen it makes. Supplying the class II alpha and beta chains gives the fibroblast the missing display molecule, and the CD4 clone then responds. The pattern of class I and class II expression on a cell therefore decides which T cell subset that cell can activate.<\/p>", "why_wrong": ["Beta-2 microglobulin is part of class I, and the CD8 response showed class I was working normally.", "Degradation of cytosolic protein supplies class I peptides, which were clearly being presented to the CD8 clone.", "Correct: class II is restricted to professional antigen-presenting cells, and without it the fibroblast cannot present to CD4 cells.", "CD4 activation requires a positive peptide and class II signal; inhibitory ligands are not a requirement for it.", "Peptide transport into the endoplasmic reticulum serves class I loading, which was intact here."], "objective": "Class I is expressed on all nucleated cells while class II is restricted to professional antigen-presenting cells, so class II expression determines whether a cell can activate CD4 T cells."}, {"qid": "11-4", "topic": "CD4 and CD8 as co-receptors", "stem": "<p>Blood T cells from a healthy donor are mixed with dendritic cells from the same donor that have been loaded with two peptides from a single viral protein, one that fits a class I molecule and one that fits a class II molecule. Three cultures are set up: no blocking antibody, an antibody that blocks CD4, and an antibody that blocks CD8. Proliferation of each T cell subset is measured.<\/p><table class=\"labs\"><tr><th>Culture<\/th><th>CD4 cell proliferation<\/th><th>CD8 cell proliferation<\/th><\/tr><tr><td>No blocking antibody<\/td><td>Strong<\/td><td>Strong<\/td><\/tr><tr><td>Anti-CD4 added<\/td><td>Absent<\/td><td>Strong<\/td><\/tr><tr><td>Anti-CD8 added<\/td><td>Strong<\/td><td>Absent<\/td><\/tr><\/table>", "lead": "Which function of the blocked molecules best explains these results?", "choices": ["They degrade antigen into peptides for loading", "They stabilize receptor contact with one class of presenting molecule", "They provide the second signal that completes activation", "They carry the activation motifs that start the signaling cascade", "They transport peptides from the cytosol for loading"], "answer": 1, "explanation": "<p>A T cell receptor contacts both the peptide and the presenting molecule, but that interaction is weak on its own. CD4 and CD8 act as co-receptors that stabilize it, and each one engages only one class: CD4 binds class II and CD8 binds class I. Blocking a co-receptor therefore removes the help only for the subset that uses it.<\/p><p>That selectivity explains the table. Each dendritic cell displayed both peptides, so antigen availability is not the variable. Blocking CD4 silenced only the class II-restricted CD4 response, and blocking CD8 silenced only the class I-restricted CD8 response. The same division is why expression of CD4 or CD8 identifies the two main T cell subsets and predicts which class of molecule a cell must display to activate them.<\/p>", "why_wrong": ["Antigen was supplied as preformed peptide, and processing is not a function of these surface molecules.", "Correct: CD4 and CD8 are co-receptors that stabilize contact with class II and class I molecules respectively.", "The second signal comes from costimulatory receptors such as CD28, which binds ligands on the presenting cell rather than a class of presenting molecule.", "Activation motifs lie in the CD3 and zeta chains associated with the receptor.", "Peptide transport from the cytosol is handled by an intracellular transporter in the presenting cell."], "objective": "CD4 stabilizes T cell receptor contact with class II molecules and CD8 with class I, so each co-receptor restricts its subset to one class of presenting molecule."}, {"qid": "11-5", "topic": "Peptide transport into the endoplasmic reticulum", "stem": "<p>A cell line carries a defect in a single transporter protein. The cells make normal amounts of class I heavy chain and beta-2 microglobulin messenger RNA, and their proteasomes degrade cytosolic proteins normally. Flow cytometry shows very low surface class I, and the little that reaches the surface is unstable. Adding synthetic peptide that fits the class I cleft directly to the culture medium restores stable surface class I. Surface class II and presentation of phagocytosed protein to CD4 cells are both normal.<\/p>", "lead": "The defective protein most likely performs which function?", "choices": ["Tags cytosolic proteins for degradation", "Moves peptides from the cytosol into the endoplasmic reticulum", "Occupies the class II cleft until it reaches an endosome", "Fuses lysosomes with peptide-loading vesicles", "Carries assembled class I molecules to the cell surface"], "answer": 1, "explanation": "<p>Endogenous proteins are tagged and degraded by the proteasome in the cytosol, and the resulting peptides are then actively transported into the endoplasmic reticulum, where they are loaded into newly made class I molecules. A class I molecule that never receives a peptide is unstable and largely fails to reach or remain on the surface.<\/p><p>Every step in this cell is intact except one. Transcription is normal, proteasomal degradation is normal, and the class II pathway, which handles exogenous protein in endosomes, is untouched. Adding peptide from outside bypasses the block, because peptide can then be loaded onto class I at the cell surface. A defect that starves class I of cytosolic peptides while sparing everything else points to the peptide transporter.<\/p>", "why_wrong": ["Tagging proteins for proteasomal degradation is upstream, and proteasomal degradation was shown to be normal.", "Correct: without transport of peptides into the endoplasmic reticulum, class I cannot be loaded and is unstable at the surface.", "The placeholder peptide that blocks the class II cleft belongs to the class II pathway, which is normal here.", "Lysosomal fusion with loading vesicles serves class II presentation of exogenous protein, which is normal here.", "A transport defect to the surface would not be corrected by adding peptide to the medium."], "objective": "Class I molecules are loaded with proteasome-derived peptides that must be actively transported into the endoplasmic reticulum, and loss of that transport leaves class I unstable and low at the surface."}, {"qid": "11-6", "topic": "Separating the two presentation pathways", "stem": "<p>Macrophages are treated with a drug that raises the pH inside endosomes and lysosomes and blocks the proteases that work there. The cells are then given two antigens: a soluble protein taken up from the medium, and the same protein expressed from an introduced gene so that it is made in the cytosol. Presentation to a CD4 clone and to a CD8 clone specific for peptides of that protein is measured, with untreated macrophages as controls.<\/p>", "lead": "Compared with untreated cells, the treated macrophages are most likely to show which pattern?", "choices": ["Loss of both the CD4 and the CD8 response", "Loss of the CD4 response to the protein taken up from the medium", "Loss of the CD8 response to the protein made in the cytosol", "Loss of the CD4 response only to the protein made in the cytosol", "No change in either response"], "answer": 1, "explanation": "<p>Exogenous proteins, those phagocytosed or endocytosed from outside, are cleaved into peptides inside acidified phagolysosomes and endolysosomes. Those vesicles then meet class II molecules, whose cleft is occupied by a placeholder peptide from the invariant chain until the peptide is exchanged in. Blocking acidification and endosomal proteases stops that route, so class II presentation of material taken up from outside fails.<\/p><p>The cytosolic copy of the same protein is handled differently: it is degraded by the proteasome and its peptides are transported into the endoplasmic reticulum for loading onto class I, which CD8 cells read. Neither of those steps depends on endosomal pH, so the CD8 response persists. The experiment separates the two pathways by the compartment in which the antigen is handled rather than by the antigen itself.<\/p>", "why_wrong": ["The class I pathway operates in the cytosol and endoplasmic reticulum and is not blocked by this treatment.", "Correct: endosomal acidification and proteases are required to generate peptides from exogenous protein for class II loading.", "Peptides for class I come from proteasomal degradation of cytosolic protein, which this drug does not affect.", "The cytosolic copy is routed to class I, so a CD4 response to it is not the expected finding.", "The exogenous route depends on acidified proteolytic compartments, so at least one response must change."], "table": "<table><tr><th><\/th><th>Class I pathway<\/th><th>Class II pathway<\/th><\/tr><tr><td>Antigen source<\/td><td>Cytosolic (endogenous)<\/td><td>Taken up from outside (exogenous)<\/td><\/tr><tr><td>Degradation<\/td><td>Proteasome<\/td><td>Endosomal and lysosomal proteases<\/td><\/tr><tr><td>Loading site<\/td><td>Endoplasmic reticulum<\/td><td>Vesicles after invariant chain peptide exchange<\/td><\/tr><tr><td>Read by<\/td><td>CD8 cells<\/td><td>CD4 cells<\/td><\/tr><\/table>", "objective": "Exogenous antigen is processed in acidified endosomes for class II presentation to CD4 cells, while cytosolic antigen is processed by the proteasome for class I presentation to CD8 cells."}, {"qid": "11-7", "topic": "Human leukocyte antigen association with disease", "stem": "<p>A study genotypes 2,000 people with an inflammatory spine disease and 2,000 healthy controls from the same population. One class I allele is carried by 90 percent of the cases and 8 percent of the controls. Carriers of that allele have roughly 80 times the risk of the disease compared with non-carriers. Most carriers of the allele in the population never develop the disease, and the allele is found in every population studied, though at different frequencies.<\/p>", "lead": "Which statement best interprets this finding?", "choices": ["The allele encodes an antibody that attacks spinal tissue", "The allele prevents expression of the other class I loci", "The allele is required for the disease and sufficient to cause it", "The allele strongly raises risk but is not sufficient on its own", "The allele frequency differences prove disease risk follows continent of origin"], "answer": 3, "explanation": "<p>Some human leukocyte antigen (HLA) alleles show strong statistical association with autoimmune and hypersensitivity diseases. The association can be large, for example roughly an 80-fold increase in risk for one spondyloarthropathy in carriers of a particular class I allele, or about a 25-fold increase in type 1 diabetes for certain class II haplotypes. A large relative risk still describes a probability, not a determinism.<\/p><p>Here the allele is present in 8 percent of healthy controls and most carriers stay well, so carrying it is not sufficient for disease. A fraction of cases lack it, so it is not strictly required either. HLA alleles are mostly distributed worldwide with differing frequencies, which affects how common an association appears in a population and how easy it is to find matched organs, but it does not make risk a property of ancestry itself.<\/p>", "why_wrong": ["HLA genes encode peptide-presenting surface molecules, not antibodies.", "Everyone expresses all three class I types, and one allele does not silence the others.", "Most carriers never develop the disease, so the allele is not sufficient, and some cases do not carry it.", "Correct: a large relative risk with many healthy carriers means the allele raises susceptibility without being sufficient.", "Allele frequencies differ between populations, but most alleles are globally distributed and risk is not determined by continent of origin."], "objective": "Certain human leukocyte antigen alleles confer large increases in relative risk for immune-mediated diseases while remaining neither necessary nor sufficient for disease."}, {"qid": "11-8", "topic": "Haplotypes and tissue matching", "stem": "<p>A transplant program types a patient and relatives at the class I and class II loci. The patient and one sibling are identical at every locus tested, a second sibling shares exactly half the typed alleles, and each parent shares half. Unrelated volunteers from a large registry rarely match, and the chance of finding a match differs between registry subgroups. Typing a region of the same chromosome stretch that contains complement and cytokine genes shows no effect on matching decisions.<\/p>", "lead": "Which statement best explains why the siblings share alleles in these all-or-half blocks?", "choices": ["The class I and class II genes are clustered and inherited together as a haplotype", "Each parent transmits only class I alleles, and class II alleles arise later", "The alleles rearrange somatically in each person before transplantation", "The alleles are randomly assorted because each locus sits on a different chromosome", "Shared alleles reflect the number of peptides each person can present"], "answer": 0, "explanation": "<p>The class I loci (HLA-A, HLA-B and HLA-C) and the class II loci (the genes for the DR, DP and DQ alpha and beta chains) lie close together in one region of chromosome 6. Because they are tightly linked, a whole set of alleles is usually transmitted together as a unit, and recurring combinations in a population are called haplotypes. A child inherits one haplotype from each parent, so a parent shares half, and two siblings have a one in four chance of matching on both.<\/p><p>Unrelated people rarely match because many alleles exist at many linked loci, giving an enormous number of combinations, and haplotype frequencies differ between population subgroups. The neighboring region containing complement and cytokine genes lies within the same stretch of chromosome but does not encode HLA molecules, which is why it does not enter matching decisions.<\/p>", "why_wrong": ["Correct: linked class I and class II genes are transmitted as a haplotype, which produces all-or-half sharing among siblings.", "Both classes are inherited from the parents; neither appears later in life.", "Somatic rearrangement generates antigen receptor diversity in lymphocytes, not the inherited presenting molecules.", "These loci are clustered in one chromosomal region rather than scattered, which is why they are not assorted independently.", "The number of presentable peptides is a consequence of which alleles are carried, not the reason sharing comes in blocks."], "objective": "The clustered class I and class II loci are inherited together as haplotypes, which explains familial sharing patterns and the difficulty of matching unrelated donors."}, {"qid": "11-9", "topic": "Combinatorial diversity from gene segments", "stem": "<p>A laboratory counts the germline gene segments at the human antigen receptor loci. The heavy chain locus has many variable segments, several diversity segments and several joining segments; each light chain locus has variable and joining segments but no diversity segments. Multiplying the available segment combinations for heavy chains by those for light chains gives roughly two million different pairings. Sequencing receptors from circulating lymphocytes shows far greater diversity than two million, and the extra variation maps to the short stretch where the segments meet.<\/p>", "lead": "The diversity beyond the two million calculated pairings is best explained by which process?", "choices": ["Independent assortment of the loci during meiosis", "Alternative splicing of the constant region exons", "Point mutation of the variable segments in the germline", "Duplication of variable segments between individuals", "Imprecise repair at the joints, with nucleotides lost and added"], "answer": 4, "explanation": "<p>Variable regions are assembled by cutting and pasting germline segments, so simply counting which variable, diversity and joining segments can be combined gives combinatorial diversity, on the order of a few million heavy and light chain pairings. The observed repertoire is far larger than that.<\/p><p>The extra diversity comes from how the joints are made. After the recombinase cuts the DNA, repair is imprecise: nucleotides are deleted from the ends, and additional nucleotides are added, including random nucleotides inserted by terminal deoxynucleotidyl transferase in developing lymphocytes. These joints encode the third hypervariable loop of the variable region, which is the most diverse part of the binding site. This junctional diversity multiplies the repertoire by orders of magnitude, which is why the extra variation maps exactly to where the segments meet.<\/p>", "why_wrong": ["Meiotic assortment shuffles inherited alleles and cannot create sequences absent from the genome.", "Alternative splicing joins the assembled variable region to a constant region and does not change the binding site sequence.", "Germline point mutation operates over evolutionary time and would not concentrate at the segment joints.", "Segment duplication differences between people cannot explain diversity within one person's repertoire.", "Correct: nucleotide loss and random addition at the joints generate junctional diversity in the third hypervariable loop."], "objective": "Combinatorial pairing of variable, diversity and joining segments gives a few million receptors, and imprecise junctional repair with nucleotide loss and random addition expands the repertoire far beyond that."}, {"qid": "11-10", "topic": "Productive versus non-productive rearrangement", "stem": "<p>Developing lymphocytes from the bone marrow of a healthy mouse are sorted, and the rearranged heavy chain joints are sequenced from each cell. In about two thirds of the sequences, the nucleotides added and deleted at the joint shift the reading frame or create a termination codon, so no complete chain can be translated. Cells carrying only such sequences are not found among mature lymphocytes in the spleen. Mature cells always carry at least one joint that reads through in frame.<\/p>", "lead": "Which statement best explains why so many sequences are unusable yet the animal has a normal lymphocyte count?", "choices": ["Unusable joints are repaired to the germline sequence and tried again", "Unusable joints are spliced out of the messenger RNA before translation", "The process is wasteful, and only cells that make a functional chain can continue to mature", "The recombinase avoids reading frame errors once a cell has committed to a lineage", "Random nucleotide addition occurs only after a functional chain is confirmed"], "answer": 2, "explanation": "<p>The same imprecision that creates junctional diversity also makes the process wasteful. Because nucleotides are deleted and randomly added at the joints, each rearrangement has roughly a one in three chance of being in frame and free of termination codons. The rest are non-productive and cannot yield a chain.<\/p><p>Development handles this by checking the product rather than the process. A cell that fails to make a functional antigen receptor chain cannot continue to mature, which is why no mature splenic lymphocyte carries only non-productive joints. Cells have more than one chance, since the loci can be rearranged on both chromosomes and the light chain loci offer further attempts, so a normal repertoire is still produced despite a high failure rate per attempt.<\/p>", "why_wrong": ["The intervening DNA is deleted and the joint is not restored to germline sequence, so a joint cannot simply be undone.", "Splicing removes introns between the assembled variable region and the constant region; it cannot fix a shifted reading frame inside the joint.", "Correct: most rearrangements are non-productive, and cells that cannot make a functional chain do not mature further.", "The recombinase cuts at fixed signal sequences and has no way to anticipate the reading frame of the joint.", "Random nucleotide addition happens during the joining itself, which is why the outcome cannot be known in advance."], "objective": "Junctional remodeling makes most rearrangements non-productive, and developing lymphocytes that cannot express a functional receptor chain fail to mature."}, {"qid": "11-11", "topic": "The recombinase and its restriction to developing lymphocytes", "stem": "<p>A fibroblast line is given a complete, unrearranged antigen receptor heavy chain locus, including the conserved signal sequences that flank each gene segment. Over weeks in culture no rearrangement of the locus occurs. When two additional genes whose products are normally found only in developing lymphocytes are introduced into the same fibroblasts, the locus rearranges, and the joints show nucleotide loss but little random nucleotide addition.<\/p>", "lead": "The two introduced genes most likely encode which of the following?", "choices": ["Enzymes that add random nucleotides to broken ends", "The proteins that repair double-strand breaks after cutting", "The transcription factors that activate the constant region genes", "Molecules that display peptide on the cell surface", "The recombinase complex that cuts at the flanking signal sequences"], "answer": 4, "explanation": "<p>The segments at the antigen receptor loci are flanked by conserved signal sequences, and cutting at those sequences is done by a recombinase made of two proteins, RAG1 and RAG2, which are expressed only in developing B and T cells. Everything downstream, the repair of the resulting double-strand breaks and the ligation of the ends, is carried out by general DNA repair enzymes that every cell already has.<\/p><p>That division explains the experiment. A fibroblast has the repair machinery but not the recombinase, so the locus sits unrearranged. Supplying the two lymphocyte-restricted proteins supplies the missing cutting activity, and the cell's own repair enzymes then finish the joint. Random nucleotide addition stays low because terminal deoxynucleotidyl transferase, which inserts those nucleotides, is also restricted to lymphocyte precursors and was not supplied. Loss of the recombinase in a person blocks both B and T cell receptor assembly, which is why such defects cause severe combined immunodeficiency with absent B and T cells and preserved natural killer cells.<\/p>", "why_wrong": ["The enzyme that adds random nucleotides was clearly absent, since the joints showed little such addition.", "Double-strand break repair proteins are present in all cells, including these fibroblasts.", "Constant region transcription does not initiate the DNA cutting that starts rearrangement.", "Peptide-displaying surface molecules have no role in assembling receptor genes.", "Correct: the recombinase that recognizes and cuts the flanking signal sequences is restricted to developing lymphocytes and is the missing activity."], "objective": "The RAG1 and RAG2 recombinase cuts at conserved signal sequences and is expressed only in developing lymphocytes, while general DNA repair enzymes complete the joint."}, {"qid": "11-12", "topic": "Pharmacologic interruption of T cell receptor signaling", "stem": "<p>A patient receives a partially mismatched kidney from a deceased donor and is started on a drug to prevent rejection. In culture, T cells exposed to the drug bind peptide and presenting molecules normally and show normal early tyrosine phosphorylation and a normal rise in intracellular calcium after receptor engagement. However, the calcium-dependent dephosphorylation step that allows a transcription factor to enter the nucleus does not occur, and interleukin 2 messenger RNA is not induced. Phagocyte function and B cell receptor assembly are unaffected.<\/p>", "lead": "The drug most likely inhibits which molecule?", "choices": ["The recombinase that cuts receptor gene segments", "The enzyme that generates reactive oxygen in phagocytes", "A tyrosine kinase that acts immediately downstream of the receptor", "The calcium-activated phosphatase acting on a transcription factor", "The transporter that loads peptides onto class I molecules"], "answer": 3, "explanation": "<p>Antigen receptor engagement starts with phosphorylation of the activation motifs on the associated signaling chains by early tyrosine kinases, which leads to phospholipid-derived second messengers and a rise in intracellular calcium. Calcium then works through calmodulin to activate calcineurin, a phosphatase that dephosphorylates the transcription factor of the nuclear factor of activated T cells family and allows it to enter the nucleus and drive genes such as interleukin 2.<\/p><p>The findings place the block precisely. Antigen recognition, early phosphorylation and the calcium rise are all intact, so everything upstream of calcium is working. What fails is the calcium-dependent dephosphorylation that releases the transcription factor, which identifies the phosphatase as the target. Drugs that act at this step are standard for preventing transplant rejection because they shut down the transcriptional program of T cell activation without touching phagocyte function or receptor gene assembly.<\/p>", "why_wrong": ["Blocking the recombinase would prevent receptor assembly, but these T cells have functional receptors and B cell assembly is normal.", "The phagocyte oxidase has no role in T cell receptor signaling, and phagocyte function was normal.", "An early tyrosine kinase block would abolish the phosphorylation and calcium rise, both of which were normal.", "Correct: the calcium-activated phosphatase that dephosphorylates the transcription factor is the step shown to fail.", "Blocking peptide loading would impair presentation by the donor and host cells, not the measured signaling step inside the T cell."], "objective": "T cell receptor signaling runs from early tyrosine kinases through a calcium rise to calcineurin-dependent activation of a transcription factor, and blocking that phosphatase prevents interleukin 2 induction."}]}, {"id": "12", "title": "Antibody Effector Functions and the Complement System", "week": 2, "subject": "Immunology", "questions": [{"qid": "12-1", "topic": "Placental transfer of immunoglobulin G", "stem": "<p>A healthy infant born at term is followed with serial serum immunoglobulin measurements. At birth, immunoglobulin G (IgG) is in the adult range and includes antibody against several organisms the mother was immunized against, while IgM and IgA are very low. Over the next 3 to 6 months the IgG level falls steadily and the maternal-type antibodies disappear, then IgG rises again as the infant's own production increases. The infant is well throughout.<\/p>", "lead": "The high IgG level at birth is best explained by which mechanism?", "choices": ["Transfer across the placenta by a receptor for the IgG constant region", "Transfer across the placenta by a receptor that binds the J chain", "Synthesis of IgG by the fetus beginning in the second trimester", "Diffusion of maternal serum proteins across the placenta by size", "Transfer of maternal plasma cells into the fetal circulation"], "answer": 0, "explanation": "<p>Of the immunoglobulin classes, only IgG crosses the placenta, and it does so actively. A receptor for the IgG constant region, the neonatal Fc receptor, carries maternal IgG from the maternal circulation into the fetus. The same receptor recycles IgG in adults and is why IgG has a long half-life compared with other classes. Nothing comparable moves IgM or IgA across the placenta, which is why those classes are very low at birth.<\/p><p>Because the transferred antibody is a protein with a limited half-life, this is a form of passive immunity and it fades. Maternal IgG falls over the first several months, which produces the familiar dip before the infant's own production takes over. A different receptor, the polymeric immunoglobulin receptor, transports dimeric IgA and polymeric IgM across mucosal surfaces, including into breast milk, but that route is not what loads the fetal circulation.<\/p>", "why_wrong": ["Correct: the neonatal Fc receptor binds the IgG constant region and actively transports maternal IgG across the placenta.", "The receptor that binds the J chain transports polymeric IgA and IgM across mucosa, not IgG across the placenta.", "Fetal production is minimal, and the antibodies present match the mother's immunization history.", "Transfer is receptor-mediated and class-specific, not passive diffusion by molecular size, since IgM is larger but IgA is not excluded by size alone.", "Maternal plasma cells are not transferred; the antibody itself crosses."], "table": "<table><tr><th>Transport receptor<\/th><th>Cargo<\/th><th>Route<\/th><\/tr><tr><td>Neonatal Fc receptor<\/td><td>IgG<\/td><td>Placenta to fetus; recycling in adults<\/td><\/tr><tr><td>Polymeric immunoglobulin receptor<\/td><td>Dimeric IgA, polymeric IgM<\/td><td>Across mucosal epithelium into secretions<\/td><\/tr><\/table>", "objective": "IgG alone crosses the placenta, carried by the neonatal Fc receptor, giving the newborn temporary passive immunity that wanes over the first months."}, {"qid": "12-2", "topic": "Passive immunization", "stem": "<p>Group 1 animals receive a small dose of an inactivated bacterial toxin and are challenged with a lethal dose 6 weeks later; they survive, and they also survive a second challenge 6 months after that. Serum is taken from group 1 and injected into group 2, which has never seen the toxin. Group 2 survives a lethal challenge given 1 day after the serum transfer, but dies when challenged again 8 weeks later. Group 3 receives serum from unimmunized animals and dies at the first challenge.<\/p>", "lead": "Which statement best explains the difference between group 1 and group 2?", "choices": ["Group 2 received antibody but no cells capable of making more of it", "Group 2 received antibody of an isotype that cannot neutralize toxin", "Group 2 mounted its own response, which took longer than 8 weeks", "Group 1 was protected by innate rather than adaptive mechanisms", "Group 1 cleared the toxin before any antibody was produced"], "answer": 0, "explanation": "<p>Group 1 was actively immunized: it recognized the antigen, expanded specific clones, and kept memory cells and antibody-producing cells that can be recalled, so protection lasts. Group 2 received only the product, preformed antibody in serum, which is passive immunization. It protects immediately, because antibody can bind and neutralize toxin without any delay, but it confers nothing that can replenish itself.<\/p><p>Antibody has a limited half-life, so transferred protection decays over weeks, which is why group 2 survived the early challenge and died at the later one. The same reasoning applies to the clinical uses of preformed antibody, such as antivenoms, antitoxins, post-exposure prophylaxis, intravenous immunoglobulin replacement and therapeutic monoclonal antibodies: they work at once and must be repeated.<\/p>", "why_wrong": ["Correct: transferred antibody protects immediately but is not replenished, so protection fades as the antibody is catabolized.", "The transferred serum did neutralize toxin, as shown by survival at the first challenge.", "An animal that mounted its own response would be protected later, not earlier.", "Group 1 survived a lethal challenge long after immunization, which reflects adaptive memory.", "Group 1 was protected by the response it generated, and unimmunized serum gave no protection at all."], "objective": "Passive immunization with preformed antibody protects immediately but is short-lived, while active immunization generates memory and sustained protection."}, {"qid": "12-3", "topic": "Neutralization requires only the antigen-binding fragments", "stem": "<p>A commercial antivenom is manufactured by immunizing animals, purifying the antibody, digesting it with a protease, and keeping only the fragments that retain antigen binding while discarding the constant region portion. The product binds the venom enzyme and prevents it from reaching its target tissue, and patients treated with it recover. A separate therapeutic antibody that binds and inactivates a soluble inflammatory cytokine is also made as a binding fragment only.<\/p>", "lead": "Which statement best explains why discarding the constant region portion does not reduce efficacy for these products?", "choices": ["Binding fragments are the only part that can activate complement", "The therapeutic effect requires only occupancy of the target molecule", "The constant region portion would be needed to cross the placenta", "Binding fragments engage receptors on phagocytes more efficiently", "The constant region portion carries the hypervariable loops"], "answer": 1, "explanation": "<p>Antibodies act in several ways. Some functions are mediated entirely by the constant region, such as complement activation, binding to receptors on phagocytes and natural killer cells, and transport across the placenta or mucosa. Neutralization is different: it works simply by binding the target so that it cannot interact with what it normally interacts with, for example blocking a toxin's active site or preventing a soluble mediator from reaching its receptor.<\/p><p>Because neutralization needs only occupancy, a fragment that retains the antigen-binding site is sufficient, and removing the constant region can even be an advantage, since it lowers the chance of unwanted inflammatory or immune complex effects from animal-derived constant regions. The hypervariable loops that create specificity sit in the variable regions, which are kept in the fragment.<\/p>", "why_wrong": ["Complement activation is a function of the constant region, which these products lack.", "Correct: neutralization requires only that the antibody bind and block the target, which the antigen-binding fragments do.", "Placental transfer is irrelevant to the therapeutic action of an antivenom given to a patient.", "Receptors on phagocytes bind the constant region, so removing it reduces rather than improves that interaction.", "The hypervariable loops lie in the variable regions, which are part of the binding fragments."], "objective": "Neutralization depends only on antigen binding, so antigen-binding fragments without the constant region are sufficient for antitoxins, antivenoms and blocking therapeutic antibodies."}, {"qid": "12-4", "topic": "Antibody-dependent cell-mediated cytotoxicity", "stem": "<p>Cultured cells expressing a viral surface protein are mixed with natural killer cells from a healthy donor in four conditions, and target cell death is measured after 4 hours.<\/p><table class=\"labs\"><tr><th>Condition<\/th><th>Target cell killing<\/th><\/tr><tr><td>Natural killer cells alone<\/td><td>Low<\/td><\/tr><tr><td>Natural killer cells plus antiviral IgG<\/td><td>High<\/td><\/tr><tr><td>Natural killer cells plus antiviral IgG plus antibody blocking CD16<\/td><td>Low<\/td><\/tr><tr><td>Natural killer cells plus antigen-binding fragments of the same antiviral antibody<\/td><td>Low<\/td><\/tr><\/table>", "lead": "Which mechanism best explains the killing seen in the second condition?", "choices": ["Complement pores formed on the target membrane after antibody binding", "Antibody blocking the viral protein so the target cell undergoes apoptosis", "Antibody bound to the target engaging an activating receptor for its constant region", "Antibody cross-linking receptors on the natural killer cell independently of the target", "Antibody opsonizing the target for ingestion by the natural killer cell"], "answer": 2, "explanation": "<p>Natural killer cells carry an activating receptor, CD16 (also called Fc gamma receptor III), that binds the constant region of IgG. When IgG coats a target cell, for example a virus-infected cell displaying viral protein on its surface, CD16 engagement activates the natural killer cell to kill that target. This is antibody-dependent cell-mediated cytotoxicity, and it links a specific antibody response to a cytotoxic effector cell.<\/p><p>The controls identify every requirement. Killing needs antibody, so it is not spontaneous natural killer activity. It is abolished by blocking CD16, so the constant region receptor is the trigger. It fails with antigen-binding fragments, which coat the target but have no constant region to engage, which confirms the same point from the antibody side. No complement was present in this culture, so pore formation cannot explain the result. Other cells do something similar: eosinophils use a low-affinity IgE receptor to attack IgE-coated parasites and release cytotoxic granule contents.<\/p>", "why_wrong": ["No complement source was present in the culture, and blocking a cellular receptor abolished killing.", "Antigen-binding fragments also block the viral protein, yet produced no killing.", "Correct: IgG bound to the target engages CD16 on the natural killer cell and triggers killing.", "Killing required antibody bound to the target, so free cross-linking of natural killer receptors does not explain it.", "Natural killer cells kill their targets rather than phagocytosing them."], "objective": "IgG coating a target cell engages CD16 on natural killer cells and triggers antibody-dependent cell-mediated cytotoxicity, which requires the antibody constant region."}, {"qid": "12-5", "topic": "Classical pathway activation requires surface-bound antibody", "stem": "<p>Normal human serum is used as a source of complement in three tubes. Tube 1 contains bacteria coated with specific IgG antibody. Tube 2 contains the same amount of the same IgG but no bacteria, with only free soluble antigen present in small amounts. Tube 3 contains the bacteria with no antibody added. Deposition of C4b and C3b on the bacteria, and consumption of C4 from the serum, are measured.<\/p><table class=\"labs\"><tr><th>Tube<\/th><th>C4 consumption<\/th><th>C3b on bacteria<\/th><\/tr><tr><td>1 (antibody-coated bacteria)<\/td><td>Marked<\/td><td>Heavy<\/td><\/tr><tr><td>2 (antibody and small soluble antigen)<\/td><td>Minimal<\/td><td>Not applicable<\/td><\/tr><tr><td>3 (bacteria alone)<\/td><td>Minimal<\/td><td>Light<\/td><\/tr><\/table>", "lead": "Which feature of the classical pathway best explains the result in tube 1?", "choices": ["Spontaneous hydrolysis of C3 is accelerated by antibody in solution", "Antibody bound to a surface allows the initiating complex to be activated", "Antibody cleaves C4 and C2 directly through its constant region", "Antibody binds mannose residues and activates associated proteases", "Antibody stabilizes the convertase formed by factor B and properdin"], "answer": 1, "explanation": "<p>The classical pathway begins when C1q recognizes the constant regions of IgM or IgG that are bound to antigen on a surface, or present in large immune complexes. Clustered antibody changes the conformation of C1q and activates the associated C1r and C1s proteases. Those proteases cleave C4 and C2 to build the C3 convertase C4bC2a, which cleaves C3 into C3b, which deposits on the surface as an opsonin, and C3a, which is released as an inflammatory signal. C3b then joins the convertase to form the C5 convertase.<\/p><p>Antibody that is not gathered on a surface does not cluster C1q efficiently, which is why tube 2 shows almost no C4 consumption even though the same amount of IgG is present. Tube 3 shows the low-level deposition expected from the alternative pathway acting on a microbial surface without antibody. The requirement for surface-bound antibody is what keeps this powerful cascade aimed at targets rather than at the fluid phase. Certain acute phase proteins, such as C-reactive protein, can activate C1 in a similar surface-bound manner.<\/p>", "why_wrong": ["Spontaneous C3 hydrolysis initiates the alternative pathway and does not consume C4.", "Correct: C1q binds clustered antibody on a surface, which activates the C1 protease complex and starts the cascade.", "Antibody has no protease activity; the C1 complex cleaves C4 and C2.", "Binding of mannose and activation of associated proteases describes the lectin pathway initiator, not antibody.", "Factor B and properdin belong to the alternative pathway, which does not need antibody."], "objective": "The classical pathway is initiated by C1q binding to IgM or IgG that is bound to antigen on a surface or in large immune complexes, which activates C1r and C1s to build the C4bC2a convertase."}, {"qid": "12-6", "topic": "Distinguishing the activation pathways by what is consumed", "stem": "<p>Serum complement studies are done on two patients during active disease, and both show low C3. Patient 1 has a markedly low C4 as well. Patient 2 has a normal C4 but very low levels of factor B. Both patients have normal total levels of the terminal components. Neither patient has a genetic deficiency of a complement protein; in both the pattern reflects ongoing consumption.<\/p>", "lead": "Which pathway is most likely being consumed in patient 2?", "choices": ["Classical pathway, initiated by antibody bound to antigen", "Lectin pathway, initiated by a plasma lectin bound to carbohydrate", "Alternative pathway, amplified from spontaneously hydrolyzed C3", "Terminal pathway, from C5 cleavage through the lytic complex", "Classical and lectin pathways together, through a shared convertase"], "answer": 2, "explanation": "<p>The three activation pathways converge on C3, but they build their C3 convertases from different proteins. The classical and lectin pathways both assemble C4bC2a, so both consume C4 and C2 along with C3. The alternative pathway does not use C4 or C2 at all: C3b generated by low-level spontaneous hydrolysis of C3 binds factor B, factor D cleaves the complex to C3bBb, and properdin stabilizes it. That convertase cleaves more C3, which amplifies the response.<\/p><p>Patient 1, with low C3 and low C4, is consuming a C4-dependent pathway, the classical or lectin route. Patient 2 consumes C3 and factor B while sparing C4, which can only be the alternative pathway. Reading which upstream proteins are low is therefore a practical way to tell which pathway is active.<\/p>", "why_wrong": ["Classical activation consumes C4 and C2, which are normal in patient 2.", "The lectin pathway uses the same C4-dependent convertase, so C4 would also fall.", "Correct: the alternative pathway consumes C3 and factor B without using C4 or C2.", "Terminal component levels were normal, and the terminal pathway does not consume factor B.", "Both of those pathways use the C4-dependent convertase, which is not the pattern here."], "table": "<table><tr><th>Pathway<\/th><th>Initiator<\/th><th>C3 convertase<\/th><th>Consumes C4<\/th><\/tr><tr><td>Classical<\/td><td>C1q on bound IgM or IgG<\/td><td>C4bC2a<\/td><td>Yes<\/td><\/tr><tr><td>Lectin<\/td><td>Mannose-binding lectin and MASP proteases<\/td><td>C4bC2a<\/td><td>Yes<\/td><\/tr><tr><td>Alternative<\/td><td>Spontaneous C3 hydrolysis on a surface<\/td><td>C3bBb (stabilized by properdin)<\/td><td>No<\/td><\/tr><\/table>", "objective": "Classical and lectin activation build the C4bC2a convertase and consume C4, while alternative pathway activation consumes C3 and factor B without C4."}, {"qid": "12-7", "topic": "Lectin pathway initiation", "stem": "<p>Serum from a healthy donor is depleted of all immunoglobulin, then incubated with yeast particles whose surface is rich in mannose. C4 is consumed, C3b is deposited on the particles, and the lytic complex assembles. The experiment is repeated with serum from a person who lacks a plasma carbohydrate-binding protein: C4 consumption on the yeast is now minimal, although deposition still occurs slowly on the same particles and classical pathway activity measured with antibody-coated targets is normal.<\/p>", "lead": "The missing plasma protein most likely acts by which mechanism?", "choices": ["It binds the constant region of clustered antibody and activates C1r and C1s", "It binds microbial carbohydrate and activates associated proteases that cleave C4 and C2", "It stabilizes the convertase assembled from C3b and factor B", "It transports C3b to the microbial surface from the fluid phase", "It inserts into the microbial membrane to allow C9 polymerization"], "answer": 1, "explanation": "<p>The lectin pathway reaches the same place as the classical pathway by a different door. A plasma lectin, mannose-binding lectin, recognizes carbohydrate residues on microbial surfaces, and that binding activates its associated serine proteases, MASP-1 and MASP-2. Those proteases cleave C4 and C2 to build the same C3 convertase, C4bC2a, which generates C3b for opsonization and C3a for inflammation, and then the C5 convertase.<\/p><p>Because this route needs no antibody, it still worked in immunoglobulin-depleted serum. Removing the lectin removed the ability to start it on mannose-rich surfaces, while classical activity with antibody-coated targets remained intact because that pathway uses C1q instead. The slow residual deposition reflects the alternative pathway, which can act on a microbial surface without either initiator.<\/p>", "why_wrong": ["Binding clustered antibody and activating C1r and C1s is the role of C1q in the classical pathway, which was normal here.", "Correct: mannose-binding lectin binds microbial carbohydrate and activates MASP proteases that cleave C4 and C2.", "Stabilizing the C3bBb convertase is the role of properdin in the alternative pathway.", "C3b is generated by convertase cleavage on the surface rather than transported there by a carrier.", "Membrane insertion allowing C9 polymerization describes the terminal components, not an initiator, and the lytic complex formed normally."], "objective": "The lectin pathway is initiated when mannose-binding lectin binds microbial carbohydrate and activates MASP proteases, which build the same C4bC2a convertase as the classical pathway without requiring antibody."}, {"qid": "12-8", "topic": "Anaphylatoxins", "stem": "<p>Two small soluble fragments released during complement activation are purified and injected into the skin of an animal. Within minutes each produces local redness, swelling and leakage of plasma protein from vessels, and biopsy shows degranulated mast cells and an influx of neutrophils. Injecting the larger surface-binding fragments of the same parent proteins into skin produces none of these changes, but those fragments coat particles and make them easier for phagocytes to ingest.<\/p>", "lead": "The two soluble fragments are best described as which of the following?", "choices": ["Opsonins that are recognized by complement receptors on phagocytes", "Subunits that assemble into a membrane pore", "Proteases that cleave C4 and C2 to form a convertase", "Mediators of inflammation that recruit and activate leukocytes", "Regulators that accelerate decay of the convertases"], "answer": 3, "explanation": "<p>Cleavage of C3 and C5 yields two kinds of product. The larger fragments, C3b and to a lesser extent C4b, stay on the surface and act as opsonins recognized by complement receptors on phagocytes, and C3b also builds the C5 convertase. The small fragments C3a and C5a, with a minor contribution from C4a, diffuse away and act as inflammatory mediators, which is why they are called anaphylatoxins.<\/p><p>Their actions explain the skin findings: chemotaxis and activation of leukocytes, mast cell degranulation, increased vascular permeability and smooth muscle effects such as bronchospasm. The opsonic fragments do not do this, which is why the second injection produced no inflammation while still promoting ingestion of particles. Separating the two outputs of a single cleavage step is the point: one fragment marks the target, the other calls in and activates the response.<\/p>", "why_wrong": ["Opsonins are the larger surface-bound fragments, which caused no inflammation in this experiment.", "Pore assembly is the job of the terminal components C5b through C9, which are not small diffusible fragments.", "Convertase formation is carried out by the initiating proteases, and these fragments are products rather than enzymes.", "Correct: C3a and C5a are anaphylatoxins that recruit and activate leukocytes, degranulate mast cells and increase vascular permeability.", "Decay-accelerating regulators limit complement activity rather than causing inflammation."], "table": "<table><tr><th>Fragment<\/th><th>Fate<\/th><th>Main function<\/th><\/tr><tr><td>C3b (and C4b)<\/td><td>Binds the surface<\/td><td>Opsonization; builds the C5 convertase<\/td><\/tr><tr><td>C3a and C5a<\/td><td>Released into fluid<\/td><td>Chemotaxis, leukocyte activation, mast cell degranulation, vascular leak<\/td><\/tr><tr><td>C5b through C9<\/td><td>Assembles in membrane<\/td><td>Lysis of the target<\/td><\/tr><\/table>", "objective": "Complement cleavage yields surface-bound opsonic fragments and soluble anaphylatoxins C3a and C5a that drive chemotaxis, leukocyte activation and vascular permeability."}, {"qid": "12-9", "topic": "Complement deficiency and the pattern of infection", "stem": "<p>A 17-year-old has had two episodes of severe bacteremic illness caused by an encapsulated organism, each resolving with treatment. Neutrophil count and oxidative burst are normal, serum immunoglobulin levels are normal, and antibody responses to immunizations are protective. Total complement activity measured as the ability of serum to lyse antibody-coated red cells is nearly absent. C3 and C4 levels are normal, as is deposition of C3b on test particles, but no lytic complex can be detected on the target membranes.<\/p>", "lead": "A deficiency of which component best explains these findings?", "choices": ["C1 inhibitor", "A terminal component required to assemble the lytic complex", "A regulator that accelerates decay of the convertases", "The lectin that initiates activation on carbohydrate", "A receptor for the antibody constant region on phagocytes"], "answer": 1, "explanation": "<p>The findings localize the defect precisely. Antibody production and neutrophil function are normal, so the problem is not with those arms. C3 and C4 are normal and C3b still deposits on particles, so the activation pathways and C3 cleavage work, which means opsonization is intact. What is missing is the final product, the membrane attack complex, which is why serum cannot lyse target cells.<\/p><p>Loss of the ability to form that pore produces a characteristic clinical picture: recurrent, often severe infection with encapsulated organisms, classically repeated meningococcal disease. Defects in C3, in properdin or in the terminal components all carry this risk. Deficiencies earlier in the classical pathway, such as C2 and C4, behave differently and are associated more with poor clearance of immune complexes and apoptotic cells, and with autoimmunity.<\/p>", "why_wrong": ["C1 inhibitor deficiency causes unregulated activation with episodic swelling, not failure of lysis.", "Correct: normal C3b deposition with absent lysis points to a missing terminal component needed for the membrane attack complex.", "Loss of a decay-accelerating regulator causes excessive complement activity on host cells, not absent lytic capacity.", "Loss of the initiating lectin would reduce activation on carbohydrate surfaces, but C3b deposition and C4 were normal.", "A phagocyte receptor for the antibody constant region is not measured by the lysis assay and would not abolish it."], "objective": "Deficiency of the terminal complement components spares opsonization but abolishes lysis, and presents as recurrent severe infection with encapsulated organisms."}, {"qid": "12-10", "topic": "Loss of a complement regulator: C1 inhibitor", "stem": "<p>A 24-year-old has recurrent attacks of non-itchy swelling of the lips, hands and bowel wall lasting 2 to 3 days, often beginning after minor dental work or stress. There is no rash, and antihistamines and epinephrine give no benefit. A parent and a sibling have the same problem. Between attacks, C4 is persistently low and C3 is normal. Functional testing of one plasma inhibitor is markedly reduced, although its antigenic concentration is within the reference range.<\/p>", "lead": "Which statement best explains the low C4 between attacks?", "choices": ["An inherited deficiency of C4 itself limits classical pathway activity", "Immune complexes are continuously consuming C4 and C2", "A protein that normally restrains the initiating protease is non-functional", "The alternative pathway is amplifying and consuming all early components", "Mast cell mediators cleave C4 directly during and between attacks"], "answer": 2, "explanation": "<p>C1 inhibitor blocks the activity of the C1r and C1s proteases, and it also restrains proteases of the contact and kallikrein system. When it is absent or present but inactive, which is the pattern in about 15 percent of cases where the level is normal and the function is not, the initiating protease runs unchecked. Continuous low-grade cleavage of C4 and C2 keeps C4 low even between attacks, while C3 is spared because the convertase is held in check further downstream.<\/p><p>The attacks themselves are driven largely by unregulated bradykinin generation rather than by histamine, which is why swelling is non-itchy and without rash, and why antihistamines and epinephrine do not help. Inheritance is autosomal dominant, and attacks are often triggered by minor trauma or stress. Treatment is directed at the missing inhibitor or at the bradykinin axis, with inhibitor concentrates, a kallikrein inhibitor or a bradykinin receptor blocker. Laryngeal swelling makes the condition potentially fatal.<\/p>", "why_wrong": ["A C4 gene deficiency would not produce episodic swelling or a dysfunctional inhibitor on functional testing.", "Immune complex consumption typically lowers C3 as well and does not explain the inhibitor result or the family history.", "Correct: a non-functional C1 inhibitor allows continuous C1 protease activity, which consumes C4 while C3 stays normal.", "Alternative pathway amplification consumes C3 and factor B rather than C4.", "This disorder is bradykinin-driven, and mast cell mediators do not cleave C4."], "objective": "Deficient or dysfunctional C1 inhibitor allows unchecked C1 protease and kallikrein activity, producing persistently low C4 with normal C3 and episodic bradykinin-mediated swelling."}, {"qid": "12-11", "topic": "Loss of membrane complement shields", "stem": "<p>A 30-year-old reports episodes of dark urine on waking, fatigue and anemia. Laboratory studies show hemolysis occurring inside the vessels with free hemoglobin in plasma and urine, and no antibody is detectable on the red cells. Flow cytometry shows that a large fraction of red cells and some white cells lack two surface proteins that are normally anchored to the membrane by the same type of lipid anchor. Marrow studies show the defect arose in a hematopoietic precursor during life and is not inherited.<\/p>", "lead": "Which function of the missing surface proteins best explains the hemolysis?", "choices": ["They protect the host cell membrane from complement convertases and the lytic complex", "They bind antibody constant regions and prevent opsonization of red cells", "They inhibit the initiating protease of the classical pathway", "They transport hemoglobin out of the red cell for safe disposal", "They present complement fragments to phagocytes for clearance"], "answer": 0, "explanation": "<p>Complement is constantly turning over at a low level, so host cells need protection. Two membrane proteins provide much of it: one inhibits the C3 convertases on the cell surface and the other prevents assembly of the membrane attack complex. Both are attached to the membrane by a glycolipid anchor, and an acquired mutation in a gene needed to make that anchor leaves the affected clone without either shield.<\/p><p>Red cells from that clone are then lysed directly by complement within the circulation, which gives hemoglobin in plasma and urine with no antibody on the cells. Because the mutation arises in a hematopoietic precursor, the defect is clonal and acquired rather than inherited. Treatment with an antibody that blocks C5, and so prevents formation of the lytic complex, stops the intravascular lysis, which confirms the mechanism.<\/p>", "why_wrong": ["Correct: these proteins normally restrain the convertases and the lytic complex on host membranes, so cells lacking them are lysed by complement.", "No antibody was present on the red cells, and these proteins do not bind antibody constant regions.", "Inhibition of the initiating classical protease is the role of a plasma inhibitor, not of these membrane-anchored proteins.", "Hemoglobin appears in plasma because the cells lysed, not because of a transport defect.", "Presenting complement fragments for clearance describes complement receptors on phagocytes rather than these inhibitors."], "table": "<table><tr><th>Regulator<\/th><th>Where<\/th><th>Step blocked<\/th><\/tr><tr><td>C1 inhibitor<\/td><td>Plasma<\/td><td>C1r and C1s activity<\/td><\/tr><tr><td>Decay-accelerating factor (CD55)<\/td><td>Cell membrane<\/td><td>C3 convertases<\/td><\/tr><tr><td>CD59<\/td><td>Cell membrane<\/td><td>Membrane attack complex assembly<\/td><\/tr><tr><td>Factor H and factor I<\/td><td>Plasma<\/td><td>Degradation of C3b<\/td><\/tr><\/table>", "objective": "CD55 and CD59 shield host membranes from complement convertases and the lytic complex, and their loss on a clone of blood cells causes complement-mediated intravascular hemolysis."}, {"qid": "12-12", "topic": "Why pentameric IgM is an efficient complement activator", "stem": "<p>Serum is taken from a volunteer 6 days after a first exposure to a new bacterial carbohydrate and again 6 weeks after a second exposure. Both samples are tested on the bacteria. The early sample contains a large multimeric antibody with ten binding sites whose individual sites bind the carbohydrate weakly, and it activates complement strongly on the bacterial surface. The late sample contains a monomeric antibody with two binding sites whose individual sites bind the carbohydrate much more tightly.<\/p>", "lead": "Which property of the early antibody best explains its strong complement activation?", "choices": ["Its multimeric structure allows dense surface binding that clusters the initiating complex", "Its constant region binds the lectin that starts the carbohydrate pathway", "Its high affinity per site allows it to remain bound longer than later antibody", "Its small size lets it diffuse into the bacterial periplasm", "Its constant region is bound by receptors on natural killer cells"], "answer": 0, "explanation": "<p>IgM is the dominant antibody of the primary response and it forms pentamers, assembled with the help of a J chain, giving ten binding sites. Each site binds relatively weakly, but the many sites together produce high avidity, so the molecule attaches firmly to a surface where the epitope is repeated. Classical pathway activation requires antibody clustered on a surface, and a single bound pentamer presents many constant regions in close array, which is an ideal platform for C1q.<\/p><p>That is why IgM activates complement very efficiently even early in a response, before affinity has improved. The later monomeric antibody with higher affinity per site serves other functions better, including opsonization, placental transfer and antibody-dependent cellular cytotoxicity, and most of its subclasses can still activate complement, but it must accumulate on the surface to do so. IgA, the other multimer, forms dimers with a J chain and works mainly at mucosal surfaces.<\/p>", "why_wrong": ["Correct: a pentamer binds a repetitive surface with high avidity and presents many constant regions together, which clusters and activates C1q.", "The plasma lectin binds microbial carbohydrate directly, not the antibody constant region.", "The early antibody has lower affinity per site, as stated in the experiment.", "A pentamer is the larger molecule, and complement activation happens on the outer surface.", "Natural killer cell receptors bind IgG and mediate cytotoxicity rather than complement activation."], "objective": "Pentameric IgM binds repetitive surfaces with high avidity and clusters its constant regions, which makes it an efficient activator of the classical complement pathway during the primary response."}, {"qid": "12-13", "topic": "Type II hypersensitivity: altering receptor function", "stem": "<p>A 38-year-old has drooping eyelids and double vision that worsen through the day and improve after rest. Strength declines with repeated effort. Serum contains immunoglobulin G that binds a receptor at the neuromuscular junction and prevents its normal ligand from acting. Muscle biopsy shows no cell destruction and no complement deposition in the muscle fibers, and there is no evidence of circulating antigen-antibody complexes depositing in vessels or kidneys.<\/p>", "lead": "Which mechanism of antibody-mediated injury best explains these findings?", "choices": ["Immunoglobulin E bound to mast cells releasing stored mediators", "Antibody binding a cell surface receptor and blocking its function", "Antibody-coated cells being destroyed by phagocytes and complement", "Complexes of antibody and soluble antigen depositing in tissues", "T cells recognizing peptide and recruiting macrophages to the tissue"], "answer": 1, "explanation": "<p>Hypersensitivity reactions are exaggerated antigen-specific responses that damage the host, and three of the four types in the Gell and Coombs scheme are antibody-mediated. Type II reactions are mediated by immunoglobulin G directed at antigens on a particular tissue or cell type, and they can injure in three ways: destroying the cell, binding extracellular molecules and causing local complement activation and inflammation, or altering the function of a cell surface receptor by blocking or by stimulating it.<\/p><p>Here there is no cell destruction, no complement deposition and no immune complex disease, yet antibody is bound to a receptor and prevents its ligand from acting. That is
