are compared with a fully susceptible parent strain. Isolate 1 makes an enzyme that cleaves the beta-lactam ring of ampicillin. Isolate 2 makes far less of the channel protein through which the drug crosses the outer membrane. Isolate 3 overexpresses a membrane transporter and keeps the drug concentration inside the cell low despite normal entry. Isolate 4 carries a point mutation in the gene for DNA gyrase and is unaffected by fluoroquinolones while remaining susceptible to ampicillin.<\/p>", "lead": "Which mechanism does isolate 4 use?", "choices": ["Enzymatic inactivation of the drug", "Reduced uptake of the drug into the cell", "Increased export of the drug out of the cell", "Alteration of the drug's molecular target", "Formation of a dormant state the drug cannot act on"], "answer": 3, "explanation": "<p>The lecture gives four main mechanisms of antibiotic resistance, and the stem lays out all four. Isolate 1 inactivates the drug enzymatically (beta-lactamases, and the aminoglycoside-modifying enzymes). Isolate 2 reduces uptake by decreasing porin expression. Isolate 3 increases export by overexpressing efflux pumps. Isolate 4 changes the target itself, such as a mutation in DNA gyrase, RNA polymerase or the ribosome.<\/p><p>Target alteration explains why isolate 4 is resistant to one drug class and not another: only drugs that act on the mutated target lose their effect. Fluoroquinolones act on DNA gyrase, so a gyrase mutation blocks them, while ampicillin acts on cell wall synthesis and still works.<\/p>", "why_wrong": ["Enzymatic inactivation is isolate 1, with its beta-lactam cleaving enzyme.", "Reduced uptake through fewer porins is isolate 2.", "Increased efflux is isolate 3, with its overexpressed transporter.", "Correct: a gyrase mutation alters the drug target, which explains resistance limited to fluoroquinolones.", "Dormancy is a property of endospores, not one of the four resistance mechanisms."], "objective": "The four main mechanisms of antibiotic resistance are enzymatic inactivation of the drug, decreased uptake through fewer porins, increased efflux, and alteration of the drug target.", "table": "<table><tr><th>Mechanism<\/th><th>Example<\/th><\/tr><tr><td>Inactivate the drug<\/td><td>Beta-lactamases, aminoglycoside-modifying enzymes<\/td><\/tr><tr><td>Keep the drug out<\/td><td>Decreased porin expression<\/td><\/tr><tr><td>Pump the drug out<\/td><td>Overexpressed efflux pumps<\/td><\/tr><tr><td>Change the target<\/td><td>Mutation in gyrase, RNA polymerase or ribosome<\/td><\/tr><\/table>"}, {"qid": "04-13", "topic": "Emergence and spread of resistance", "stem": "<p>A hospital tracks a carbapenem-resistant Klebsiella pneumoniae outbreak. Sequencing shows the resistance gene sits on a plasmid, and the same plasmid is found in Escherichia coli isolates from the same ward and in isolates from a nearby farm where the drug class has never been used in people. One patient's pretreatment culture already contained a small number of resistant cells before any carbapenem was given. Resistance rates on the ward fall after a program that shortens unnecessary courses.<\/p>", "lead": "Which of the following best accounts for the appearance of the gene in unrelated species?", "choices": ["Each species mutated the same gene independently under drug pressure", "Induction of a mutator phenotype by the antibiotic in each species", "Selection of pre-existing resistant cells already present in each population", "Reduced porin expression shared by Gram-negative bacteria as a group", "Transfer of the gene between bacteria on a mobile genetic element"], "answer": 4, "explanation": "<p>Resistance arises in two broad ways. Bacteria evolve quickly, so a population may already contain resistant mutants before treatment starts, and antibiotic exposure can induce a mutator phenotype that raises the mutation rate. Those explain resistance appearing within one lineage. They do not explain the same plasmid turning up in different species and different settings.<\/p><p>That requires horizontal gene transfer: resistance genes carried on mobile elements such as plasmids move between bacteria, including across species and between the hospital, the community and agriculture. Human behavior then selects for what spreads: self-medication and unfinished courses, empiric overuse and prophylaxis, agricultural use and a thin pipeline of new drugs. Shortening unnecessary courses removes that selection pressure, which is why the ward's rates fell.<\/p>", "why_wrong": ["Independent identical mutations in several species would not produce one shared plasmid sequence.", "A mutator phenotype raises mutation rates within a lineage; it does not transfer a plasmid between species.", "Pre-existing resistant cells explain the single patient's culture, not the shared plasmid across species and the farm.", "Decreased porin expression is a resistance mechanism, not a way for a gene to move between organisms.", "Correct: horizontal gene transfer on a plasmid moves the resistance gene between species and settings."], "objective": "Antibiotic resistance emerges from rapid bacterial evolution and spreads by horizontal gene transfer of mobile elements across species and settings, with human antibiotic use in medicine and agriculture providing the selection pressure."}, {"qid": "04-14", "topic": "Exotoxin versus endotoxin", "stem": "<p>Two sterile bacterial preparations are tested in rabbits. Preparation A loses all toxic activity after being held at 60 degrees Celsius for 30 minutes, is a protein recovered from culture fluid after the bacteria were removed, and produces its effects at very small doses without fever or a rise in inflammatory cytokines. Preparation B keeps its activity after boiling, is recovered from the washed bacterial envelope rather than the fluid, and requires much larger doses but reliably produces fever and a cytokine response.<\/p>", "lead": "Which statement about these preparations is correct?", "choices": ["Preparation A is from a Gram-negative organism and preparation B from a Gram-positive organism", "Preparation A is secreted by the bacteria, while preparation B is a membrane component", "Preparation A is a lipid-carbohydrate molecule and preparation B is a protein", "Preparation A requires bacteria replicating in the blood, while preparation B acts from a local site", "Preparation A reliably causes inflammation, while preparation B does not"], "answer": 1, "explanation": "<p>Preparation A is an exotoxin: a soluble, antigenic, usually heat-labile protein produced inside the bacterium and secreted, active at a small lethal dose, and not inflammatory on its own. Preparation B is an endotoxin: the lipopolysaccharide of the Gram-negative outer membrane, specifically its lipid A portion, which is heat stable, requires a much larger dose, and drives fever and inflammation.<\/p><p>The other distinguishing features follow from that. Exotoxins come from both Gram-positive and Gram-negative bacteria, while endotoxin is restricted to Gram-negative organisms (the lipo-oligosaccharide of Neisseria meningitidis is a particularly powerful one). Because exotoxins are secreted proteins, they can act at a distance from a localized infection, which is how toxins such as tetanus and diphtheria toxin cause disease without bacteremia.<\/p>", "why_wrong": ["Exotoxins come from both Gram-positive and Gram-negative bacteria, and endotoxin is the Gram-negative one.", "Correct: exotoxins are made inside the cell and secreted, while endotoxin is a component of the outer membrane.", "The chemistry is reversed: exotoxins are proteins and endotoxin is lipopolysaccharide.", "Endotoxin-driven septic shock is what requires bacteria replicating in the blood, not the secreted protein toxin.", "Endotoxin causes inflammation and exotoxins generally do not, which is also reversed here."], "objective": "Exotoxins are secreted, heat-labile proteins from Gram-positive or Gram-negative bacteria that act at small doses without inflammation, while endotoxin is the heat-stable lipopolysaccharide of the Gram-negative outer membrane that causes fever and inflammation at larger doses.", "table": "<table><tr><th><\/th><th>Exotoxin<\/th><th>Endotoxin<\/th><\/tr><tr><td>Source<\/td><td>Gram-positive and Gram-negative<\/td><td>Gram-negative<\/td><\/tr><tr><td>Relation to microbe<\/td><td>Made inside and secreted<\/td><td>Outer membrane component<\/td><\/tr><tr><td>Chemistry<\/td><td>Protein<\/td><td>Lipopolysaccharide<\/td><\/tr><tr><td>Heat<\/td><td>Usually labile<\/td><td>Stable<\/td><\/tr><tr><td>Inflammation<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><td>Lethal dose 50%<\/td><td>Small<\/td><td>Large<\/td><\/tr><\/table>"}, {"qid": "04-15", "topic": "Shiga toxin", "stem": "<p>A 7-year-old girl had 4 days of crampy abdominal pain and bloody diarrhea after eating undercooked ground beef. She now has decreased urine output and bruising. Blood smear shows fragmented erythrocytes, the platelet count is low and creatinine is rising. In the laboratory, the toxin purified from her stool isolate binds a glycolipid on vascular endothelial cells and halts protein synthesis in those cells. Stool cultures show a lactose-fermenting Gram-negative rod.<\/p>", "lead": "Which toxin shares its mechanism of cellular damage with this one?", "choices": ["Botulinum toxin", "Cholera toxin", "Tetanus toxin", "Diphtheria toxin", "Pertussis toxin"], "answer": 3, "explanation": "<p>Bloody diarrhea after undercooked beef, followed by fragmented erythrocytes, low platelets and rising creatinine, points to Shiga toxin produced by Shigella dysenteriae or by certain strains of Escherichia coli. The toxin's B subunit binds globotriaosylceramide on vascular endothelial cells, and its A subunit inhibits protein synthesis in them, which kills the endothelium and produces hemorrhage, bloody diarrhea and injury to small vessels in organs such as the kidney.<\/p><p>Among the A-B toxins, the one that shares that mechanism is diphtheria toxin, which also inhibits protein synthesis and kills cells, though it binds a growth factor receptor precursor on heart and liver cells. Same cellular action, different target cell, so a different disease.<\/p>", "why_wrong": ["Botulinum toxin blocks acetylcholine release, causing flaccid paralysis.", "Cholera toxin raises cyclic AMP and opens a chloride channel, causing watery secretory diarrhea.", "Tetanus toxin blocks GABA and glycine release, causing spastic paralysis.", "Correct: diphtheria toxin, like Shiga toxin, inhibits protein synthesis and causes cell death.", "Pertussis toxin blocks signal transduction, promoting colonization and lymphocytosis."], "objective": "Shiga toxin binds globotriaosylceramide on vascular endothelium and inhibits protein synthesis, causing hemorrhage and bloody diarrhea, the same cellular mechanism diphtheria toxin uses on heart and liver cells."}]}, {"id": "1A", "title": "Bacteriology Lab I", "week": 1, "subject": "Microbiology", "questions": [{"qid": "1A-1", "topic": "Quantifying bacteria by colony count", "stem": "<p>A technician wants to know how many live bacteria are in a broth culture. She makes ten-fold serial dilutions of the broth and spreads 0.1 mL of each dilution over the entire surface of separate agar plates. After overnight incubation, the plate from the 10<sup>-4<\/sup> dilution has 52 colonies, the plate from the 10<sup>-3<\/sup> dilution has too many colonies to count, and the plate from the 10<sup>-5<\/sup> dilution has 5 colonies.<\/p>", "lead": "Which of the following is the best estimate of the number of viable bacteria, in colony forming units (CFU) per mL, in the original broth?", "choices": ["5.2 x 10<sup>5<\/sup> CFU/mL", "5.2 x 10<sup>6<\/sup> CFU/mL", "5.2 x 10<sup>4<\/sup> CFU/mL", "5.0 x 10<sup>5<\/sup> CFU/mL", "5.2 x 10<sup>7<\/sup> CFU/mL"], "answer": 1, "explanation": "<p>Each colony grows from a single viable cell, so colonies are counted as colony forming units (CFU). The countable plate is the 10<sup>-4<\/sup> dilution with 52 colonies; the 10<sup>-3<\/sup> plate is too crowded to count and the 10<sup>-5<\/sup> plate has too few for a reliable estimate.<\/p><p>To recover the number in the original sample, multiply the colony count by the dilution factor and divide by the volume plated: 52 x 10<sup>4<\/sup> / 0.1 mL = 5.2 x 10<sup>6<\/sup> CFU/mL. The most common error is forgetting to correct for plating 0.1 mL rather than 1 mL, which gives an answer ten times too low.<\/p>", "why_wrong": ["This value forgets to correct for plating only 0.1 mL, so it is ten times too low.", "Correct: 52 colonies x 10<sup>4<\/sup> dilution factor / 0.1 mL = 5.2 x 10<sup>6<\/sup> CFU/mL.", "This value is one hundred times too low; it ignores both the volume correction and one dilution step.", "This uses the 5-colony plate without the volume correction; too few colonies give an unreliable estimate.", "This multiplies by the volume instead of dividing, overestimating the count ten-fold."], "objective": "Viable bacteria are quantified by multiplying the colonies on a countable plate by the dilution factor and dividing by the volume plated, expressed as colony forming units per mL."}, {"qid": "1A-2", "topic": "Interpreting disk diffusion", "stem": "<p>An isolate from a patient's wound is tested by disk diffusion (Kirby-Bauer) on a lawn of bacteria. After overnight incubation, the zone of inhibition is 25 mm around the disk of drug X and 17 mm around the disk of drug Y. The laboratory's interpretive standards for this organism are shown below.<\/p><table class=\"labs\"><tr><th>Drug<\/th><th>Susceptible<\/th><th>Intermediate<\/th><th>Resistant<\/th><\/tr><tr><td>Drug X<\/td><td>28 mm or more<\/td><td>23 to 27 mm<\/td><td>22 mm or less<\/td><\/tr><tr><td>Drug Y<\/td><td>15 mm or more<\/td><td>12 to 14 mm<\/td><td>11 mm or less<\/td><\/tr><\/table>", "lead": "Which of the following is the most appropriate interpretation?", "choices": ["Drug X is the better choice because its zone is larger", "Both drugs are equally effective because both produced zones", "Neither drug can be interpreted without a minimum inhibitory concentration from broth dilution", "Drug X is susceptible at higher doses and preferred over drug Y", "Drug Y is susceptible and drug X is intermediate"], "answer": 4, "explanation": "<p>The zone of inhibition forms because antibiotic diffuses out of the disk and its concentration falls with distance. How far a drug diffuses depends on the drug itself, so zone size has no meaning on its own. Each drug and organism pair has its own interpretive standards, set by correlating zone sizes with the drug levels that can be reached in the body and with clinical outcome.<\/p><p>Measured against its own standard, drug Y (17 mm, susceptible at 15 mm or more) is susceptible, which predicts treatment success. Drug X has the larger zone, but 25 mm falls in its intermediate range, meaning higher doses would be needed and the result is borderline. A bigger zone is not always better.<\/p>", "why_wrong": ["A larger zone is not better by itself; drug X's 25 mm is only intermediate by its own breakpoint.", "The presence of a zone does not establish susceptibility; each must be compared with its breakpoint.", "Disk diffusion gives a categorical result that can be interpreted directly from the standards.", "Intermediate means borderline and higher dosing would be required; a susceptible drug is the better option.", "Correct: interpreted against drug-specific breakpoints, drug Y is susceptible and drug X is intermediate."], "objective": "Disk diffusion zones are interpreted only against drug-specific breakpoints, because diffusion differs between drugs; a larger zone does not by itself mean greater susceptibility."}, {"qid": "1A-3", "topic": "Selective and differential media in a mixed culture", "stem": "<p>A swab from an infected surgical wound is streaked onto three plates. After overnight incubation, mannitol salt agar grows small colonies surrounded by yellow medium. MacConkey agar grows pink colonies. Blood agar grows two distinct colony types, one with a clear zone of hemolysis around it. The physician asks the laboratory to determine which antibiotics will work against each organism.<\/p>", "lead": "Which of the following should the laboratory do before setting up susceptibility testing?", "choices": ["Run disk diffusion directly on the original swab to save time", "Repeat the cultures in liquid broth to separate the two organisms by growth rate", "Report the organisms as normal skin flora and stop the workup", "Streak a single colony of each type onto fresh media", "Incubate all plates anaerobically to confirm the result"], "answer": 3, "explanation": "<p>Reading each plate identifies what is present. Mannitol salt agar is selective (7.5% salt lets halotolerant staphylococci grow) and differential (a yellow color means mannitol was fermented to acid), which points to <i>Staphylococcus aureus<\/i>, the most pathogenic staphylococcus. MacConkey agar is selective for Gram-negative enteric rods (bile salts and crystal violet inhibit Gram-positive bacteria), and pink colonies are lactose fermenters such as <i>E. coli<\/i>, <i>Klebsiella<\/i> or <i>Enterobacter<\/i>. Two colony types on blood agar confirm a mixed culture.<\/p><p>Susceptibility results are only meaningful for one organism at a time, so the next step is to pick a single colony of each type and streak it onto new media. Because each colony descends from one cell, this yields a pure culture, which is then used for susceptibility testing.<\/p>", "why_wrong": ["Testing a mixed sample would blend the responses of two organisms into one uninterpretable result.", "Liquid media support heavy growth but cannot separate mixed organisms.", "A mannitol-fermenting staphylococcus and a lactose-fermenting Gram-negative rod in a wound are not dismissed as normal flora.", "Correct: each organism must be isolated as a pure culture, from a single colony, before susceptibility testing.", "Both organisms already grew aerobically; anaerobic incubation would not separate them or guide therapy."], "objective": "Selective and differential media identify the organisms in a mixed specimen, but each must be isolated as a pure culture from a single colony before antimicrobial susceptibility testing.", "table": "<table><tr><th>Medium<\/th><th>Selective for<\/th><th>Differential reaction<\/th><\/tr><tr><td>Mannitol salt agar<\/td><td>Staphylococci (7.5% salt)<\/td><td>Yellow = mannitol fermenter (S. aureus)<\/td><\/tr><tr><td>MacConkey agar<\/td><td>Gram-negative enteric rods<\/td><td>Pink = lactose fermenter; colorless = non-fermenter<\/td><\/tr><tr><td>Blood agar<\/td><td>None (enriched)<\/td><td>Alpha, beta or gamma hemolysis<\/td><\/tr><tr><td>Chocolate agar<\/td><td>None (enriched)<\/td><td>Supports fastidious organisms<\/td><\/tr><\/table>"}, {"qid": "1A-4", "topic": "Reading an MIC and choosing an agent", "stem": "<p>A Gram-negative rod isolated from a patient's urine is tested by broth microdilution against three antibiotics. Each well holds the same number of bacteria and a two-fold dilution of drug. After 24 hours, wells are read for visible growth (+) or no growth (-). Drug P is broad spectrum; drugs Q and R are narrow spectrum. All three cost about the same.<\/p><table class=\"labs\"><tr><th>Drug (microgram/mL)<\/th><th>1<\/th><th>2<\/th><th>4<\/th><th>8<\/th><th>16<\/th><th>32<\/th><\/tr><tr><td>Drug P<\/td><td>+<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>Drug Q<\/td><td>+<\/td><td>+<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>Drug R<\/td><td>+<\/td><td>+<\/td><td>+<\/td><td>+<\/td><td>-<\/td><td>-<\/td><\/tr><\/table><p>Interpretive breakpoints for this organism:<\/p><table class=\"labs\"><tr><th>Drug<\/th><th>Susceptible<\/th><th>Resistant<\/th><\/tr><tr><td>Drug P<\/td><td>2 or less<\/td><td>8 or more<\/td><\/tr><tr><td>Drug Q<\/td><td>8 or less<\/td><td>32 or more<\/td><\/tr><tr><td>Drug R<\/td><td>4 or less<\/td><td>16 or more<\/td><\/tr><\/table>", "lead": "Based on these results, which of the following is the most appropriate choice of agent?", "choices": ["Drug P, because it has the lowest MIC of the three", "Drug R, because it is narrow spectrum and inhibits growth at 16", "Drug Q, because it is susceptible and narrow spectrum", "Drugs P and R together, to cover the borderline result", "None of the drugs until disk diffusion confirms the MICs"], "answer": 2, "explanation": "<p>The minimum inhibitory concentration (MIC) is the lowest drug concentration with no visible growth, the first clear well. Reading across, the MIC is 2 for drug P, 4 for drug Q and 16 for drug R. An MIC means nothing until it is compared with that drug's own breakpoint, which is set from the drug levels reached in the body. Drug P (2, susceptible at 2 or less) and drug Q (4, susceptible at 8 or less) are both susceptible. Drug R (16, resistant at 16 or more) is resistant, even though it does stop growth at a concentration inside the tested range.<\/p><p>When more than one agent is susceptible, susceptibility testing guides the choice toward the most narrow spectrum and least expensive drug. Drug Q is susceptible and narrow spectrum, so it is preferred over the broad spectrum drug P. A lower MIC does not make drug P better, because MIC values are not comparable across drugs.<\/p>", "why_wrong": ["MICs cannot be compared between drugs; both P and Q are susceptible, and the narrower agent is preferred.", "An MIC of 16 meets drug R's resistant breakpoint, so it predicts treatment failure.", "Correct: drug Q is susceptible (MIC 4, breakpoint 8 or less) and narrow spectrum, so it is the best choice.", "No result is borderline here, and adding a resistant drug adds nothing.", "Broth microdilution gives a quantitative result that is interpreted directly against breakpoints."], "table": "<table><tr><th>Drug<\/th><th>MIC read<\/th><th>Category<\/th><th>Spectrum<\/th><\/tr><tr><td>P<\/td><td>2<\/td><td>Susceptible<\/td><td>Broad<\/td><\/tr><tr><td>Q<\/td><td>4<\/td><td>Susceptible<\/td><td>Narrow<\/td><\/tr><tr><td>R<\/td><td>16<\/td><td>Resistant<\/td><td>Narrow<\/td><\/tr><\/table>", "objective": "The MIC is the first concentration with no growth, it is interpreted only against that drug's breakpoint, and among susceptible drugs the narrowest spectrum, least expensive agent is chosen."}, {"qid": "1A-5", "topic": "Chocolate agar for fastidious organisms", "stem": "<p>A sputum specimen shows tiny Gram-negative coccobacilli. The laboratory streaks it onto a sheep blood agar plate and a chocolate agar plate made from the same blood, and incubates both under identical conditions. After 48 hours, the blood agar plate shows no growth of the organism, while the chocolate agar plate has many small gray colonies.<\/p>", "lead": "Which of the following best explains the difference between the two plates?", "choices": ["The chocolate agar contains 7.5% salt that suppresses competing flora", "The chocolate agar contains bile salts and crystal violet that inhibit other organisms", "The chocolate agar contains a pH indicator that makes the colonies visible", "The chocolate agar removes oxygen, allowing an anaerobe to grow", "Heating the blood released factor V (NAD) and factor X (hemin) from red cells"], "answer": 4, "explanation": "<p>The organism fails to grow on blood agar and grows well on chocolate agar made from the same blood, so the difference is a nutrient the organism needs that blood agar does not make available. That pattern defines a fastidious organism, one that needs special nutritional supplements, such as <i>Haemophilus influenzae<\/i>.<\/p><p>Chocolate agar is blood agar that has been slowly heated. Heating lyses the red cells, releasing nicotinamide adenine dinucleotide (NAD, factor V) and hemin (factor X), and inactivates growth inhibitors in the blood. It is an enriched, non-selective medium used for fastidious respiratory pathogens such as <i>H. influenzae<\/i> and <i>Neisseria meningitidis<\/i>. Its brown color, not chocolate, gives it the name.<\/p>", "why_wrong": ["High salt is the selective ingredient of mannitol salt agar, not chocolate agar.", "Bile salts and crystal violet make MacConkey agar selective for Gram-negative enteric rods.", "Chocolate agar is enriched, not differential; it carries no pH indicator.", "Both plates were incubated identically; oxygen is controlled by anaerobic jars, not by the medium.", "Correct: heating lyses red cells, releasing NAD (factor V) and hemin (factor X) needed by fastidious organisms."], "objective": "Chocolate agar is heated blood agar that releases factor V (NAD) and factor X (hemin), an enriched non-selective medium for fastidious organisms such as Haemophilus influenzae."}, {"qid": "1A-6", "topic": "Reading hemolysis on blood agar", "stem": "<p>Two streptococcal isolates are grown overnight on sheep blood agar. Colonies of isolate 1 are surrounded by a narrow greenish zone; when the plate is held up to the light, the agar in that zone is not transparent. Colonies of isolate 2 are surrounded by a wide, completely clear zone through which print can be read.<\/p>", "lead": "Which of the following best explains the zone around isolate 1?", "choices": ["Complete lysis of red cells by a secreted toxin", "Partial lysis of red cells with hemoglobin converted to biliverdin", "No effect on red cells, with the color coming from the colony pigment", "Fermentation of a sugar to acid that changes a pH indicator", "Contamination of the plate with a second organism"], "answer": 1, "explanation": "<p>Blood agar is both enriched and differential: the sheep red cells show how an organism affects them. A completely clear zone, as around isolate 2, is beta hemolysis, complete lysis of the red cells (for example, <i>Streptococcus pyogenes<\/i>).<\/p><p>Isolate 1's greenish, non-transparent zone is alpha hemolysis. The red cells are only partly lysed, and the green comes from hemoglobin breakdown to biliverdin. Viridans streptococci are the classic example. Gamma hemolysis means no change at all in the surrounding medium.<\/p>", "why_wrong": ["Complete lysis gives a clear zone, which describes isolate 2 (beta hemolysis).", "Correct: alpha hemolysis is partial lysis, and the green color is biliverdin from hemoglobin breakdown.", "No change in the medium is gamma hemolysis; a greenish zone is a change in the red cells.", "Blood agar has no pH indicator; color change from sugar fermentation is read on mannitol salt or MacConkey agar.", "The zone surrounds each colony of one isolate, which is a property of that organism, not a contaminant."], "table": "<table><tr><th>Pattern<\/th><th>What you see<\/th><th>What happened<\/th><th>Example<\/th><\/tr><tr><td>Alpha<\/td><td>Greenish zone<\/td><td>Partial lysis, biliverdin<\/td><td>Viridans streptococci<\/td><\/tr><tr><td>Beta<\/td><td>Clear zone<\/td><td>Complete lysis<\/td><td>Streptococcus pyogenes<\/td><\/tr><tr><td>Gamma<\/td><td>No change<\/td><td>No lysis<\/td><td>Enterococcus<\/td><\/tr><\/table>", "objective": "On blood agar, a greenish zone is alpha (partial) hemolysis from biliverdin, a clear zone is beta (complete) hemolysis, and no change is gamma hemolysis."}, {"qid": "1A-7", "topic": "MacConkey agar: lactose non-fermenters", "stem": "<p>A stool specimen from a man with three days of diarrhea is plated on MacConkey agar and on mannitol salt agar. After overnight incubation, the mannitol salt plate has no growth. The MacConkey plate grows two colony types: most colonies are pink, and a smaller number are colorless with no change in the surrounding agar.<\/p>", "lead": "Which of the following is the most likely significance of the colorless colonies?", "choices": ["They are Gram-negative rods that do not ferment lactose, a group that includes enteric pathogens", "They are Gram-positive cocci that tolerate bile and therefore cannot be identified on this plate", "They are lactose fermenters, like the pink colonies, that grew more slowly", "They are staphylococci that ferment mannitol and should be confirmed on blood agar", "They are fastidious organisms that need factor V and factor X to change color"], "answer": 0, "explanation": "<p>First, what grew: MacConkey agar contains bile salts and crystal violet, which inhibit Gram-positive bacteria, so any colony on it is a Gram-negative rod of the Enterobacterales type. The empty mannitol salt plate agrees, showing no salt-tolerant staphylococci.<\/p><p>Second, what the color means: lactose fermenters make acid that turns the neutral red indicator pink (for example, <i>E. coli<\/i>, <i>Klebsiella<\/i>, <i>Enterobacter<\/i>, common in normal stool). Colorless colonies did not ferment lactose. That group includes the enteric pathogens <i>Salmonella<\/i> and <i>Shigella<\/i> (and <i>Vibrio<\/i>), so in a patient with diarrhea these are the colonies to work up. Note that the reading is the opposite of mannitol salt agar, where a color change marks the more pathogenic organism.<\/p>", "why_wrong": ["Correct: on MacConkey agar, colorless colonies are lactose non-fermenting Gram-negative rods, the group containing Salmonella and Shigella.", "Bile salts and crystal violet inhibit Gram-positive organisms, so they do not form colonies on MacConkey agar.", "Lactose fermenters turn the indicator pink; a colorless colony means lactose was not fermented.", "Mannitol fermentation is read on mannitol salt agar, which had no growth.", "Factor V and X requirements are met by chocolate agar and have nothing to do with color on MacConkey agar."], "objective": "MacConkey agar selects Gram-negative enteric rods and differentiates lactose fermenters (pink) from non-fermenters (colorless), the group that includes Salmonella and Shigella."}, {"qid": "1A-8", "topic": "Mannitol salt agar: reading a non-fermenter", "stem": "<p>A swab of a patient's intact forearm skin is streaked onto mannitol salt agar. After overnight incubation, many small colonies have grown, but the agar around them has kept its original color with no yellow change. A control strain known to ferment mannitol, grown on the same batch of plates, turns the medium yellow.<\/p>", "lead": "Which of the following is the most likely interpretation of the skin isolate?", "choices": ["Staphylococcus aureus, because it grew in high salt", "A Gram-negative enteric rod that does not ferment lactose", "An organism that cannot tolerate salt, so growth is from carryover", "A salt-tolerant staphylococcus that does not ferment mannitol", "A failed plate, because the indicator did not change"], "answer": 3, "explanation": "<p>Mannitol salt agar is selective because its 7.5% salt lets halotolerant organisms such as staphylococci (and micrococci), which live on the skin, grow while most others do not. So growth itself says the isolate tolerates salt.<\/p><p>The medium is differential because it contains mannitol and the pH indicator phenol red. Fermenting mannitol makes acid that turns the agar yellow, which is what <i>Staphylococcus aureus<\/i>, the most pathogenic staphylococcus, does. This isolate grew without a yellow change, and the control shows the plate works, so it is a staphylococcus that does not ferment mannitol, one of the less pathogenic species typical of normal skin.<\/p>", "why_wrong": ["Growth in salt shows a staphylococcus, but Staphylococcus aureus ferments mannitol and turns the agar yellow.", "Gram-negative enteric rods are selected by MacConkey agar and generally do not grow in 7.5% salt.", "Many colonies grew, which shows salt tolerance rather than carryover.", "Correct: growth shows salt tolerance (selective), and no yellow change shows no mannitol fermentation (differential).", "The control strain turned the same batch yellow, so the plate is working."], "objective": "On mannitol salt agar, growth shows a salt-tolerant staphylococcus, and a yellow change marks mannitol fermentation by Staphylococcus aureus; growth without yellow suggests a less pathogenic staphylococcus."}, {"qid": "1A-9", "topic": "Antimicrobial gradient strip (Etest)", "stem": "<p>A slow-growing isolate does not give valid results on the laboratory's automated susceptibility instrument. A technician makes a lawn of the organism on an agar plate and lays a thin plastic strip on it. The underside of the strip carries dried antibiotic in a gradient, and the top is printed with a concentration scale. After incubation, an elliptical zone of no growth surrounds the high-concentration end of the strip, and the edge of the ellipse meets the strip at the mark for 0.5 microgram/mL.<\/p>", "lead": "Which of the following best describes the result this method provides?", "choices": ["A quantitative value analogous to the MIC, read where growth meets the strip", "A categorical result of susceptible or resistant with no numeric value", "A count of viable bacteria in colony forming units per mL", "A zone diameter that is meaningful without interpretive standards", "A genotypic result showing which resistance gene is present"], "answer": 0, "explanation": "<p>The strip releases antibiotic into the agar along a concentration gradient, so the organism grows wherever the local concentration is too low to stop it. The point where the edge of the zone of inhibition crosses the printed scale is the lowest concentration that inhibits growth, so the method gives a number analogous to a minimum inhibitory concentration (MIC), here 0.5 microgram/mL.<\/p><p>This is the gradient (Etest) method. It uses plate handling like disk diffusion, but disk diffusion yields only a categorical result (susceptible, intermediate, resistant) from a zone diameter. The gradient strip is more laborious and expensive than automated MIC methods and is used for difficult organisms or when automated methods are not valid. Its number, like any MIC, is still interpreted against breakpoints.<\/p>", "why_wrong": ["Correct: the gradient strip gives an MIC-like number where the zone edge meets the concentration scale.", "A categorical result without a number is what disk diffusion (Kirby-Bauer) gives.", "Colony forming units come from counting colonies on dilution plates, not from a susceptibility test.", "Zone size has no meaning on its own in any method; results need interpretive standards.", "The method measures growth in the presence of drug (phenotype), not resistance genes."], "objective": "The gradient strip (Etest) gives a quantitative MIC-like result on a plate, read where the zone edge meets the strip, and is used when automated methods are not valid."}]}, {"id": "1B", "title": "Bacteriology Lab II", "week": 1, "subject": "Microbiology", "questions": [{"qid": "1B-1", "topic": "Which specimens get a direct Gram stain", "stem": "<p>A 59-year-old man in the intensive care unit has a temperature of 39.3 C, pulse 124/min and blood pressure 84/50 mm Hg. Two sets of blood cultures and a cerebrospinal fluid sample are sent to the microbiology laboratory, and the physician asks for an immediate Gram stain of each. The laboratory performs a direct Gram stain on the cerebrospinal fluid but places the blood culture bottles in the incubator and stains them only after the instrument signals growth.<\/p>", "lead": "Which of the following best explains the laboratory's approach to the blood?", "choices": ["Bacteria in blood are usually below the number a Gram stain can detect", "Blood contains too many commensal organisms to interpret a stain", "Red cells absorb the crystal violet and make all organisms look Gram negative", "Blood specimens must first be tested by mass spectrometry", "Gram stains are reserved for specimens from non-sterile sites"], "answer": 0, "explanation": "<p>A Gram stain can only show organisms present at fairly high numbers, roughly 10<sup>4<\/sup> colony forming units per mL or more. Sterile fluids such as cerebrospinal, joint, pleural and peritoneal fluid are always stained directly, because organisms there can reach that level and there is little background to confuse the reading.<\/p><p>Bacteremia usually involves a low inoculum, below the sensitivity of the Gram stain, so a direct stain of fresh blood would usually be negative even in a septic patient. Instead, blood culture bottles are incubated and monitored for carbon dioxide production; when a bottle signals positive, the organisms have multiplied enough to be seen, and the laboratory performs a Gram stain, subcultures to plates and calls the physician with the critical result.<\/p>", "why_wrong": ["Correct: the low number of organisms in blood is below Gram stain sensitivity until they multiply in culture.", "Blood is a sterile site; the concern is too few organisms, not commensal noise.", "This is not a recognized limitation; the problem is sensitivity, not stain absorption.", "Mass spectrometry identifies colonies after growth; it is not a prerequisite for staining.", "Gram stains are routinely done on sterile fluids such as cerebrospinal fluid; non-sterile sites like stool are the ones usually skipped."], "objective": "Direct Gram stains are done on sterile fluids such as cerebrospinal fluid, but blood is incubated first because bacteremia usually involves too few organisms for a Gram stain to detect."}, {"qid": "1B-2", "topic": "Genotypic detection of resistance", "stem": "<p>A 64-year-old woman with a long-term intravenous catheter has fever and chills. Within 18 hours, a blood culture bottle signals positive and the Gram stain shows Gram-positive cocci in clusters. A rapid molecular panel run on the positive bottle identifies <i>Staphylococcus aureus<\/i> and detects the mecA gene. Results of standard susceptibility testing will not be available for another 1 to 2 days.<\/p>", "lead": "Which of the following is the best interpretation of the molecular result?", "choices": ["The organism is most likely a skin contaminant, because the bottle turned positive so quickly", "No conclusion about resistance can be made until the MIC is measured", "The isolate is methicillin resistant, so standard beta-lactams are unreliable", "The isolate produces a toxin, so an antibiotic will not change the outcome", "The gene predicts resistance to all antibiotics, so treatment should be withheld"], "answer": 2, "explanation": "<p>Genotypic detection of resistance works when resistance to a drug is explained by one gene, or a limited number of genes or mutations, so that carrying the gene means the organism expresses, or can express, the resistance. The mecA test for methicillin-resistant <i>S. aureus<\/i> (MRSA) is the lecture's main example, and the blood culture panel is designed to detect it directly from the positive bottle.<\/p><p>Finding mecA therefore predicts methicillin resistance hours to days before phenotypic testing returns, letting the team choose therapy that will work against MRSA right away. A phenotypic MIC still follows to give the full susceptibility profile. A quickly positive bottle, by contrast, suggests a high inoculum of a true pathogen, since contaminants are usually few in number and turn positive later.<\/p>", "why_wrong": ["Contaminants usually turn positive later and in low numbers; early positivity favors a true pathogen.", "For a single-gene resistance mechanism like mecA, the genotype predicts resistance before the MIC is available.", "Correct: mecA predicts methicillin resistance, so standard antistaphylococcal beta-lactams are expected to fail.", "mecA is a resistance gene, not a toxin gene, and treatment remains essential.", "mecA predicts beta-lactam (methicillin) resistance, not resistance to every antibiotic."], "objective": "Genotypic resistance tests such as mecA detection work when one gene accounts for resistance, allowing methicillin-resistant Staphylococcus aureus to be identified from a positive blood culture before phenotypic susceptibility results."}, {"qid": "1B-3", "topic": "Work-up of Gram-positive cocci: enterococci", "stem": "<p>A 73-year-old man who has been in the intensive care unit for 3 weeks develops a urinary tract infection while catheterized. The urine culture grows Gram-positive cocci in pairs and short chains that are catalase negative and cause no hemolysis on blood agar. The organism grows in broth containing 6.5% sodium chloride. Mass spectrometry identifies the species most common among hospital isolates of its genus that are resistant to multiple drugs.<\/p>", "lead": "Which of the following is most characteristic of this organism?", "choices": ["Optochin sensitivity and lancet-shaped diplococci", "Frequent resistance to ampicillin and vancomycin", "Coagulase production and mannitol fermentation", "Requirement for chocolate agar and factors released by heating blood", "Growth only at the bottom of a thioglycolate tube"], "answer": 1, "explanation": "<p>First, identify the organism. Catalase-negative cocci are in the streptococcal group; no hemolysis (gamma) and growth in 6.5% salt identify enterococci. In a patient with a long hospital stay, the multidrug-resistant species typical of hospital isolates is <i>Enterococcus faecium<\/i>, a common nosocomial pathogen and one of the ESKAPE organisms.<\/p><p>Second, recall what defines it. Enterococci are normal gastrointestinal, skin and genitourinary flora that are relatively antibiotic resistant survivors. <i>E. faecalis<\/i> is the most common and more susceptible species, while <i>E. faecium<\/i> is often resistant to ampicillin and vancomycin (vancomycin-resistant enterococci). Laboratories use vancomycin screen agar to look for carriers.<\/p>", "why_wrong": ["Optochin sensitivity and lancet-shaped diplococci identify Streptococcus pneumoniae, which is alpha hemolytic and not salt tolerant.", "Correct: Enterococcus faecium, a nosocomial pathogen, is often resistant to ampicillin and vancomycin.", "Coagulase and mannitol fermentation identify Staphylococcus aureus, which is catalase positive.", "Chocolate agar requirements describe fastidious organisms such as Haemophilus influenzae.", "Growth only at the bottom of thioglycolate describes an obligate anaerobe; enterococci are not."], "objective": "Catalase-negative, non-hemolytic cocci that grow in 6.5% salt are enterococci; Enterococcus faecium is a common nosocomial pathogen often resistant to ampicillin and vancomycin.", "table": "<table><tr><th>Catalase-negative cocci<\/th><th>Hemolysis<\/th><th>Key test<\/th><\/tr><tr><td>S. pyogenes<\/td><td>Beta<\/td><td>Bacitracin sensitive<\/td><\/tr><tr><td>S. agalactiae<\/td><td>Beta<\/td><td>Bacitracin resistant<\/td><\/tr><tr><td>S. pneumoniae<\/td><td>Alpha<\/td><td>Optochin sensitive<\/td><\/tr><tr><td>Viridans streptococci<\/td><td>Alpha<\/td><td>Optochin resistant<\/td><\/tr><tr><td>Enterococci<\/td><td>Usually gamma<\/td><td>Grow in 6.5% salt<\/td><\/tr><\/table>"}, {"qid": "1B-4", "topic": "Quantitative urine culture and collection method", "stem": "<p>A 66-year-old man in the hospital cannot void and has fever. Because a clean specimen cannot be obtained otherwise, urine is collected by suprapubic aspiration, a needle passed through the abdominal wall directly into the bladder. The laboratory plates the urine with a calibrated loop that delivers 10 microliters onto blood agar and MacConkey agar. After overnight incubation, each plate grows 20 colonies of a single Gram-negative rod.<\/p>", "lead": "Which of the following is the most appropriate interpretation of this culture?", "choices": ["2 x 10<sup>3<\/sup> CFU/mL, likely skin contamination because it is below 10<sup>5<\/sup>", "2 x 10<sup>5<\/sup> CFU/mL, significant because it exceeds the usual threshold", "2 x 10<sup>2<\/sup> CFU/mL, too few colonies to report", "2 x 10<sup>3<\/sup> CFU/mL, likely significant because the bladder is normally sterile", "2 x 10<sup>4<\/sup> CFU/mL, significant only if a clean-catch specimen confirms it"], "answer": 3, "explanation": "<p>A 10 microliter loop plates one hundredth of a mL, so each colony represents 100 colony forming units (CFU) per mL. Twenty colonies therefore equal 2,000, or 2 x 10<sup>3<\/sup> CFU/mL. That is well below 10<sup>5<\/sup> CFU/mL, the usual threshold for significance.<\/p><p>The threshold, though, exists for specimens that pass through the urethra, such as a clean catch, where low counts of commensals are expected noise. Interpreting a culture requires knowing how it was collected. A suprapubic aspirate comes straight from the bladder, a sterile site, so anything that grows may be significant, and a pure growth of one Gram-negative rod in a febrile patient is meaningful at this count. Even so, a urinary tract infection is a clinical diagnosis, not a number on a plate.<\/p>", "why_wrong": ["The count is right, but the 10<sup>5<\/sup> threshold applies to urethral specimens, not to a sterile-site aspirate.", "This multiplies by 10,000 rather than 100; each colony from a 10 microliter loop is 100 CFU/mL.", "This forgets the loop volume; each colony stands for 100 CFU/mL, not 10.", "Correct: 20 colonies x 100 = 2 x 10<sup>3<\/sup> CFU/mL, and growth from a sterile-site specimen may be significant at any count.", "This miscalculates the count, and a clean catch is a noisier specimen, not a confirmation."], "objective": "With a 10 microliter calibrated loop each colony equals 100 CFU/mL; the 10^5 CFU/mL threshold applies to urethral specimens, while growth from a sterile collection such as suprapubic aspiration may be significant at lower counts."}, {"qid": "1B-5", "topic": "Judging sputum specimen quality", "stem": "<p>A 70-year-old man has fever and a productive cough. An expectorated sputum sample is sent for Gram stain and culture. The Gram stain shows many large, flat squamous epithelial cells, rare polymorphonuclear cells (PMNs), and a mixture of bacteria of many shapes and staining patterns.<\/p>", "lead": "Which of the following is the most appropriate action by the laboratory?", "choices": ["Culture the specimen and report every organism that grows", "Reject the specimen as mostly saliva and request a new sample", "Report the result as a polymicrobial lower respiratory infection", "Incubate the specimen anaerobically to recover the oral organisms", "Identify each bacterial shape directly from the slide by mass spectrometry"], "answer": 1, "explanation": "<p>Before reading the organisms on a sputum Gram stain, the laboratory judges whether the sample is phlegm from the lower airway or spit from the mouth. A good lower respiratory specimen contains many PMNs from the inflamed airway. Many squamous epithelial cells, which line the mouth, with few PMNs and a mixed jumble of bacteria mean the sample is mostly saliva.<\/p><p>Sputum is a non-sterile specimen, and the goal of its work-up is to separate pathogens from normal oral flora. A saliva sample is full of that oral noise, so culturing it would grow commensals and could mislead treatment. The appropriate step is to reject it and request a better specimen.<\/p>", "why_wrong": ["Culturing saliva would report oral commensals as if they came from the lung.", "Correct: many epithelial cells and few PMNs mark an oral (spit) specimen, which should be recollected.", "The mixed bacteria reflect oral flora contamination, not a true lower airway infection.", "Recovering oral anaerobes from saliva adds noise; the specimen itself is the problem.", "Mass spectrometry identifies colonies grown in culture, not shapes seen on a stained slide."], "objective": "A sputum Gram stain is first judged for quality: many PMNs indicate a lower respiratory specimen, while many squamous epithelial cells indicate saliva that should be rejected."}, {"qid": "1B-6", "topic": "Blood culture contaminant vs true bacteremia", "stem": "<p>A 45-year-old woman with fever has two blood culture sets drawn from two separate venipuncture sites. One bottle of the first set signals positive after 3.5 days of incubation; both bottles of the second set remain negative at 5 days. The positive bottle's Gram stain shows Gram-positive cocci in clusters. Colonies from the subculture bubble when hydrogen peroxide is added and do not clump in the coagulase test.<\/p>", "lead": "Which of the following is the most likely interpretation?", "choices": ["Staphylococcus aureus bacteremia that requires treatment", "Enterococcal bacteremia from a urinary source", "Streptococcal bacteremia because the organism is in clusters", "True bacteremia, because any organism in blood is significant", "Probable contamination from skin flora during collection"], "answer": 4, "explanation": "<p>The organism first has to be identified. Gram-positive cocci in clusters that are catalase positive (bubbles with hydrogen peroxide) are staphylococci, and a negative coagulase test rules out <i>Staphylococcus aureus<\/i>, leaving a coagulase-negative staphylococcus such as <i>Staphylococcus epidermidis<\/i>, a normal skin organism.<\/p><p>Next comes the meaning of the positive bottle. A positive blood culture can reflect organisms in the patient's blood or contamination during collection. Contaminants are usually present in low numbers, so they turn positive later and often in only one of several sets. Here the organism grew late, in one bottle of one set, while the set from a separate site stayed negative. Together with a skin organism, that pattern most likely represents contamination.<\/p>", "why_wrong": ["A negative coagulase test rules out Staphylococcus aureus.", "Enterococci are catalase negative and grow in pairs and short chains.", "Streptococci are catalase negative; clusters and a positive catalase test point to staphylococci.", "Blood cultures can be contaminated during collection, so a single late positive must be interpreted, not assumed significant.", "Correct: a coagulase-negative staphylococcus growing late in one of two sets most likely reflects skin contamination."], "objective": "Catalase-positive, coagulase-negative staphylococci growing late in only one blood culture set usually represent skin contamination, because contaminants are few and turn positive later."}, {"qid": "1B-7", "topic": "Pneumococcus vs viridans streptococci", "stem": "<p>A sputum culture grows colonies surrounded by a greenish, partial zone of hemolysis on blood agar. The Gram stain of the colonies shows lancet-shaped Gram-positive diplococci, and the colonies do not bubble with hydrogen peroxide. The laboratory places an optochin disk on a lawn of the isolate, and a zone of inhibition forms around it.<\/p>", "lead": "Which of the following additional results would be expected for this isolate?", "choices": ["Growth in broth containing 6.5% sodium chloride", "Clumping in the coagulase test", "Dissolving of the colonies when bile is added", "Resistance to a bacitracin disk with a wide clear zone of hemolysis", "Yellow change in mannitol salt agar"], "answer": 2, "explanation": "<p>Catalase-negative Gram-positive cocci are streptococci, and greenish partial hemolysis makes this an alpha-hemolytic streptococcus. Among the alpha-hemolytic group, <i>Streptococcus pneumoniae<\/i> has to be separated from the viridans streptococci, which are normal oral flora. Lancet-shaped diplococci and susceptibility to optochin (a zone of inhibition) identify <i>S. pneumoniae<\/i>; viridans streptococci are optochin resistant.<\/p><p>The companion test for pneumococcus is bile solubility: its colonies dissolve when bile is added. Colony appearance helps as well. Together these characteristics separate a respiratory pathogen from the oral commensals it resembles.<\/p>", "why_wrong": ["Growth in 6.5% salt separates enterococci from other catalase-negative cocci.", "Coagulase applies to catalase-positive staphylococci and identifies Staphylococcus aureus.", "Correct: optochin-susceptible alpha-hemolytic lancet-shaped diplococci are Streptococcus pneumoniae, which is bile soluble.", "Bacitracin is used on beta-hemolytic streptococci; this isolate is alpha hemolytic.", "Mannitol fermentation on mannitol salt agar is used for staphylococci."], "objective": "Alpha-hemolytic, catalase-negative, lancet-shaped diplococci that are optochin susceptible and bile soluble are Streptococcus pneumoniae, distinct from optochin-resistant viridans streptococci."}, {"qid": "1B-8", "topic": "Beta-hemolytic streptococci: bacitracin", "stem": "<p>A throat swab from a 12-year-old girl with sore throat and fever is cultured on sheep blood agar. After overnight incubation, small colonies are surrounded by wide, completely clear zones of hemolysis. The colonies do not bubble when hydrogen peroxide is added. A bacitracin disk placed on a lawn of the isolate produces a zone of inhibition.<\/p>", "lead": "Which of the following organisms is most likely?", "choices": ["Streptococcus pyogenes", "Streptococcus agalactiae", "Streptococcus pneumoniae", "Enterococcus faecalis", "Staphylococcus aureus"], "answer": 0, "explanation": "<p>The colonies are catalase negative, so they are streptococci or a related organism rather than staphylococci. A completely clear zone is beta hemolysis, which narrows the field to the beta-hemolytic streptococci, groups A, B, C, G and others, each with its own clinical associations.<\/p><p>Bacitracin separates the two main beta-hemolytic groups on the work-up scheme: group A <i>Streptococcus pyogenes<\/i> is bacitracin susceptible, and group B <i>Streptococcus agalactiae<\/i> is resistant. A zone around the disk, from a throat swab, points to group A streptococcus. Beta-hemolytic streptococci are confirmed by group using latex agglutination, and for throat swabs a rapid antigen test can be used alongside culture.<\/p>", "why_wrong": ["Correct: catalase-negative, beta-hemolytic and bacitracin-susceptible cocci are group A Streptococcus pyogenes.", "Group B Streptococcus agalactiae is beta hemolytic but bacitracin resistant.", "Streptococcus pneumoniae is alpha hemolytic and identified with optochin, not bacitracin.", "Enterococci are usually non-hemolytic and are identified by growth in 6.5% salt.", "Staphylococcus aureus is catalase positive and would bubble with hydrogen peroxide."], "table": "<table><tr><th>Catalase-negative coccus<\/th><th>Hemolysis<\/th><th>Key test<\/th><\/tr><tr><td>S. pyogenes (group A)<\/td><td>Beta<\/td><td>Bacitracin susceptible<\/td><\/tr><tr><td>S. agalactiae (group B)<\/td><td>Beta<\/td><td>Bacitracin resistant<\/td><\/tr><tr><td>S. pneumoniae<\/td><td>Alpha<\/td><td>Optochin susceptible, bile soluble<\/td><\/tr><tr><td>Viridans streptococci<\/td><td>Alpha<\/td><td>Optochin resistant<\/td><\/tr><tr><td>Enterococci<\/td><td>Usually gamma<\/td><td>Grow in 6.5% salt<\/td><\/tr><\/table>", "objective": "Among catalase-negative, beta-hemolytic streptococci, bacitracin susceptibility identifies group A Streptococcus pyogenes and resistance points to group B Streptococcus agalactiae."}, {"qid": "1B-9", "topic": "Thioglycolate growth and oxygen requirements", "stem": "<p>Pus from a deep abdominal abscess is plated onto blood, chocolate and MacConkey agar incubated in room air, and is also inoculated into a tube of thioglycolate broth. After 48 hours, none of the plates show growth. The thioglycolate tube is cloudy only in a band at the very bottom of the tube, with clear broth above it; a Gram stain of that growth shows Gram-negative rods.<\/p>", "lead": "Which of the following is the most appropriate next step to recover and identify the organism?", "choices": ["Hold the room air plates for another week", "Subculture onto MacConkey agar to select the Gram-negative rods", "Discard the tube result as a contaminant of the broth", "Subculture onto plates incubated in an anaerobic jar", "Report the isolate as a strict aerobe and stop the work-up"], "answer": 3, "explanation": "<p>Thioglycolate broth contains a reducing agent that removes oxygen, so oxygen is plentiful at the top of the tube and absent at the bottom. Where an organism grows reveals how it tolerates oxygen. Strict aerobes grow at the top, facultative organisms grow throughout, and strict (obligate) anaerobes grow only at the bottom. Growth only at the bottom, with nothing on any room air plate, identifies a strict anaerobe, for which oxygen is toxic.<\/p><p>The organism therefore must be subcultured onto plates incubated without oxygen, in anaerobic jars or pouches, before it can be isolated as colonies and identified. Thioglycolate serves as a back-up and amplification system that recovers small numbers of organisms and anaerobes; its growth is meant to be subcultured.<\/p>", "why_wrong": ["Longer incubation cannot help an organism for which oxygen is toxic.", "MacConkey plates in room air already failed; the problem is oxygen, not competition.", "Thioglycolate can grow contaminants, but growth confined to the oxygen-free bottom with negative aerobic plates fits a strict anaerobe.", "Correct: growth only at the bottom of thioglycolate means a strict anaerobe, which must be subcultured under anaerobic conditions.", "A strict aerobe would grow at the top of the tube and on the room air plates."], "table": "<table><tr><th>Growth in thioglycolate<\/th><th>Organism type<\/th><\/tr><tr><td>Top only<\/td><td>Strict (obligate) aerobe<\/td><\/tr><tr><td>Throughout, densest at top<\/td><td>Facultative anaerobe<\/td><\/tr><tr><td>Evenly throughout<\/td><td>Aerotolerant anaerobe<\/td><\/tr><tr><td>Bottom only<\/td><td>Strict (obligate) anaerobe<\/td><\/tr><\/table>", "objective": "Growth only at the bottom of thioglycolate broth identifies a strict anaerobe, which must be subcultured and incubated in anaerobic conditions to be isolated."}, {"qid": "1B-10", "topic": "Gram-negative rod work-up: oxidase-positive non-fermenter", "stem": "<p>A tracheal aspirate from a patient on a ventilator grows a Gram-negative rod. On MacConkey agar the colonies are colorless with no change in the surrounding agar. On blood agar the colonies are flat and spreading with a green pigment that diffuses into the medium. A colony turns the oxidase reagent dark purple within seconds.<\/p>", "lead": "Which of the following organisms is most likely?", "choices": ["Escherichia coli", "Klebsiella pneumoniae", "Proteus mirabilis", "Salmonella species", "Pseudomonas aeruginosa"], "answer": 4, "explanation": "<p>Growth on MacConkey agar confirms a Gram-negative rod, and colorless colonies mean it does not ferment lactose. On the Gram-negative rod work-up scheme, the non-lactose fermenters are then split by the oxidase test.<\/p><p>An oxidase-positive non-lactose fermenter is <i>Pseudomonas<\/i>, and the green diffusible pigment is a classic colony clue for <i>Pseudomonas aeruginosa<\/i>. The oxidase-negative non-fermenters (<i>Shigella<\/i>, <i>Salmonella<\/i>, <i>Proteus<\/i>) are then sorted by hydrogen sulfide production. Other colony clues on the same scheme include mucoid lactose-fermenting colonies of <i>Klebsiella<\/i> and swarming growth of <i>Proteus<\/i>.<\/p>", "why_wrong": ["Escherichia coli ferments lactose, giving pink colonies on MacConkey agar.", "Klebsiella ferments lactose and forms mucoid pink colonies on MacConkey agar.", "Proteus is an oxidase-negative non-fermenter known for swarming, not a green pigment.", "Salmonella is an oxidase-negative non-fermenter that produces hydrogen sulfide.", "Correct: an oxidase-positive lactose non-fermenter with a green pigment is Pseudomonas aeruginosa."], "objective": "A Gram-negative rod that does not ferment lactose and is oxidase positive is Pseudomonas, and a green diffusible pigment suggests Pseudomonas aeruginosa."}, {"qid": "1B-11", "topic": "Enteric pathogens: hydrogen sulfide", "stem": "<p>A stool specimen from a 30-year-old man with fever and diarrhea is cultured on a panel of selective media. A Gram-negative rod grows as colorless colonies on MacConkey agar. The isolate is oxidase negative, and on a medium that detects hydrogen sulfide its colonies have black centers.<\/p>", "lead": "Which of the following organisms is most likely?", "choices": ["Salmonella species", "Shigella species", "Escherichia coli", "Pseudomonas aeruginosa", "Campylobacter jejuni"], "answer": 0, "explanation": "<p>Colorless colonies on MacConkey agar mark a Gram-negative rod that does not ferment lactose. Because this isolate is oxidase negative, it is not <i>Pseudomonas<\/i>; it belongs with the oxidase-negative non-fermenting enteric rods.<\/p><p>Hydrogen sulfide production splits that group. <i>Salmonella<\/i> (and <i>Proteus<\/i>) produce hydrogen sulfide, seen as black colonies or black centers, while <i>Shigella<\/i> (and <i>Yersinia<\/i>) do not. In a patient with diarrhea, a hydrogen sulfide-producing non-lactose fermenter is most likely <i>Salmonella<\/i>, which is why stool is cultured on a panel of selective media designed to pick enteric pathogens out of dense normal flora.<\/p>", "why_wrong": ["Correct: an oxidase-negative, non-lactose-fermenting rod that produces hydrogen sulfide in stool is most likely Salmonella.", "Shigella is a non-lactose fermenter that does not produce hydrogen sulfide.", "Escherichia coli ferments lactose and forms pink colonies on MacConkey agar.", "Pseudomonas is oxidase positive.", "Campylobacter is a curved rod that grows at 42 degrees C and is not identified by this lactose and hydrogen sulfide pathway."], "objective": "Among oxidase-negative, non-lactose-fermenting enteric rods, hydrogen sulfide production points to Salmonella, while Shigella is hydrogen sulfide negative."}, {"qid": "1B-12", "topic": "Gram-negative diplococci: maltose utilization", "stem": "<p>A 19-year-old college student has fever, headache and neck stiffness. Cerebrospinal fluid (CSF) is sent for an immediate direct Gram stain, which shows Gram-negative diplococci, and is plated on enriched media. Gray colonies grow on chocolate agar overnight. In carbohydrate testing, the isolate uses both glucose and maltose.<\/p>", "lead": "Which of the following organisms is most likely?", "choices": ["Neisseria gonorrhoeae", "Haemophilus influenzae", "Neisseria meningitidis", "Moraxella catarrhalis", "Streptococcus pneumoniae"], "answer": 2, "explanation": "<p>Cerebrospinal fluid is a sterile fluid, so it always gets a direct Gram stain, and any organism seen there is significant. Gram-negative diplococci are the <i>Neisseria<\/i> group (with <i>Moraxella<\/i>), and like most Gram-negative cocci and coccobacilli these are fastidious, growing on enriched chocolate agar.<\/p><p>Maltose utilization separates the two pathogenic <i>Neisseria<\/i> on the work-up scheme. <i>Neisseria meningitidis<\/i> uses maltose, while <i>Neisseria gonorrhoeae<\/i> does not. A maltose-positive Gram-negative diplococcus from CSF is therefore <i>N. meningitidis<\/i>, a cause of meningitis and septicemia.<\/p>", "why_wrong": ["Neisseria gonorrhoeae does not use maltose and is associated with genital and joint infections.", "Haemophilus influenzae appears as tiny Gram-negative coccobacilli, not diplococci.", "Correct: a maltose-utilizing Gram-negative diplococcus from CSF is Neisseria meningitidis.", "Moraxella catarrhalis is a Gram-negative coccus but does not fit the maltose result or a CSF source.", "Streptococcus pneumoniae is a Gram-positive lancet-shaped diplococcus."], "objective": "Gram-negative diplococci that grow on chocolate agar are Neisseria; maltose utilization identifies Neisseria meningitidis, while Neisseria gonorrhoeae does not use maltose."}, {"qid": "1B-13", "topic": "Why a blood culture can stay negative", "stem": "<p>A 58-year-old man arrives at the emergency department with fever and low blood pressure. Before any cultures are drawn, he receives an intravenous dose of a broad-spectrum antibiotic. Two blood culture sets, each with an aerobic and an anaerobic bottle, are drawn 3 hours later. Both sets show no growth after the standard 5 days of incubation, although his clinical picture still suggests a bacterial infection.<\/p>", "lead": "Which of the following best explains the negative blood cultures?", "choices": ["Blood cultures need a direct Gram stain before incubation to detect organisms", "Antibiotic in the patient's blood inhibited bacterial growth in the bottles", "Most pathogens need more than 5 days to turn a blood culture positive", "Organisms in blood can only be recovered on MacConkey agar", "Anaerobic bottles prevent the growth of most blood pathogens"], "answer": 1, "explanation": "<p>How soon a blood culture turns positive reflects how many organisms were in the sample and how fast they grow, and anything that slows that growth can delay or prevent a positive result. Antibiotics already in the patient's blood are carried into the bottle and can inhibit growth in vitro, so cultures drawn after a dose may stay negative even when bacteria were present.<\/p><p>That is why blood cultures are ideally collected before antibiotics are started. Most typical pathogens grow within the standard 5 days, so the laboratory holds bottles longer only when a specific slow-growing organism is suspected and requested.<\/p>", "why_wrong": ["Blood is not Gram stained before incubation because its organism count is below the stain's sensitivity.", "Correct: antibiotic carried into the bottles can inhibit growth in vitro, giving falsely negative cultures.", "Most typical pathogens grow by 5 days; longer holds are only for specific requests.", "Positive bottles are subcultured to several media, and MacConkey agar grows only Gram-negative rods.", "Each set includes an aerobic and an anaerobic bottle so that both kinds of organisms can grow."], "objective": "Antibiotics given before blood cultures are drawn can inhibit growth in the bottles, so cultures should be collected before antimicrobial therapy."}, {"qid": "1B-14", "topic": "MALDI-TOF identification", "stem": "<p>A positive blood culture bottle is subcultured to plates, and colonies appear the next morning. A technologist smears part of one colony onto a target plate, adds a matrix, and fires a laser at it. The proteins released are separated by their time of flight, and the resulting spectrum is matched to a reference database. The organism is identified about 10 minutes after the colony was picked.<\/p>", "lead": "Which of the following is a requirement or limitation of this method?", "choices": ["It reports which antibiotics the organism is susceptible to", "It detects specific resistance genes such as mecA", "It is performed directly on blood before the bottle is incubated", "It identifies organisms by their shape and Gram reaction", "It needs an organism grown in culture, such as a colony on a plate"], "answer": 4, "explanation": "<p>This is matrix-assisted laser desorption ionization time-of-flight mass spectrometry (MALDI-TOF). It reads the protein profile of an organism and matches it to a database, replacing the hours to days of traditional biochemical panels with identification in about 10 minutes, for bacteria and also fungi and mycobacteria. That speed and low cost made it a disruptive technology in the laboratory.<\/p><p>It still depends on the earlier steps of the bacteriology process: there must be an organism growing, usually a colony on a plate, to analyze. It also answers only the identification question; susceptibility still requires phenotypic testing (MIC, disk diffusion) or a genotypic resistance test.<\/p>", "why_wrong": ["MALDI-TOF identifies the organism; susceptibility needs separate testing.", "Resistance genes are detected by molecular tests such as PCR panels, not by protein spectra.", "Unincubated blood has too few organisms; MALDI-TOF is run on grown colonies.", "Shape and Gram reaction come from the Gram stain, which gives a morphologic, not confirmed, identification.", "Correct: MALDI-TOF identifies an organism from a colony in minutes, so it still requires growth in culture."], "objective": "MALDI-TOF mass spectrometry identifies bacteria from a colony in about 10 minutes by protein profile, but it needs grown organisms and does not test susceptibility."}, {"qid": "1B-15", "topic": "Limits of genotypic resistance testing", "stem": "<p>A blood culture bottle from a hospitalized patient turns positive with a Gram-negative rod. A rapid molecular panel run on the bottle identifies the organism and tests for a small set of resistance genes; none are detected. Two days later, broth microdilution on the isolate shows an MIC that is above the resistant breakpoint for one of the drugs the panel had appeared to support.<\/p>", "lead": "Which of the following best explains the discrepancy?", "choices": ["The phenotypic MIC result is unreliable whenever a molecular test disagrees", "The molecular panel was falsely positive for the organism's identity", "Carrying a resistance gene always guarantees that resistance is expressed", "Resistance in this organism arose through a mechanism not covered by the panel's few gene targets", "The isolate tested by microdilution must have been a contaminant"], "answer": 3, "explanation": "<p>Genotypic detection of resistance works well when one gene, or a limited number of genes or mutations, accounts for most or all resistance to a drug. The classic example is the <i>mecA<\/i> gene in methicillin-resistant <i>Staphylococcus aureus<\/i>: if the gene is there, resistance is expressed or can be.<\/p><p>Many Gram-negative rods, by contrast, can become resistant through many different genes and mutations. A panel that looks for only a few targets can therefore miss resistance, so a negative result does not prove susceptibility. Phenotypic testing (MIC, disk diffusion, gradient strip), which measures whether the drug actually inhibits growth, remains the standard and decides here.<\/p>", "why_wrong": ["Phenotypic testing measures inhibition directly and is the standard against which genotypic results are judged.", "Nothing suggests a wrong identification; the panel missed a resistance mechanism, not the organism.", "This reverses the logic and does not explain a resistant result with no gene detected.", "Correct: a negative gene panel does not exclude resistance when an organism can become resistant through many mechanisms.", "Both tests came from the same positive bottle, and a contaminant would not explain the pattern."], "objective": "Genotypic resistance tests are reliable when one or a few genes explain resistance (such as mecA), but a negative panel does not exclude resistance in organisms with many possible mechanisms, so phenotypic testing still decides."}, {"qid": "1B-16", "topic": "Branching Gram-positive rods: Actinomyces vs Nocardia", "stem": "<p>A liver biopsy from a patient with an abscess is Gram stained and shows long, filamentous, branching Gram-positive rods. A modified acid-fast stain of the same tissue is negative. The specimen was plated on blood and chocolate agar, which have been incubated in room air for 3 days with no growth.<\/p>", "lead": "Which of the following conditions is most likely needed to grow this organism?", "choices": ["Incubation in an anaerobic jar", "Incubation at 42 degrees C", "Plating on MacConkey agar", "Plating on mannitol salt agar", "Addition of factor V and factor X to the blood agar"], "answer": 0, "explanation": "<p>Branching, filamentous Gram-positive rods narrow the possibilities to two organisms on the Gram-positive work-up scheme. <i>Nocardia<\/i> is aerobic and weakly acid fast; <i>Actinomyces<\/i> is anaerobic (or microaerophilic) and not acid fast. A negative acid-fast stain, together with no growth in room air, points to <i>Actinomyces<\/i>.<\/p><p>Because <i>Actinomyces<\/i> does not grow well in oxygen, recovering it requires anaerobic culture, plates incubated in anaerobic jars or pouches, often supported by thioglycolate broth. The laboratory needs to know when a specific organism like this is suspected, because special growth conditions or longer incubation may be required.<\/p>", "why_wrong": ["Correct: a branching, non-acid-fast Gram-positive rod that fails in room air is Actinomyces, which needs anaerobic incubation.", "Growth at 42 degrees C is a feature used for Campylobacter, a curved Gram-negative rod.", "MacConkey agar inhibits Gram-positive organisms.", "Mannitol salt agar selects salt-tolerant staphylococci.", "Chocolate agar already supplies factor V and factor X, and it showed no growth in room air."], "objective": "Filamentous branching Gram-positive rods are Nocardia (aerobic, weakly acid fast) or Actinomyces (anaerobic, not acid fast); Actinomyces requires anaerobic culture."}]}, {"id": "05", "title": "Virology I", "week": 1, "subject": "Microbiology", "questions": [{"qid": "05-1", "topic": "Viral attachment and tropism", "stem": "<p>Investigators study a virus that replicates efficiently in human liver cells but cannot infect human kidney cells grown in the same medium. When the kidney cells are engineered to express a single additional surface glycoprotein normally found only on liver cells, they become fully permissive and release large numbers of new virions. Kidney cells injected directly with the purified viral genome also produce infectious virions without any engineering.<\/p>", "lead": "Which step of the viral life cycle most likely determines which cell types this virus can infect?", "choices": ["Binding of a viral attachment protein to a host receptor", "Uncoating of the genome inside an acidified endosome", "Translation of viral mRNA on host ribosomes", "Assembly of capsid proteins around the new genome", "Release of progeny virions by lysis of the host cell"], "answer": 0, "explanation": "<p>The kidney cells already contain everything the virus needs to copy itself: when the genome is placed directly inside them, they make infectious virus. What they lack is a way in. Supplying one liver surface protein fixes the problem, so that protein must be the receptor that the viral attachment protein recognizes.<\/p><p>Attachment is the first step of the life cycle and the main determinant of tropism, the range of cells, tissues and hosts a virus can infect. A cell that lacks the receptor is resistant even if its interior would support replication perfectly well.<\/p>", "why_wrong": ["Correct: the receptor is the only thing the kidney cells were missing, so attachment sets the tropism.", "Uncoating happens after entry; the kidney cells could not get the virus inside in the first place.", "Kidney ribosomes worked fine once the genome was delivered directly, so translation is not the barrier.", "Assembly also succeeded in kidney cells given the genome, since infectious virions were produced.", "Release is a late step and could not explain why infection never starts in unmodified kidney cells."], "objective": "Viral tropism is set mainly by attachment: a viral attachment protein must bind a specific host receptor, so cells lacking that receptor resist infection even when they could support replication."}, {"qid": "05-2", "topic": "Baltimore classification", "stem": "<p>Two RNA viruses are studied in cultured cells. Purified, protein-free genomic RNA from virus X is transfected into cells and produces infectious progeny. Purified genomic RNA from virus Y produces no viral proteins and no progeny when transfected alone. If the RNA of virus Y is transfected together with an RNA-dependent RNA polymerase purified from its virions, infectious virus Y is produced.<\/p>", "lead": "The genome of virus Y is most likely which of the following?", "choices": ["Positive-sense single-stranded RNA", "Negative-sense single-stranded RNA", "Positive-sense RNA copied into DNA by reverse transcriptase", "Double-stranded DNA that enters the host nucleus", "Single-stranded DNA that uses host DNA polymerase"], "answer": 1, "explanation": "<p>A genome that works as mRNA can be read by host ribosomes the moment it enters the cell, so naked genomic RNA is infectious on its own. That is virus X, a positive-sense RNA virus. Virus Y's RNA cannot be translated, and the cell has no enzyme that copies RNA from an RNA template, so nothing happens until the virion's own polymerase is supplied.<\/p><p>That pattern defines a negative-sense single-stranded RNA virus (Baltimore class V). Its genome is the complement of mRNA, so the virion must carry an RNA-dependent RNA polymerase to make mRNA before any viral protein can be produced.<\/p>", "why_wrong": ["A positive-sense genome is translated directly, so it would be infectious alone, like virus X.", "Correct: negative-sense RNA must first be copied into mRNA by a polymerase packaged in the virion.", "A retrovirus needs reverse transcriptase, an enzyme that makes DNA, not the RNA-dependent RNA polymerase that rescued virus Y.", "The stem describes an RNA virus, and a dsDNA genome can use host polymerases in the nucleus.", "The stem describes RNA genomes, and ssDNA viruses rely on host DNA polymerase rather than a packaged one."], "objective": "Positive-sense RNA genomes act as mRNA and are infectious alone; negative-sense RNA genomes need a virion-packaged RNA-dependent RNA polymerase to make mRNA first."}, {"qid": "05-3", "topic": "Enveloped vs non-enveloped viruses", "stem": "<p>A laboratory compares two viruses. Treating virus A with a mild detergent or with ethanol destroys its infectivity, and electron microscopy afterward shows bare nucleocapsids that no longer bind cells. Virus B keeps full infectivity after the same treatments and after drying on a steel surface for several days. Both viruses are grown in the same cell line and harvested from the culture supernatant.<\/p>", "lead": "Virus A most likely leaves the infected cell by which mechanism?", "choices": ["Lysis of the cell after virions accumulate in the cytoplasm", "Budding through a host cell membrane that it keeps as its outer layer", "Transfer of the naked genome to neighboring cells through gap junctions", "Export of finished capsids through nuclear pores into the medium", "Release only after the host cell undergoes programmed cell death"], "answer": 1, "explanation": "<p>Detergent and ethanol dissolve lipid. Losing infectivity after that treatment, with intact nucleocapsids left behind, means virus A has a lipid envelope that carries its attachment proteins. Virus B's resistance to detergent and drying marks it as a non-enveloped (naked) virus with a sturdy protein capsid.<\/p><p>The envelope is not made by the virus: it is a piece of host membrane, studded with viral glycoproteins, that the nucleocapsid wraps itself in as it buds out of the cell. Budding is therefore the typical exit for enveloped viruses, and it does not require the cell to burst. Naked viruses, by contrast, usually exit by lysis.<\/p>", "why_wrong": ["Lysis is the typical exit of naked viruses such as virus B, not of an enveloped virus.", "Correct: the lipid envelope is host membrane acquired as the virus buds out of the cell.", "Viruses spread as particles that must attach to a receptor; a naked genome passing through gap junctions is not a described exit route.", "Capsids leaving through nuclear pores would not acquire a lipid envelope or reach the medium.", "Enveloped viruses can bud from living cells; release does not depend on programmed cell death."], "objective": "Sensitivity to detergents and alcohol marks an enveloped virus, whose envelope is host membrane acquired by budding; naked viruses are hardier and usually exit by cell lysis."}, {"qid": "05-4", "topic": "Uncoating", "stem": "<p>Investigators infect cultured human cells with a non-enveloped virus that normally enters by receptor-mediated endocytosis. One set of cultures is pretreated with an agent that prevents acidification of endosomes. In treated cultures, virions bind the cell surface in normal numbers and are taken into intracellular vesicles, but viral protein synthesis never begins and no progeny virions are made. Virions recovered from the treated cells still contain their genome within an intact capsid
